[package]
name = "oxsum-web"
description = "oxsum web dashboard: Topcoat pages, server-side rendered, mounted into the same binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The dashboard pages: server-side rendered Topcoat views, mounted into the
# axum router as a fallback tower service (spike/topcoat-dashboard). No wasm
# bundle, no client build step.
topcoat.workspace = true
percent-encoding.workspace = true
# The pages call the domain layer directly (docs/architecture.md).
oxsum-core = { workspace = true }
# The public /verify page runs the pure proof check on the server now: Topcoat
# has no browser wasm target, so the browser-side check is gone (see lib.rs).
oxsum-verify = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# The usage page's lookback window is computed on the server.
time.workspace = true
uuid.workspace = true

[lints]
workspace = true
