        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/business/ownership:
    post:
      operationId: transferBusinessOwnership
      summary: Transfer ownership to an existing staff member
      description: Owner only. Atomically promotes the selected current staff member and demotes the actor to admin. Last-owner deletion is refused. Replays recheck current owner permission.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessOwnershipRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
