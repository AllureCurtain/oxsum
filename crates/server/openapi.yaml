                excludeSystem: { type: boolean, deprecated: true, description: "Accepted for compatibility, ignored; system/instructions always participate in the cache key." }
    BusinessProviderAliasRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, config]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        config:
          type: object
          additionalProperties: false
          required: [alias, upstreamModel]
          properties:
            alias: { type: string, minLength: 1, maxLength: 200 }
            upstreamModel: { type: string, minLength: 1, maxLength: 200 }
    BusinessProviderPriceRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, config]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
