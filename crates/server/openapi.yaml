      properties:
        key: { type: string, enum: [profile, supply, saleTerms, collection, admission] }
        state: { type: string, enum: [ready, todo, restricted] }
        action:
          type: [string, "null"]
          enum: [profile, channels, prices, integrations, customers, null]
          description: Existing business section the current actor can manage; null requires an appropriately authorized colleague.
    BusinessReadiness:
      type: object
