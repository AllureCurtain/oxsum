  /api/v1/webhooks/merchants/{merchantId}/versions/{versionId}:
    post:
      summary: Accept a signed event for an immutable merchant configuration
      description: Trusted path coordinates select the merchant and signing version before the raw body is verified. The payload cannot select a signing secret. Authenticated events are durably scoped by merchant and event ID across rotations. Reusing an ID with different signed content conflicts. Missing local payment/customer metadata may be recovered only from an already-bound provider payment reference inside that exact merchant and version; supplied conflicting or malformed coordinates are never overwritten. Events arriving before their provider reference remain pending and are re-evaluated by recovery. Recognized payment events must match the pinned payment/customer/provider account/mode/amount/currency exactly before acceptance; unknown local payments remain pending for recovery. Receipt does not itself grant wallet credit or entitlement. Authenticated rejected and unsupported events are acknowledged without any financial effect.
      security: []
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Webhook-Signature-512, in: header, schema: { type: string }, description: Hyperswitch HMAC-SHA512 over exact request bytes. }
        - { name: Stripe-Signature, in: header, schema: { type: string }, description: Stripe timestamped signature; five-minute freshness window. }
        - { name: x-timestamp, in: header, schema: { type: string }, description: Airwallex Unix milliseconds; five-minute freshness window. }
        - { name: x-signature, in: header, schema: { type: string }, description: Airwallex HMAC-SHA256 over timestamp plus exact request bytes. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Original provider event; normalized only after signature verification. }
      responses:
        "200": { description: Authenticated event durably received or replayed; not a promise of fulfillment. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
