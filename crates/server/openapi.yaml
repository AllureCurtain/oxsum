      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 80 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expiresAt: { type: string, format: date-time }
        spendLimitMinor: { type: integer, format: int64, minimum: 1, description: Finite cumulative settled-plus-pending budget in minor credits. }
        modelAllowlist: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        requestsPerMinute: { type: integer, minimum: 1, maximum: 10000 }
        maxConcurrentHolds: { type: integer, minimum: 1, maximum: 1000 }
    ApplicationCustomerKeyResult:
      type: object
