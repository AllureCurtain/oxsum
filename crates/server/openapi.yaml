  /api/v1/org/evidence-bundles:
    get:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: List the organization's minted evidence bundles (issue #616)
      description: |
        Every evidence bundle the organization has minted, newest first — the
        descriptors a member's dashboard browses. The list carries no artifact
        rows or proofs: a mint is rare, so the descriptor alone is enough to
        pick the bundle whose bytes `GET .../evidence-bundles/{bundleId}` then
        serves.
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The minted bundles, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/EvidenceBundleSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Mint a period evidence bundle over a closed span (issue #616)
      description: |
        A usage report answers "what did this `endUser` cost me" for one
        downstream customer. An evidence bundle answers the wider question the
        *organization itself* asks of its operator: "what did this closed
        period commit me to, and can I check it offline?" One bundle carries
        every artifact the scope commits — the usage records settled in the
        span, the plan statements and invoice journals they billed through, the
        payment orders and fulfillments that paid them, the refunds, disputes
        and credit notes that adjusted them, and the day seals that closed the
        days they booked on — plus a `scope` block that spells honestly what it
        does not attest (the platform's own upstream costs, another
        organization's rows, history outside the span, in-flight operations).

        Producing the bundle appends a self-balancing marker entry
        (`oxsum/evidence-bundle/v1`) to the organization's own ledger whose
        `DocumentRef` binds the *manifest digest* — `H(oxsum/evidence-manifest/v1)`
        over the canonical manifest, which names every artifact's own digest
        (`oxsum/evidence-artifact/v1/<kind>` over each artifact's canonical
        bytes), sorted by `(kind, id)`. One marker per
        `(organization, from, to)`, ever: the marker's idempotency key is
        derived from the span and a unique index pins the scope, so a second
        request for the same span replays the standing bundle rather than
        committing a second manifest — an org cannot commit one artifact set
        to the ledger and serve the customer another.

        Both dates are inclusive UTC `YYYY-MM-DD`, and `to` must be a fully
        ended day: the manifest commits a complete artifact set and an open
        day can still book rows the bundle would omit. A span over an open day
        or longer than 366 days is `VALIDATION_ERROR`. The bundle's JSON is
        frozen at mint and served byte-identically on re-download — the
        digests commit the artifacts as they stood at mint.

        A `verifier` runs `oxsum_verify::verify_evidence_bundle` over the body
        with no second call: every artifact re-digests to what the manifest
        names, every artifact the manifest commits is present, the marker
        proves the manifest is the one the ledger committed, and the money
        artifacts' ledger entries adopt-verify and include in the signed head.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  format: date
                  description: first UTC day of the span, inclusive
                to:
                  type: string
                  format: date
                  description: last UTC day of the span, inclusive — must be fully ended
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The minted bundle's descriptor — `GET .../{bundleId}` serves the bytes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EvidenceBundleSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/evidence-bundles/{bundleId}:
    get:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Download one minted evidence bundle (issue #616)
      description: |
        `bundleId` is the marker entry's own id — the same id the `POST`
        answers and the one a verifier resolves to the marker's inclusion
        proof. The committed artifact set is frozen at mint: the response is
        the stored `bundle_json` verbatim, never a re-query, so a bundle cannot
        grow to absorb rows the org omitted the first time. The body is the
        `data` object `oxsum_verify::verify_evidence_bundle` consumes directly.
        A bundle of another organization answers 404.
      parameters:
        - name: bundleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The evidence bundle — the manifest, artifacts, entries, head and signed note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EvidenceBundle" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/evidence-bundles/{bundleId}/share:
    post:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Mint a share token for one evidence bundle (issue #616)
      description: |
        The bundle's recipient holds no account, so the token is the
        capability: the plaintext is answered once, only its SHA-256 is stored,
        and the organization can revoke it. The token opens the public
        `GET /api/v1/evidence/{token}` download without a session — the token
        is the authorization, not a login. `expiresAt` defaults to 30 days from
        now and may not be more than 90 days out; `maxDownloads` bounds how
        many times the token resolves before it goes dead (absent means
        unbounded until expiry); `label` is the organization's own note for the
        recipient. The bundle must belong to the acting organization: an id
        guessed from another tenant answers 404.
      parameters:
        - name: bundleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvidenceShareRequest" }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The share descriptor and its one-time token
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedEvidenceShare" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    get:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: List the share tokens on one evidence bundle (issue #616)
      description: |
        Every share the organization minted on the bundle, newest first —
        descriptors only, never tokens. `downloadCount` is the audit figure
        `maxDownloads` spends down; `lastDownloadAt` is the operator's signal
        the recipient opened the bundle; `revokedAt` and `expiresAt` are the
        two ways a token stops resolving.
      parameters:
        - name: bundleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The bundle's shares, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/EvidenceShare" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Revoke every share token on one evidence bundle (issue #616)
      description: |
        Stamps `revokedAt` on every live share the bundle carries, so the
        public download goes dead at once. Idempotent: revoking an
        already-fully-revoked bundle answers the same count of zero. A bundle
        of another organization answers 404.
      parameters:
        - name: bundleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: How many live shares the call revoked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked:
                        type: integer
                        format: int64
                        description: live shares this call stamped revoked
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/statements/{statementId}/evidence:
    get:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Mint or fetch the evidence bundle for one plan statement (issue #616)
      description: |
        The statement-scoped bundle: the one `plan_statements` row, its lines,
        the `invoice_journals` receivable it wraps, and every order, refund,
        dispute, credit note and day seal that touched it — the same manifest
        and marker machinery as a period bundle, scoped to a single document.
        One bundle per `(organization, statement)`, ever: a second request
        replays the standing bytes. The statement must belong to the acting
        organization and be a real issued document — a foreign, missing or
        `open` id answers 404.
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The statement's evidence bundle — the manifest, artifacts, entries, head and signed note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EvidenceBundle" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/evidence/{token}:
    get:
      summary: Download an evidence bundle by share token (issue #616)
      description: |
        The public, session-free download a share token opens: `token` is the
        plaintext the `POST .../share` mint answered once, presented as the
        path's own credential — the token *is* the authorization, so no session
        or API key is asked for. The response is the same frozen `bundle_json`
        the owner download serves.

        A token resolves while it is unexpired, unrevoked and within its
        `maxDownloads` budget; each successful download spends one. An
        expired, revoked, exhausted or unknown token all answer 410 — the
        caller cannot tell which, so a guessed token leaks nothing about which
        shares exist.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The evidence bundle — the manifest, artifacts, entries, head and signed note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EvidenceBundle" }
        "410":
          description: the token is expired, revoked, out of downloads, or never existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/estimate-price:
    post:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: Price a declared token shape
      description: |
        The number the gateway would freeze for a request with this shape: the dearest
        permitted price set over the declared input tokens and the output ceiling
        (`outputTokens` clamped to the model's `maxOutputTokens`). Nothing is held or
        charged — the answer is the upper bound a real request could cost, and a real
        settle never exceeds it. An unknown model answers `VALIDATION`; a shape the
        model's price cannot express answers the same. Customer tier limits apply;
        consumption keys additionally restrict model names and group channels. Aliases
        require both the public and resolved model name to be allowed. Unavailable or
        forbidden names return the same validation error, without hidden route details.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimatePriceRequest" }
      responses:
        "200":
          description: The freeze estimate
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [estimateMinor, model, version]
                    properties:
                      estimateMinor:
                        type: integer
                        format: int64
                        description: the most a real request with this shape can settle for
                      model: { type: string }
                      version:
                        type: integer
                        format: int64
                        description: the price version the estimate was computed from
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/pricing:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: The customer-authorized price catalog
      description: |
        Every route this customer may use — a model may be served by several
        channels, and each `(model, channel)` pair lists its own row with the
        current price version and the route's `weight`, the relative preference
        for leading a request. These are the same rows `POST
        /v1/chat/completions` is priced by, without the channel's credential. A
        caller that wants a version's full rule set reads the flattened price on
        each row; estimate-price answers what one shape costs. The customer tier filters
        model names, and consumption keys also apply their own model and request-group
        channel restrictions. Alias names and their resolved targets must both be allowed.
        Customer sessions see the tier-authorized catalog, without a key-specific grant.
        Alias prices use the alias version when present, otherwise the target version.
      responses:
        "200":
          description: The catalog, one row per route
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [models]
                    properties:
                      models:
                        type: array
                        items: { $ref: "#/components/schemas/PricedModel" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/branding:
    get:
      summary: The deployment's seller branding
      description: |
        Public effective seller identity. An explicitly saved business profile
        overrides all environment branding, including optional fields saved as
        null. Before the first save, an initialized business uses its setup name;
        otherwise name/logo/accent use deployment defaults. Contact/help default
        to null. This read never changes historical documents, prices or money.
      security: []
      responses:
        "200":
          description: The branding the portal renders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Branding" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/entries/{entryId}/proof:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
