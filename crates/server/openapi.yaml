openapi: 3.1.0
info:
  title: oxsum API
  version: 0.87.0
  description: |
    Common conventions (auth, idempotency, error format, money units) are documented in docs/api.md.

    Three surfaces, deliberately different:

    - `/api/v1/*` is oxsum's own API: enveloped responses (`{"data": …}`), oxsum error codes, camelCase.
    - `/v1/*` is the protocol-native gateway: `POST /v1/chat/completions` answers in OpenAI's shapes,
      `POST /v1/messages` in Anthropic's, and each surface answers errors the way its own SDK parses them
      object, and everything the gateway does not understand is passed upstream unchanged, so an OpenAI
      SDK works by changing `base_url` only. `POST /v1/embeddings` and `POST /v1/rerank` are the
      input-only surfaces — metered by the tokens they embed or rank, settled against upstream's
      usage the same way. A gateway request freezes credit before upstream is
      contacted and settles against the usage upstream reports.
    - `/api/v1/admin/*` is the platform admin's surface: whoever deploys oxsum manages channels and
      their prices with an operator token, not with an organization's API key.

    0.2.0 changed the auth model: an API key belongs to exactly one organization and decides whose
    balance a request spends, so the ledger endpoints no longer name a tenant in the path. 0.3.0 added
    the gateway surface. 0.4.0 added channel and price configuration: prices are append-only versions,
    and a request is priced by the version in force when it starts. 0.5.0 added web login: a session
    is a second credential next to the API key, carried in a cookie, and the role rules (owner, admin,
    member) now constrain what a session principal may do with the organization's keys. 0.6.0 added
    trustworthy tree heads: the operator signs each tenant's ledger head (a C2SP signed-note), and
    `/api/v1/log/consistency` proves the current head extends a head the caller already holds. 0.7.0
    added per-key spend limits: `spendLimitMinor` caps what one key may have committed — settled
    charges plus outstanding holds attributed to it — a key takes that limit at creation or through
    `PATCH /api/v1/org/keys/{keyId}`, and a hold that would exceed it is refused with 429
    `KEY_LIMIT_EXCEEDED` on `/api/v1` and `insufficient_quota` on the gateway. 0.8.0 added membership
    management: an owner or an admin may add an existing account by email, remove a member, change a
    member's role and transfer ownership (`/api/v1/org/members`, `/api/v1/org/members/{userId}`,
    `/api/v1/org/ownership`). Membership management is a person's action: an API key names no role and
    is refused there, which is the one place a key does not act with the organization's full
    authority. Invitations for people who have no account yet are issue #59 and are not part of this
    contract. 0.9.0 widened the platform-admin surface past channels: `GET /api/v1/admin/organizations`
    lists every organization with its balance, so the deployment can see whom the ledger holds money
    for. Adjusting or topping up another organization is still not in the contract (issue #60).
    0.10.0 added `GET /api/v1/admin/holds`, 0.11.0 `GET /api/v1/admin/anomalies`, and 0.12.0
    `GET`/`POST /api/v1/admin/closings`: the monthly closing, which seals a `YYYY-MM` period in
    every organization's ledger — after a month is sealed, no entry may carry a booking date in it
    again, and the seal itself is the closing record. 0.13.0 adds team organizations: `GET`/`POST
    /api/v1/orgs` lists and creates the session user's organizations, and `POST
    /api/v1/session/organization` switches which organization the session acts as.
    0.14.0 adds invitation links (`/api/v1/org/invitations`, `/api/v1/invitations/redeem`):
    an owner or admin mints a one-use link, and the person holding it registers into the
    organization — the only registration `OXSUM_SIGNUP=invite` allows. 0.15.0 gives the platform admin
    the write half of the organizations list: `POST
    /api/v1/admin/organizations/{organizationId}/adjustments` books a signed amount with a
    required reason into that organization's ledger. 0.16.0 added `POST
    /api/v1/admin/users/{userId}/password-reset`: the operator's recovery path, which revokes the
    user's sessions with the change. 0.17.0 paginates the one admin list that can grow
    unboundedly — `GET /api/v1/admin/organizations` takes `cursor`/`limit` and answers
    `nextCursor`. 0.18.0 added request attribution to the gateway: `user`, `metadata` and
    `service_tier` on a chat completion land on the turn's usage record. 0.19.0 added
    `protocol` to channels: the name the usage-adapter registry resolves the upstream's
    usage report with. 0.20.0 itemizes the price book: a price version may carry the cache
    dimensions (read, 5-minute and 1-hour write), a reasoning price, a flat
    `costPerRequest`, a `mode` (only `chat` is priced today), conditional `rules` that swap
    the whole price set most-specific-wins — two rules that could match the same request at
    the same specificity are refused when written — and `upstream` prices, which record what
    the channel costs us and are never shown to an organization. 0.21.0 adds the `unpriced`
    settlement kind to the anomalies the platform reviews: a turn whose usage carried a
    metered dimension the price book cannot cover settles for the computable part and is
    flagged, never billed at zero or at a rate the dimension does not belong to.
    0.22.0 adds `GET /api/v1/admin/margin`: each settled turn now also records what
    the channel's `upstream` prices made of the same usage, and the endpoint sums
    the two per channel and model — the gross-margin view the `upstream` prices
    were written for. 0.23.0 makes funding multi-rail: every credit into the
    purchased pool is recorded as a deposit on one `deposits` table (`/api/v1/topups`
    is the `manual` rail, unchanged on the wire), and the first live rail is
    redemption codes — `POST /api/v1/admin/redemption-codes` mints a batch and
    `POST /api/v1/redemptions` redeems one into the acting organization's wallet.
    0.24.0 widens per-key controls: beside the cumulative `spendLimitMinor` and the
    existing `expiresAt`, a key may carry a `budgetDuration` (`daily`, `weekly` or
    `monthly` — the spend limit becomes per-period instead of cumulative) and a
    `modelAllowlist` (the models the key may call on the gateway; null is all of
    them). A hold over a disallowed model is refused 403 `FORBIDDEN`; both fields
    are set at creation and replaced wholesale by `PATCH /api/v1/org/keys/{keyId}`.
    0.25.0 adds organization credit: `PATCH
    /api/v1/admin/organizations/{organizationId}` grants an organization a credit
    limit, which its holds and settlements draw after the bonus and purchased
    pools exhaust — borrow first, settle monthly. The balance answer and the
    admin organization list gain `creditLimitMinor`/`creditUsedMinor` so the
    drawn share is always readable next to the limit.
    0.26.0 adds statements — the monthly billing document that closes the
    "borrow first, settle monthly" loop: `POST /api/v1/admin/statements`
    generates a draft per organization for a closed `YYYY-MM` period,
    `/finalize` locks it and sets the due date from the organization's
    `paymentTermsDays` (a new field on `PATCH
    /api/v1/admin/organizations/{organizationId}`), `/payments` records a
    payment as a real ledger repayment, and `/suspend` marks an unpaid one.
    An organization reads its finalized statements through
    `GET /api/v1/statements` and `GET /api/v1/statements/{statementId}` —
    every line's charge is ledger entries the bill proofs already cover.
    0.27.0 adds per-key rate limiting: a key may carry `requestsPerMinute`
    and `maxConcurrentHolds` beside the spend constraints, set at creation
    and replaced wholesale by `PATCH /api/v1/org/keys/{keyId}`. A request
    over the minute's allowance is refused 429 `RATE_LIMITED` with
    `Retry-After` and `X-RateLimit-*` headers; a hold over the concurrent
    cap is refused 429 `TOO_MANY_HOLDS`, checked under the same per-key
    lock as the spend limit. The gateway answers both as
    `rate_limit_exceeded` in OpenAI's shape.
    0.28.0 adds request-level idempotency on the gateway: `POST
    /v1/chat/completions` accepts an `Idempotency-Key` header, and a
    retry carrying the same key and the same request body replays the
    first response — a completed non-streamed turn answers its stored
    body, a completed streamed turn answers the settled receipt, both
    marked `Idempotent-Replayed: true`. The same key with a different
    body is 422 `IDEMPOTENCY_MISMATCH`; a retry while the first turn is
    still running is 409 `IDEMPOTENCY_IN_FLIGHT`. Records live 24 hours.
    0.29.0 adds `GET /api/v1/admin/reconciliation`: the reconciliation
    report scans every organization's ledger against the oxsum-owned
    projections — usage rows, deposits, hold watches — and answers one
    entry per drift class with a count and a bounded sample. It never
    repairs: drift is for a human to read and act on, not for a second
    writer to patch silently.
    0.30.0 adds `GET /metrics`: the process's own telemetry in Prometheus
    exposition format — HTTP request counts and durations by route, the
    gateway's money path (holds, settlements by kind, charged minor units,
    settled tokens, upstream latency), rate-limit and idempotency
    outcomes, and scrape-time gauges for open holds and the connection
    pool. The scrape carries the same operator bearer token as the admin
    surface; a deployment without one answers 401 there too.
    0.31.0 answers what a gateway request cost without a second call:
    `x-oxsum-freeze-minor` and `x-oxsum-balance-minor` on the response
    head of every answer that took the hold — the reserved bound and the
    spendable balance left after it — and `x-oxsum-charged-minor` once
    the turn settled, a header on non-streamed answers and on refusals
    that happened after the hold, and an HTTP trailer on streamed ones.
    0.32.0 dead-letters a hold watch after ten failed sweeps: the row
    records `sweepAttempts`, `lastError` and `deadAt`, leaves the
    per-minute queue for an hourly retry, and shows up in the
    reconciliation report as the `holds_dead_lettered` class, in the
    admin holds payload, and in the `oxsum_holds_dead_lettered_total`
    and `oxsum_dead_holds` metrics. 0.33.0 adds the second protocol
    surface, `POST /v1/messages`: Anthropic's Messages shape, served
    only by channels whose `protocol` is `anthropic`, under the same
    freeze-then-settle contract. An API key is accepted as
    `Authorization: Bearer` or `x-api-key` on `/v1`, and
    `anthropic-version`/`anthropic-beta` pass through to upstream.
    Usage normalization follows Anthropic's report: `input_tokens` plus
    both cache counts make the billed input total, and the
    5-minute/1-hour cache-write tiers come from
    `cache_creation.ephemeral_*_input_tokens`. 0.34.0 adds outbound
    webhooks: `/api/v1/webhooks` registers an HTTPS endpoint per
    organization for `request.settled`, each settlement enqueues a signed
    delivery in the same transaction as its usage row, and a worker
    posts `{id, type, created_at, org_id, data}` with `x-oxsum-signature`
    (HMAC-SHA256 of `t.body`) until delivered, backing off through ten
    attempts before the delivery fails. `GET
    /api/v1/webhooks/{endpointId}/deliveries` lists the attempts. 0.35.0 opens the
    programmatic read surface: `GET /api/v1/usage` answers the daily rollup,
    `GET /api/v1/billing-records` pages settled turns newest-first by the
    `before` cursor, `POST /api/v1/estimate-price` prices a declared token
    shape through the same arithmetic the gateway freezes on, and `GET
    /api/v1/pricing` answers the public catalog — every model's current price
    version, without channel credentials. 0.36.0 adds the email flows a
    deployment with SMTP configured gets (`OXSUM_SMTP_URL`/`OXSUM_MAIL_FROM`/
    `OXSUM_PUBLIC_URL`): `POST /api/v1/auth/verify/request` mails the session
    user's verification link, `POST /api/v1/auth/verify` consumes it and marks
    `emailVerified` on the user, `POST /api/v1/auth/password/forgot` mails a
    reset link when the address has an account — indistinguishable when it does
    not — and `POST /api/v1/auth/password/reset` sets the new password and
    revokes every session the user holds. A deployment without a mailer
    registers and logs in as before; `verify/request` is the one endpoint that
    answers `SERVICE_UNAVAILABLE` there, because the mail is the feature.
    0.37.0 adds OAuth login, GitHub first: `GET /api/v1/auth/oauth/github`
    redirects to the provider's authorize page carrying a single-use state, and
    `GET /api/v1/auth/oauth/github/callback` consumes the code and the state,
    resolves the account — a linked identity first, then a verified-email match,
    and otherwise a registration that respects `OXSUM_SIGNUP` — mints a session
    and redirects to the dashboard. Both endpoints are browser redirects, not
    JSON: a failure answers `303` back to `/login`, not an error body. The same
    release adds `GET /api/v1/auth/methods`, the unauthenticated discovery the
    login page reads to know which buttons to draw.
    0.38.0 adds the env-gated anti-bot check (Cloudflare Turnstile) on the two
    public account-creation surfaces: `POST /api/v1/auth/register` and
    `POST /api/v1/invitations/redeem` accept an optional `turnstileToken`,
    required whenever `OXSUM_TURNSTILE_SITE_KEY`/`OXSUM_TURNSTILE_SECRET_KEY`
    are configured — a missing token or a `success: false` siteverify answers
    `FORBIDDEN`, and a siteverify that cannot be reached answers
    `SERVICE_UNAVAILABLE`, because the check never fails open.
    `GET /api/v1/auth/methods` gains `turnstileSiteKey` — the site key is
    public by design, it is what the page hands the widget.

    0.39.0 adds the device authorization grant (issue #154's sibling, #156):
    a CLI or other input-constrained tool POSTs `/api/v1/device/code`, shows
    the short `userCode` to the signed-in user at `verificationUri`, and polls
    `/api/v1/device/token` until the user approves on `/device` —
    `GET /api/v1/device/request` reads the pending request for the approval
    page and `POST /api/v1/device/authorize` stamps the session's verdict.
    The approved key is minted inside the successful poll, so its secret is
    never at rest, and every code expires unconsumed after fifteen minutes.

    0.40.0 adds the two halves of per-organization commercial terms
    (issue #158). Discounts: `GET`/`POST /api/v1/admin/discounts` manage
    `pricing_discounts` rows — an organization and/or model scope, a
    percent, and a validity window — and `DELETE
    /api/v1/admin/discounts/{discountId}` ends one early. A settlement
    applies the single most favorable discount whose scope and window the
    turn matches — discounts never stack — and snapshots the percent into
    its description (`v` 4, `discountPercent`), so the charge still
    recomputes from the description alone; the freeze stays the
    undiscounted bound. Tiers: `tier_profiles` name capability packages —
    an organization-wide `requestsPerMinute` and a `modelAllowlist` —
    managed through `GET`/`PUT`/`DELETE /api/v1/admin/tiers` and assigned
    by `tier` on `PATCH /api/v1/admin/organizations/{organizationId}`
    (null clears it). A tier is never a pricing input: the gateway
    enforces its limits at admission — 429 `RATE_LIMITED` over the
    organization allowance, 403 `FORBIDDEN` for a model the allowlist
    does not name — and an organization without a tier behaves as before.

    0.41.0 adds the admin audit log (issue #160): every mutating
    `/api/v1/admin` call appends one `oxsum.admin_audit` row — the action,
    its target, the redacted detail and the request's idempotency key —
    readable newest-first through `GET /api/v1/admin/audit`, cursor-paged
    like the organizations list. The row is written only after the
    mutation commits, so the log can omit on a crash but never invent;
    credentials (a channel's `apiKey`) never enter `detail`.

    0.42.0 adds organization suspension and member budgets (issue #162).
    `suspended` on `PATCH /api/v1/admin/organizations/{organizationId}` flips
    `organizations.suspended_at`: a suspended organization's new holds refuse
    with 403 — on `/v1` and `POST /api/v1/holds` alike — while its in-flight
    holds settle, and money-in still lands so the line can be repaid.
    Suspending enqueues `org.suspended` for the organization's subscribed
    webhook endpoints; the event joins the subscription catalog.
    `budgetLimitMinor` on `PATCH /api/v1/org/members/{userId}` caps a member's
    committed spend — settled charges plus outstanding holds summed over every
    key they minted — enforced inside the same locked window as the key's own
    limits. `role` on that endpoint is now optional beside it; at least one of
    the two is required.

    0.43.0 adds the jobs layer (issue #166): `oxsum.jobs` schedules the
    periodic work — hold sweeping, webhook delivery, reconciliation, monthly
    statement generation and retention cleanup — claimed with
    `FOR UPDATE SKIP LOCKED`, retried on a backoff, and landed `dead` past
    the attempt budget. Dead runs surface as the reconciliation report's new
    `jobs_dead` class.
    0.44.0 adds failover (issue #168): a model may be priced on several
    channels, each route carrying a `weight` — the relative preference for
    leading a request. A retriable upstream failure (unreachable, 429, 5xx)
    before any answer bytes rotates the turn to the next weighted candidate
    under the same hold, and the settlement records how many upstream calls
    were made — `upstreamAttempts` on the billing record and the settlement
    description's v5. The catalog lists one row per route.

    0.45.0 meters the input-only endpoints (issue #170): `POST
    /v1/embeddings` (OpenAI's shape — `input` a string, an array of strings,
    or token arrays, which freeze at their exact count) and `POST /v1/rerank`
    (Jina/Cohere's shape — `query` plus `documents`) join the gateway, priced
    by price versions whose `mode` is `embeddings` or `rerank`. A non-chat
    price is input-only: `outputPricePerMillion` and `maxOutputTokens` are
    absent or zero, and a `costPerRequest` still applies once per billed
    turn. A model priced only for `chat` is not served on the new surfaces
    and vice versa; the freeze, failover and `Idempotency-Key` semantics are
    the shared pipeline's, unchanged. Embeddings usage settles against
    `usage.prompt_tokens`, rerank against `usage.total_tokens`; a report that
    never arrives settles `estimated` from the request's own input bound.
    `POST /api/v1/estimate-price` takes an optional `mode` beside the model.

    0.46.0 adds the metering surface (issue #172): the deployer's own services report billable
    events under `/api/v1/metering` — `holds`, `settle`, `release` and one-shot `settlements`
    — authenticated by a service credential (`oxs-svc-…`) the admin mints, never by an
    organization's key or a session. A service names the `organizationId` it meters for, a
    `channel` and a `billableCode`, which resolve to the channel's `mode: event` price version;
    the declared `usage` is a UsageRecord in the code's own units, and every call carries an
    `idempotencyKey`. Metered settlements enter the ledger and its proofs like gateway turns,
    under a `v6` description that names the reporting service instead of upstream attempts.

    0.47.0 completes the webhook event catalog (issue #200): beside `request.settled` and
    `org.suspended`, an endpoint may now subscribe to `deposit.credited`,
    `deposit.failed`, `deposit.reversed`, `balance.low`, `statement.finalized`,
    `statement.payment_overdue`, `statement.payment_status_updated`,
    `org.credit_limit_exceeded` and `anomaly.detected`. Each is enqueued inside the
    transaction of the state change it reports — `deposit.credited` beside the
    `credited` flip, `statement.finalized` inside finalization, the payment-standing
    events inside reconcile, `anomaly.detected` beside the anomalous usage row and the
    dead-letter mark. `balance.low` is armed per endpoint by `balanceLowMinor` on
    create and fires once per crossing. `org.credit_limit_exceeded` is the one
    at-least-once exception: a hold refusal leaves no transaction to enqueue into, so
    it announces from the dispatch layer.

    0.48.0 adds the Stripe deposit rail (issue #201): `POST /api/v1/topups/stripe` opens a
    pending deposit, asks Stripe for a checkout session and answers the redirect URL —
    `payment_ref` is the caller's `idempotencyKey`, so a replayed intent finds its own row.
    `POST /api/v1/webhooks/stripe` is the provider's unauthenticated callback: the
    `Stripe-Signature` header verifies against `OXSUM_STRIPE_WEBHOOK_SECRET`, then
    `checkout.session.completed` confirms and credits the deposit under the session id's own
    ledger key, and `checkout.session.expired` closes it. `received_minor` records what Stripe
    reports paid; a mismatch with `amount_minor` is for a human, never auto-patched.

    0.49.0 adds account deletion by pseudonymization (issue #202): `DELETE
    /api/v1/users/me` — session-only, password-confirmed — tombstones the user row
    (`email` → `deleted-<id>@deleted.invalid`, the password hash blanked, `emailVerified`
    cleared), revokes every session and every key the user minted, removes their
    memberships (the last-owner wall refuses 409), and nulls the `endUser`/`tags`
    attribution on the usage rows their keys paid. The ledger is never touched: the
    books keep the UUID, every proof keeps verifying.

    0.50.0 adds per-key token rate limiting (issue #203): `tokensPerMinute` caps the
    settled input+output tokens a key may burn inside a trailing minute. RPM spends a
    slot at admission; TPM counts *settled* usage — a durable window a settlement
    feeds in its own transaction, never a hold. A request is refused at admission
    when window-actual plus this request's estimate (the input bound plus the output
    bound, the freeze's own figures) exceeds the cap: 429 with `Retry-After` and the
    `X-RateLimit-*` headers, `TOKENS_PER_MINUTE` in the oxsum envelope and on the
    gateway's `error.code` under the `rate_limit_exceeded`/`rate_limit_error` type.
    Holds never occupy the window; only a settle moves it. Tag-scoped buckets are a
    follow-up.

    0.51.0 adds signed price-catalog checkpoints (issue #204): a bill's settlement
    names the `(channel, model, priceVersion)` it priced under, but until now that
    price's authenticity rested only on the append-only `channel_prices` table. The
    operator now signs each priced row as a checkpoint under the same Ed25519 key
    that signs tree heads, served at `GET /api/v1/log/price-head` — origin
    `oxsum/price-catalog/<channel>`, the version in the note's size slot, the
    canonical row's hash in its root. The proof bundle carries the signed link in
    `price` — the canonical row bytes, the checkpoint note, and the published key —
    so a verifier confirms the price a bill names is the one the catalog held,
    without trusting a second server answer. Signing is stateless and
    deterministic, so a stored row signs identically whenever asked: a bill under
    an older version stays verifiable after the catalog moves on, and no snapshot
    table exists to drift.

    0.52.0 adds the statement PDF export (issue #205):
    `GET /api/v1/statements/{statementId}/export.pdf` and the admin twin
    `GET /api/v1/admin/statements/{statementId}/export.pdf` render a finalized
    statement as a downloadable PDF — organization, period, status and due date,
    the itemized lines, totals, and a footer anchoring the page to the ledger
    window (`logFromIndex`/`logToIndex`) beside a QR back to `/verify`. Only
    `finalized` statements export — a draft, a foreign or a missing id is 404 —
    and the body is binary `application/pdf`, not the JSON envelope. Rendering
    is pure Rust inside the single binary, so the PDF always reads the stored
    lines and can never disagree with the detail endpoint's own answer.

    0.53.0 adds tag-scoped token buckets (issue #209): `tokensPerMinuteScopes`
    slices a key's `tokensPerMinute` allowance by the request's `metadata` tag.
    Each tag names one scope — `each` fans a bucket out per value, `concrete`
    pins one named value, `total` aggregates the whole tag — and every bucket a
    turn lands in is checked `window-actual + estimate ≤ cap` alongside the
    plain window. A full per-value bucket refuses only the turns carrying that
    value; the other values' buckets stay open. Scoped rows accrue in the same
    transaction that records the usage row and expire with the trailing minute,
    so a high-cardinality tag set cannot outgrow the window.

    0.54.0 adds forecasted budget exhaustion (issue #220): an endpoint may now
    subscribe to `budget.exhaustion_forecast`. A key carrying both
    `spendLimitMinor` and `budgetDuration` is checked after each settle: the
    window's committed spend projected forward at the rate observed so far in
    the window, and when the projection crosses the limit before the window
    ends the event enqueues — inside the settle's own transaction, once per key
    per window, deduped the way `balance.low` latches. The data names the key,
    the limit, the window start, the committed spend, the projected exhaustion
    date and the days remaining. The latch clears when the window rolls or the
    constraint changes, so a new period forecasts again.

    0.55.0 anchors finalized statements to the transparency log (issue #221).
    Finalizing a statement now appends a marker entry to the tenant ledger that
    commits two digests at that point in the log: the window digest, folded in
    log order over the covered entries' content hashes, and the rollup digest
    over the statement's lines and totals. The statement records the anchor's
    entry id and log index plus both digests (`anchorEntryId`,
    `anchorLogIndex`, `windowHash`, `rollupHash`), and the detail endpoint
    serves an `anchor` object carrying the digests, the marker's coordinates
    and — when the deployment configures `OXSUM_HEAD_SIGNING_KEY` — a signed
    note over the tree head right after the anchor. A verified bill now proves
    not only that each entry sits in the log but that nothing was left out of
    the window the statement claims to cover.

    0.56.0 watches upstream price drift (issue #222). A scheduled job probes
    each channel's live catalog — the oxsum-compatible `/api/v1/pricing` the
    channel's base URL serves — and diffs every model's `upstream` rates
    against the rates oxsum stores for it. Each differing field lands in the
    new `oxsum.upstream_price_drift` table and surfaces as the reconciliation
    report's new `upstream_price_drift` class, and every drift broadcasts an
    `anomaly.detected` event (`kind: "upstream_price_drift"`, naming the
    channel, model, field, stored and live minor rates) to each enabled
    subscriber. A channel that cannot be probed — unreachable, or an upstream
    that does not serve an oxsum-compatible catalog — records a probe outcome
    for that run rather than failing the pass; drift is detected, never
    inferred from silence.

    0.60.0 serves the dashboard's remaining reads over the wire (issue #234): `GET
    /api/v1/org/members` lists the organization's members, `GET /api/v1/holds`
    lists the organization's in-flight holds, `GET /api/v1/entries` pages the
    ledger's entries and `GET /api/v1/bills` pages its transactions — the four
    reads the server-rendered dashboard drew straight from core. `GET
    /api/v1/balance` additionally answers `reservedMinor` and
    `spentThisMonthMinor`, the overview's frozen and month-spend figures.

    0.61.0 adds signed spend mandates (issue #262): a key holder delegates a strictly
    narrower slice of a key's authority to a bearer who does not hold the key. `POST
    /api/v1/org/keys/{keyId}/mandates` mints a self-contained mandate — a canonical-JSON
    body Ed25519-signed under the key's own `mandateSigningSeed`, base64url on the wire —
    and `GET` on the same path lists the key's mandates. The delegate presents it in an
    `X-Oxsum-Mandate` header on `/v1/*` and `POST /api/v1/holds`; the hold path verifies
    the signature and applies the mandate's `capMinor`, `models` and `notBefore`/`notAfter`
    on top of the key's own constraints — narrower only, never wider — refused
    `invalid_mandate` / `mandate_expired` / `mandate_exceeded` / `model_not_served` rather
    than the key's own codes, so a delegate learns the delegation bit, not the budget. A
    mandate's committed spend is ledger-derived (the mandate id rides each entry's
    provenance correlation, summed like a key's own committed spend), so its spend
    is provable inside the ledger like everything else, and a
    settled bill names the mandate under its content hash (settlement description v7). Every
    mandate is `notAfter`-bounded and none is revocable — for revocable delegation, mint a
    constrained key instead.

    0.67.0 adds the x402-shaped deposit rail (issue #264): `POST /api/v1/topups/x402`
    credits a signed payment authorization — `{scheme, network, asset, amountMinor,
    payTo, nonce, payer, signature}` as base64url `payment` — through the same
    pending → confirmed → credited walk every rail shares, the signed `nonce`
    anchoring `payment_ref` so a replay credits once. The verifier is the seam: a
    real EIP-712/x402 verifier drops into the same interface later; today's stand-in
    checks an Ed25519 test-scheme signature (`scheme: "exact"`, `network:
    "oxsum-ed25519"`, `asset: "OXSUM-CREDIT"`) against `OXSUM_X402_VERIFYING_KEY`,
    and an unconfigured deployment answers 503. No chain RPC, no finality check, no
    real wallet signatures — the boundary is stubbed, the bookkeeping is real.

    0.68.0 makes the x402 rail real (issue #282): the `OXSUM_X402_FACILITATOR_*`
    set (`URL` + `NETWORK` + `ASSET` + `PAY_TO`, all-or-none) swaps the stand-in
    for a verifier delegating to an x402-rs facilitator sidecar — `/verify`
    proves the EIP-3009 authorization's signature and limits, `/settle` lands
    the transfer on-chain, and the chain's transaction hash records into
    `deposits.facilitator_tx_hash` (migration 0048). The request gains optional
    `amountMinor` — the `paymentRequirements.maxAmountRequired` the facilitator
    is asked to enforce — and `payment` now carries whichever wire the
    configured rail speaks: the V1 `PaymentPayload` under the facilitator, the
    test-scheme body under the stand-in. A same-nonce race settles once: the
    deposit row is claimed `FOR UPDATE` across the on-chain call.

    0.69.0 reconciles the upstream cost estimate against the billed fact (issue
    #283): `AdminMargin` gains `providerBilledMinor` — the channel's cumulative
    provider-billed total, channel-scoped so the same figure repeats on each of
    that channel's model rows (null when the `upstream-bill-sync` pass has never
    reconciled the channel). The daily leader-required `upstream-bill-sync` job
    pulls each channel's billed cost for the day just closed, records it beside
    the day's summed `upstream_cost_minor` in `oxsum.upstream_bills` (migration
    0049), and flags drift over the alert threshold as `anomaly.detected`.
    `channels` gains `bill_key_sealed`/`bill_key_last4` — the admin billing
    credential, sealed beside the metering key and deliberately separate, so a
    relay credential never reads the org's bill.

    0.70.0 adds the Airwallex deposit rail (issue #285): `POST /api/v1/topups/airwallex`
    opens a `pending` deposit, asks Airwallex for a PaymentIntent and answers
    `{checkoutUrl, intentId, clientSecret, depositId}` — the hosted-page URL the
    payer's browser follows plus the SDK secret it confirms against. The signed
    webhook at `POST /api/v1/webhooks/airwallex` (`x-timestamp` + `x-signature`,
    HMAC-SHA256 of `timestamp + body`) confirms and credits the deposit the intent
    names under the fixed ledger key `airwallex:<intent_id>` — a replayed or raced
    delivery credits once — and `payment_intent.cancelled`/`payment_intent.expired`
    close it. The `rail` CHECK widens to admit `airwallex` (migration 0050). The
    rail needs `OXSUM_AIRWALLEX_CLIENT_ID`, `OXSUM_AIRWALLEX_API_KEY`,
    `OXSUM_AIRWALLEX_WEBHOOK_SECRET` and `OXSUM_PUBLIC_URL` together; a deployment
    without them answers 503 on the intent and 404 on the webhook.

    0.71.0 adds model aliases (issue #286): a channel may serve a public name that
    renames the upstream model it relays. `POST /api/v1/admin/channels/{channelName}/aliases`
    claims an alias for a channel, `GET` lists one channel's aliases and
    `DELETE …/aliases/{alias}` drops one. An alias is a rename, not a routing
    layer — the name resolves to the one channel that claims it, the gateway
    forwards the upstream name, and `GET /v1/models` lists the alias beside the
    direct names. A settlement under an alias describes itself at version 8:
    `model` stays the asked-for alias and a new `upstreamModel` names what
    answered. The alias's own price row wins over the upstream model's on that
    channel, so a public name can be priced differently.

    0.72.0 adds share links for usage reports (issue #300): a downstream customer
    holds no account, so a link is the capability. `POST …/usage-reports/{reportId}/links`
    pins one report, `POST …/usage-reports/links` names one customer and lists
    the reports issued to them, `GET` lists the organization's links and
    `DELETE …/links/{linkId}` revokes one. The plaintext token is answered once;
    the database keeps only its SHA-256. Links expire (30 days by default, 90 at
    most), and the customer-facing `/bill/{token}` page that resolves them is
    served by the deployment rather than this API.

    0.73.0 lets the mint mail the link (issue #315): both request bodies accept an
    optional `email`, and the response's `delivery` says `sent` or `failed` when a
    mail was attempted. A deployment with no mailer refuses `email` with
    `VALIDATION_ERROR`; a send failure still answers the token and `delivery:
    failed`, because the link exists and can be passed on by hand.

    0.74.0 adds the Hyperswitch deposit rail (issue #319): `POST /api/v1/topups/hyperswitch`
    opens a deposit and creates a payment on the switch, answering the payment id, the
    `clientSecret` the browser SDK confirms against and the `publishableKey` it initializes
    with. The switch's webhook at `POST /api/v1/webhooks/hyperswitch` verifies
    `X-Webhook-Signature-512` (hex HMAC-SHA512 over the raw body), records every event under
    its `event_id` before acting, and credits `payment_succeeded` under
    `hyperswitch:<payment_id>`. An unconfigured rail answers 503 at the intent and 404 at the
    webhook.

    0.75.0 carries the witness half of a usage report (issue #328): `witnessOrigin` names the
    tenant log, `witnessKeys` the deployment's pinned witness keys (public), and `witnessNotes`
    the cosigned notes stored for the bundle's head — the three pieces a reader runs
    `verify_witnesses` over. All three are optional: an absent `witnessKeys` means no witnesses
    are pinned, and an absent `witnessNotes` means no cosignature covers that head yet.

    0.76.0 turns the usage report's completeness from a claim into a proof when the span is
    anchored (issue #339): `completeness` carries the anchor entry that fixed the customer's
    day-log head, the head, its inclusion in the anchor's sorted map, and every day leaf the head
    was folded from. The verifier rebuilds each day leaf from the rows the proof assigns to that
    day, so a dropped day or a row assigned to the wrong day fails. It is optional: without it
    (an unanchored span, or history from before the day log) the report still verifies, with
    completeness as the organization's claim.

    0.77.0 seals the anchored day (issue #340): a settlement whose booking date falls in a day the
    daily anchor already committed is refused with `409 DAY_SEALED` — the day log's leaf for that
    day must never change after the anchor fixed it, or a completeness proof would disagree with
    the ledger. The reconciliation report gains the `anchored_day_altered` class: a day leaf that
    no longer folds to its anchor's map root (a bypassed seal, a hand edit) is drift for the
    operator. The seal is a write rule, not a repaired fact: a late settlement is refused, and
    history anchored before this rule stays as it was.

    0.78.0 adds credit notes (issue #352, decision D12): `POST
    /api/v1/admin/organizations/{organizationId}/credit-notes` credits an organization's wallet
    with a reasoned, positive amount, posting one ledger entry — Revenue debited, Wallet credited,
    the reason as its description — and `GET` on the same path lists what was issued, newest
    first. A retried `idempotencyKey` answers the standing note. A credit note moves no money: it
    is not a refund, and the refund and chargeback halves of D12 stay separate.

    0.79.0 adds the operator's money-in view (issue #354): GET /api/v1/admin/deposits lists the newest deposits platform-wide or for one organization — rail, status, the amount opened for, what the rail reported paid, the rail's reference and the ledger entry once credited. It is read-only: nothing on this path confirms, credits or reverses a deposit.

    0.80.0 adds the ledger half of a refund (issue #356, decision D12): `POST
    /api/v1/admin/deposits/{depositId}/reverse` reverses a `credited` deposit — one
    ledger entry (Wallet debited, Cash credited, the reason as its description) and
    the deposit flips to `reversed`, naming `reversalEntryId` and `reversedAt`. The
    ledger key derives from the deposit id, so a retry or double-click replays the
    standing entry instead of posting twice. A deposit the wallet cannot cover is
    `402 INSUFFICIENT_FUNDS` — the customer spent the credit — and one that is not
    `credited` is `409`. No payment provider is called: returning the money through
    the rail is a separate issue.

    0.81.0 extends the Hyperswitch intent (issue #320): `POST
    /api/v1/topups/hyperswitch` also answers `sdkUrl` — the origin the dashboard
    loads `HyperLoader.js` from (`OXSUM_HYPERSWITCH_SDK_URL`, default the hosted
    `https://beta.hyperswitch.io/v1`). The API origin and the SDK bundle are
    different services, so the response carries both.

    0.82.0 wires the payment-provider half of a refund and the dispute record
    (issue #360): reversing a `credited` Hyperswitch deposit also calls the
    switch's `POST /refunds`, and the deposit row's `meta` carries
    `hyperswitchRefundId` plus a `refundStatus` the `refund_succeeded` /
    `refund_failed` webhooks walk. `AdminDeposit` gains `refundStatus` and
    `disputedAt`; a `dispute_opened` webhook records the dispute timestamp and
    enqueues `deposit.disputed` — accepting it is the existing reversal path.
    A rail that cannot refund answers `refundStatus: null`; a refund call the
    switch refuses is recorded as `refundStatus: failed`, never silent.

    0.83.0 adds credential pools (issue #444): a channel carries several
    upstream keys instead of one, so a single account's 429 fails over onto the
    pool's next credential of the *same* channel — same price — before the turn
    has to leave for a differently-priced route. `Channel.credentials` replaces
    `apiKeyLast4` (the pool, not the key); `ChannelRequest` takes `apiKeys`
    beside the single-key `apiKey` spelling; and three endpoints manage the
    pool — `POST` a credential, `PATCH` one active/disabled, `DELETE` it. The
    settlement still names `(channel, priceVersion)` only: which credential
    answered is routing detail, never ledger data.

    0.84.0 adds the statement proof bundle (issue #479): `GET
    `/api/v1/statements/{statementId}/proof` answers a self-contained
    `StatementProof` — the statement and its lines, the anchor, the covered
    entries' `windowHashes` in log order, the `expectedHead` right after the
    anchor and the `expectedOrigin` — so `verify_statement_anchor` runs off a
    single response instead of stitching three endpoints together.
    0.87.0 adds subscription quota plans (issue #496): a plan grants a
    per-period credit quota that meters before the wallet. The admin defines
    plans (`GET /api/v1/admin/subscription-plans`, `PUT
    /api/v1/admin/subscription-plans/{name}`) and binds one to an organization
    (`PUT`/`DELETE /api/v1/admin/organizations/{organizationId}/subscription`).
    A gateway request then draws from the active subscription first and holds
    only the overflow against the wallet; a plan with
    `allowWalletOverflow=false` refuses the request once its period quota is
    exhausted. Periods close and reopen on the plan's reset boundary —
    `daily`, `weekly`, `monthly` or `never` — lazily on the next draw and via
    an hourly rollover job. The org reads its own subscription and period
    history (`GET /api/v1/org/subscription`, `GET
    /api/v1/org/subscription/periods`) and, on a Stripe-configured deployment,
    buys a plan through `POST /api/v1/org/subscription/checkout`; the Stripe
    webhook now also handles `invoice.paid` (period renewal) and
    `customer.subscription.deleted`. The drawn share is bound into the
    settlement's v9 description (`subscription.subscriptionId`, `periodId`,
    `drawnMinor`, `chargedMinor`) so `verify_charge` proves which entitlement
    paid.

    0.86.0 adds OpenAI's Responses API (issue #495): `POST /v1/responses` accepts the
    successor wire — `input` items rather than `messages`, `max_output_tokens` the
    only ceiling spelling — served by the same `openai` channels, called upstream at
    `{baseUrl}/responses` with the Bearer credential. `store` and
    `previous_response_id` are pass-through: the gateway keeps no response state of
    its own, so a stateful chain lives or dies by the upstream's store. Usage
    normalization follows the Responses report — `usage.input_tokens` /
    `usage.output_tokens`, with `output_tokens_details.reasoning_tokens` the
    reasoning subset — and a stream ends on `response.completed`, the event that
    carries the final usage; there is no `[DONE]` sentinel on this wire.

    0.85.0 adds the third upstream protocol (issue #494): channels may now declare
    `protocol: gemini`, served on `POST /v1beta/models/{model}:generateContent` and
    `:streamGenerateContent`. A Gemini client names the model in the path and picks the
    streaming action in the URL — there is no `stream` body field — and the surface
    freezes, relays and settles the turn by the same contract as the other chat
    surfaces. Upstream is called at `{baseUrl}/models/{model}:generateContent` (or
    `:streamGenerateContent?alt=sse`) with the channel credential as `x-goog-api-key`,
    which both `generativelanguage.googleapis.com` and `*-aiplatform.googleapis.com`
    accept. Usage normalization follows `usageMetadata`: `promptTokenCount` already
    includes the cached share and `candidatesTokenCount` excludes the thinking share,
    so the billed output is `candidatesTokenCount + thoughtsTokenCount`, the billed
    input `promptTokenCount + toolUsePromptTokenCount`, and `cachedContentTokenCount`
    fills the cached dimension.

    Every `/api/v1` endpoint that takes a bearer key also accepts the session cookie. The
    endpoints that take no credential at all are the ones whose credential is in the body or
    whose job precedes authentication: `/api/v1/auth/login`, `/api/v1/auth/logout`,
    `/api/v1/auth/register`, `/api/v1/auth/oauth/github`, `/api/v1/auth/oauth/github/callback`,
    `/api/v1/auth/methods`, `/api/v1/auth/verify`, `/api/v1/auth/password/forgot`,
    `/api/v1/auth/password/reset`, `/api/v1/invitations/redeem`, `/api/v1/device/code`,
    `/api/v1/device/token`, `/api/v1/log/key`, `/api/v1/webhooks/stripe`,
    `/api/v1/webhooks/airwallex` and `/api/v1/webhooks/hyperswitch`. The cookie is never
    accepted on `/v1`: the gateway takes an API key only — `Authorization: Bearer` or
    `x-api-key`.
servers:
  - url: http://localhost:3000
security:
  - bearer: []
paths:
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema: { type: string, example: ok }
  /metrics:
    get:
      summary: Prometheus metrics
      description: |
        The process's telemetry in Prometheus exposition format (`text/plain;
        version=0.0.4`): HTTP request counts and durations by matched route, the
        gateway's money path (holds taken, settlements by kind, charged minor
        units, settled tokens, upstream response latency), rate-limit rejections,
        idempotency claim outcomes, and scrape-time gauges for open holds and the
        shared connection pool. The credential is the operator token — the same
        `OXSUM_ADMIN_TOKEN` the `/api/v1/admin` surface takes — so a Prometheus
        scrape config carries it as `bearer_token`. A deployment with no
        operator token answers 401 here, the same as every admin route.
      responses:
        "200":
          description: The current exposition document
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /add-checkpoint:
    post:
      summary: Offer a head to this deployment's tlog-witness (issue #260)
      description: |
        The [C2SP `tlog-witness`](https://c2sp.org/tlog-witness) endpoint: a
        foreign transparency log asks this deployment to vouch for one history
        and no other. Present on deployments that opt in with
        `OXSUM_WITNESS_SIGNING_KEY` (and `OXSUM_WITNESS_KEY_NAME`); a deployment
        that does not run a witness answers 404 like any unknown path.

        The body is the tlog-witness request format: the submitting log's
        signed checkpoint note (`origin`, `size`, `root`, a blank line, then
        the submitter's own signature lines) followed by one base64 line per
        consistency-proof hash proving the new head extends the head this
        witness already vouched for. The old size is this witness's own state —
        it is not read from the request, so a proof cannot be aimed at a head
        the witness never accepted.

        Which origins this witness tracks is out of band: `OXSUM_WITNESS_TRUST`
        pins `origin=size:root` starting heads, and a submission for an
        origin not in that set is refused — there is no trust-on-first-use,
        and that is the point. The refusals are the witness's own vocabulary:
        `404` for an origin it does not track, `409` for a checkpoint that
        forks what it already vouched (same size, different root) or shrinks
        below it, `400` for a malformed body or a consistency proof that does
        not verify, `401` for a note carrying no signature line at all — a
        witness signs nothing it cannot attribute to a log key.

        On accept the witness stores the head and returns the note with its
        own `cosignature/v1` (algorithm `0x04`) signature line appended — the
        cosigned note the submitter files as its `witness_cosignatures` row.
        A re-offer of the head already held answers the same cosigned note:
        an at-least-once delivery path resends, and a witness that refused
        would be unusable behind one.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: "the signed checkpoint note, a blank line, then one base64 line per consistency-proof hash"
      responses:
        "200":
          description: The checkpoint note with this witness's cosignature line appended
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/register:
    post:
      summary: Register a user, its personal organization and the first API key
      description: |
        Refused with `FORBIDDEN` unless the deployment allows self-service signup (`OXSUM_SIGNUP=open`).
        The API key secret is returned once, here, and is never retrievable again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: The new user and organization, plus the one API key secret
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Registration" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/invitations/redeem:
    post:
      summary: Register through an invitation link
      description: |
        The one registration an `invite`-mode deployment allows — the link is the
        credential, so no other authentication applies, whatever `OXSUM_SIGNUP` is.
        The token names one live invitation: usable once, valid seven days from minting,
        and unknown, spent and expired tokens are all `404 NOT_FOUND` — which is wrong
        is the holder's business. The new account joins the invitation's organization as
        a `member`, with the first API key minted for that organization; no personal
        organization is created — that is what `auth/register` is for.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemInvitationRequest" }
      responses:
        "200":
          description: The new user and organization, plus the one API key secret
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Registration" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      summary: Log in with email and password
      description: |
        Mints a session and answers it in the body together with a `Set-Cookie` header carrying the
        session cookie (`oxsum_session`, `HttpOnly`, `SameSite=Lax`, `Path=/`, plus `Secure` when the
        deployment sets `OXSUM_SESSION_COOKIE_SECURE`).

        An unknown email and a wrong password answer the same 401 with the same message, and the
        unknown-email path still pays for one password-hash verification, so neither timing nor
        wording reveals whether an account exists. The session acts as the user's organization, in
        their role; it expires thirty days after login and stops authenticating the moment the
        user's membership in that organization is gone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: The user, the organization, the role and the session; the `Set-Cookie` header carries the session cookie
          headers:
            Set-Cookie:
              description: "the session cookie: `oxsum_session=<token>; Path=/; HttpOnly; SameSite=Lax`, plus `; Secure` when the deployment sets `OXSUM_SESSION_COOKIE_SECURE`"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      summary: Log out
      description: |
        Revokes the session the cookie names and clears the cookie with a `Set-Cookie` header
        (`Max-Age=0`). Always 200: logging out twice is not an error, and neither is logging out
        without a session at all — which is why this route takes no credential.
      security: []
      responses:
        "200":
          description: Logged out; the `Set-Cookie` header clears the cookie
          headers:
            Set-Cookie:
              description: "`oxsum_session=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0`, plus `; Secure` when the deployment sets `OXSUM_SESSION_COOKIE_SECURE`"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LogoutResponse" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/methods:
    get:
      summary: Which login methods this deployment offers
      description: |
        The unauthenticated discovery the login page needs to know which
        buttons to draw: `oauthGithub` is true when the GitHub OAuth pair is
        configured and `/api/v1/auth/oauth/github` will answer its redirect.
      security: []
      responses:
        "200":
          description: The methods on offer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AuthMethods" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/device/code:
    post:
      summary: Start a device authorization
      description: |
        The first leg of the device grant (RFC 8628-flavored): a CLI or other
        input-constrained tool mints a request, shows the `userCode` to a
        signed-in user at `verificationUri`, then polls
        `/api/v1/device/token`. The `deviceCode` proves the tool still owns
        the request — it is `oxd-` plus 32 random bytes and only its SHA-256
        is stored — and the `userCode` (`XXXX-XXXX`, unambiguous alphabet) is
        what the user types. Both expire `expiresIn` seconds after minting;
        `interval` is the minimum seconds between polls.
      security: []
      responses:
        "200":
          description: The minted device request
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DeviceCodeResponse" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/device/request:
    get:
      summary: Read a pending device request
      description: |
        What the approval page reads before showing the decision: the request
        the typed `code` names, or `404 NOT_FOUND` for a code that never
        existed, expired, or already carries a verdict — the page cannot tell
        them apart, and neither can someone guessing codes.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, description: "the user code, `XXXX-XXXX`; dashes and case are ignored" }
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DeviceRequest" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/device/authorize:
    post:
      summary: Approve or deny a device request
      description: |
        The signed-in user's verdict on the request the `userCode` names.
        `approve: true` marks the request approved for the session's current
        organization with the session user as the key's creator — the API key
        itself is minted later, inside the tool's successful
        `/api/v1/device/token` poll, so its secret is never at rest.
        `approve: false` denies it. Either way the stamp is atomic: a raced
        second verdict answers `404` like a spent code, and so does a code
        that expired or never existed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAuthorizeRequest" }
      responses:
        "200":
          description: The request after the verdict
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DeviceRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/device/token:
    post:
      summary: Poll a device authorization
      description: |
        The tool's second leg, polled no faster than `interval`. While the
        request waits the answer is `{"status": "pending"}`; a denied request
        answers `{"status": "denied"}`. The first poll after approval answers
        `{"status": "approved", "apiKey"}` with the key minted for the
        approver's organization in that same transaction — the secret is
        answered once and never stored — and every poll after that answers
        `{"status": "consumed"}`. An unknown, expired or already-consumed
        `deviceCode` is `404 NOT_FOUND`; polling inside `interval` is 429
        `RATE_LIMITED` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceTokenRequest" }
      responses:
        "200":
          description: The request's current standing
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DeviceTokenResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/oauth/github:
    get:
      summary: Start a GitHub OAuth login
      description: |
        The first leg of the OAuth flow: answers `303 See Other` to GitHub's
        authorize page with `scope=read:user user:email` and a `state` minted
        server-side — single-use and ten-minute-lived, so a callback carries a
        token that can be spent once ever. The callback URL is built from
        `OXSUM_PUBLIC_URL`, which the OAuth configuration requires.
        A deployment without the provider pair configured answers `404`, and
        this route is only ever a browser redirect — no body.
      security: []
      responses:
        "303":
          description: Redirect to the provider's authorize page
          headers:
            Location:
              description: "the authorize URL: `{authorize}?client_id=…&redirect_uri=…&scope=read:user user:email&state=…`"
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/oauth/github/callback:
    get:
      summary: Finish a GitHub OAuth login
      description: |
        The provider's redirect lands here with `code` and `state`. The state is
        consumed atomically — an unknown, spent or expired one rejects the whole
        attempt — the code is exchanged for an access token, and the account
        resolves by the primary **verified** email the provider reports: a
        linked `oauth_accounts` row first, then an email match that links the
        identity, and otherwise a registration when `OXSUM_SIGNUP=open` (an
        `invite` deployment refuses new accounts here). Success mints a session
        and answers `303` to `/dashboard` with the session `Set-Cookie`; every
        failure answers `303` back to `/login?error=oauth`, because the caller
        is a browser mid-redirect, not an API client.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "303":
          description: Redirect to `/dashboard` with the session cookie on success, to `/login?error=oauth` on any failure
          headers:
            Location:
              description: "`/dashboard` or `/login?error=oauth`"
              schema: { type: string }
            Set-Cookie:
              description: "the session cookie on success — `oxsum_session=<token>; Path=/; HttpOnly; SameSite=Lax`, plus `; Secure` when configured"
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/verify/request:
    post:
      summary: Mail the session user's verification link
      description: |
        Mints a single-use email token (seven-day life, stored as its SHA-256 hash) and
        mails the verification link to the session user's address. The session is the
        credential: an API key names no user and is `FORBIDDEN` here.

        A deployment without a mailer answers `SERVICE_UNAVAILABLE` — sending the mail
        is the endpoint's whole job. An already-verified user answers `alreadyVerified`
        without mailing. A resend within sixty seconds of the last mint answers
        `sent: false` rather than mailing again — the cooldown keeps the endpoint from
        being a mail amplifier.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Whether a verification mail went out
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/VerifyRequestResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/verify:
    post:
      summary: Consume a verification token
      description: |
        Marks the token's user's email verified. Unknown, spent and expired tokens are
        all `404 NOT_FOUND` — which is wrong is the holder's business. Already-verified
        is not an error: the token is consumed all the same.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: The email is verified
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [verified]
                    properties:
                      verified: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password/forgot:
    post:
      summary: Mail a password-reset link
      description: |
        Always 200 with an empty `data` — an unknown address gets the same answer as a
        known one, so the endpoint enumerates no accounts. When the address has an
        account and no reset mail went out in the last sixty seconds, a single-use
        token (one-hour life, stored as its SHA-256 hash) is minted and the link is
        mailed. A deployment without a mailer mints and mails nothing and still
        answers the same 200.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "200":
          description: Empty, whatever the address
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password/reset:
    post:
      summary: Consume a reset token and set a new password
      description: |
        Sets the token's user's password — the same length rule as signup — and
        revokes every session they hold, in one transaction: the old credential dies
        with the reset. Unknown, spent and expired tokens are all `404 NOT_FOUND`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: The new password is set; how many sessions it revoked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sessionsRevoked]
                    properties:
                      sessionsRevoked:
                        type: integer
                        format: int64
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/session:
    get:
      summary: The current session
      description: |
        Who is logged in, as which organization, in which role. Takes the session cookie; a bearer
        key names no session and answers 404.
      security:
        - bearer: []
        - sessionCookie: []
      responses:
        "200":
          description: The session, the user, the organization and the role
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/session/organization:
    post:
      summary: Switch the organization the session acts as
      description: |
        Carries the session's acting organization — the choice the dashboard's switcher makes.
        `organizationId` must name an organization the user is a member of; any other value, a real
        organization the user does not belong to included, answers `404` so memberships cannot be
        probed. The session row is updated, so the choice survives reloads and new tabs alike, and
        every organization-scoped read follows it. A person's action: an API key already *is* an
        organization and cannot act as another, so it is refused (403).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchOrganizationRequest" }
      responses:
        "200":
          description: The session, now acting as the chosen organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/users/me:
    delete:
      summary: Delete the session user's account (pseudonymization)
      description: |
        Irreversible. The account's identity is erased while the books keep their history:
        the user row's `email` is tombstoned to `deleted-<userId>@deleted.invalid`, the
        password hash is blanked so no login can ever succeed, `emailVerified` is cleared,
        every session the user holds is revoked, and every API key they minted is revoked.
        Every membership of the user is removed — except that a user who is an
        organization's last owner is refused (409): transfer ownership first, the same
        wall membership management keeps. The user's own keys' usage attribution is
        pseudonymized: `usage_records.end_user`/`tags` on turns their minted keys paid
        are nulled, as are the `open_holds` watch rows. The OAuth links and minted email
        tokens go with the account; an invitation they sent stays — it is the receiving
        organization's fact. An organization whose only member was the user — the personal
        organization every signup creates, or a team org that shrank to one seat — is
        tombstoned with them: renamed `deleted-<id>` and suspended. The ledger never
        changes — settlement descriptions carry no identity — so a deleted user's bills
        still verify.

        A person's action: the session cookie only, an API key is refused (403), and the
        body's `password` must verify against the account — a wrong one is 401. An
        account created through OAuth carries an unknown password by construction; it
        must set a real one through the reset flow before it can confirm this call. The
        answer names what was removed. The session dies in the same commit, so a
        second call can never reach the handler — its cookie is already dead.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: The account's current password — the act's confirmation.
      responses:
        "200":
          description: The account is deleted; the session that asked dies with it
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AccountDeletion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/orgs:
    get:
      summary: The organizations the session's user belongs to
      description: |
        Every organization the logged-in user is a member of, oldest membership first, each with
        the role the user holds in it — the list the organization switcher offers. A person's list:
        an API key belongs to one organization and names no member, so it is refused (403).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The user's organizations with their roles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserOrganization" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a team organization
      description: |
        Creates a `team` organization — its own ledger, its own keys, its own balance — and makes
        the session's user its owner. There is deliberately no `personal` kind to create: a personal
        organization is exactly what signup makes. A person's action: an API key has no user to own
        the new organization, so it is refused (403). The session keeps acting as the organization
        it had; switching to the new one is `POST /api/v1/session/organization`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "200":
          description: The created organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org:
    get:
      summary: The authenticated organization
      description: The organization the presented credential belongs to.
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    patch:
      summary: Set the organization's display currency
      description: |
        Sets the fiat unit the organization renders its balances, bills and
        statements in (issue #257): `displayCurrency` is the code plus the rate
        one credit converts at plus the decimals the render rounds to, and an
        explicit `null` clears the display back to credits alone. The write is
        presentational only — it touches no ledger and moves no money, so a
        settled bill's verified charge can never depend on it.

        A session in the owner or admin role writes it; a member's session and
        an API key are refused — the display is the organization's own setting,
        and a credential that is not a person cannot speak for it.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrgDisplayRequest" }
      responses:
        "200":
          description: The organization as it now reads
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/keys:
    get:
      summary: List the organization's API keys
      description: |
        Metadata only. Neither a secret nor a hash is ever returned. Members see only the keys they
        created; owners and admins see every key of the organization. An API key acting as the
        organization sees all of them, as before sessions.
      responses:
        "200":
          description: The organization's keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create an API key
      description: |
        Returns the secret once. A key minted through a session records who minted it (`createdBy`),
        for the per-member role rules; a key minted with an API key records no creator, because no
        person acts there.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKeyRequest" }
      responses:
        "200":
          description: The new key and its secret, shown only here
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedApiKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/keys/{keyId}:
    patch:
      summary: Set an API key's constraints
      description: |
        Replaces the key's whole constraint set — each of `spendLimitMinor`,
        `budgetDuration`, `modelAllowlist`, `requestsPerMinute`,
        `maxConcurrentHolds` and `tokensPerMinute` is written as given, so a
        field left out or null clears it.

        `spendLimitMinor` caps what the key may have committed — settled charges plus
        outstanding holds attributed to it, in minor units. `budgetDuration` makes
        that cap periodic: with `daily`, `weekly` or `monthly` the committed figure
        counts only the current UTC period's settled charges, plus every outstanding
        hold whatever its age; without it the cap is cumulative over all time.
        `budgetDuration` is meaningless without a limit and is refused without one.
        `modelAllowlist` lists the gateway models the key may call; a hold naming a
        model outside it is refused 403 `FORBIDDEN`. The `/api/v1/holds` endpoint
        takes no model and is not governed by the list.

        `requestsPerMinute` caps how many requests the key may start inside a
        rolling minute — on the gateway and on `POST /api/v1/holds` alike. A request
        past it is refused 429 `RATE_LIMITED`, answering `Retry-After` and the
        `X-RateLimit-Limit`/`X-RateLimit-Remaining`/`X-RateLimit-Reset` headers.
        `maxConcurrentHolds` caps how many holds the key may have outstanding at
        once: a hold over it is refused 429 `TOO_MANY_HOLDS`, counted from the
        ledger's own pending entries under the same per-key lock as the spend
        limit, so racing requests cannot both fit through.

        `tokensPerMinute` caps the settled input+output tokens the key may burn
        inside a trailing minute (issue #203). Where RPM spends a slot at admission,
        TPM counts *settled* usage — a durable window a settlement feeds in its own
        transaction, never a hold. A gateway request is refused 429
        `TOKENS_PER_MINUTE` when the tokens already settled inside the minute plus
        this request's own estimate (the input bound plus the output bound — the
        same figures the freeze prices) exceed the cap; `POST /api/v1/holds`,
        amount-only, is refused 429 `TOKENS_PER_MINUTE` only once the window is
        already full. Both answer `Retry-After` and the `X-RateLimit-*` headers.

        A hold that would push the key past its limit is refused with 429
        `KEY_LIMIT_EXCEEDED`, atomically with the ledger append, so concurrent requests
        cannot exceed it. A replayed hold answers its own receipt before any of
        these checks run: retrying one request never consumes the key's windows
        twice. The scope rules are the revoke's: a member may change only the keys
        they created — any other key id answers 404 and the key is untouched; owners, admins
        and API keys acting as the organization may change any key of the organization. A key
        id belonging to another organization is `NOT_FOUND`.
      parameters: [{ $ref: "#/components/parameters/KeyId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateKeyConstraintsRequest" }
      responses:
        "200":
          description: The key with its new limit
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Revoke an API key
      description: |
        Permanent and idempotent. A member may revoke only the keys they created — revoking any
        other answers 404 and the key stays live; owners and admins may revoke any key. A key id
        belonging to another organization is `NOT_FOUND`.
      parameters: [{ $ref: "#/components/parameters/KeyId" }]
      responses:
        "200":
          description: The revoked key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/keys/{keyId}/mandates:
    get:
      summary: List a key's mandates
      description: |
        Every mandate minted for the key, newest first — metadata only: `mandate` is the
        base64url body whose signature the delegate carries; the seed that signed it never
        leaves. The scope rules are the revoke's: a member lists only the keys they created,
        any other key id answers 404.
      parameters: [{ $ref: "#/components/parameters/KeyId" }]
      responses:
        "200":
          description: The key's mandates, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Mandate" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Mint a spend mandate for a key
      description: |
        Delegates a strictly narrower slice of the key's authority to a bearer who does not
        hold the key. The answer's `mandate` is the base64url body the delegate presents in
        `X-Oxsum-Mandate` on `/v1/*` and `POST /api/v1/holds`; it is signed once, at mint,
        under the key's `mandateSigningSeed`, and the delegate verifies nothing — the hold
        path does. A mandate can only narrow the key's own constraints: `capMinor` and
        `models` must sit inside the key's, and `notAfter` bounds how long it lives. Every
        mandate carries a `nonce` for uniqueness, so two identical requests mint two
        different mandates. Minting needs the key itself (`Authorization: Bearer oxs-…`) or
        an owner/admin session — holding the credential is what authorizes delegation.
      parameters: [{ $ref: "#/components/parameters/KeyId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMandateRequest" }
      responses:
        "200":
          description: The minted mandate — `mandate` is the signed blob the delegate carries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedMandate" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/invitations:
    post:
      summary: Mint an invitation link
      description: |
        A link into this organization: `/register?invite=<token>` in the dashboard, or
        `POST /api/v1/invitations/redeem` with the token, an email and a password. The
        token is answered exactly once, here; the database keeps only its hash. An
        invitation is valid seven days and works once. Owners and admins mint links;
        a member is refused, and a person's action means a bearer API key is refused
        too — a key is not a person.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The invitation, with the one time the token is visible
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedInvitation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/members:
    get:
      summary: List the organization's members
      description: |
        The members the session's organization carries, with each member's role and
        budget cap — the dashboard's members page. Reading is any member's right;
        the writes beside this path are an owner or admin's.
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [members]
                    properties:
                      members:
                        type: array
                        items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Add an existing account to the organization as a member
      description: |
        The email names an account that already exists, and that account becomes a member.
        Someone who has no account yet comes in through an invitation link instead:
        `POST /api/v1/org/invitations` mints one and `POST /api/v1/invitations/redeem`
        registers through it. An unknown email here is `NOT_FOUND`, never a stored
        invitation.

        Only an owner or an admin may manage memberships, and only a logged-in person: an API key is
        not a person and names no role, so it is refused here too (docs/decisions.md, "membership
        management is a person's action"). A member is refused. A new membership's role is always
        `member`; ownership is never granted here, and only `POST /api/v1/org/ownership` can move
        the owner seat.

        Adding the second person to a personal organization flips its kind to `team`; the ledger
        does not move. An account that is already a member is `CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "200":
          description: The new membership
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/members/{userId}:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    patch:
      summary: Change a member's role or budget
      description: |
        `role` is `admin` or `member`, and there is deliberately no `owner` value: ownership is a
        single seat, moved by `POST /api/v1/org/ownership`, so no role change can promote anyone to
        owner (a body naming `owner` is `VALIDATION_ERROR`, not a promotion). Only an owner or an
        admin, and only a session: an API key or a member is refused.

        `budgetLimitMinor` caps what the member may commit — settled charges plus outstanding
        holds summed over every key they minted (`created_by`). A key whose creator is over its
        budget cannot take a new hold (`402 KEY_LIMIT_EXCEEDED`, the same refusal a key's own
        spendLimitMinor raises); an explicit `null` clears the cap.

        `teamId` assigns the member to a team of this organization (issue #440) — the budget
        hierarchy's middle layer: key → member → team → organization credit line. Absent leaves
        the assignment, an explicit `null` unassigns, a team id moves the member under that
        team's cap for their *next* hold. Committed spend follows the roster — the money their
        keys already spent moves with them — and a team outside the organization is `NOT_FOUND`.
        At least one of `role`, `budgetLimitMinor` and `teamId` is required.

        An admin may not change an owner's role (403 `FORBIDDEN`) — an admin manages members, not
        the owner — and the last owner of an organization cannot be demoted (409 `CONFLICT`): an
        organization always has an owner. Setting the role a member already has answers the
        membership unchanged, so a retry is not an error. A user id that is not a member of the
        caller's organization is `NOT_FOUND`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200":
          description: The membership as it stands after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a member from the organization
      description: |
        The membership row is deleted; the user and their personal organization are untouched. Only
        an owner or an admin, and only a session: an API key or a member is refused. An admin may
        not remove an owner (403 `FORBIDDEN`), and the last owner cannot be removed (409
        `CONFLICT`) — transfer ownership first. Removing a user who is not a member of the caller's
        organization is `NOT_FOUND`, so a second removal is not a silent success.

        Removing the person a session acts for ends that session: resolution joins `memberships`,
        so a session cannot outlive the membership it names.
      responses:
        "200":
          description: The membership that was removed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/teams:
    get:
      summary: List the organization's teams
      description: |
        The teams the organization carries (issue #440), oldest first — the budget
        hierarchy's middle layer between members and the organization credit line.
        Reading the organization's own structure is any member's right; the writes
        beside it are owner/admin-gated.
      responses:
        "200":
          description: The teams
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [teams]
                    properties:
                      teams:
                        type: array
                        items: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a team
      description: |
        Creates a named subgroup under the organization with an optional
        `budgetLimitMinor`. Management is a person's action — an owner or an admin,
        and only a session; an API key or a member is refused. The name is unique
        per organization, so a retry of a create answers the standing team rather
        than minting a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "200":
          description: The team as created — or as it already stood under the name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/teams/{teamId}:
    parameters: [{ $ref: "#/components/parameters/TeamId" }]
    patch:
      summary: Change a team's name or budget cap
      description: |
        `name` renames the subgroup (unique per organization); `budgetLimitMinor`
        caps what the team's members may commit in total — settled charges plus
        outstanding holds summed over every key the team's members minted — absent
        leaves it, an explicit `null` clears it. An owner or an admin, and only a
        session: an API key or a member is refused. A team outside the
        organization is `NOT_FOUND`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTeamRequest" }
      responses:
        "200":
          description: The team as it stands after the change
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Dissolve a team
      description: |
        Removes the team; every membership it grouped keeps its seat with `teamId`
        nulled — the member layer stays, the team cap simply stops applying. An
        owner or an admin, and only a session.
      responses:
        "200":
          description: The team that was dissolved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/ownership:
    post:
      summary: Transfer ownership of the organization
      description: |
        The one way to become the owner, and the only way an owner stops being one: the named member
        is promoted to `owner` and the transferring owner becomes an `admin`, in one transaction, so
        the organization has exactly one owner before and after. Only an owner may call this
        (403 `FORBIDDEN` for an admin, a member or an API key), and the target must be a member of
        the same organization: an owner cannot transfer ownership to themselves (`CONFLICT`) or to a
        user who is not a member (`NOT_FOUND`).

        The owner seat is never left empty: the last owner can neither be removed nor demoted, and
        this endpoint moves the seat rather than creating a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferOwnershipRequest" }
      responses:
        "200":
          description: The new owner and the previous owner, now an admin
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Ownership" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/subscription:
    get:
      summary: The organization's active subscription
      description: |
        The subscription currently metering the organization's gateway
        requests, or `null` when none is bound. The `consumedMinor` counter is
        the period's spend so far against `quotaMinor`; when the plan's
        `quotaMinor` is `null` the quota is unmetered and every request draws
        in full. `state` is `active`, `cancelled` or `expired`; only an
        `active` row is ever returned here — a cancelled or expired binding
        leaves the organization unsubscribed.
      responses:
        "200":
          description: The active subscription, or `null`
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    anyOf:
                      - { $ref: "#/components/schemas/OrgSubscription" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/subscription/checkout:
    post:
      summary: Open a Stripe checkout for a subscription plan
      description: |
        Starts a Stripe Checkout session in `subscription` mode for the named
        plan's `stripePriceId`; the answer is the URL the browser is sent to.
        When Stripe reports `checkout.session.completed` the plan binds to the
        organization with `source: stripe`, and each later `invoice.paid`
        renews the period at the invoice's period end; a
        `customer.subscription.deleted` event cancels the binding. A plan
        without a `stripePriceId`, or a disabled one, is a `VALIDATION`;
        without Stripe configured the endpoint answers `UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionCheckoutRequest" }
      responses:
        "200":
          description: The checkout URL and the plan it buys
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [checkoutUrl, planId]
                    properties:
                      checkoutUrl:
                        type: string
                        format: uri
                        description: where the browser completes payment
                      planId: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/org/subscription/periods:
    get:
      summary: The organization's subscription period history
      description: |
        Every period a binding has ever metered for the organization, newest
        first: the snapshot quota, what it consumed, and the `outcome` it
        closed with (`boundary` for a rollover, `cancelled`, `expired`,
        `upgrade` or `downgrade` for a mid-period rebind; `open` while it
        meters). The audit trail for every subscription state transition is
        these rows — one row opens with each binding or rollover and closes
        with an outcome.
      responses:
        "200":
          description: The organization's periods, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionPeriod" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks:
    get:
      summary: List the organization's webhook endpoints
      description: |
        Every endpoint the caller's organization registered, newest first. A listing
        never carries a signing secret — only `secretLast4`; the full secret is
        returned once, at creation.
      responses:
        "200":
          description: The organization's endpoints
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Register a webhook endpoint
      description: |
        `url` is the HTTPS (or HTTP, for a receiver on localhost) address oxsum posts
        signed events to; `events` lists the event types it subscribes to. The catalog
        is `request.settled`, `org.suspended`, `deposit.credited`,
        `deposit.failed`, `deposit.reversed`, `balance.low`, `statement.finalized`,
        `statement.payment_overdue`, `statement.payment_status_updated`,
        `org.credit_limit_exceeded` and `anomaly.detected`. `balanceLowMinor` arms the
        `balance.low` threshold — the event fires once when a settlement drops the
        organization's available balance under the line, and again only after a
        deposit lifts it back over. The answer carries the signing
        secret once, under `secret`; store it there, because a listing only ever
        shows `secretLast4`. The secret seals under `OXSUM_SECRET_KEY` at rest, the
        same as a channel's upstream credential.

        A delivery POSTs `{id, type, created_at, org_id, data}` with
        `x-oxsum-event` naming the type and `x-oxsum-signature` carrying
        `t=<unix>,v1=<hex HMAC-SHA256 of "t.body" under the endpoint secret>`. A
        2xx answers delivered; anything else retries on a backoff for ten attempts
        before the delivery is marked `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookRequest" }
      responses:
        "200":
          description: The endpoint and its secret, shown only here
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedWebhook" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/{endpointId}:
    delete:
      summary: Delete a webhook endpoint
      description: |
        Permanent. Undelivered deliveries of the endpoint go with it. An endpoint
        belonging to another organization is `NOT_FOUND`.
      parameters: [{ $ref: "#/components/parameters/EndpointId" }]
      responses:
        "200":
          description: The deleted endpoint
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/{endpointId}/deliveries:
    get:
      summary: List an endpoint's recent deliveries
      description: |
        The fifty most recent attempts, newest first: each delivery's status, its
        attempt count, the response upstream answered, and when it is due next. An
        endpoint belonging to another organization is `NOT_FOUND`.
      parameters: [{ $ref: "#/components/parameters/EndpointId" }]
      responses:
        "200":
          description: The endpoint's deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/topups:
    post:
      summary: Top up credits
      description: |
        The `manual` deposit rail: the caller asserts money arrived out of band and the credit
        lands in the purchased pool. The credit is also recorded on `oxsum.deposits`
        (`rail = manual`, `payment_ref` = the idempotency key) so every funding event has one
        record for reconciliation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/topups/stripe:
    post:
      summary: Open a Stripe checkout to top up
      description: |
        The `stripe` deposit rail: opens a `pending` deposit (`payment_ref` =
        the `idempotencyKey`), asks Stripe for a checkout session and answers
        the redirect URL. A replayed intent (same `idempotencyKey`) answers the
        same checkout URL — the deposit's unique constraint is the idempotency
        anchor, not a lookup. A deployment without `OXSUM_STRIPE_*` answers
        503: the rail is configured or it is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "200":
          description: The checkout URL and the deposit id it credits
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [checkoutUrl, depositId]
                    properties:
                      checkoutUrl: { type: string, format: uri, description: "the hosted-payment-page URL the browser follows" }
                      depositId: { type: string, format: uuid, description: "the pending deposit this session confirms" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/topups/airwallex:
    post:
      summary: Open an Airwallex payment page to top up
      description: |
        The `airwallex` deposit rail (issue #285): opens a `pending` deposit
        (`payment_ref` = the `idempotencyKey`), asks Airwallex for a
        PaymentIntent and answers the hosted-page URL the payer's browser
        follows plus the `clientSecret` the SDK confirms against. A replayed
        intent (same `idempotencyKey`) answers the same URL and secret — the
        deposit's unique constraint is the idempotency anchor, not a lookup. A
        deployment without `OXSUM_AIRWALLEX_*` answers 503: the rail is
        configured or it is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "200":
          description: The hosted-page URL, the intent identity and the deposit it credits
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [checkoutUrl, intentId, depositId]
                    properties:
                      checkoutUrl: { type: string, format: uri, description: "the hosted-payment-page URL the browser follows" }
                      intentId: { type: string, description: "the PaymentIntent id the webhook names" }
                      clientSecret: { type: string, description: "the secret the hosted page's SDK confirms against" }
                      depositId: { type: string, format: uuid, description: "the pending deposit this intent confirms" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/topups/x402:
    post:
      summary: Credit a signed x402 payment authorization
      description: |
        The `x402` deposit rail (issues #264, #282): the caller presents a
        signed payment authorization (`payment`, base64url) and the rail
        verifies it, settles it, and books the deposit through the same
        pending → confirmed → credited walk every rail shares —
        `payment_ref` carries the signed `nonce`, so a replayed authorization
        credits once (and settles once: the deposit row's `FOR UPDATE` claim
        serializes a same-nonce race behind the winner's on-chain settle).

        Two verifier configurations:

        - **Facilitator-delegated** (issue #282): `OXSUM_X402_FACILITATOR_URL` +
          `OXSUM_X402_NETWORK` + `OXSUM_X402_ASSET` + `OXSUM_X402_PAY_TO` —
          verify and settle delegate to an x402-rs facilitator sidecar over
          its V1 HTTP API, and the settle answer's chain transaction hash lands
          on the deposit's `facilitator_tx_hash`. This is the real rail:
          EIP-3009 signatures, real wallet authorizations, real finality.
        - **Ed25519 stand-in** (issue #264): `OXSUM_X402_VERIFYING_KEY` alone
          keeps the test scheme (`scheme: "exact"`, `network: "oxsum-ed25519"`,
          `asset: "OXSUM-CREDIT"`) — no chain, for tests and for deployments
          exercising the bookkeeping without a payment network. A deployment
          with neither answers 503: the rail is configured or it is not.

        Whichever rail serves, a payload that fails its wire's parse is the
        same 403 an unverified signature earns.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/X402TopupRequest" }
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/stripe:
    post:
      summary: Stripe's deposit and subscription callback
      description: |
        The provider's unauthenticated webhook: `Stripe-Signature` verifies
        against `OXSUM_STRIPE_WEBHOOK_SECRET` (the same `t=<unix>,v1=<hex>`
        shape oxsum's own outbound webhooks use). `checkout.session.completed`
        confirms and credits the deposit the session names — the credit replays
        under `stripe:<session_id>` so a retried or raced delivery writes
        nothing twice — and `checkout.session.expired` closes it. A session
        opened in `subscription` mode instead binds the plan its metadata
        names (`oxsum_plan_id`) to the `client_reference_id` organization,
        with `source: stripe`. `invoice.paid` renews that binding's period at
        the invoice line's period end, and `customer.subscription.deleted`
        cancels it. `received_minor` records what Stripe reports paid; a
        number that disagrees with `amount_minor` is for a human, never
        auto-patched. A deployment without `OXSUM_STRIPE_*` answers 404: an
        unconfigured rail has no webhook to verify.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the raw Stripe event envelope; `data.object.id` is the session
      responses:
        "200":
          description: acknowledged — every verified event is answered 200 whether the deposit moved or not
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/airwallex:
    post:
      summary: Airwallex's deposit-rail callback
      description: |
        The provider's unauthenticated webhook (issue #285): `x-timestamp` and
        `x-signature` verify the body under `OXSUM_AIRWALLEX_WEBHOOK_SECRET` —
        hex HMAC-SHA256 of `timestamp + raw_body`, compared in constant time.
        `payment_intent.succeeded` confirms and credits the deposit the intent
        names — the credit replays under `airwallex:<intent_id>` so a retried
        or raced delivery writes nothing twice — and
        `payment_intent.cancelled`/`payment_intent.expired` close it.
        `data.object.amount` (decimal major units) converts to the recorded
        `received_minor` in cents; a number that disagrees with `amount_minor`
        is for a human, never auto-patched. A deployment without
        `OXSUM_AIRWALLEX_*` answers 404: an unconfigured rail has no webhook to
        verify.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the raw Airwallex event envelope; `data.object.id` is the intent
      responses:
        "200":
          description: acknowledged — every verified event is answered 200 whether the deposit moved or not
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/topups/hyperswitch:
    post:
      summary: Create a Hyperswitch payment to top up
      description: |
        The `hyperswitch` deposit rail (issue #319): opens a `pending` deposit
        (`payment_ref` = the `idempotencyKey`), creates a payment on the switch
        (`POST /payments`, automatic capture, `confirm: false`) and answers the
        payment id, the `clientSecret` the browser SDK confirms against, the
        `publishableKey` the SDK initializes with, and the `sdkUrl` origin the
        dashboard loads `HyperLoader.js` from — the API and the SDK bundle are
        different services, so the rail carries both origins (issue #320). A
        replayed intent (same `idempotencyKey`) answers the same handles — the
        deposit's unique constraint is the idempotency anchor, not a lookup. A
        deployment without `OXSUM_HYPERSWITCH_*` answers 503: the rail is
        configured or it is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "200":
          description: The payment identity, the browser secret and the deposit it credits
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [paymentId, clientSecret, publishableKey, depositId, sdkUrl]
                    properties:
                      paymentId: { type: string, description: "the switch's payment id the webhook names" }
                      clientSecret: { type: string, description: "the secret the browser SDK confirms against" }
                      publishableKey: { type: string, description: "the key the browser SDK initializes with" }
                      depositId: { type: string, format: uuid, description: "the pending deposit this payment confirms" }
                      sdkUrl: { type: string, description: "the origin serving HyperLoader.js — the dashboard prepends it to /HyperLoader.js" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/hyperswitch:
    post:
      summary: Hyperswitch's deposit-rail callback
      description: |
        The switch's unauthenticated webhook (issue #319):
        `X-Webhook-Signature-512` verifies the raw body as hex HMAC-SHA512 under
        the business profile's `payment_response_hash_key`
        (`OXSUM_HYPERSWITCH_WEBHOOK_SECRET`), compared in constant time.
        Every verified event is recorded under its `event_id` before it acts — a
        replayed delivery is acknowledged and credits nothing. `payment_succeeded`
        confirms and credits the deposit the payment names — the credit replays
        under `hyperswitch:<payment_id>` so a retried or raced delivery writes
        nothing twice — and `payment_cancelled`/`payment_expired` close it.
        `content.object.amount` is recorded as `received_minor`; a number that
        disagrees with `amount_minor` is for a human, never auto-patched. A
        deployment without `OXSUM_HYPERSWITCH_*` answers 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the raw switch envelope; `event_id`, `event_type` and `content.object.payment_id` are what the handler reads
      responses:
        "200":
          description: acknowledged — every verified event is answered 200 whether the deposit moved or not
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/redemptions:
    post:
      summary: Redeem a code into the acting organization's wallet
      description: |
        The `redemption` deposit rail: a code the operator minted (`POST
        /api/v1/admin/redemption-codes`) credits its amount to the purchased pool.
        Redeeming is one atomic claim — the code's row is locked, the deposit is
        recorded (`rail = redemption`, `payment_ref` = the code's id), and the ledger
        credits the wallet under idempotency key `redemption:<code_id>`; a retried
        redeem replays the same credit, and two concurrent redeems of one code leave
        exactly one winner. A code that is unknown, already spent or past its expiry
        answers `404` whichever it is: which of the three is wrong is the holder's
        business. The answer is the ledger receipt of the credit plus what it credited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "200":
          description: The receipt of the credit, with the amount the code carried
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Redemption" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/holds:
    get:
      summary: The organization's in-flight holds
      description: |
        The holds the ledger still reserves for this organization — the
        dashboard's "in-flight" table. A hold listed here is one the sweeper
        watches: rows whose ledger hold is gone heal themselves away, so the
        list is the ledger's own outstanding set, newest first.
      responses:
        "200":
          description: The open holds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [holds]
                    properties:
                      holds:
                        type: array
                        items: { $ref: "#/components/schemas/OpenHoldView" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Hold credits (before a streaming call starts)
      description: |
        A hold taken with an API key is checked against the key's constraints when it
        has them: when settled charges plus outstanding holds attributed to the key
        would exceed `spendLimitMinor`, the hold is refused with 429
        `KEY_LIMIT_EXCEEDED`, checked under a per-key lock and atomic with the ledger
        append, so concurrent holds cannot together exceed it. `requestsPerMinute`
        refuses a request over the key's rolling-minute allowance with 429
        `RATE_LIMITED` — the answer carries `Retry-After` and the `X-RateLimit-*`
        headers — and `maxConcurrentHolds` refuses a hold over the outstanding-holds
        cap with 429 `TOO_MANY_HOLDS`. `tokensPerMinute` refuses an amount-only hold
        only once the key's settled-token window is already full — the hold spends
        no tokens itself, so it is refused 429 `TOKENS_PER_MINUTE` rather than let a
        settled-out key freeze more credit. A session holds unattributed, with no
        limit to check. An `X-Oxsum-Mandate` header binds the hold inside the
        mandate's bounds on top of the key's own (issue #262).
      parameters: [{ $ref: "#/components/parameters/Mandate" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/settlements:
    post:
      summary: "Settle a hold: release it and charge the actual usage"
      description: >-
        A settlement names the hold it releases (`holdKey`); the server reads the hold's amount
        from the hold entry in the ledger, so there is no amount to assert. One hold settles at
        most once: the settlement entry's idempotency key is derived from the hold's key
        (`oxsum_core::settlement_key_for`), and the ledger's idempotency gate refuses a second
        settlement of the same hold with 409, inside the append, so concurrent settlements naming
        one hold cannot both release it. Retrying the identical settlement replays it. Naming a
        hold that is not outstanding is 404, even when other holds would cover the amount; the
        wallet's limit still refuses a release the outstanding reservations cannot cover, as the
        backstop behind the pairing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettleRequest" }
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/bills:
    get:
      summary: The organization's transactions, newest first
      description: |
        Every ledger entry that moved money — top-ups, adjustments, settled
        turns — as the dashboard's bills page lists them: the booking date, the
        signed amount, the description and the content hash the entry's
        inclusion proof commits to. `before` walks older pages by log index;
        the answer's `nextCursor` is the cursor the next page asks with.
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: the log index the page continues back from; absent means the newest page
      responses:
        "200":
          description: The transaction page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/BillRow" }
                      nextCursor:
                        type: integer
                        format: int64
                        description: present while an older page exists
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/statements:
    get:
      summary: The organization's finalized statements
      description: |
        The monthly billing documents the operator has finalized, newest period
        first: each statement itemizes a closed `YYYY-MM` month's settled usage
        and carries its payment standing — `pending`, `paid`, `overdue` or
        `suspended`. Drafts are the operator's working copy and never appear
        here. `creditDrawnMinor` is what the period put on the credit line —
        what the organization owes — and `outstandingMinor` is the part still
        unpaid; a top-up repays the line and counts against the oldest open
        statement first.
      responses:
        "200":
          description: The finalized statements, newest period first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Statement" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/statements/{statementId}:
    get:
      summary: One finalized statement, with its lines
      description: |
        The statement and its itemized lines — settled usage aggregated per
        channel and model. Only `finalized` statements are readable here; a
        draft, another organization's statement and a missing id are all 404.
        `logFromIndex`/`logToIndex` bound the ledger window the lines prove:
        every charge sits in an entry a bill proof verifies.
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The statement and its lines
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StatementDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/statements/{statementId}/proof:
    get:
      summary: The statement's self-contained proof bundle
      description: |
        Everything `verify_statement_anchor` needs in one GET (issue #479):
        the statement and its itemized lines, the log anchor that commits its
        two digests, the covered entries' content hashes in log order
        (`windowHashes`), the signed tree head right after the anchor
        (`expectedHead`) and the tenant origin (`expectedOrigin`) — the same
        objects the detail endpoint serves, plus the two inputs a caller would
        otherwise have to stitch together from `/api/v1/entries/{id}/proof`
        and `/api/v1/log/head`. Only `finalized` statements answer; a draft,
        another organization's statement and a missing id are all 404, the
        same guard the detail endpoint keeps.
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The statement and the pieces its anchor check folds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StatementProof" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/statements/{statementId}/export.pdf:
    get:
      summary: A finalized statement as a PDF
      description: |
        The rendered document (issue #205): the organization and period, the
        statement meta (status, payment standing, due date), the itemized
        lines, the totals, and a footer anchoring the page to the ledger —
        `logFromIndex`/`logToIndex` beside a QR pointing back at `/verify`.
        Only `finalized` statements export; a draft, another organization's
        statement and a missing id are all 404, the same guard the detail
        endpoint keeps. The body is binary `application/pdf`, not the JSON
        envelope, and the export always renders the stored lines, so it can
        never disagree with the detail endpoint's own answer.
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The statement as a PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/balance:
    get:
      summary: Available balance (settled minus unsettled holds)
      description: |
        `availableMinor` is everything the organization can still reserve: its own
        funds (bonus and purchased pools) plus the undrawn part of its credit line.
        `creditLimitMinor` is the facility the operator granted — 0 for an
        organization without one — and `creditUsedMinor` is how much of it is
        drawn or held against right now. What the organization holds of its own
        money is `availableMinor - (creditLimitMinor - creditUsedMinor)`.
      responses:
        "200":
          description: The balance
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [availableMinor, creditLimitMinor, creditUsedMinor, reservedMinor, spentThisMonthMinor]
                    properties:
                      availableMinor: { type: integer, format: int64 }
                      creditLimitMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: the credit limit the operator granted, in minor units
                      creditUsedMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: the drawn plus reserved part of the credit line, in minor units
                      reservedMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: what outstanding holds freeze right now — the dashboard's frozen total
                      spentThisMonthMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: "what this UTC calendar month has settled so far — the dashboard's month-spend figure"
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/usage:
    get:
      summary: Daily usage rollup
      description: |
        The `oxsum.usage_daily` rows the dashboard sums, answered as data: one row per
        `(day, keyId, channel, model)` bucket with settled-turn and token sums and the
        charged total. `from` and `to` are inclusive dates; `to` defaults to today and
        `from` to 31 days before it, and the window is bounded to 92 days — a wider
        span, an inverted span, or a malformed date answers `VALIDATION`.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: first day of the window, inclusive; defaults to `to` minus 31 days
        - name: to
          in: query
          schema: { type: string, format: date }
          description: last day of the window, inclusive; defaults to today
      responses:
        "200":
          description: Daily rows, ordered by day
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [days]
                    properties:
                      days:
                        type: array
                        items: { $ref: "#/components/schemas/UsageDay" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/budget:
    get:
      summary: Budget-consumption snapshot
      description: |
        Every budget scope the caller can read, with the committed figure and the
        percentage consumed of its limit (issue #232). `committed` is the figure the
        hold-side checks read: settled spend plus every outstanding hold, windowed to
        the key's `budgetDuration` when it has one. `consumedPercent` floors
        `committed * 100 / limit` and is null where no numeric limit exists. Three
        scopes: `organization` carries the credit line beside the wallet balances,
        `member` the acting member's own `budgetLimitMinor` (null for a key and for a
        seat with no limit), `keys` every live key the principal's scope reaches with
        its `spendLimitMinor`, `budgetDuration` and `windowStart`.
      responses:
        "200":
          description: The budget snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BudgetSnapshot" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/billing-records:
    get:
      summary: Settled turns, newest first
      description: |
        The same page the dashboard's requests view reads: every settled gateway turn,
        newest first. Each row's `entryId` names its settlement entry — the proof of that
        charge is `GET /api/v1/entries/{entryId}/proof` straight off the row, no request-id
        bookkeeping needed (issue #236). `before` is the log index to resume above, and the
        page answers `nextCursor` until the walk reaches the log's start.
      parameters:
        - name: before
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: page to entries older than this log index; omit for the newest page
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: rows per page
      responses:
        "200":
          description: One page of settled turns
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/BillingRecord" }
                      nextCursor:
                        type: integer
                        format: int64
                        description: the log index the next page resumes above; absent at the log's start
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/usage-reports:
    get:
      summary: List the organization's minted usage reports (issue #261)
      description: |
        Every usage report the organization has minted, newest first — the
        descriptors a member's dashboard browses. The list carries no rows or
        proofs: a mint is rare, so the descriptor alone is enough to pick the
        report whose bundle `GET .../usage-reports/{reportId}` then serves.
      responses:
        "200":
          description: The minted reports, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/UsageReportSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Mint a signed usage report for one end-user over a period (issue #261)
      description: |
        An organization bills its own downstream customers out of the same
        ledger that mixes every customer's usage — so a customer cannot verify
        a bill by reading the ledger. A usage report is the bundle the org
        hands one `endUser`: the subset of settlement entries attributed to
        them over `[from, to]`, each with its own proof, plus a report marker
        the org committed into the ledger once and can never supersede.

        Producing the report appends a self-balancing marker entry
        (`oxsum/usage-report/v1`) to the organization's own ledger whose
        `DocumentRef` binds the subset digest — the fold of the shown
        settlement entries' content hashes in log order — and whose
        description commits `{endUser, from, to, entryCount,
        chargedTotalMinor, subsetHash}`. One marker per
        `(organization, endUser, from, to)`, ever: the marker's idempotency
        key is derived from the span, so a second request for the same span
        replays the standing report rather than committing a second subset —
        an org cannot commit one subset to the ledger and show the customer
        another.

        Both dates are inclusive UTC `YYYY-MM-DD`, and `to` must be a fully
        ended day: the subset is only complete once no more usage can book
        into the span. A report over an open day is `VALIDATION_ERROR`, as is
        an `endUser` the organization has no usage for — the report is a
        commitment, and an empty one commits nothing.

        Completeness is the org's signed claim, not a Merkle fact — the
        marker attests "these are all the settlements attributed to
        `endUser` over the span", and a customer who kept their own request
        log detects a dropped row as a count or total mismatch the signature
        attests. The bundle proves membership of every shown row and binds
        the attested subset to the committed digest; it cannot itself
        enumerate rows the org chose never to show. The trust model is
        recorded in `docs/decisions.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endUser, from, to]
              properties:
                endUser:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: the caller-declared end-user id the usage rows carry
                from:
                  type: string
                  format: date
                  description: first UTC day of the span, inclusive
                to:
                  type: string
                  format: date
                  description: last UTC day of the span, inclusive — must be fully ended
      responses:
        "200":
          description: The report bundle — descriptor, marker proof, per-entry proofs, signed head
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UsageReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/usage-reports/{reportId}:
    get:
      summary: Re-fetch a minted usage report (issue #261)
      description: |
        `reportId` is the marker entry's own id — the same id the `POST` answers
        and the one a verifier resolves to the marker's inclusion proof. The
        committed subset is frozen at mint: re-fetching serves the identical
        descriptor and rows, never a re-query, so a report cannot grow to
        absorb usage the org omitted the first time.
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The report bundle
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UsageReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/usage-reports/{reportId}/links:
    post:
      summary: Mint a share link to one usage report (issue #300)
      description: |
        A downstream customer holds no account, so the link is the capability:
        the plaintext token is answered once, only its SHA-256 is stored, and
        the organization can revoke it. The link carries no rows itself — the
        deployment's `/bill/{token}` page resolves it to the frozen report
        bundle without a session.

        The report must belong to the acting organization: an id guessed from
        another tenant answers 404. `expiresAt` defaults to 30 days from now and
        may not be more than 90 days out; `label` is the organization's own note
        for the recipient.
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportLinkRequest" }
      responses:
        "200":
          description: The link descriptor and its one-time token
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedReportLink" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/usage-reports/links:
    get:
      summary: List the organization's report share links (issue #300)
      description: |
        Every link the organization minted, newest first — descriptors only,
        never tokens. `lastUsedAt` is the operator's signal that the customer
        opened the bill; `revokedAt` and `expiresAt` are the two ways a link
        stops resolving.
      responses:
        "200":
          description: The organization's links, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/ReportLink" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Mint a share link to one downstream customer's reports (issue #300)
      description: |
        The `end_user` scope: one link that lists every report the organization
        has issued that customer. The customer must have usage in the
        organization's ledger — a name nothing was billed to is refused, because
        the page it opened would read as a broken bill. Same token, expiry and
        label rules as the report-scoped mint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEndUserLinkRequest" }
      responses:
        "200":
          description: The link descriptor and its one-time token
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedReportLink" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/usage-reports/links/{linkId}:
    delete:
      summary: Revoke a report share link (issue #300)
      description: |
        Idempotent: revoking an already-revoked link answers the same descriptor.
        An id of another organization answers 404, the same as an unknown one —
        whether a link exists elsewhere is not this organization's business.
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The revoked link descriptor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReportLink" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/estimate-price:
    post:
      summary: Price a declared token shape
      description: |
        The number the gateway would freeze for a request with this shape: the dearest
        applicable price set over the declared input tokens and the output ceiling
        (`outputTokens` clamped to the model's `maxOutputTokens`). Nothing is held or
        charged — the answer is the upper bound a real request could cost, and a real
        settle never exceeds it. An unknown model answers `VALIDATION`; a shape the
        model's price cannot express answers the same.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimatePriceRequest" }
      responses:
        "200":
          description: The freeze estimate
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [estimateMinor, model, version]
                    properties:
                      estimateMinor:
                        type: integer
                        format: int64
                        description: the most a real request with this shape can settle for
                      model: { type: string }
                      version:
                        type: integer
                        format: int64
                        description: the price version the estimate was computed from
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/pricing:
    get:
      summary: The public price catalog
      description: |
        Every route the operator sells — a model may be served by several
        channels, and each `(model, channel)` pair lists its own row with the
        current price version and the route's `weight`, the relative preference
        for leading a request. These are the same rows `POST
        /v1/chat/completions` is priced by, without the channel's credential. A
        caller that wants a version's full rule set reads the flattened price on
        each row; estimate-price answers what one shape costs.
      responses:
        "200":
          description: The catalog, one row per route
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [models]
                    properties:
                      models:
                        type: array
                        items: { $ref: "#/components/schemas/PricedModel" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/entries/{entryId}/proof:
    get:
      summary: "Bill proof bundle: entry source + inclusion proof + tree head"
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The proof bundle. The internal shape of entry/head/proof follows doubleentry's serde encoding.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [entry, head, proof]
                    properties:
                      entry: { type: object }
                      head:
                        type: object
                        properties:
                          size: { type: integer, format: int64 }
                          root: { type: string, description: 32-byte hash, lowercase hex }
                      proof: { type: object }
                      price:
                        $ref: "#/components/schemas/PriceLink"
                        # Absent on a non-settlement entry, a bundle made before price
                        # binding, or a deployment that signs no heads.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/entries:
    get:
      summary: The ledger's entries, newest first
      description: |
        Every entry the organization's append-only log carries — holds,
        settlements, top-ups, markers — as the dashboard's transaction-log page
        lists them: log index, entry id, description, content hash. `before`
        walks older pages by log index; `nextCursor` is the cursor the next
        page asks with. `limit` bounds the page (1–100, default 100).
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: The entries page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/LogEntryView" }
                      nextCursor:
                        type: integer
                        format: int64
                        description: present while an older page exists
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/log/head:
    get:
      summary: "The current tree head of the organization's ledger, signed by the operator"
      description: |
        The head of the append-only Merkle log this organization's ledger lives in, as a C2SP
        signed-note (tlog-checkpoint) carrying the operator's Ed25519 note signature. The note text
        is what the signature covers, byte for byte, so verify what you read, not what you
        re-render: parse `note`, find the signature line whose selector is `keyHash`, check it
        against `publicKey`, then check that the body carries `origin`, `size` and `root`.
        The origin names this tenant's ledger (`oxsum/ledgers/<tenant_id>`); the operator signs
        under the fixed key name `oxsum/tree-heads`. `publicKey` and `keyHash` are repeated here so
        the note is self-describing; the same key is published at `GET /api/v1/log/key`.
        A deployment with no `OXSUM_HEAD_SIGNING_KEY` answers 503.
      responses:
        "200":
          description: The signed head
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedTreeHead" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/consistency:
    get:
      summary: "Prove the current head extends a head the caller already holds"
      description: |
        For a user holding an old head: the current head as a signed note, the old head the log
        recomputed at `from`, and the consistency proof between them. Verify the note signature
        against the published key, then check the proof against the two heads — it answers true
        only when the new tree is the old tree with entries appended. A second history at the
        same size cannot produce a verifying proof, which is the guarantee this endpoint exists
        for. A deployment with no `OXSUM_HEAD_SIGNING_KEY` answers 503.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: |
            The tree size of the old head. Must be at least 1: every log extends the empty tree,
            so a proof from size 0 would verify against any history at all and is refused (400)
            rather than answered. Anything beyond the log's current size is 400 as well.
      responses:
        "200":
          description: The signed new head, the old head, and the proof between them
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [note, keyName, publicKey, keyHash, oldHead, head, proof]
                    properties:
                      note: { type: string, description: "the complete C2SP signed-note text for the new head: body, blank line, signature lines" }
                      keyName: { type: string, description: "the key name the operator signs under" }
                      publicKey: { type: string, description: "the operator's Ed25519 verifying key, base64 of 32 bytes" }
                      keyHash: { type: string, description: "the 4-byte selector this key's note signatures carry, lowercase hex" }
                      oldHead: { $ref: "#/components/schemas/TreeHead" }
                      head: { $ref: "#/components/schemas/TreeHead" }
                      proof: { $ref: "#/components/schemas/ConsistencyProof" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/price-head:
    get:
      summary: "A channel-model price row, signed by the operator"
      description: |
        The signed checkpoint of one `(channel, model)` price row — `version`'s exact
        row, or the latest when `version` is omitted — as a C2SP signed-note under the
        same Ed25519 key that signs tree heads (issue #204). The body reuses the
        tlog-checkpoint shape: `origin` is the catalog `oxsum/price-catalog/<channel>`,
        the note's size slot carries `priceVersion`, and its root carries the hash of
        the canonical row bytes — the price the catalog actually held, attested.
        Signing is stateless and deterministic over (key, origin, version, row), so a
        stored row signs identically whenever it is asked for: a bill that named an
        older version stays verifiable after the catalog moves on, and no snapshot
        table exists to drift. Verify the note signature against `publicKey` exactly
        as for `GET /api/v1/log/head`; the same key is published at `GET /api/v1/log/key`.
        A deployment with no `OXSUM_HEAD_SIGNING_KEY` answers 503.
      parameters:
        - name: channel
          in: query
          required: true
          schema: { type: string }
          description: The channel name whose catalog the checkpoint covers.
        - name: model
          in: query
          required: true
          schema: { type: string }
          description: The model whose price row is signed.
        - name: version
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
          description: |
            The price version to sign; omitted signs the latest. A bill names the
            version it priced under — pass that to verify an older price.
      responses:
        "200":
          description: The signed price checkpoint
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedPriceHead" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/key:
    get:
      summary: "The operator's tree-head verifying key"
      description: |
        The public half of the key that signs tree heads. No credential: this is a public key.
        Fetching it from the server is convenience — a verifier must have chosen this key through
        a channel the operator does not control before the operator had anything to gain, or the
        signature proves only that the server agrees with itself.
      security: []
      responses:
        "200":
          description: The verifying key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/VerifyingKey" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/checkpoint:
    get:
      summary: "Latest externally anchored checkpoint with witness cosignatures"
      description: |
        The head the `witness-checkpoints` pass last published to the witnesses
        configured in `OXSUM_WITNESS_URLS`, together with the cosigned C2SP notes
        they returned (issue #231). `note` is the operator-signed tlog-checkpoint
        covering `headSize`; each `cosignatures[]` entry is one witness's signed
        note for that same head — verify the signature lines against the keys the
        respective witnesses publish. `data` is `null` while nothing is anchored:
        before the first pass or when no witnesses are configured. A third party
        verifies a head by checking the operator's signature (key at
        `GET /api/v1/log/key`), the witnesses' signature lines, and — for their
        own held head — a consistency proof from `GET /api/v1/log/consistency`.

        `witnessKeys` (issue #259) carries the deployment's pinned witness
        keyset — the same answer `OXSUM_WITNESS_KEYS` configured: a
        `cosignature/v1` line under the listed `keyName`/`publicKey` is what a
        real third-party witness produced. A verifier that does not trust the
        deployment's pinset may substitute its own — the same "don't trust the
        server for the key" choice the operator's published key already asks
        for.
      responses:
        "200":
          description: The anchored checkpoint, or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    nullable: true
                    properties:
                      headSize: { type: integer, format: int64, description: "tree size the stored note attests" }
                      note: { type: string, description: "the operator-signed C2SP note covering the head, byte for byte" }
                      cosignatures:
                        type: array
                        items:
                          type: object
                          properties:
                            witnessUrl: { type: string, description: "the witness endpoint as configured in OXSUM_WITNESS_URLS" }
                            note: { type: string, description: "the cosigned C2SP note the witness returned — its signature line is the verifiable part" }
                            firstSeen: { type: string, format: date-time }
                      witnessKeys:
                        type: array
                        description: "the deployment's pinned witness keyset (OXSUM_WITNESS_KEYS): which `cosignature/v1` key a signature line under each URL must verify against"
                        items:
                          type: object
                          properties:
                            witnessUrl: { type: string, description: "the witness endpoint this pin applies to" }
                            keyName: { type: string, description: "the name the signature line carries (`— <keyName> <blob>`)" }
                            publicKey: { type: string, description: "the Ed25519 verifying key, hex" }
                            keyHash: { type: string, description: "the C2SP key hash (hex) the signature line's selector must equal" }
                      updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/metering/holds:
    post:
      summary: Freeze credit for a billable event a service will settle later
      description: |
        A service credential reports an event bound: the `billableCode` resolves to
        `channel`'s latest `mode: event` price version, the declared `usage` is the
        event's upper bound in the code's own units, and the freeze is that usage
        itemized — a hold, never more, never silently zero. An `eventType` names what
        the event is (`"inference"`, `"email.send"`, …); it rides the usage record and
        the settlement's `usage.eventType`. Usage naming a dimension the price cannot
        bill — a media token, a tool call — is refused, not partial-billed: the service
        declares the usage, so it can fix the request. `organizationId` names whose
        wallet freezes; a suspended organization answers `403` and an insolvent one
        `402`, like every hold. The hold is watched by the sweeper: a hold that never
        settles releases at zero with kind `swept`. Replay of the same
        `idempotencyKey` answers the original hold.
      security:
        - serviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeteringHoldRequest" }
      responses:
        "200":
          description: The hold that froze the bound
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MeteringHold" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/metering/settle:
    post:
      summary: Settle a metering hold against the event's actual usage
      description: |
        The service reports what the event consumed; the charge is that usage itemized
        at the price version the hold froze, capped by the freeze — over-bound usage
        charges the freeze and settles `capped`. Usage naming a dimension the price
        cannot bill is refused like on `holds`. The settlement entry's idempotency key
        is derived from the hold's, so the hold settles at most once: a retry of the
        same body replays, a settled hold is 409, a hold that is not outstanding — of
        this organization — is 404.
      security:
        - serviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeteringSettleRequest" }
      responses:
        "200":
          description: What the settlement charged
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MeteringSettlement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/metering/release:
    post:
      summary: Release a metering hold the event will never settle
      description: >-
        The work the hold froze for is not billing — it was abandoned or refunded — so
        the hold settles at zero with kind `released`: deliberate, distinct from the
        sweeper's `swept`. Naming a hold that is not outstanding in this
        organization's ledger is 404; one already settled is 409.
      security:
        - serviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeteringReleaseRequest" }
      responses:
        "200":
          description: The release settlement
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MeteringSettlement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/metering/settlements:
    post:
      summary: Bill a completed event in one call
      description: |
        For an event that already ran there is nothing to freeze against — the
        declared `usage` is the actual: the charge itemizes it at the code's latest
        `mode: event` price version and lands as a hold settled in the same answer.
        An organization without the funds answers `402` — a one-shot settlement can
        never spend what was not there. Every other refusal is `holds`'s: unknown
        organization, channel or code, unpriced usage, suspended organization. A
        replay of the `idempotencyKey` answers the original settlement.
      security:
        - serviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeteringSettlementRequest" }
      responses:
        "200":
          description: What the settlement charged
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MeteringSettlement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels:
    get:
      summary: List the channels, with the current price version of each of their models
      description: |
        The platform admin's view. Only the last four characters of an upstream credential are ever
        returned; the credential itself is sealed at rest and never leaves the server.

        This is what is *in force*: `GET /api/v1/admin/channels/{channelName}/prices` is the history.
      security:
        - adminToken: []
      responses:
        "200":
          description: Every channel, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a channel, or replace the connection of one that exists
      description: |
        The name is the identity: posting an existing name moves that channel to a new upstream address
        or credential and leaves its prices exactly as they are. A credential is sealed with
        `OXSUM_SECRET_KEY` before it is stored.

        A deployment with no channels yet is seeded from the environment at startup instead
        (`OXSUM_UPSTREAM_BASE_URL`, `OXSUM_UPSTREAM_API_KEY`, `OXSUM_MODELS`); this endpoint is for
        everything after that.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelRequest" }
      responses:
        "200":
          description: The channel as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/prices:
    get:
      summary: Every price version of a channel, newest first
      description: |
        The history rather than the current state: a price change appends a version and never rewrites
        one, so the version a settlement names is still here to be checked, however old the bill is.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      responses:
        "200":
          description: Every version of every model of that channel, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ModelPrice" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Append a price version for one of a channel's models
      description: |
        Appends; never overwrites. The version in force when a gateway request starts is the version
        that prices that request and the one its settlement names, so a price change lands on later
        requests and leaves in-flight turns and written bills untouched.

        A model may be priced on several channels (issue #168): each row names
        one route's version and `weight`, the relative preference for leading a
        request — the first attempt is a weighted pick, the rest follow in
        descending weight when a turn fails over. Changing the weight alone is
        a price append like any other: the settlement names the version the
        route carried.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceRequest" }
      responses:
        "200":
          description: The version that was written
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PriceVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/aliases:
    get:
      summary: One channel's aliases, oldest first
      description: |
        The public names this channel serves that rename the upstream model they
        relay (issue #286). `GET /v1/models` lists them beside the direct names.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      responses:
        "200":
          description: The channel's aliases, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ModelAlias" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Claim an alias for a channel
      description: |
        Callers write `alias` on every surface the channel speaks; the gateway
        forwards `upstreamModel` instead (issue #286). An alias is a rename, not
        a routing layer — the name resolves to this one channel.

        One name answers one route set: a name already claimed as an alias on
        any channel, or spelled as a direct model name on a different channel,
        is a `409`. The alias's own price row wins over the upstream model's on
        this channel, so a public name can be priced differently; an alias with
        no price of its own bills at the upstream model's.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: The alias as claimed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ModelAlias" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/aliases/{alias}:
    delete:
      summary: Drop one of a channel's aliases
      description: |
        Aliases are mutable routing configuration, not ledger data: the delete
        is hard, and bills already written still name the alias the caller used
        (issue #286). A name that is not this channel's — unknown to it, or
        claimed by another channel — is a `404`.
      security:
        - adminToken: []
      parameters:
        - { $ref: "#/components/parameters/ChannelName" }
        - name: alias
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: the alias to drop, as callers wrote it
      responses:
        "200":
          description: The alias is gone
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/credentials:
    post:
      summary: Add one credential to a channel's pool
      description: |
        One channel carries several upstream keys (issue #444): a single
        account's 429 or quota wall fails over onto the pool's next credential
        of the *same* channel — same model, same price — before the turn has to
        leave for a differently-priced route. The key lands sealed at the pool's
        end; reorder by re-posting `apiKeys` on `POST /api/v1/admin/channels`.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey: { type: string, minLength: 1, description: "the upstream credential to add; sealed with OXSUM_SECRET_KEY, only its last four readable afterwards" }
      responses:
        "200":
          description: The credential as stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ChannelCredential" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/credentials/{credentialId}:
    patch:
      summary: Switch one credential between active and disabled
      description: |
        The operator's way of taking a key out of the pick without losing its
        record (issue #444): `disabled` keeps the credential's health state and
        can be re-enabled, which a drop does not survive. A credential that is
        not this channel's is a `404`.
      security:
        - adminToken: []
      parameters:
        - { $ref: "#/components/parameters/ChannelName" }
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: the credential to switch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: The credential's new status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Drop one credential from a channel's pool
      description: |
        Credentials are routing configuration, not ledger data: the delete is
        hard. A credential that is not this channel's is a `404`; the pool's
        last credential is a `400` — a channel with no key cannot serve, so it
        stays until the operator disables it or retires the channel.
      security:
        - adminToken: []
      parameters:
        - { $ref: "#/components/parameters/ChannelName" }
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: the credential to drop
      responses:
        "200":
          description: The credential is gone
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations:
    get:
      summary: List every organization, with its balance
      description: |
        The platform admin's view of whom the ledger holds money for: organizations, oldest
        first, with their kind, their headcount and what their wallet shows — `availableMinor`
        (settled minus unsettled holds) and `reservedMinor` (the sum of its outstanding holds).
        Balances are integer minor units, 1 credit = 1_000_000 minor, and reading one creates
        the organization's ledger if it does not exist yet, the same way the dashboard's
        overview does. The list paginates: `limit` caps a page at 100 rows, and a full page
        answers `nextCursor`, which the next call echoes back as `cursor` — opaque, never
        constructed by hand; absent means the list is done. Moving an organization's money is
        `POST /api/v1/admin/organizations/{organizationId}/adjustments`.
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: cursor
          in: query
          description: An earlier answer's `nextCursor`, echoed verbatim.
          schema: { type: string }
      responses:
        "200":
          description: One page of organizations, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [organizations]
                    properties:
                      organizations:
                        type: array
                        items: { $ref: "#/components/schemas/AdminOrganization" }
                      nextCursor:
                        type: string
                        description: The cursor the next page asks with; absent at the list's end.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/adjustments:
    post:
      summary: Adjust an organization's balance
      description: |
        Books a signed amount into the named organization's ledger, with a required
        `reason`: a positive `amountMinor` grants credits, a negative one deducts
        them. The entry is new history — an adjustment never modifies an existing
        entry, so every bill's proof stays valid. A deduction that would push the
        balance below what the wallet holds is `402 INSUFFICIENT_FUNDS`: the ledger's
        no-overdraft rule refuses it, not the route. `402` reads as the refusal it is;
        `400` answers a zero amount, an empty reason or a missing idempotency key;
        `404` an organization that does not exist. The idempotency key makes a retried
        call the same entry — the answer carries `entryId`, which `entry_id_for` derives
        from it.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustOrganizationRequest" }
      responses:
        "200":
          description: The adjustment as booked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminAdjustment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/credit-notes:
    get:
      summary: An organization's credit notes, newest first
      description: |
        Every credit note issued into this organization's wallet (issue #352,
        decision D12), newest first: the amount, the reason, the ledger entry
        that carries it, and when it was issued. A credit note moves no money
        and reverses no deposit — it is a reasoned credit beside the charges,
        not a refund.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The notes, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/AdminCreditNote" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Issue a credit note into an organization's wallet
      description: |
        Credits the wallet with a reasoned, positive amount, posting one ledger
        entry — Revenue debited, Wallet credited, the reason as the entry's
        description — so the charge it answers stays in history beside the
        credit. No money moves: this is not a refund, and no deposit is
        reversed. A retried `idempotencyKey` answers the standing note instead
        of crediting twice; zero or negative amounts are `400`, and an
        organization that does not exist is `404`.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueCreditNoteRequest" }
      responses:
        "200":
          description: The note as issued, with the balance after it
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminCreditNote" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}:
    patch:
      summary: Set an organization's billing terms — credit limit, payment terms
      description: |
        Updates the named organization's billing terms; at least one of
        `creditLimitMinor` and `paymentTermsDays` must be present — a call
        carrying neither is `400`.

        `creditLimitMinor` grants or resizes the credit line the organization
        may draw: after its bonus and purchased pools exhaust, its holds and
        settlements keep drawing down to `-creditLimitMinor` of own funds —
        borrow first, settle monthly. The grant is a ledger entry, not a flag:
        the operator's facility funds a credit-line pool that holds reserve
        against like the wallet does, and the whole draw is part of the
        verifiable history. The limit is absolute, not a delta: the entry the
        call books is the difference from the limit already committed, and
        setting the same limit again books nothing. Shrinking the line below
        what the organization already owes is `400 VALIDATION_ERROR` — the
        ledger's own no-overdraft rule on the credit-line pool refuses the
        write, and the refusal is a property of the request, not of the
        balance. `400` also answers a negative limit or a missing idempotency
        key; `404` an organization that does not exist. The idempotency key
        makes a retried call the same entry, and the answer's `entryId` is its
        name — absent when the limit did not move and nothing was written.
        Reusing the key for a different limit is `409 CONFLICT`.

        `paymentTermsDays` is how long a finalized statement's payment has
        before it is due — the count is snapshotted onto each statement at
        finalization, so changing it affects only statements finalized after.
        It is a column on the organization, not a ledger entry. `400` answers
        a negative value.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: The billing terms as they now stand
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminCreditLimit" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/subscription-plans:
    get:
      summary: List the subscription plans
      description: |
        Every plan the deployment defines, ordered by `sort_order` — the order
        that also decides whether a rebind is an `upgrade` or a `downgrade` on
        the closed period's outcome. Disabled plans are listed too; they
        cannot be bound or checked out.
      security:
        - adminToken: []
      responses:
        "200":
          description: The plans, in catalog order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionPlan" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/subscription-plans/{name}:
    put:
      summary: Create or update a subscription plan
      description: |
        Upserts the plan by `name` (the unique catalog name in the path).
        `quotaMinor` is the per-period credit quota in minor units; `null`
        (explicit or absent) makes the plan unmetered — every request draws in
        full. `resetPeriod` is `daily`, `weekly`, `monthly` or `never`: the
        boundary on which `consumedMinor` returns to zero by closing the old
        period as `boundary` and opening a fresh one — lazily on the first
        draw after the boundary, and hourly from the rollover job; `never`
        plans carry no `currentPeriodEnd` at all — they neither roll nor
        expire, and only a cancel or the rail's `deleted` event ends them.
        `allowWalletOverflow` decides what happens once the period quota is
        exhausted: `true` (the default) holds the overflow against the
        organization's wallet; `false` refuses the gateway request. Changing a
        plan does not re-meter organizations already bound to it: the
        `quotaMinor` and `allowWalletOverflow` a period runs under are
        snapshotted onto the binding and its periods at bind and rollover
        time.
      security:
        - adminToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetSubscriptionPlanRequest" }
      responses:
        "200":
          description: The plan as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SubscriptionPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/subscription:
    put:
      summary: Bind a subscription plan to an organization
      description: |
        Makes the `planId`'s plan the organization's metering subscription.
        Rebinding the same plan it already runs is a no-op that answers the
        current binding; binding a different plan closes the open period with
        `outcome` `upgrade` or `downgrade` — decided by the plans' `sort_order`
        — and opens a fresh binding whose period starts now. `source` names
        how the binding came about (`admin` by default; `stripe` when a
        checkout session completed); `stripeSubscriptionId` attaches the
        Stripe subscription the webhook's `invoice.paid` and
        `customer.subscription.deleted` events key on, and must be unique
        across bindings (409 `CONFLICT`). A plan that does not exist is `404`,
        a disabled one `400 VALIDATION_ERROR`.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindSubscriptionRequest" }
      responses:
        "200":
          description: The organization's binding as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrgSubscription" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel the organization's subscription
      description: |
        Ends the active binding: the subscription's state becomes `cancelled`,
        its open period closes with `outcome` `cancelled`, and the
        organization's next gateway request meters against the wallet alone.
        Cancelling with no active binding is `404`.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The cancelled subscription
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrgSubscription" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/holds:
    get:
      summary: List every unsettled hold, across all organizations
      description: |
        The in-flight requests the platform is holding money for: every watched hold,
        newest first — the organization it belongs to, the request id, the model and
        channel, the price version the turn froze at, the frozen amount and when the
        hold opened. The list is the sweeper's watch table: a row whose hold already
        settled is cleaned up rather than shown, so a hold listed here is one the
        ledger still reserves.
      security:
        - adminToken: []
      responses:
        "200":
          description: Every unsettled hold, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminHold" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/anomalies:
    get:
      summary: The settled turns that did not price cleanly, across all organizations
      description: |
        Every settlement whose kind is `capped`, `estimated`, `client_cancelled`,
        `swept` or `unpriced`, newest first — the turns where usage was never reported,
        the caller left mid-stream, the upstream price ran over the freeze, the sweeper
        had to release a hold nobody settled, or the usage named a dimension the price
        book cannot bill. Each row carries `score` (0–100) and `severity` (`low`,
        `medium`, `high`) computed at read time from facts the ledger already stores —
        the kind's base weighted by the charge ratio, the upstream-cost divergence,
        failover attempts and the request id's repeat-offender count (issue #263).
        `?severity=` filters to one band and `?sort=score` orders by score descending;
        the default stays newest first. Scoring is read-only — it never changes what
        a turn charged or wrote.
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [low, medium, high] }
          description: filter to one severity band
        - name: sort
          in: query
          schema: { type: string, enum: [score, date] }
          description: "`score` orders by score descending; `date` (default) is newest first"
      security:
        - adminToken: []
      responses:
        "200":
          description: The anomalous turns, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAnomaly" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/deposits:
    get:
      summary: The newest deposits, platform-wide or for one organization
      description: |
        The money-in record (issue #354): one row per rail payment — a manual
        top-up, a redemption code, a Stripe, Airwallex or Hyperswitch charge, an
        x402 settlement — newest first, with its rail, status, the amount
        opened for, what the rail reported paid (`receivedMinor`, when it
        differs), the rail's `paymentRef`, and the ledger entry once credited.
        Read-only: nothing here confirms, credits or reverses a deposit; those
        are a webhook's or an operator action's own calls.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: narrow to one organization; an unknown id is 404
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The deposits, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminDeposit" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/deposits/{depositId}/reverse:
    post:
      summary: Reverse a credited deposit — refund through the rail when it offers one
      description: |
        Reverses one `credited` deposit (issue #356, decision D12): posts one
        ledger entry — Wallet debited, Cash credited, the reason as the entry's
        description — and flips the deposit to `reversed`, recording
        `reversalEntryId` and `reversedAt` on the row.

        One reversal per deposit ever: the entry's idempotency key is derived
        from the deposit id, so a retried call or a double-click answers the
        standing reversal instead of posting a second one — the answer is the
        already-`reversed` deposit, not a new write.

        The ledger's own no-overdraft rule refuses a reversal the wallet cannot
        cover — the customer already spent the credit — as `402
        INSUFFICIENT_FUNDS`, never a silent negative balance. A deposit that is
        not `credited` (`pending`, `confirmed`, `expired`) is `409 CONFLICT`,
        and one that does not exist is `404`. An empty reason is `400`.

        A `hyperswitch` deposit also returns the customer's money through the
        switch (issue #360): after the reversal commits, `POST /refunds` goes
        to the switch with the payment's id, the deposit's `received_minor`
        (falling back to `amount_minor`), the operator's `reason`, and the
        deposit id in `metadata`. The row's `meta` gains `hyperswitchRefundId`
        and `refundStatus` (`pending` at issue, `succeeded`/`failed` as the
        rail's webhooks land); the answer carries the same `refundStatus`. A
        switch-side refusal records `failed` — the reversal stands, because
        the books are right regardless — and a replayed reversal on a
        `failed` refund re-issues the call, so an operator's retry reaches the
        rail. Other rails answer `refundStatus: null`: their PSP calls are
        separate issues.
      security:
        - adminToken: []
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseDepositRequest" }
      responses:
        "200":
          description: The deposit, now reversed, with the entry that reversed it
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminDeposit" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/margin:
    get:
      summary: What the platform charged versus what upstream cost it, per channel and model
      description: |
        Each settled gateway turn records what its channel's `upstream` prices
        made of the same usage beside what the organization was charged — the
        mutable usage row, never the bill itself. This view sums the two per
        `(channel, model)`: what the platform took in, what upstream billed it,
        the margin between, and how many turns carried no upstream cost at all —
        a price without an `upstream` block, a swept hold, history from before
        the column existed. `untrackedTurns` is the number a growing gap in the
        coverage shows up in first; it is also where upstream misbilling would
        hide if a channel were priced but not tracked. `providerBilledMinor`
        (issue #283) is what the provider actually billed the channel — the
        daily `upstream-bill-sync` pass's answer against the estimate
        `upstreamCostMinor` keeps — channel-scoped and repeated per model row,
        `null` while no bill pass has reconciled the channel.
      security:
        - adminToken: []
      responses:
        "200":
          description: The margin per channel and model
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminMargin" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/reconciliation:
    get:
      summary: The drift between the ledgers and the tables that project them
      description: |
        Scans every organization's ledger against the oxsum-owned records
        that claim to describe it and answers one entry per drift class:
        `usage_orphans` (a usage row whose settlement entry is not on the
        books), `settlements_unrecorded` (a settled turn that wrote no usage
        row), `deposits_unbooked` (a deposit marked credited whose entry is
        missing), `deposits_mismatched` (the rail paid a different amount
        than the deposit expected), `deposits_stuck` (confirmed by the rail
        but never credited or reversed), `watches_orphaned` (a hold watch
        row with no pending posting behind it), `holds_unwatched` (a pending
        hold no watch row covers — invisible to the sweeper),
        `holds_dead_lettered` (a watched hold whose sweep has failed ten
        times — it retries hourly and needs an operator), `log_gaps`
        (a ledger log whose positions are not dense), `jobs_dead` (a
        periodic job run that exhausted its attempts — platform drift, not
        any organization's) and `upstream_price_drift` (a stored upstream
        rate that no longer matches the live catalog the channel serves —
        platform drift, not any organization's) and `anchored_day_altered`
        (a day leaf that no longer folds to the map root its daily anchor
        committed — a late settlement or a hand edit rewrote a leaf the
        ledger had already fixed). Each class carries a
        count and a bounded sample of the offending identifiers. The report
        is read-only: drift is for an operator to read, never for the
        reconciler to patch.
      security:
        - adminToken: []
      responses:
        "200":
          description: The reconciliation report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReconciliationReport" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/redemption-codes:
    post:
      summary: Mint a batch of redemption codes
      description: |
        Generates `count` codes worth `amountMinor` each — every code is `oxr-` plus
        32 random bytes, and the database keeps only its SHA-256 hash, so this answer
        is the only time the codes exist in readable form. The batch shares one id
        and one optional expiry; a code without `expiresAt` never expires. Codes
        redeem through `POST /api/v1/redemptions`.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedemptionCodeBatchRequest" }
      responses:
        "200":
          description: The minted batch; the only answer that carries the codes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RedemptionCodeBatch" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/closings:
    get:
      summary: The sealed months, across all organizations
      description: |
        Every period seal the ledgers hold, newest first and per organization: the
        closing records. A seal commits to the log's tree head at sealing, the
        period's entry count and the closing trial balance, and chains onto the
        seal before it — so the list is the history of what the books committed to,
        not a copy of it.
      security:
        - adminToken: []
      responses:
        "200":
          description: The sealed periods, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminClosing" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Close a month
      description: |
        Seals the period `month` (`YYYY-MM`) in every organization's ledger: defines
        the period if the ledger does not know it, stops new postings, and appends
        the seal that is the month's closing record. From then on no entry may carry
        a booking date in that month — the engine's sealed watermark refuses it at
        seal time, which is the promise "after closing, that month accepts no new
        entries" made structural.

        Only a month that has fully ended can be closed: one that still contains the
        server's current UTC date answers `400`, as does a malformed `month`. A month
        that is already closed answers its existing record — the call is idempotent,
        and the seals table's primary key is what makes a double-close impossible
        rather than merely reported. Answers the closing record of every
        organization.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseMonthRequest" }
      responses:
        "200":
          description: The closing record of every organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminClosing" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements:
    get:
      summary: List statements across organizations
      description: |
        Every statement the platform has generated, newest period first —
        drafts and finalized alike, optionally narrowed by `period`
        (`YYYY-MM`) or `organizationId`. A pending statement whose due date
        has passed reports `overdue`, and the read is what flips it.
      security:
        - adminToken: []
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: organizationId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The statements, newest period first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Generate draft statements for a closed month
      description: |
        Builds the `YYYY-MM` statement for one organization — `organizationId`
        in the body — or for every organization the period's usage records
        cover when it is absent. Generation is idempotent per organization and
        period: a draft is rebuilt from the usage rows each time, so a late
        settlement that lands after generation is picked up by regenerating;
        a statement already finalized stands — the committed document is the
        answer, not a rebuilt draft. Only a month that has fully ended
        generates: the running month is `400`, as is a malformed `period`.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateStatementsRequest" }
      responses:
        "200":
          description: The statements the period produced, drafts and standing finals alike
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}:
    get:
      summary: One statement, with its lines
      description: |
        The statement and its itemized lines — the period's settled usage
        aggregated per channel and model. `logFromIndex`/`logToIndex` bound the
        ledger window the lines prove.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The statement and its lines
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StatementDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}/export.pdf:
    get:
      summary: A finalized statement as a PDF (admin)
      description: |
        The same rendered document the organization downloads from
        `/api/v1/statements/{statementId}/export.pdf` — the admin view, able to
        reach any organization's statement. Only `finalized` statements export;
        a draft or a missing id answers 404 — an unissued document does not
        exist to export. The body is binary `application/pdf`.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The statement as a PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}/finalize:
    post:
      summary: Finalize a draft statement
      description: |
        Locks the draft's lines and totals and issues the statement: the due
        date is set from the organization's `paymentTermsDays`, `creditDrawnMinor`
        is read from the ledger — the period's settled draws on the credit
        line, what the organization owes — and `logFromIndex`/`logToIndex` pin
        the ledger window the lines prove. Finalizing is idempotent: an
        already-final statement answers itself. A draft for a month that has
        not fully ended is `400`; a statement that is not a draft is the
        standing document, not an error.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatementTransitionRequest" }
      responses:
        "200":
          description: The finalized statement
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}/payments:
    post:
      summary: Record a payment against a statement
      description: |
        Books the payment into the organization's ledger — `debit Cash`,
        repaying the drawn credit line first, the remainder into the wallet —
        and applies it to the statement: `paidMinor` grows, and the statement
        turns `paid` once the payments cover `creditDrawnMinor`. Repayments
        settle the line's draws oldest-first, so the amount may be as large as
        the credit-line debt outstanding through the statement's period —
        earlier draws take their share even when their period was never
        billed — and never larger (`400`). A statement with nothing owed
        refuses a payment the same way. The idempotency key names the ledger
        entry, which can never book twice: a retried payment on a still-open
        statement replays the receipt; one that arrives after the statement
        paid is refused as `400`, and the same key under a different amount is
        `409`.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordStatementPaymentRequest" }
      responses:
        "200":
          description: The statement after the payment
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StatementPayment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}/suspend:
    post:
      summary: Mark a statement's payment suspended
      description: |
        Marks an unpaid finalized statement `suspended` — the standing the
        platform puts an organization in when the bill has gone unpaid past
        its grace. Only a `pending` or `overdue` statement suspends; a paid
        one and a draft are `400`. A later payment still settles it — a
        suspended statement that is paid turns `paid`.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatementTransitionRequest" }
      responses:
        "200":
          description: The suspended statement
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{userId}/password-reset:
    post:
      summary: Reset a user's password
      description: |
        Sets a new password for the named user and revokes every session that
        user holds, so the old credential dies with the reset — the only
        recovery path v1 has, since no email is sent. An unknown user is 404;
        the admin token already authorizes the call, so the code can say which
        of the two it was.
      security:
        - adminToken: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: The reset, with the sessions it revoked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PasswordReset" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tiers:
    get:
      summary: List the tier profiles
      description: |
        Every tier profile, name first, with the count of organizations
        assigned to it. A tier is a capability package — limits and
        allowlists the gateway enforces at admission — never a pricing
        input.
      security:
        - adminToken: []
      responses:
        "200":
          description: The tier profiles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TierProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tiers/{tier}:
    put:
      summary: Write a tier profile
      description: |
        Creates the named tier profile, or replaces the one that exists
        under the name — the request names the whole package, so a field
        left out clears rather than keeps its old value. A `PUT` to the
        same name with the same body is the natural replay: it changes
        nothing, which is why the request carries no idempotency key.

        `requestsPerMinute` is one rolling-minute allowance shared by
        every key of every organization on the tier — counted at
        admission, refused 429 `RATE_LIMITED` — and `modelAllowlist`
        bounds the models those organizations may call; `null` means all
        models the deployment serves. `400` answers a malformed name, a
        non-positive allowance or a malformed allowlist.
      security:
        - adminToken: []
      parameters:
        - name: tier
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](-?[a-z0-9])*$'
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTierRequest" }
      responses:
        "200":
          description: The tier profile as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TierProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Retire a tier profile
      description: |
        Removes the named tier. A tier organizations are still assigned
        to refuses `409 CONFLICT` — reassign or clear them first, so a
        deleted package never silently uncaps its members.
      security:
        - adminToken: []
      parameters:
        - name: tier
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The tier is gone
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/discounts:
    get:
      summary: List the pricing discounts
      description: |
        Every discount row, newest first, ended or not — the full history,
        because a settlement snapshots only the percent and the list is
        how an operator reads back why a period billed what it did.
      security:
        - adminToken: []
      responses:
        "200":
          description: The discounts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Discount" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a pricing discount
      description: |
        Grants a discount to an organization and/or a model — both absent
        means every organization on every model — over a validity window
        (`validFrom` defaults to now, `validUntil` absent means it does
        not expire). When several rows match a turn the single most
        favorable applies; discounts never stack. `percent` is 1 to 100 —
        100 settles at zero, recorded as a discount, not as an unpriced
        anomaly.

        The settlement snapshots the percent into its description, so a
        later change here rewrites no bill. `400` answers a percent out
        of range, a window that ends before it starts, or an organization
        that does not exist. A retry with the same `idempotencyKey` and
        the same fields answers the row it created; the same key with
        different fields is `409 CONFLICT`.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDiscountRequest" }
      responses:
        "200":
          description: The discount row — the created one, or the one its idempotency key already wrote
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Discount" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/discounts/{discountId}:
    delete:
      summary: End a discount early
      description: |
        Sets the discount's `validUntil` to now: it stops applying to
        turns that start after the call, and stays in the list — the
        history a settled bill's `discountPercent` points back at.
        Deleting an already-ended or expired discount is the same answer;
        an unknown id is `404`.
      security:
        - adminToken: []
      parameters:
        - name: discountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The discount, now ended
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Discount" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/audit:
    get:
      summary: Read the admin audit log
      description: |
        Every mutating call on this surface appends one row to
        `oxsum.admin_audit`: the action (`channel.set`, `organization.adjust`,
        `tier.delete`, …), what it acted on, the request's detail with
        credentials redacted, and the idempotency key it carried. Rows are
        written only after the mutation commits, so a crash may omit one but
        the log never describes a change that did not happen. Newest first;
        a full page answers `nextCursor`, echoed back as `cursor` — opaque,
        never constructed by hand; absent means the log is read out.
        `action` narrows to one action's rows exactly.
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: cursor
          in: query
          description: An earlier answer's `nextCursor`, echoed verbatim.
          schema: { type: string }
        - name: action
          in: query
          description: Narrow the page to one action, exactly.
          schema: { type: string }
      responses:
        "200":
          description: One page of audit rows, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [entries]
                    properties:
                      entries:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEntry" }
                      nextCursor:
                        type: string
                        description: The cursor the next page asks with; absent at the log's end.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/service-credentials:
    get:
      summary: List the metering service credentials
      description: >-
        Every service credential, newest first — metadata only: the secret exists
        once, at mint. The list answers `prefix`, `createdAt` and `revokedAt`, so a
        deployment can name which of its services may still meter.
      security:
        - adminToken: []
      responses:
        "200":
          description: The service credentials
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Mint a metering service credential
      description: >-
        The secret is answered exactly once, in this response — the database keeps
        only its hash, like an API key's. `name` is what the settlement description
        records as the reporting service, so name it for the service that will hold
        it. The mint lands in the admin audit log.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCredentialRequest" }
      responses:
        "200":
          description: The credential, with its secret — the only answer that carries it
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedServiceCredential" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/service-credentials/{credentialId}:
    delete:
      summary: Revoke a service credential
      description: >-
        The credential authenticates nothing from the revocation on; nothing it
        already wrote changes. Revoking an absent or already-revoked credential is
        404. The revoke lands in the admin audit log.
      security:
        - adminToken: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The revoked credential
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServiceCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/models:
    get:
      summary: List the served models, in OpenAI's shape
      description: |
        Only models with a relayable price are listed: a model the gateway cannot price cannot be
        frozen, so it cannot be served — and a `mode: event` price is a billable code for
        `/api/v1/metering`, not a model any `/v1` surface relays, so it is not listed either.
        `owned_by` is the channel that serves the model, and `created` is when the version in force
        was written. Model aliases are listed beside the direct names (issue
        #286): a caller writes the public name and the channel relays the
        upstream model it renames.
      responses:
        "200":
          description: The model list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
  /v1/chat/completions:
    post:
      summary: Chat completion, billed by freezing credit first and settling against upstream usage
      description: |
        The gateway computes the most the request could cost, freezes that much, and only then
        contacts upstream. Upstream's request always carries the output upper bound as `max_tokens`,
        and a streaming request always carries `stream_options.include_usage = true`, so upstream
        cannot return more than the freeze was computed for and its usage arrives in the final chunk.
        The request settles against that usage, capped at the freeze.

        Every response carries `x-oxsum-request-id`. The two ledger entries use `req-<id>:hold` and
        `req-<id>:settle`, and the settlement's description carries the channel, the price version in
        force when the request started, the token counts and the prices that produced the charge, so a
        bill can be verified down to the arithmetic years later.

        Request content is text-only in v1: a message whose `content` is an array containing anything
        but text is refused with 400, because the input upper bound must be computable for the freeze
        promise to hold.

        A `stream: true` response ends with `data: [DONE]`. If upstream reports usage, the last frame
        before it carries the `usage` object, and that is what was billed. If the client disconnects,
        the upstream call is cancelled and the turn settles on local estimation, marked as estimated
        in the settlement description; if upstream is unreachable or answers with an error before
        emitting anything, the whole freeze is released and nothing is charged.

        An `Idempotency-Key` header makes a retried request the same turn: the first request
        claims the key, and a retry carrying it is answered from the record rather than run
        again — a completed non-streamed turn replays its stored response, a completed
        streamed turn (whose bytes cannot be replayed) answers its settled receipt, and a
        retry that lands while the first turn is still running is refused 409. The same key
        under a different request body is refused 422. A refusal that never reached the wallet
        releases the key, so retrying a corrected request is always possible; a key expires
        24 hours after it was first claimed.

        Every answer that took the hold — a completion or an upstream refusal — carries
        `x-oxsum-freeze-minor` (the reserved bound) and `x-oxsum-balance-minor` (the
        spendable balance left after it) on the response head. The settled charge rides as
        `x-oxsum-charged-minor`: a header on a non-streamed answer and on a refusal that
        settled `Charge::Nothing`, and — because the head goes out before a streamed turn
        settles — an HTTP trailer on a streamed answer, announced by `Trailer`.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: >-
            Upstream's completion, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-balance-minor: { $ref: "#/components/headers/BalanceMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
            Trailer: { schema: { type: string, example: "x-oxsum-charged-minor" }, description: "on a streamed answer, announces the settled charge arrives as a trailer" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletion" }
            text/event-stream:
              schema:
                type: string
                description: "OpenAI SSE frames, passed through unchanged, terminated by `data: [DONE]`"
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
  /v1/responses:
    post:
      summary: Responses turn, billed by freezing credit first and settling against upstream usage
      description: |
        The same freeze-then-settle contract as `/v1/chat/completions`, in OpenAI's
        newer Responses wire (issue #495): `input` rather than `messages`,
        `instructions` for the system prompt, `max_output_tokens` the only output
        ceiling, and `store`/`previous_response_id` forwarded for the upstream's
        stateful flow — the gateway keeps no response state, so the chain lives in
        the upstream's store, not here. The surface serves the same `openai`
        channels as `/v1/chat/completions`; upstream is called at
        `{baseUrl}/responses` with the channel credential as `Authorization: Bearer`.

        `input` is a string or the items list: a `message` item's `input_text`
        parts contribute their text to the input bound, a structured item — a
        `function_call`, `function_call_output`, `reasoning` record — contributes
        its serialized JSON, and a media part (`input_image`, `input_file`,
        `input_audio`) is refused 400 like every surface's media. The forwarded
        body always carries `max_output_tokens` set to the freeze's bound, and a
        stream carries `stream_options.include_usage = true`, because the terminal
        `response.completed` event is where the usage report rides. Errors answer
        in OpenAI's envelope, the same as `/v1/chat/completions`.

        Usage normalization follows the Responses report: `usage.input_tokens` is
        the billed input (already including `input_tokens_details.cached_tokens`)
        and `usage.output_tokens` the billed output (already including
        `output_tokens_details.reasoning_tokens`). A `stream: true` response
        relays the event stream unchanged and ends on `response.completed`,
        `response.failed` or `response.incomplete` — there is no `[DONE]` on this
        wire. The cost headers and `Idempotency-Key` contract are
        `/v1/chat/completions`'s.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsesRequest" }
      responses:
        "200":
          description: >-
            Upstream's response, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-balance-minor: { $ref: "#/components/headers/BalanceMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
            Trailer: { schema: { type: string, example: "x-oxsum-charged-minor" }, description: "on a streamed answer, announces the settled charge arrives as a trailer" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Response" }
            text/event-stream:
              schema:
                type: string
                description: "Responses SSE events, passed through unchanged, ending on `response.completed`"
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
  /v1/messages:
    post:
      summary: Anthropic Messages turn, billed by freezing credit first and settling against upstream usage
      description: |
        The same freeze-then-settle contract as `/v1/chat/completions`, in Anthropic's
        request and response shapes. The surface serves only channels whose `protocol` is
        `anthropic`: a model that no anthropic channel serves is refused 400, exactly as an
        unserved model is on the OpenAI surface — there is no cross-protocol translation.
        Errors are answered in Anthropic's shape, `{"type": "error", "error": {…}}`, and
        `error.code` still carries oxsum's own code.

        The credential is the same organization API key, presented either as
        `Authorization: Bearer` or `x-api-key`. `anthropic-version` and `anthropic-beta`
        are forwarded to upstream; when no `anthropic-version` is sent, `2023-06-01` is
        sent in its place. Upstream is called at `{baseUrl}/messages` and is authenticated
        with the channel credential as `x-api-key`.

        Upstream's request always carries the output upper bound as `max_tokens`, so
        upstream cannot return more than the freeze was computed for. Usage normalization
        follows Anthropic's report: `usage.input_tokens` excludes the cached counts, so the
        billed input total is `input_tokens + cache_read_input_tokens +
        cache_creation_input_tokens`; `cache_creation.ephemeral_5m_input_tokens` and
        `ephemeral_1h_input_tokens` split the write into the two cache-write dimensions,
        and a `cache_creation_input_tokens` lump without the split counts toward the
        5-minute tier. On a stream, `message_start` carries the input side and each
        `message_delta` carries cumulative `output_tokens`; the last report wins per field.

        Content is text-computable: a `text` block contributes its `text`, a
        `tool_use`/`tool_result`/`thinking` block contributes its serialized JSON, and a
        media block (`image`, `document`, `audio`, `video`) has no computable bound and is
        refused 400. `system` accepts a string or an array of `text` blocks. Attributing a
        turn is `metadata.user_id`, which lands on the usage record's `endUser`.

        A `stream: true` response relays Anthropic's event stream unchanged and ends with
        `message_stop`. The cost headers are the same three: `x-oxsum-freeze-minor` and
        `x-oxsum-balance-minor` on the head, `x-oxsum-charged-minor` on a non-streamed head
        or a streamed trailer. `Idempotency-Key` behaves exactly as it does on
        `/v1/chat/completions`.
      security: [{ bearer: [] }, { apiKeyHeader: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
        - name: anthropic-version
          in: header
          required: false
          schema: { type: string, default: "2023-06-01" }
          description: forwarded to upstream; `2023-06-01` is sent when absent
        - name: anthropic-beta
          in: header
          required: false
          schema: { type: string }
          description: forwarded to upstream unchanged when present
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessagesRequest" }
      responses:
        "200":
          description: >-
            Upstream's message, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-balance-minor: { $ref: "#/components/headers/BalanceMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
            Trailer: { schema: { type: string, example: "x-oxsum-charged-minor" }, description: "on a streamed answer, announces the settled charge arrives as a trailer" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnthropicMessage" }
            text/event-stream:
              schema:
                type: string
                description: "Anthropic SSE events, passed through unchanged, ending with `message_stop`"
        "400": { $ref: "#/components/responses/AnthropicError" }
        "401": { $ref: "#/components/responses/AnthropicError" }
        "402": { $ref: "#/components/responses/AnthropicError" }
        "403": { $ref: "#/components/responses/AnthropicError" }
        "409": { $ref: "#/components/responses/AnthropicError" }
        "422": { $ref: "#/components/responses/AnthropicError" }
        "429": { $ref: "#/components/responses/AnthropicError" }
        "500": { $ref: "#/components/responses/AnthropicError" }
        "502": { $ref: "#/components/responses/AnthropicError" }
  /v1/embeddings:
    post:
      summary: Embeddings, billed by freezing the input bound first and settling against upstream usage
      description: |
        The input-only half of the gateway (issue #170), in OpenAI's request and response
        shapes, served only by `openai` channels whose price for the model carries
        `mode: embeddings`. The turn freezes the input bound — token-array `input` counts
        exactly, string input at the usual text bound — plus the flat fee before upstream is
        contacted, and settles against `usage.prompt_tokens` afterward, capped at the freeze.

        There is no output side: `stream` is refused, and no `max_tokens` is injected into the
        forwarded body. The failover, bounded `Retry-After`, `Idempotency-Key` and
        cost-header contract is the shared pipeline's — `x-oxsum-freeze-minor` and
        `x-oxsum-balance-minor` on the head, `x-oxsum-charged-minor` once the turn settled.

        Upstream is called at `{baseUrl}/embeddings` with the channel credential as
        `Authorization: Bearer`. A response without a usage report settles `estimated`,
        priced from the request's own input bound.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingsRequest" }
      responses:
        "200":
          description: >-
            Upstream's embeddings response, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-balance-minor: { $ref: "#/components/headers/BalanceMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingsResponse" }
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
  /v1/rerank:
    post:
      summary: Rerank, billed by freezing the input bound first and settling against upstream usage
      description: |
        The second input-only surface (issue #170), in the shape Jina and Cohere speak:
        `query` plus a `documents` array — strings or `{"text": …}` objects — whose combined
        text gives the input bound. The turn freezes that bound plus the flat fee under a
        `mode: rerank` price and settles against `usage.total_tokens`, capped at the freeze.

        The failover, bounded `Retry-After`, `Idempotency-Key` and cost-header contract is the
        shared pipeline's, unchanged. Upstream is called at `{baseUrl}/rerank` with the
        channel credential as `Authorization: Bearer`; a response without a usage report
        settles `estimated` from the request's own input bound.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RerankRequest" }
      responses:
        "200":
          description: >-
            Upstream's rerank response, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-balance-minor: { $ref: "#/components/headers/BalanceMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RerankResponse" }
  /v1beta/models/{model}:generateContent:
    post:
      summary: Gemini generateContent turn, billed by freezing credit first and settling against upstream usage
      description: |
        The same freeze-then-settle contract as `/v1/chat/completions`, in Gemini's
        request and response shapes (issue #494). Two details make the surface unlike
        the other chat surfaces: the model is the path's `{model}` segment — a `model`
        body field may only repeat it, never disagree — and streaming is a separate
        action (`/v1beta/models/{model}:streamGenerateContent`), so there is no
        `stream` field on this wire; sending one is 400.

        The surface serves only channels whose `protocol` is `gemini`: a model that no
        gemini channel serves is refused 400, exactly as an unserved model is on the
        OpenAI surface — there is no cross-protocol translation. Errors answer in the
        `{"error": {…}}` object a Gemini SDK reads, with oxsum's own code kept on
        `error.code`.

        Upstream is called at `{baseUrl}/models/{model}:generateContent` with the
        channel credential sent as `x-goog-api-key`, the spelling both
        `generativelanguage.googleapis.com` and `*-aiplatform.googleapis.com` accept.
        The forwarded body's `generationConfig.maxOutputTokens` carries the freeze's
        output bound, so upstream cannot return more than was priced.

        Usage normalization follows `usageMetadata`: `promptTokenCount` already
        includes `cachedContentTokenCount`, `candidatesTokenCount` excludes
        `thoughtsTokenCount` (so the billed output adds it back), and
        `toolUsePromptTokenCount` sits outside `promptTokenCount` (so the billed input
        adds it in).

        The cost headers are the same three: `x-oxsum-freeze-minor` and
        `x-oxsum-balance-minor` on the head, `x-oxsum-charged-minor` on a non-streamed
        head. `Idempotency-Key` behaves exactly as it does on `/v1/chat/completions`.
        `labels` maps onto the turn's usage tags, like OpenAI's `metadata` — strings
        only, ten entries, 64 characters a side.
      security: [{ bearer: [] }, { apiKeyHeader: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
        - name: model
          in: path
          required: true
          schema: { type: string }
          description: "the model the turn bills under — `gemini-2.5-flash` or an alias a `gemini` channel claims; must be served with a configured price"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeminiGenerateRequest" }
      responses:
        "200":
          description: >-
            Upstream's answer, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-balance-minor: { $ref: "#/components/headers/BalanceMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeminiGenerateResponse" }
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
  /v1beta/models/{model}:streamGenerateContent:
    post:
      summary: Gemini streamGenerateContent turn — the same contract, streamed over SSE
      description: |
        The streaming action of the Gemini surface (issue #494): everything the
        `generateContent` entry documents applies, and upstream is called at
        `{baseUrl}/models/{model}:streamGenerateContent?alt=sse` instead. The
        answer is Gemini's event stream passed through unchanged; the last event
        carries a candidate `finishReason`, and the socket close is the close —
        there is no `[DONE]` sentinel on this protocol. The settled charge still
        arrives as the `x-oxsum-charged-minor` trailer the other surfaces use.
      security: [{ bearer: [] }, { apiKeyHeader: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
        - name: model
          in: path
          required: true
          schema: { type: string }
          description: "the model the turn bills under, served by a `gemini` channel with a configured price"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeminiGenerateRequest" }
      responses:
        "200":
          description: Gemini's event stream, passed through unchanged, ending when upstream closes it
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-balance-minor: { $ref: "#/components/headers/BalanceMinor" }
            Trailer: { schema: { type: string, example: "x-oxsum-charged-minor" }, description: "announces the settled charge arrives as a trailer" }
          content:
            text/event-stream:
              schema:
                type: string
                description: "Gemini SSE events, passed through unchanged; the last event carries a candidate `finishReason` and the socket close ends the stream"
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "An oxsum API key: `oxs-` followed by 32 random bytes, shown once at creation."
    adminToken:
      type: http
      scheme: bearer
      description: |
        The operator token from `OXSUM_ADMIN_TOKEN`, at least 16 characters, compared in constant time.
        It is not an API key and belongs to no organization: it is whoever deploys oxsum. A deployment
        that sets no token has no admin surface at all.
    serviceCredential:
      type: http
      scheme: bearer
      description: |
        A metering service credential: `oxs-svc-` followed by 32 random bytes, shown once when
        the admin mints it. It authenticates `/api/v1/metering/*` and nothing else — an
        organization's key and a session are refused there, because an organization can never
        report its own usage (issue #172).
    sessionCookie:
      type: apiKey
      in: cookie
      name: oxsum_session
      description: |
        A web session from `POST /api/v1/auth/login`: `oxsess-` followed by 32 random bytes, carried
        in the `oxsum_session` cookie (`HttpOnly`, `SameSite=Lax`, `Path=/`, plus `Secure` when the
        deployment sets `OXSUM_SESSION_COOKIE_SECURE`). The database keeps only its SHA-256 hash.
        Accepted on `/api/v1` wherever a bearer key is; never accepted on `/v1`, where the gateway
        takes an API key only.
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: >-
        The same organization API key as `bearer`, in the spelling an Anthropic SDK sends.
        Accepted on `/v1`; an explicitly presented bearer token wins over it.
  parameters:
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: the id of the user whose membership this is, as a member's `userId`
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: the id of the team this endpoint addresses, as a team's `teamId`
    ChannelName:
      name: channelName
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,40}$" }
      description: the channel's name, which is its identity
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: the webhook endpoint's id
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255 }
      description: >-
        makes a retried request the same turn: the same key under the same request body
        replays the first response, under a different body it is refused 422, and while the
        first turn is still running it is refused 409
    Mandate:
      name: X-Oxsum-Mandate
      in: header
      required: false
      schema: { type: string }
      description: >-
        a signed spend mandate (issue #262): base64url of the canonical-JSON body plus its
        Ed25519 signature, minted by `POST /api/v1/org/keys/{keyId}/mandates`. Presented on
        `/v1/*` and `POST /api/v1/holds`, it binds the request inside the mandate's
        `capMinor`, `models` and validity window — a refusal reads `invalid_mandate`,
        `mandate_expired` or `mandate_exceeded`, distinct from the key's own limits
  headers:
    RequestId:
      description: "the id the ledger entries are keyed by: `req-<id>:hold` and `req-<id>:settle`"
      schema: { type: string }
    FreezeMinor:
      description: "minor units this request froze — the most it can cost"
      schema: { type: integer }
    BalanceMinor:
      description: "the organization's spendable balance after this request's reservation"
      schema: { type: integer }
    ChargedMinor:
      description: "minor units the settled turn actually charged — a header on non-streamed answers and post-hold refusals, a trailer on streamed ones"
      schema: { type: integer }
  schemas:
    CreatedInvitation:
      type: object
      required: [id, token, expiresAt]
      properties:
        id: { type: string, format: uuid }
        token:
          type: string
          description: "`oxi-` plus 32 random bytes — answered once; only its hash is stored"
        expiresAt: { type: string, format: date-time, description: seven days from minting }
    RedeemInvitationRequest:
      type: object
      required: [token, email, password]
      properties:
        token: { type: string, description: "the invitation link's token" }
        email: { type: string, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256 }
        turnstileToken: { type: [string, "null"], description: "the widget's response token — required when the deployment configures the anti-bot check" }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256, description: at least 12 characters }
        organizationName: { type: string, minLength: 1, maxLength: 80, description: name of the personal organization; defaults to the local part of the email }
        turnstileToken: { type: [string, "null"], description: "the widget's response token — required when the deployment configures the anti-bot check" }
    Registration:
      type: object
      required: [user, organization, apiKey, verificationSent]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        apiKey: { $ref: "#/components/schemas/CreatedApiKey" }
        verificationSent:
          type: boolean
          description: whether a verification mail went out — always false on a deployment without a mailer
    DeviceCodeResponse:
      type: object
      required: [deviceCode, userCode, verificationUri, expiresIn, interval]
      properties:
        deviceCode:
          type: string
          description: "the tool's credential for polling, `oxd-` plus 32 random bytes — only its SHA-256 is stored"
        userCode:
          type: string
          description: "what the user types at the approval page, `XXXX-XXXX` — only its SHA-256 is stored"
        verificationUri: { type: string, description: "the page that takes the user code; built from OXSUM_PUBLIC_URL" }
        expiresIn: { type: integer, description: "seconds until both codes lapse" }
        interval: { type: integer, description: "minimum seconds between token polls" }
    DeviceRequest:
      type: object
      required: [userCode, createdAt, expiresAt]
      properties:
        userCode: { type: string, description: "the code as it was minted, `XXXX-XXXX`" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    DeviceAuthorizeRequest:
      type: object
      required: [userCode, approve]
      properties:
        userCode: { type: string, description: "the code the user typed; dashes and case are ignored" }
        approve: { type: boolean, description: "true grants a key into the session's organization; false denies the request" }
    DeviceTokenRequest:
      type: object
      required: [deviceCode]
      properties:
        deviceCode: { type: string }
    DeviceTokenResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, denied, approved, consumed]
          description: "pending waits on the user; denied is final; approved carries the minted key, once; consumed means the key was already delivered"
        apiKey:
          $ref: "#/components/schemas/CreatedApiKey"
    User:
      type: object
      required: [id, email, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        emailVerified:
          type: boolean
          description: whether the address has been verified through a mailed token
    VerifyRequestResult:
      type: object
      required: [sent, alreadyVerified]
      properties:
        sent:
          type: boolean
          description: whether a verification mail went out — false is the sixty-second resend cooldown
        alreadyVerified:
          type: boolean
          description: the address was already verified, so nothing was mailed
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 256, description: the `oxt-…` token the verification mail's link carries }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 256, description: the `oxt-…` token the reset mail's link carries }
        password: { type: string, minLength: 12, maxLength: 256, description: at least 12 characters }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256, description: at least 12 characters }
    Session:
      type: object
      required: [id, createdAt, expiresAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "absolute expiry: thirty days after login, no sliding renewal in v1" }
        lastUsedAt: { type: string, format: date-time, description: "the last authenticated request; touched at most once per five minutes" }
    UserOrganization:
      type: object
      required: [organization, role]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        role: { type: string, enum: [owner, admin, member], description: "the role the session's user holds in this organization" }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "the new team organization's name" }
    SwitchOrganizationRequest:
      type: object
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid, description: "must be an organization the session's user is a member of" }
    AccountDeletion:
      type: object
      description: What `DELETE /api/v1/users/me` removed — the ledger is untouched, so no count covers it.
      required: [sessionsRevoked, keysRevoked, membershipsRemoved]
      properties:
        sessionsRevoked: { type: integer, format: int64, description: "sessions the account held, now dead" }
        keysRevoked: { type: integer, format: int64, description: "API keys the account minted, now dead" }
        membershipsRemoved: { type: integer, format: int64, description: "memberships the account left; the organizations stay" }
    SessionInfo:
      type: object
      required: [user, organization, role, session]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        role: { type: string, enum: [owner, admin, member], description: "the user's role in the organization the session acts as" }
        session: { $ref: "#/components/schemas/Session" }
    LogoutResponse:
      type: object
      description: "empty: the logout is in the Set-Cookie header that clears the cookie"
    AuthMethods:
      type: object
      required: [oauthGithub]
      properties:
        oauthGithub: { type: boolean, description: "true when the GitHub OAuth client pair is configured" }
        turnstileSiteKey: { type: [string, "null"], description: "the Turnstile site key when the anti-bot check is configured — public by design, the page hands it to the widget" }
    Organization:
      type: object
      required: [id, name, tenantId, kind, createdAt, displayCurrency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenantId: { type: string, description: "ledger tenant id; the ledger lives in the schema ledger_<tenantId>" }
        kind: { type: string, enum: [personal, team] }
        createdAt: { type: string, format: date-time }
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          description: "the fiat unit this organization displays its credit figures in — presentational only, set through `PATCH /api/v1/admin/organizations/{organizationId}`; null renders credits alone"
    DisplayCurrency:
      type: object
      required: [code, ratePerCredit, decimals]
      description: |
        How one credit renders as a fiat amount (issue #257). Purely presentational:
        ledger entries, settlement descriptions and proofs keep integer minor units of
        credit, and the conversion never reaches a charge — so a display-currency
        change can never alter a settled bill's verified charge.
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
          description: "the ISO 4217 unit — USD, EUR, CNY; informational: the conversion needs only the rate, so an unrecognized-but-well-formed code still renders"
        ratePerCredit:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: "how many of the unit one credit displays as, as a decimal literal — \"0.0014\" renders 1_500_000 minor (1.5 credits) as 0.00 at 2 decimals; stored as text so no float ever touches money"
        decimals:
          type: integer
          minimum: 0
          maximum: 6
          description: "the decimal places the unit renders with — 2 for most currencies, 0 for JPY-shaped ones; the render rounds half-up to this precision"
    CreateKeyRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expiresAt: { type: [string, "null"], format: date-time, description: optional expiry; an expired key authenticates nothing }
        spendLimitMinor: { type: [integer, "null"], format: int64, minimum: 0, description: "the key's spend limit in minor units: settled charges plus outstanding holds attributed to the key may not exceed it; null (the default) is unlimited" }
        budgetDuration: { type: [string, "null"], enum: [daily, weekly, monthly], description: "makes spendLimitMinor periodic over the current UTC calendar period; requires spendLimitMinor, meaningless without it" }
        modelAllowlist: { type: [array, "null"], items: { type: string, minLength: 1 }, description: "the gateway models this key may call; null (the default) allows all served models" }
        requestsPerMinute: { type: [integer, "null"], minimum: 1, description: "requests the key may start inside a rolling minute, on the gateway and on /api/v1/holds; null (the default) is uncapped" }
        maxConcurrentHolds: { type: [integer, "null"], minimum: 1, description: "holds the key may have outstanding at once; null (the default) is uncapped" }
        tokensPerMinute: { type: [integer, "null"], minimum: 1, description: "settled input+output tokens the key may burn inside a trailing minute, checked at admission on the gateway; null (the default) is uncapped" }
        tokensPerMinuteScopes: { $ref: "#/components/schemas/TokensPerMinuteScopes" }
    UpdateKeyConstraintsRequest:
      type: object
      properties:
        spendLimitMinor: { type: [integer, "null"], format: int64, minimum: 0, description: "the new limit in minor units, or null for unlimited" }
        budgetDuration: { type: [string, "null"], enum: [daily, weekly, monthly], description: "periodic limit window; requires spendLimitMinor; null or absent clears it" }
        modelAllowlist: { type: [array, "null"], items: { type: string, minLength: 1 }, description: "models the key may call; null or absent clears the list to allow all" }
        requestsPerMinute: { type: [integer, "null"], minimum: 1, description: "the new per-minute request allowance, or null to uncap" }
        maxConcurrentHolds: { type: [integer, "null"], minimum: 1, description: "the new outstanding-holds cap, or null to uncap" }
        tokensPerMinute: { type: [integer, "null"], minimum: 1, description: "the new per-minute settled-token allowance, or null to uncap" }
        tokensPerMinuteScopes: { $ref: "#/components/schemas/TokensPerMinuteScopes" }
    ApiKey:
      type: object
      required: [id, name, prefix, createdBy, createdAt, expiresAt, revokedAt, spendLimitMinor, budgetDuration, modelAllowlist, requestsPerMinute, maxConcurrentHolds, tokensPerMinute, tokensPerMinuteScopes]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        prefix: { type: string, description: "leading characters of the secret, for recognizing the key in a list" }
        createdBy: { type: [string, "null"], format: uuid, description: "the user who minted the key, for the per-member role rules; null for keys minted with an API key" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        spendLimitMinor: { type: [integer, "null"], format: int64, minimum: 0, description: "the key's spend limit in minor units; null is unlimited" }
        budgetDuration: { type: [string, "null"], enum: [daily, weekly, monthly], description: "the window spendLimitMinor applies to; null makes the limit cumulative" }
        modelAllowlist: { type: [array, "null"], items: { type: string }, description: "models the key may call on the gateway; null allows all" }
        requestsPerMinute: { type: [integer, "null"], minimum: 1, description: "the key's rolling-minute request allowance; null is uncapped" }
        maxConcurrentHolds: { type: [integer, "null"], minimum: 1, description: "the key's outstanding-holds cap; null is uncapped" }
        tokensPerMinute: { type: [integer, "null"], minimum: 1, description: "the key's rolling-minute settled-token allowance; null is uncapped" }
        tokensPerMinuteScopes: { $ref: "#/components/schemas/TokensPerMinuteScopes" }
    TokensPerMinuteScopes:
      type: ["object", "null"]
      additionalProperties: { $ref: "#/components/schemas/TokenScope" }
      description: "Tag-scoped slices of the key's settled-token allowance (issue #209). Maps a request `metadata` tag key to one scope; each scoped bucket is an additional cap alongside `tokensPerMinute`, not a replacement. null (the default) scopes nothing."
    TokenScope:
      type: object
      description: "One tag scope (issue #209): exactly one of `each`, `concrete`, or `total` is set. A settled turn accrues into the bucket its `metadata` tag selects — `each` fans out per value (`tag=value`), `concrete` only the pinned value, `total` the whole tag — and the bucket's cap is checked `window-actual + estimate ≤ cap` at admission, 429 when full while other buckets stay open."
      oneOf:
        - type: object
          required: [each]
          properties:
            each: { type: integer, minimum: 1, description: "a separate bucket per value of this tag, each capped here" }
          additionalProperties: false
        - type: object
          required: [concrete, tokensPerMinute]
          properties:
            concrete: { type: string, minLength: 1, maxLength: 64, description: "the one tag value this bucket pins" }
            tokensPerMinute: { type: integer, minimum: 1, description: "the pinned bucket's settled-token allowance per minute" }
          additionalProperties: false
        - type: object
          required: [total]
          properties:
            total: { type: integer, minimum: 1, description: "one bucket over every value of this tag, capped here" }
          additionalProperties: false
    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "the plaintext key; shown once and stored only as a SHA-256 hash" }
    Mandate:
      type: object
      required: [mandateId, keyId, capMinor, models, notBefore, notAfter, nonce]
      properties:
        mandateId: { type: string, format: uuid, description: "the stable id a mandate's committed spend keys on" }
        keyId: { type: string, format: uuid, description: "the key this delegates" }
        capMinor: { type: integer, format: int64, minimum: 1, description: "total committed spend this mandate may carry, in minor units" }
        models: { type: [array, "null"], items: { type: string }, description: "the model allowlist — a subset of the key's own; null means all the key serves" }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time, description: "when the mandate expires — there is no revocation, so mandates are short-lived" }
        nonce: { type: string, description: "uniqueness; hex of 16 random bytes" }
        createdAt: { type: string, format: date-time }
    CreatedMandate:
      allOf:
        - $ref: "#/components/schemas/Mandate"
        - type: object
          required: [mandate]
          properties:
            mandate: { type: string, description: "base64url of the canonical body plus its Ed25519 signature — the blob the delegate presents in `X-Oxsum-Mandate`" }
    CreateMandateRequest:
      type: object
      required: [capMinor, notAfter]
      properties:
        capMinor: { type: integer, format: int64, minimum: 1, description: "total committed spend the mandate may carry — must sit inside the key's own `spendLimitMinor` when the key has one" }
        models: { type: [array, "null"], items: { type: string }, description: "the model allowlist — must be a subset of the key's own `modelAllowlist` when the key has one; omitted or null means all the key serves" }
        notBefore: { type: string, format: date-time, description: "when the mandate starts being honored; absent means now" }
        notAfter: { type: string, format: date-time, description: "when the mandate expires — required, because no revocation exists" }
    Member:
      type: object
      required: [userId, email, role, joinedAt]
      properties:
        userId: { type: string, format: uuid, description: "the user's id, which the membership endpoints address a member by" }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member], description: "the member's role in this organization; a platform admin is a deployment identity, not a role here" }
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: "the member's committed-spend cap across every key they minted; null carries none"
        teamId:
          type: string
          format: uuid
          nullable: true
          description: "the team the member belongs to (issue #440); null means unassigned — no team cap applies to the member's keys"
        joinedAt: { type: string, format: date-time, description: when the membership was created }
    AddMemberRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320
          description: |
            the email of an account that already exists; the comparison is case-insensitive. An
            email no account holds is `NOT_FOUND` — a person without an account is invited by link
            (`POST /api/v1/org/invitations`) — and one that is already a member of this organization
            is `CONFLICT`.
    Team:
      type: object
      required: [teamId, name, members, createdAt]
      properties:
        teamId: { type: string, format: uuid, description: "the team's id, which the team endpoints address it by" }
        name: { type: string, description: "the subgroup's name — unique per organization" }
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: "the team's committed-spend cap across every key its members minted; null carries none"
        members: { type: integer, format: int64, description: "how many memberships the team groups today" }
        createdAt: { type: string, format: date-time, description: when the team was created }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "the subgroup's name — unique per organization" }
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: "the team's committed-spend cap across every key its members minted; absent or null carries none"
    UpdateTeamRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "the team's new name" }
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: |
            the team's committed-spend cap across every key its members minted — absent leaves it,
            an explicit null clears it. At least one of `name` and `budgetLimitMinor` is required.
    UpdateMemberRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, member]
          description: |
            the member's new role. `owner` is not a value here on purpose: ownership is a single
            seat moved by `POST /api/v1/org/ownership`, so this endpoint cannot promote anyone.
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: |
            the member's committed-spend cap across every key they minted — absent leaves it, an
            explicit null clears it.
        teamId:
          type: string
          format: uuid
          nullable: true
          description: |
            the team the member joins (issue #440) — absent leaves the assignment, an explicit
            null unassigns, a team id moves the member under that team's `budgetLimitMinor` for
            their *next* hold. Committed spend follows the roster: the money their keys already
            spent moves with them. A team outside the organization is `NOT_FOUND`. At least one
            of `role`, `budgetLimitMinor` and `teamId` is required.
    TransferOwnershipRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid, description: "the member who becomes the owner; they are an admin or a member of this organization" }
    Ownership:
      type: object
      required: [owner, previousOwner]
      properties:
        owner: { $ref: "#/components/schemas/Member", description: "the new owner, in the owner role" }
        previousOwner: { $ref: "#/components/schemas/Member", description: "the owner who transferred it, now an admin" }
    WebhookEndpoint:
      type: object
      required: [id, url, events, enabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: "where signed events are posted" }
        events:
          type: array
          items:
            type: string
            enum:
              - request.settled
              - org.suspended
              - deposit.credited
              - deposit.failed
              - deposit.reversed
              - balance.low
              - statement.finalized
              - statement.payment_overdue
              - statement.payment_status_updated
              - org.credit_limit_exceeded
              - anomaly.detected
              - budget.exhaustion_forecast
              - budget.threshold_crossed
          description: the event types this endpoint is subscribed to
        enabled: { type: boolean, description: "a disabled endpoint enqueues nothing" }
        balanceLowMinor:
          type: integer
          format: int64
          nullable: true
          description: "the available-balance line `balance.low` fires below; absent or null leaves the endpoint deaf to the balance"
        budgetThresholdsPercent:
          type: array
          items: { type: integer, minimum: 1, maximum: 100 }
          description: "the consumption percentages `budget.threshold_crossed` fires at — each scope a settle re-evaluates (key spendLimitMinor, minting member's budgetLimitMinor, organization credit line) fires once per window; empty leaves the endpoint deaf"
        secretLast4: { type: string, description: "the last four characters of the signing secret, for recognizing it" }
        createdAt: { type: string, format: date-time }
    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri, minLength: 1, maxLength: 500, description: "the HTTPS (or localhost HTTP) address events are posted to" }
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - request.settled
              - org.suspended
              - deposit.credited
              - deposit.failed
              - deposit.reversed
              - balance.low
              - statement.finalized
              - statement.payment_overdue
              - statement.payment_status_updated
              - org.credit_limit_exceeded
              - anomaly.detected
              - budget.exhaustion_forecast
              - budget.threshold_crossed
          description: "the event types to subscribe; the catalog is listed under the operation's description"
        balanceLowMinor:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: "the available-balance line `balance.low` fires below; absent or null leaves the endpoint deaf to the balance"
        budgetThresholdsPercent:
          type: array
          items: { type: integer, minimum: 1, maximum: 100 }
          description: "the consumption percentages `budget.threshold_crossed` fires at (issue #232); absent or empty leaves the endpoint deaf"
    CreatedWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "the signing secret (`whsec-…`); shown once, stored sealed under OXSUM_SECRET_KEY" }
    WebhookDelivery:
      type: object
      required: [id, eventType, status, attempts, nextAttemptAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        endpointId: { type: string, format: uuid }
        eventType:
          type: string
          enum:
            - request.settled
            - org.suspended
            - deposit.credited
            - deposit.failed
            - deposit.reversed
            - balance.low
            - statement.finalized
            - statement.payment_overdue
            - statement.payment_status_updated
            - org.credit_limit_exceeded
            - anomaly.detected
            - budget.exhaustion_forecast
        status: { type: string, enum: [pending, sending, delivered, failed], description: "sending is a worker's claim in flight; delivered means a 2xx; failed means the ten-attempt budget ran out" }
        attempts: { type: integer, minimum: 0 }
        nextAttemptAt: { type: string, format: date-time, description: "when the worker next tries a pending delivery; the creation time for a finished one" }
        responseStatus: { type: [integer, "null"], description: "the HTTP status the receiver last answered, when it answered at all" }
        lastError: { type: [string, "null"], description: "the last failure, when the last attempt failed before a response" }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
    ChannelRequest:
      type: object
      required: [name, baseUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9._-]+$", description: the channel's identity; posting an existing name replaces its connection }
        baseUrl: { type: string, format: uri, description: "where the upstream surface lives, http or https; the protocol's path (`/chat/completions`, `/messages`, `models/{model}:<action>`) is appended to it" }
        apiKey: { type: string, minLength: 1, description: "the upstream credential, single-key spelling — merged into `apiKeys` when both arrive. Sealed with OXSUM_SECRET_KEY, only its last four characters readable afterwards. Sent upstream as `Authorization: Bearer` on an `openai` channel, as `x-api-key` on an `anthropic` one, and as `x-goog-api-key` on a `gemini` one" }
        apiKeys:
          type: array
          items: { type: string, minLength: 1 }
          description: "the channel's credential pool (issue #444): the whole ordered set of upstream keys — a `set` re-credentials the channel wholesale, so every key the pool should hold goes here. Absent leaves the stored pool untouched; a present empty array is VALIDATION_ERROR — a channel with no key cannot serve. One of `apiKey`/`apiKeys` is required when creating a channel."
        billKey: { type: string, minLength: 1, nullable: true, description: "the admin billing credential the upstream-bill-sync pass reads the provider's cost API under (issue #283) — sealed beside the metering keys, deliberately separate so a relay credential never reads the org's bill. Omit to leave any stored billing key untouched; explicit null clears it." }
        protocol: { type: string, enum: [openai, anthropic, gemini], description: "the upstream protocol the channel speaks, which selects the usage adapter its reports are normalized by and which surface serves its models: `/v1/*` for `openai` and `anthropic`, `/v1beta/*` for `gemini`; defaults to `openai` — any other name is VALIDATION_ERROR" }
    ChannelCredential:
      type: object
      required: [credentialId, apiKeyLast4, position, status, cooldownUntil, lastError, lastUsedAt, createdAt]
      properties:
        credentialId: { type: string, format: uuid }
        apiKeyLast4: { type: string, description: "the last four characters of the upstream key, and nothing more of it" }
        position: { type: integer, description: "the pick order inside the pool — lower tries first when nothing else ranks" }
        status: { type: string, enum: [active, disabled], description: "`active` picks normally; `disabled` is kept on record, never picked" }
        cooldownUntil: { type: [string, "null"], format: date-time, description: "the health cool-down the pick honours until — a credential that kept refusing upstream rests out the window, then lets itself back in" }
        lastError: { type: [string, "null"], description: "what cooled it, for the admin list; observability, never a pick input" }
        lastUsedAt: { type: [string, "null"], format: date-time, description: "when this credential last led an upstream call — the least-recently-used pick's input; null means never used" }
        createdAt: { type: string, format: date-time }
    Channel:
      type: object
      required: [name, baseUrl, protocol, credentials, billKeyLast4, createdAt, models]
      properties:
        name: { type: string }
        baseUrl: { type: string }
        protocol: { type: string, description: "the upstream protocol the channel speaks" }
        credentials:
          type: array
          description: "the channel's credential pool (issue #444): one entry per upstream key, ordered by position, each showing only its last four plus the health state the pick reads"
          items: { $ref: "#/components/schemas/ChannelCredential" }
        billKeyLast4: { type: string, nullable: true, description: "the last four characters of the admin billing credential (issue #283), and nothing more of it; null when the channel carries none" }
        createdAt: { type: string, format: date-time }
        models:
          type: array
          description: one entry per model, at its current version
          items: { $ref: "#/components/schemas/ModelPrice" }
    PriceSet:
      type: object
      required: [inputPricePerMillion]
      description: "the rates one request bills at under one mode. `outputPricePerMillion` and `maxOutputTokens` are required on a `chat` price and absent or zero on the input-only modes (`embeddings`, `rerank`) — there is no output side to price."
      properties:
        inputPricePerMillion: { type: integer, format: int64, minimum: 0, description: minor units per million input tokens }
        outputPricePerMillion: { type: integer, format: int64, minimum: 0, description: "minor units per million output tokens; required on `chat`, absent or zero on the input-only modes" }
        maxOutputTokens: { type: integer, format: int64, minimum: 0, description: "the most output the model may produce; also the ceiling a caller's max_tokens is clamped to — positive on `chat`, absent or zero on the input-only modes" }
        cacheReadPricePerMillion: { type: integer, format: int64, minimum: 0, description: "minor units per million cached input tokens; absent bills the cached part at the input price" }
        cacheWrite5mPricePerMillion: { type: integer, format: int64, minimum: 0, description: "minor units per million tokens written into the 5-minute provider cache tier; absent bills them at the input price" }
        cacheWrite1hPricePerMillion: { type: integer, format: int64, minimum: 0, description: "as cacheWrite5mPricePerMillion, for the 1-hour tier" }
        reasoningPricePerMillion: { type: integer, format: int64, minimum: 0, description: "minor units per million reasoning tokens; absent bills the reasoning part at the output price" }
        costPerRequest: { type: integer, format: int64, minimum: 0, description: "a flat amount in minor units, charged once per billed request in addition to the token lines" }
        upstream: { $ref: "#/components/schemas/UpstreamPrices" }
    UpstreamPrices:
      type: object
      description: "what the upstream bills the deployment for the same usage, in the same units — the margin and misbilling view reads it; an organization never sees it"
      properties:
        inputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        outputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        cacheReadPricePerMillion: { type: integer, format: int64, minimum: 0 }
        cacheWrite5mPricePerMillion: { type: integer, format: int64, minimum: 0 }
        cacheWrite1hPricePerMillion: { type: integer, format: int64, minimum: 0 }
        reasoningPricePerMillion: { type: integer, format: int64, minimum: 0 }
        costPerRequest: { type: integer, format: int64, minimum: 0 }
    PriceMatch:
      type: object
      description: "the conditions a request must satisfy: every present field must hold, and the count of present fields is the rule's specificity"
      properties:
        serviceTier: { type: string, maxLength: 64, description: "matches when the caller asked for this service tier" }
        minInputTokens: { type: integer, format: int64, minimum: 0, description: "matches when the turn's input reaches this count" }
        maxInputTokens: { type: integer, format: int64, minimum: 0, description: "matches when the turn's input stays under this count" }
    PriceRule:
      type: object
      required: [match, price]
      description: "a conditional price: when the request matches, this rule's price set replaces the whole base set — never a field-level diff. The most specific matching rule wins; two rules that could match the same request at the same specificity are refused when the price is written."
      properties:
        match: { $ref: "#/components/schemas/PriceMatch" }
        price: { $ref: "#/components/schemas/PriceSet" }
    ModelPrice:
      allOf:
        - $ref: "#/components/schemas/PriceSet"
        - type: object
          required: [model, version, weight, createdAt]
          properties:
            model: { type: string }
            version: { type: integer, minimum: 1, description: "counted per model from 1; a settlement names the version that priced it" }
            weight:
              type: integer
              minimum: 1
              maximum: 1000
              description: "the route's relative preference for leading a request against other channels serving the same model (issue #168)"
            mode: { type: string, enum: [chat, embeddings, rerank, event], description: "the billing mode this price applies to — which surface may serve it and what its counts mean; `event` prices meter `/api/v1/metering` reports and serve no gateway surface" }
            rules:
              type: array
              description: "the conditional price sets; empty when every request pays the base set"
              items: { $ref: "#/components/schemas/PriceRule" }
            createdAt: { type: string, format: date-time, description: "when this version was written" }
    PriceRequest:
      allOf:
        - $ref: "#/components/schemas/PriceSet"
        - type: object
          required: [model]
          properties:
            model: { type: string, minLength: 1, maxLength: 200 }
            weight:
              type: integer
              minimum: 1
              maximum: 1000
              default: 100
              description: "the route's relative preference for leading a request; absent means 100"
            mode:
              type: string
              enum: [chat, embeddings, rerank, event]
              default: chat
              description: "the billing mode the price serves; absent means `chat`. `embeddings` and `rerank` prices are input-only: `outputPricePerMillion` and `maxOutputTokens` must be absent or zero. `event` prices are metered through `/api/v1/metering` only: `maxOutputTokens` must be absent or zero — nothing is forwarded, so there is no output bound — while `outputPricePerMillion` stays allowed for services that meter an output side"
            rules:
              type: array
              description: "conditional price sets, evaluated most-specific-wins; two rules that could match the same request at the same specificity are refused"
              items: { $ref: "#/components/schemas/PriceRule" }
    PriceVersion:
      type: object
      required: [model, version]
      properties:
        model: { type: string }
        version: { type: integer, minimum: 1, description: the version this change appended }
    AliasRequest:
      type: object
      required: [alias, upstreamModel]
      description: "an alias claim (issue #286): the public name callers write, and the upstream model the channel relays it as"
      properties:
        alias: { type: string, minLength: 1, maxLength: 200, description: "the public name; unique across channels — a name another channel serves directly is a conflict" }
        upstreamModel: { type: string, minLength: 1, maxLength: 200, description: "the model the channel actually serves, forwarded upstream in place of the alias" }
    ModelAlias:
      type: object
      required: [alias, channel, upstreamModel, createdAt]
      properties:
        alias: { type: string, description: "the public name callers write" }
        channel: { type: string, description: "the channel that claims the alias" }
        upstreamModel: { type: string, description: "the upstream model the channel relays" }
        createdAt: { type: string, format: date-time, description: "when the alias was claimed" }
    OpenHoldView:
      type: object
      description: "one hold the ledger still reserves — the in-flight table's row"
      required: [requestId, model, freezeMinor]
      properties:
        requestId: { type: string, description: "the caller's request id — `x-oxsum-request-id`" }
        model: { type: string }
        freezeMinor: { type: integer, format: int64, minimum: 0, description: "what the hold reserves, in minor units" }
        keyPrefix:
          type: string
          description: the display prefix of the key that took the hold; absent for unattributed holds
    LogEntryView:
      type: object
      description: one ledger entry as the transaction log lists it
      required: [index, id, description, contentHash]
      properties:
        index: { type: integer, format: int64, description: "the entry's position in the log" }
        id: { type: string, format: uuid, description: "the entry id — `GET /api/v1/entries/{entryId}/proof` names it" }
        description: { type: string, description: "what the writer recorded — a settlement record, a hold, a reason" }
        contentHash: { type: string, pattern: "^[0-9a-f]{64}$", description: "the hash the Merkle log commits to" }
    UsageReport:
      type: object
      description: |
        A signed end-user usage report (issue #261): the committed subset of
        settlement entries for one `endUser` over `[from, to]`, the marker
        entry that bound it into the organization's ledger once, and every
        shown entry's own inclusion proof — everything a third party needs to
        run `oxsum_verify::verify_usage_report` with no second call.
      required: [reportId, endUser, from, to, entryCount, chargedTotalMinor, subsetHash, marker, entries, head, note, keyName, publicKey, keyHash]
      properties:
        reportId:
          type: string
          format: uuid
          description: the marker entry's own id — `GET .../entries/{id}/proof` resolves it
        endUser: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        entryCount:
          type: integer
          format: int64
          description: settlements the subset commits — a customer's own count spot-checks this
        chargedTotalMinor:
          type: integer
          format: int64
          description: the subset's summed settled charge in minor units
        subsetHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: fold of the shown entries' content hashes in log order, `oxsum/usage-report/v1`
        marker:
          type: object
          description: the usage-report marker entry — the entry itself (whose DocumentRef binds the subset digest and whose description commits the report), its recorded content hash, and its inclusion proof
          required: [entry, contentHash, proof]
          properties:
            entry:
              type: object
              description: the marker entry, doubleentry's serde encoding — the verifier recomputes its hash and reads its DocumentRef + description
            contentHash:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: the hash the Merkle log commits to — the verifier re-derives it with `adopt_verified` before trusting the entry
            proof:
              type: object
              description: the marker's inclusion proof into `head`
        entries:
          type: array
          description: every settlement entry the subset shows, in log order — each proves its own membership against `head`
          items:
            type: object
            required: [entry, contentHash, proof]
            properties:
              entry:
                type: object
                description: the settlement entry, doubleentry's serde encoding
              contentHash:
                type: string
                pattern: "^[0-9a-f]{64}$"
                description: the hash the Merkle log commits to — re-derived with `adopt_verified`
              proof:
                type: object
                description: this entry's inclusion proof into `head`
        head:
          type: object
          description: the tree head every proof anchors to, at report time
          properties:
            size: { type: integer, format: int64 }
            root: { type: string, pattern: "^[0-9a-f]{64}$" }
        note:
          type: string
          nullable: true
          description: the operator-signed head note, when the deployment signs heads
        keyName: { type: string, nullable: true }
        publicKey: { type: string, nullable: true, description: the operator's Ed25519 verifying key, hex }
        keyHash: { type: string, nullable: true, description: the signature-line selector, hex }
        witnessOrigin:
          type: string
          nullable: true
          description: |
            the tenant log's origin (`oxsum/ledgers/<tenant>`), so a reader's
            witness check knows which log the cosignatures must name (issue #328)
        witnessKeys:
          type: array
          description: |
            the deployment's pinned witness keys — public by design, and absent
            (or empty) when the deployment pins none
          items:
            type: object
            required: [witnessUrl, keyName, publicKey, keyHash]
            properties:
              witnessUrl: { type: string, format: uri }
              keyName: { type: string }
              publicKey: { type: string, description: "the Ed25519 verifying key, hex" }
              keyHash: { type: string, description: "the C2SP key hash, hex" }
        witnessNotes:
          type: array
          description: |
            the cosigned notes stored for this bundle's head, absent when none
            are; a reader checks them with `verify_witnesses`
          items:
            type: object
            required: [witnessUrl, note]
            properties:
              witnessUrl: { type: string, format: uri }
              note: { type: string, description: "the cosigned C2SP note text" }
        completeness:
          type: object
          description: |
            The anchored-day completeness proof (issue #339), present when a
            daily anchor covers the span: the anchor entry that fixed the
            customer's day-log head, the head itself, its inclusion in the
            anchor's sorted map, and every day leaf the head was folded from.
            The verifier rebuilds each day leaf from the rows the proof assigns
            to that day, so a dropped day or a misattributed row fails. Absent,
            completeness remains the organization's claim.
          required: [v, anchor, head, mapProof, days]
          properties:
            v: { type: integer, minimum: 1 }
            anchor:
              type: object
              description: the ledger entry the daily pass appended, its recorded hash and its inclusion proof into `head`
              required: [entry, day, mapRoot, enduserCount]
              properties:
                entry:
                  type: object
                  required: [entry, contentHash, proof]
                  properties:
                    entry: { type: object, description: "doubleentry's serde encoding of the anchor entry" }
                    contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
                    proof: { type: object }
                day: { type: string, format: date, description: "the anchored UTC day" }
                mapRoot:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: the sorted-map root over every customer's day-log head at that day
                enduserCount: { type: integer, format: int64, description: "customers the map covered" }
            head:
              type: object
              description: the customer's day-log head at the anchor day
              required: [root, size]
              properties:
                root: { type: string, pattern: "^[0-9a-f]{64}$" }
                size: { type: integer, format: int64 }
            mapProof:
              type: object
              description: the customer's head-pair inclusion in `anchor.mapRoot` (the proof carries the position)
            days:
              type: array
              description: every day leaf the head covers, in index order
              items:
                type: object
                required: [day, index, leaf, proof]
                properties:
                  day: { type: string, format: date }
                  index: { type: integer, format: int64, minimum: 0 }
                  leaf: { type: string, pattern: "^[0-9a-f]{64}$" }
                  proof: { type: object, description: the leaf's inclusion proof into `head` }
                  rows:
                    type: array
                    description: positions in `entries` this day's leaf was rebuilt from (span days only)
                    items: { type: integer, minimum: 0 }
    UsageReportSummary:
      type: object
      description: |
        A minted usage report's descriptor — what `GET .../usage-reports` lists.
        Carries no rows or proofs; `GET .../usage-reports/{reportId}` serves the
        full bundle.
      required: [reportId, endUser, from, to, entryCount, chargedTotalMinor, subsetHash]
      properties:
        reportId:
          type: string
          format: uuid
          description: the marker entry's own id — the bundle's `GET` path parameter
        endUser: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        entryCount: { type: integer, format: int64 }
        chargedTotalMinor: { type: integer, format: int64 }
        subsetHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    LinkScope:
      type: string
      enum: [report, end_user]
      description: |
        What a share link resolves to: `report` pins one minted usage report —
        the customer's bill for one span — while `end_user` names one downstream
        customer and lists the reports the organization has issued them.
    ReportLink:
      type: object
      description: |
        A capability link the organization minted. The token itself is never
        part of this shape; it exists only in the create response.
      required: [linkId, scope, endUser, createdAt, expiresAt]
      properties:
        linkId: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/LinkScope" }
        reportId:
          type: string
          format: uuid
          nullable: true
          description: the pinned report for `report` scope; absent for `end_user`
        endUser: { type: string }
        label:
          type: string
          nullable: true
          description: the organization's own note for the recipient
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: when the link stops resolving
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: when the link last resolved — the customer opened the bill
    CreatedReportLink:
      type: object
      required: [link, token]
      properties:
        link: { $ref: "#/components/schemas/ReportLink" }
        token:
          type: string
          description: |
            the plaintext capability token, answered once — the deployment serves
            `/bill/{token}` for it and the database keeps only its SHA-256
        delivery:
          type: string
          enum: [sent, failed]
          nullable: true
          description: |
            present only when the mint asked for a mail: `sent` when the SMTP
            transport accepted it, `failed` when it did not — the link and token
            are still the answer, so the operator can pass the link on by hand
    CreateReportLinkRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 128
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: defaults to 30 days from now; at most 90 days out
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: |
            mail the link here at creation — the only moment the plaintext token
            exists; a deployment without a mailer refuses it
    CreateEndUserLinkRequest:
      type: object
      required: [endUser]
      properties:
        endUser:
          type: string
          minLength: 1
          maxLength: 128
          description: the downstream customer the reports are attributed to
        label:
          type: string
          maxLength: 128
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: defaults to 30 days from now; at most 90 days out
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: |
            mail the link here at creation — the only moment the plaintext token
            exists; a deployment without a mailer refuses it
    BillRow:
      type: object
      description: one transaction as the bills page lists it — every ledger entry that moved money
      required: [index, entryId, bookedOn, kind, amountMinor, description, contentHash]
      properties:
        index: { type: integer, format: int64 }
        entryId: { type: string, format: uuid }
        bookedOn: { type: string, format: date, description: "the server's UTC date the entry was written" }
        kind:
          type: string
          enum: [topUp, adjustment, settlement]
          description: "the entry's movement kind: money in, an operator's book entry, or a settled charge"
        amountMinor:
          type: integer
          format: int64
          description: "the entry's effect on the settled balance, signed: top-ups read positive, charges negative"
        description: { type: string }
        contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
    UsageDay:
      type: object
      required: [day, channel, model, turns, inputTokens, outputTokens, cachedTokens, reasoningTokens, chargedMinor]
      properties:
        day: { type: string, format: date, description: the booking date these turns settled under }
        keyId:
          type: string
          format: uuid
          description: the key that paid; absent for shared unattributed usage
        channel: { type: string }
        model: { type: string }
        turns: { type: integer, format: int64, description: settled turns the bucket sums }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cachedTokens: { type: integer, format: int64 }
        reasoningTokens: { type: integer, format: int64 }
        chargedMinor: { type: integer, format: int64 }
    BudgetSnapshot:
      type: object
      required: [organization, member, keys]
      properties:
        organization:
          type: object
          required: [availableMinor, reservedMinor]
          properties:
            availableMinor: { type: integer, format: int64 }
            reservedMinor: { type: integer, format: int64 }
            creditLimitMinor: { type: integer, format: int64, nullable: true }
            creditUsedMinor: { type: integer, format: int64, nullable: true }
            consumedPercent: { type: integer, nullable: true, description: "creditUsed/creditLimit floored to a whole percent; null with no line" }
        member:
          type: object
          nullable: true
          properties:
            budgetLimitMinor: { type: integer, format: int64 }
            committedMinor: { type: integer, format: int64 }
            consumedPercent: { type: integer, nullable: true }
        keys:
          type: array
          items:
            type: object
            required: [keyId, prefix, committedMinor]
            properties:
              keyId: { type: string, format: uuid }
              name: { type: string, nullable: true }
              prefix: { type: string }
              spendLimitMinor: { type: integer, format: int64, nullable: true }
              budgetDuration: { type: string, nullable: true, enum: [daily, weekly, monthly] }
              windowStart: { type: string, format: date, nullable: true, description: "the UTC date the current budget window began; null for a cumulative limit" }
              committedMinor: { type: integer, format: int64 }
              consumedPercent: { type: integer, nullable: true }
    BillingRecord:
      type: object
      required: [bookedOn, requestId, entryId, model, kind, inputTokens, outputTokens, chargedMinor, upstreamAttempts]
      properties:
        bookedOn: { type: string, format: date, description: the server's UTC date the settlement was written }
        requestId:
          type: string
          description: the caller's request id; the settlement entry is `req-<requestId>:settle`
        entryId:
          type: string
          format: uuid
          description: the settlement entry's own id — `GET /api/v1/entries/{entryId}/proof` answers this turn's proof bundle directly
        model: { type: string }
        status:
          type: string
          enum: [settled, errored, refused]
          description: >
            how the turn ended: `settled` covers every settled outcome including
            the anomalous kinds; `errored` marks the turns that served nothing
            after their hold (`upstream_error`, `upstream_unreachable`,
            `swept`); `refused` marks a request admission turned away before a
            hold, recorded as a marker entry so a 4xx or 429 still lands on the
            billing page
        failureReason:
          type: string
          description: >
            why the turn refused or errored, when the settlement recorded a
            reason — the caller-facing words the answer already carried; absent
            on a clean settle
        kind:
          type: string
          enum: [usage, estimated, client_cancelled, upstream_error, upstream_unreachable, capped, swept, unpriced, released, refused]
          description: how the turn was priced
        inputTokens: { type: integer, format: int64, description: tokens billed as input }
        outputTokens: { type: integer, format: int64, description: tokens billed as output }
        chargedMinor: { type: integer, format: int64 }
        upstreamAttempts:
          type: integer
          format: int64
          minimum: 0
          description: "how many upstream calls the turn made — above 1 means it failed over between channels (issue #168); a metered event never calls upstream, so it records 0"
        discountPercent:
          type: integer
          minimum: 1
          maximum: 100
          description: the discount applied between the priced sum and the cap — absent when none applied
        keyId:
          type: string
          format: uuid
          description: the key that paid; absent for an unattributed hold
    EstimatePriceRequest:
      type: object
      required: [model]
      properties:
        model: { type: string, minLength: 1, maxLength: 200 }
        mode:
          type: string
          enum: [chat, embeddings, rerank, event]
          default: chat
          description: "which billing mode's routes to price against — an `embeddings` estimate reads the model's embeddings prices, ignoring `outputTokens`; `event` prices a billableCode's declared units"
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: the input side of the shape; omit for a prompt-empty estimate
        outputTokens:
          type: integer
          format: int64
          description: the output the shape asks for; omit to estimate against the model's `maxOutputTokens` ceiling — unused by the input-only modes
        serviceTier:
          type: string
          description: the conditional-pricing dimension, as a chat completion's `service_tier`
    PricedModel:
      allOf:
        - $ref: "#/components/schemas/ModelPrice"
        - type: object
          required: [channel, protocol]
          properties:
            channel: { type: string, description: the channel the model is sold through }
            protocol:
              type: string
              description: the upstream protocol — the surface `model` answers on, `openai`, `anthropic` or `gemini`
    AdjustOrganizationRequest:
      type: object
      required: [amountMinor, reason, idempotencyKey]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: "signed minor units: positive grants, negative deducts; never zero"
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: "why the money moved — stored as the entry's description, covered by its hash"
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: a retry writes no second entry; the same key replays the same adjustment
    UpdateOrganizationRequest:
      type: object
      required: [idempotencyKey]
      properties:
        creditLimitMinor:
          type: integer
          format: int64
          minimum: 0
          description: the credit line the organization may draw, absolute — not a delta
        paymentTermsDays:
          type: integer
          format: int32
          minimum: 0
          description: days a finalized statement's payment has before it falls due — snapshotted onto each statement at finalization
        tier:
          type: string
          nullable: true
          description: the tier profile to assign — a capability package, never a pricing input; an explicit null clears it
        suspended:
          type: boolean
          description: |
            suspend the organization's spend (true) or reinstate it (false). A suspended
            organization's new holds refuse — 403 on `/v1` and `POST /api/v1/holds` alike —
            while its in-flight holds still settle and money-in still lands; suspending enqueues
            `org.suspended` to its subscribed webhook endpoints. A manual suspension is
            never the dunning sweep's to lift — reinstating here also clears any marker a
            sweep-set suspension left.
        dunningGraceDays:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            days past a finalized statement's due date before the statements job's
            dunning sweep suspends the organization's spend — an explicit null switches
            the automation off; absent leaves it alone. The sweep also marks and marks
            its own suspensions, reinstating the organization once nothing unpaid stands
            past grace (or when the grace is switched off here).
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          nullable: true
          description: |
            the fiat unit the organization displays its balances, bills and statements
            in (issue #257) — `code` plus `ratePerCredit` (a decimal literal like
            "0.0014": how much of the unit one credit renders as), plus the `decimals`
            the figure rounds to. Presentational only: the write touches no ledger and
            moves no money, so it never alters a settled bill's verified charge.
            An explicit null clears the display — the organization renders credits alone.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: a retry writes no second entry; the same key replays the same change. At least one of creditLimitMinor, paymentTermsDays, tier, suspended, dunningGraceDays and displayCurrency must be present.
    UpdateOrgDisplayRequest:
      type: object
      required: [displayCurrency]
      properties:
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          nullable: true
          description: |
            the fiat unit the organization renders in (issue #257), or null to
            render credits alone — the only field this PATCH takes; the write is
            presentational and moves no money.
    PasswordResetRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 256
          description: the replacement password; the same rule signup applies
    PasswordReset:
      type: object
      required: [userId, sessionsRevoked]
      properties:
        userId: { type: string, format: uuid, description: the account the password now belongs to }
        sessionsRevoked: { type: integer, minimum: 0, description: live sessions the reset revoked }
    AdminAdjustment:
      type: object
      required: [entryId, organizationId, amountMinor, reason, availableMinor]
      properties:
        entryId: { type: string, description: "the ledger entry's id, derived from the idempotency key" }
        organizationId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64 }
        reason: { type: string }
        availableMinor:
          type: integer
          format: int64
          description: the organization's available balance after the adjustment
    AdminCreditNote:
      type: object
      description: |
        One credit note (issue #352, decision D12): a reasoned ledger credit the
        operator issued. The entry is the fact; this is the lookup.
      required: [creditNoteId, entryId, organizationId, amountMinor, reason, createdAt]
      properties:
        creditNoteId: { type: string, format: uuid }
        entryId:
          type: string
          format: uuid
          description: the ledger entry that carries the credit (Revenue debit / Wallet credit)
        organizationId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, description: the note's reason — also the entry's description }
        createdAt: { type: string, format: date-time }
        availableMinor:
          type: integer
          format: int64
          description: the organization's available balance after the write; present on the issuance answer only
    IssueCreditNoteRequest:
      type: object
      required: [amountMinor, reason, idempotencyKey]
      additionalProperties: false
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 1 }
    AdminCreditLimit:
      type: object
      required: [organizationId, creditLimitMinor, creditUsedMinor, availableMinor, paymentTermsDays, tier, suspended, dunningGraceDays, dunningSuspendedAt, displayCurrency]
      properties:
        entryId:
          type: string
          description: "the ledger entry's id, derived from the idempotency key — absent when the limit did not move"
        organizationId: { type: string, format: uuid }
        creditLimitMinor: { type: integer, format: int64, minimum: 0 }
        creditUsedMinor: { type: integer, format: int64, minimum: 0 }
        availableMinor:
          type: integer
          format: int64
          description: the organization's spendable balance after the change, own funds plus undrawn credit
        paymentTermsDays:
          type: integer
          format: int32
          minimum: 0
          description: days a finalized statement's payment has before it falls due
        tier:
          type: string
          nullable: true
          description: the tier profile the organization is assigned to — null when it carries none
        suspended:
          type: boolean
          description: whether the organization's spend is suspended — new holds refuse, in-flight holds settle
        dunningGraceDays:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: the dunning grace configured — null when the sweep automation is off
        dunningSuspendedAt:
          type: string
          format: date-time
          nullable: true
          description: when the dunning sweep itself suspended the organization — null when the suspension standing is the operator's or none
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          nullable: true
          description: the display unit the organization renders in — null renders credits alone
    AdminOrganization:
      type: object
      required: [id, name, kind, members, createdAt, availableMinor, reservedMinor, creditLimitMinor, creditUsedMinor, suspended, displayCurrency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [personal, team] }
        members: { type: integer, format: int64, minimum: 0, description: how many people belong to the organization }
        createdAt: { type: string, format: date-time }
        availableMinor: { type: integer, format: int64, description: settled minus unsettled holds, own funds plus undrawn credit }
        reservedMinor: { type: integer, format: int64, minimum: 0, description: the sum of the organization's outstanding holds }
        creditLimitMinor: { type: integer, format: int64, minimum: 0, description: the credit limit the operator granted }
        creditUsedMinor: { type: integer, format: int64, minimum: 0, description: the drawn plus reserved part of the credit line }
        tier:
          type: string
          nullable: true
          description: the tier profile assigned — its limits and allowlist gate the organization's requests; null when none
        suspendedAt:
          type: string
          format: date-time
          nullable: true
          description: when the organization was suspended — null while its spend runs normally
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          nullable: true
          description: the display unit the organization renders in — null renders credits alone
    AdminHold:
      type: object
      required: [organization, requestId, model, channel, priceVersion, freezeMinor, openedAt]
      properties:
        organization: { type: string, description: the name of the organization whose ledger holds the freeze }
        requestId: { type: string, description: "the x-oxsum-request-id the turn was taken under" }
        model: { type: string }
        channel: { type: string }
        priceVersion: { type: integer, minimum: 1, description: the version the turn froze at }
        freezeMinor: { type: integer, format: int64, minimum: 1, description: what was frozen, in minor units }
        openedAt: { type: string, format: date-time, description: when the hold was taken }
        sweepAttempts: { type: integer, minimum: 0, description: how many sweep passes have tried to settle it }
        lastError: { type: string, nullable: true, description: "the last failed settle's error, so the operator sees what is stuck" }
        deadAt: { type: string, format: date-time, nullable: true, description: "set once the hold has failed ten sweeps — the dead-letter marker; the sweeper retries it hourly from then on" }
    TierProfile:
      type: object
      required: [name, requestsPerMinute, modelAllowlist, organizations]
      properties:
        name: { type: string, description: the package's slug — `organizations.tier` references it }
        requestsPerMinute:
          type: integer
          nullable: true
          minimum: 1
          description: one rolling-minute allowance shared by every key of the assigned organizations; null uncapped
        modelAllowlist:
          type: array
          nullable: true
          items: { type: string }
          description: the models the assigned organizations may call; null means all served models
        organizations: { type: integer, format: int64, minimum: 0, description: how many organizations are assigned the tier }
    SetTierRequest:
      type: object
      properties:
        requestsPerMinute:
          type: integer
          nullable: true
          minimum: 1
          description: the organization-wide rolling-minute allowance; absent or null uncaps
        modelAllowlist:
          type: array
          nullable: true
          items: { type: string }
          description: the models the tier may call; absent or null means all served models
    Discount:
      type: object
      required: [discountId, percent, validFrom, createdAt]
      properties:
        discountId: { type: string, format: uuid }
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: the organization the discount applies to; null is every organization
        organization:
          type: string
          nullable: true
          description: the scoped organization's name — the operator's label for the row
        model:
          type: string
          nullable: true
          description: the model the discount applies to; null is every model
        percent:
          type: integer
          minimum: 1
          maximum: 100
          description: the percent taken off the priced sum, applied before the freeze cap; 100 settles at zero
        label:
          type: string
          nullable: true
          description: why the discount exists — the operator's own words, for the audit of a bill that cites it
        validFrom: { type: string, format: date-time, description: turns starting at or after this qualify }
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: turns starting at or after this do not qualify; null does not expire
        createdAt: { type: string, format: date-time }
    CreateDiscountRequest:
      type: object
      required: [percent, idempotencyKey]
      properties:
        percent:
          type: integer
          minimum: 1
          maximum: 100
          description: the percent taken off the priced sum
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: scope the discount to one organization; absent scopes it to all
        model:
          type: string
          nullable: true
          description: scope the discount to one model; absent scopes it to all
        label:
          type: string
          maxLength: 200
          nullable: true
          description: why the discount exists — recorded for the audit
        validFrom:
          type: string
          format: date-time
          description: defaults to now
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: the end of the window; absent does not expire
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: a retry answers the row it created; the same key under different fields is 409
    SubscriptionPlan:
      type: object
      required: [planId, name, quotaMinor, resetPeriod, allowWalletOverflow, priceMinor, stripePriceId, enabled, sortOrder]
      properties:
        planId: { type: string, format: uuid }
        name: { type: string, description: "the catalog name — unique, and the PUT path's {name}" }
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: the per-period credit quota; null meters the subscription without a quota — every request draws in full
        resetPeriod:
          type: string
          enum: [daily, weekly, monthly, never]
          description: the boundary on which the period closes as `boundary` and a fresh one opens; `never` plans carry no `currentPeriodEnd` — they neither roll nor expire
        allowWalletOverflow:
          type: boolean
          description: what an exhausted quota does — `true` holds the overflow against the wallet, `false` refuses the gateway request
        priceMinor:
          type: integer
          format: int64
          minimum: 0
          description: what the plan costs per period, for display and checkout — subscription quota itself is entitlement, not ledger money
        stripePriceId:
          type: string
          nullable: true
          description: the Stripe price a subscription checkout creates sessions for; null means the plan is admin-bound only
        enabled: { type: boolean, description: a disabled plan cannot be bound or checked out }
        sortOrder:
          type: integer
          description: catalog order — a rebind to a higher `sortOrder` closes the period as `upgrade`, a lower one as `downgrade`
    SetSubscriptionPlanRequest:
      type: object
      required: [quotaMinor, resetPeriod]
      properties:
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: the per-period quota; absent or null unmeters the plan
        resetPeriod:
          type: string
          enum: [daily, weekly, monthly, never]
        allowWalletOverflow:
          type: boolean
          default: true
          description: what an exhausted quota does — overflow to the wallet, or refuse
        priceMinor:
          type: integer
          format: int64
          minimum: 0
          default: 0
        stripePriceId:
          type: string
          nullable: true
        enabled:
          type: boolean
          default: true
        sortOrder:
          type: integer
          default: 0
    OrgSubscription:
      type: object
      required: [subscriptionId, organizationId, planId, state, currentPeriodStart, currentPeriodEnd, consumedMinor, quotaMinor, allowWalletOverflow, source, stripeSubscriptionId, createdAt]
      properties:
        subscriptionId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        state:
          type: string
          enum: [active, cancelled, expired]
          description: only an `active` binding meters requests
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: the boundary the period rolls at; null for a `never` plan, which has no boundary to roll and no lapse to expire
        consumedMinor:
          type: integer
          format: int64
          minimum: 0
          description: what this period has drawn against `quotaMinor`
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: the plan quota snapshotted at bind time — a later plan change does not re-meter a running binding
        allowWalletOverflow:
          type: boolean
          description: the plan's overflow flag snapshotted at bind time
        source:
          type: string
          description: how the binding came about — `admin` for an operator bind, `stripe` for a checkout session
        stripeSubscriptionId:
          type: string
          nullable: true
          description: the Stripe subscription the `invoice.paid`/`customer.subscription.deleted` webhook events key on
        createdAt: { type: string, format: date-time }
    SubscriptionPeriod:
      type: object
      required: [periodId, subscriptionId, organizationId, periodStart, periodEnd, quotaMinor, consumedMinor, outcome, createdAt]
      properties:
        periodId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time }
        periodEnd:
          type: string
          format: date-time
          nullable: true
          description: the boundary the period was meant to roll at; null for a `never` plan
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: the quota this period ran under, snapshotted when it opened
        consumedMinor:
          type: integer
          format: int64
          minimum: 0
          description: what the period drew — settled draws only move this counter; a released share returns
        outcome:
          type: string
          enum: [open, boundary, cancelled, expired, upgrade, downgrade]
          description: "`open` while it meters; `boundary` on a rollover; `cancelled`, `expired`, `upgrade` or `downgrade` for how it ended"
        createdAt: { type: string, format: date-time }
    BindSubscriptionRequest:
      type: object
      required: [planId]
      properties:
        planId: { type: string, format: uuid }
        source:
          type: string
          default: admin
          description: the binding's provenance — `admin` for an operator bind; the Stripe checkout webhook binds with `stripe`
        stripeSubscriptionId:
          type: string
          nullable: true
          description: attaches the Stripe subscription id the webhook renewals and cancellations key on; must be unique across bindings
    SubscriptionCheckoutRequest:
      type: object
      required: [planId]
      properties:
        planId:
          type: string
          format: uuid
          description: must name an enabled plan with a `stripePriceId`
    AuditEntry:
      type: object
      required: [auditId, recordedAt, actor, action, detail]
      properties:
        auditId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
        actor:
          type: string
          description: who acted — "operator" today; the single admin token is the only admin identity
        action:
          type: string
          description: the mutating call, as a dotted name — channel.set, channel.price.append, organization.adjust, organization.update, tier.set, tier.delete, discount.create, discount.end, user.password_reset, codes.mint, closing.close, statement.generate, statement.finalize, statement.payment, statement.suspend
        target:
          type: string
          nullable: true
          description: what the action acted on — a channel name, an organization id, a statement id
        detail:
          type: object
          description: the request's fields that are safe to show — credentials (a channel's apiKey) are never recorded
        idempotencyKey:
          type: string
          nullable: true
          description: the key the request carried, when it did — the write it names replays rather than doubles
    AdminAnomaly:
      type: object
      required: [organization, requestId, model, channel, priceVersion, kind, upstreamAttempts, chargedMinor, freezeMinor, bookedOn, score, severity]
      properties:
        organization: { type: string, description: the organization whose ledger recorded the turn }
        requestId: { type: string }
        model: { type: string }
        channel: { type: string, description: the channel that served the turn }
        priceVersion: { type: integer, minimum: 1 }
        kind: { type: string, enum: [capped, estimated, client_cancelled, swept, unpriced], description: how the turn was priced; the anomalous kinds }
        upstreamAttempts:
          type: integer
          format: int64
          minimum: 0
          description: "how many upstream calls the turn made — above 1 means it failed over between channels (issue #168); a metered event records 0"
        chargedMinor: { type: integer, format: int64, minimum: 0, description: what the settlement charged, in minor units }
        freezeMinor: { type: integer, format: int64, minimum: 1, description: what had been frozen, in minor units }
        bookedOn: { type: string, format: date, description: the settlement's booking date }
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: "the anomaly's severity 0–100, derived at read time from the kind's base weighted by the charge ratio, upstream-cost divergence, failover attempts and the request's repeat-offender count (issue #263); read-only — never an input to what is charged"
        severity: { type: string, enum: [low, medium, high], description: "the band `score` falls into — low < 40, medium < 70, high ≥ 70" }
    AdminMargin:
      type: object
      required: [channel, model, turns, chargedMinor, upstreamCostMinor, marginMinor, untrackedTurns]
      properties:
        channel: { type: string }
        model: { type: string }
        turns: { type: integer, format: int64, minimum: 0, description: the settled turns the row sums }
        chargedMinor: { type: integer, format: int64, description: what the organizations were charged, in minor units }
        upstreamCostMinor: { type: integer, format: int64, description: what the channel's upstream prices made of the same usage, over the turns that track it }
        providerBilledMinor: { type: integer, format: int64, nullable: true, description: what the provider actually billed the channel, summed across every (channel, day) bill row the upstream-bill-sync pass has written — channel-scoped, so the same value repeats on each of that channel's model rows; null when the pass has never reconciled the channel }
        marginMinor: { type: integer, format: int64, description: chargedMinor minus upstreamCostMinor }
        untrackedTurns: { type: integer, format: int64, minimum: 0, description: settled turns with no upstream cost recorded — an untracked price, a swept hold, or history }
    AdminDeposit:
      type: object
      description: |
        One money-in row (issue #354): the deposit record the rail wrote, never
        the ledger entry itself — `entryId` names that once credited.
      required: [depositId, organizationId, organization, rail, paymentRef, amountMinor, status, createdAt]
      properties:
        depositId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organization: { type: string, description: the organization's display name }
        rail:
          type: string
          enum: [manual, redemption, stripe, crypto-evm, x402, airwallex, hyperswitch]
          description: the rail that carried the payment
        paymentRef: { type: string, description: "the rail's reference — an idempotency key, a charge id, a code id" }
        amountMinor: { type: integer, format: int64, minimum: 1, description: the amount the deposit was opened for }
        receivedMinor:
          type: integer
          format: int64
          nullable: true
          description: what the rail reported paid, when it differs from `amountMinor`
        status:
          type: string
          enum: [pending, confirmed, credited, reversed, expired]
          description: |
            `pending` (opened, not paid), `confirmed` (the rail says paid, the
            ledger has not credited yet), `credited` (the wallet moved, `entryId`
            names the entry), `reversed` (a refund/chargeback outcome) or
            `expired` (never paid in time)
        entryId: { type: string, format: uuid, nullable: true, description: the ledger entry that credited the wallet, once credited }
        reversalEntryId: { type: string, format: uuid, nullable: true, description: the ledger entry that reversed the credit (Wallet debited, Cash credited), once reversed }
        reversedAt: { type: string, format: date-time, nullable: true, description: when the deposit reversed }
        refundStatus:
          type: string
          enum: [pending, succeeded, failed]
          nullable: true
          description: |
            the payment-provider refund's standing, when the rail issued one
            (issue #360): `pending` while the rail works it, `succeeded` when the
            money moved, `failed` when the call was refused (the reversal stands;
            a retry re-issues it). `null` means the rail issued no refund — the
            deposit was never reversed through a rail, or the rail carries no
            refund path.
        disputedAt: { type: string, format: date-time, nullable: true, description: "when a dispute opened on the payment, when the rail reported one (issue #360)" }
        createdAt: { type: string, format: date-time }
    ReverseDepositRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, description: "why the deposit is reversed — becomes the reversal entry's description, so it is part of what a bill's proof covers" }
    ReconciliationReport:
      type: object
      required: [checkedAt, organizations, clean, classes]
      properties:
        checkedAt: { type: string, format: date-time, description: when the scan ran }
        organizations: { type: integer, format: int64, minimum: 0, description: the organizations whose ledgers were scanned }
        clean: { type: boolean, description: every class counted zero }
        classes:
          type: array
          description: every drift class, zero-count ones included, in a fixed order
          items: { $ref: "#/components/schemas/ReconciliationClass" }
    ReconciliationClass:
      type: object
      required: [class, count, samples]
      properties:
        class:
          type: string
          enum: [usage_orphans, settlements_unrecorded, deposits_unbooked, deposits_mismatched, deposits_stuck, watches_orphaned, holds_unwatched, holds_dead_lettered, log_gaps, jobs_dead, upstream_price_drift, anchored_day_altered]
        count: { type: integer, format: int64, minimum: 0, description: how much drift the class holds }
        samples:
          type: array
          description: a bounded sample of the offending identifiers, newest first
          items: { $ref: "#/components/schemas/ReconciliationSample" }
    ReconciliationSample:
      type: object
      required: [organization, detail]
      properties:
        organization: { type: string, description: the organization the drift belongs to }
        detail: { type: string, description: "the identifier an operator follows: the request id, hold key, deposit ref or gap position" }
    AdminClosing:
      type: object
      required: [organization, period, entryCount, treeSize, treeRoot, trialBalanceRoot, sealHash]
      properties:
        organization: { type: string, description: the organization whose ledger sealed the month }
        period: { type: string, description: "the sealed period, `YYYY-MM`" }
        entryCount: { type: integer, format: int64, minimum: 0, description: how many of the log's entries the period contains }
        treeSize: { type: integer, format: int64, minimum: 0, description: the log's size at the moment of sealing }
        treeRoot: { type: string, description: the log's tree head at sealing, hex — what the month committed to }
        trialBalanceRoot: { type: string, description: the Merkle root over the period's closing trial balance, hex }
        sealHash: { type: string, description: the seal's own hash, hex — it chains onto the seal before it }
    CloseMonthRequest:
      type: object
      required: [month]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", description: "the month to close, `YYYY-MM`; it must have fully ended" }
    GenerateStatementsRequest:
      type: object
      required: [period]
      properties:
        period: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", description: "the month to bill, `YYYY-MM`; it must have fully ended" }
        organizationId: { type: string, format: uuid, description: generate for this organization only; absent means every organization the period's usage covers }
    StatementTransitionRequest:
      type: object
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200, description: carried for uniformity; the transition is idempotent on its own }
    RecordStatementPaymentRequest:
      type: object
      required: [amountMinor, idempotencyKey]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1, description: the payment's amount — may not exceed what the statement still owes }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200, description: names the ledger repayment entry; a retry replays it, a different amount under it conflicts }
    Statement:
      type: object
      required: [id, organizationId, period, status, paymentStatus, totalMinor, creditDrawnMinor, paidMinor, outstandingMinor, paymentTermsDays, entryCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        period: { type: string, description: "the billed month, `YYYY-MM`" }
        status: { type: string, enum: [draft, finalized], description: draft is the operator's working copy — rebuilt on regeneration; finalized is issued and immutable }
        paymentStatus: { type: string, enum: [pending, paid, overdue, suspended], description: pending while the drawn part is unpaid; overdue once the due date has passed; suspended when the operator marks it; paid once payments cover creditDrawnMinor }
        totalMinor: { type: integer, format: int64, minimum: 0, description: the period's settled usage charges, own funds and credit alike }
        creditDrawnMinor: { type: integer, format: int64, minimum: 0, description: the part of the period's charges the credit line carried — what the statement is owed }
        paidMinor: { type: integer, format: int64, minimum: 0, description: payments allocated to the statement so far }
        outstandingMinor: { type: integer, format: int64, minimum: 0, description: creditDrawnMinor minus paidMinor — what is still owed }
        paymentTermsDays: { type: integer, format: int32, minimum: 0, description: the organization's payment terms at finalization, snapshotted }
        dueDate: { type: [string, "null"], format: date, description: when payment falls due — set at finalization }
        logFromIndex: { type: [integer, "null"], format: int64, description: the first covered ledger entry's log index — the proof window's lower bound, set at finalization }
        logToIndex: { type: [integer, "null"], format: int64, description: the last covered ledger entry's log index — the proof window's upper bound, set at finalization }
        entryCount: { type: integer, format: int64, minimum: 0, description: usage rows the statement itemizes }
        finalizedAt: { type: [string, "null"], format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        overdueAt: { type: [string, "null"], format: date-time, description: when the statement first answered past due }
        suspendedAt: { type: [string, "null"], format: date-time }
        anchorEntryId: { type: [string, "null"], format: uuid, description: "the ledger marker committing the statement's window and rollup digests — appended at finalization" }
        anchorLogIndex: { type: [integer, "null"], format: int64, description: "the anchor entry's position in the tenant log" }
        windowHash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: "digest folded in log order over the covered entries' content hashes — a truncated or reordered window no longer matches" }
        rollupHash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: "digest over the statement's canonical lines and totals" }
        createdAt: { type: string, format: date-time }
    StatementLine:
      type: object
      required: [channel, model, turns, inputTokens, outputTokens, cachedTokens, reasoningTokens, amountMinor]
      properties:
        channel: { type: string }
        model: { type: string }
        turns: { type: integer, format: int64, minimum: 0, description: settled requests the line aggregates }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cachedTokens: { type: integer, format: int64, minimum: 0 }
        reasoningTokens: { type: integer, format: int64, minimum: 0 }
        amountMinor: { type: integer, format: int64, minimum: 0, description: what the line's usage was charged }
    StatementDetail:
      type: object
      required: [statement, lines]
      properties:
        statement: { $ref: "#/components/schemas/Statement" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StatementLine" }
        anchor:
          type: object
          description: "the statement's log anchor; present once the statement is finalized — `note`, `keyName`, `publicKey` and `keyHash` only when the deployment configures OXSUM_HEAD_SIGNING_KEY"
          required: [entryId, logIndex, windowHash, rollupHash, origin]
          properties:
            entryId: { type: string, format: uuid, description: "the marker entry committing the digests" }
            logIndex: { type: integer, format: int64, description: "the marker's position in the tenant log" }
            windowHash: { type: string, pattern: "^[0-9a-f]{64}$", description: "digest folded in log order over the covered entries' content hashes" }
            rollupHash: { type: string, pattern: "^[0-9a-f]{64}$", description: "digest over the statement's canonical lines and totals" }
            origin: { type: string, description: "the ledger's origin, `oxsum/ledgers/<tenant>`" }
            note: { type: [string, "null"], description: "signed-note text over the tree head right after the anchor — the anchor's inclusion is proven by the head that follows it" }
            keyName: { type: [string, "null"], description: "the signing key's published name, present when the note is" }
            publicKey: { type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: "the operator's Ed25519 public key, lowercase hex, present when the note is" }
            keyHash: { type: [string, "null"], pattern: "^[0-9a-f]{8}$", description: "the key's short fingerprint, lowercase hex, present when the note is" }
    StatementPayment:
      type: object
      required: [statement, entryId, amountMinor]
      properties:
        statement: { $ref: "#/components/schemas/Statement" }
        entryId: { type: string, description: "the repayment's ledger entry, derived from the idempotency key" }
        amountMinor: { type: integer, format: int64, description: the payment as booked }
    StatementProof:
      type: object
      description: "the self-contained bundle `GET /api/v1/statements/{id}/proof` answers (issue #479): the statement detail plus the two inputs `verify_statement_anchor` cannot read out of the document itself — the covered entries' content hashes and the head that follows the anchor"
      required: [statement, lines, windowHashes, expectedHead, expectedOrigin]
      properties:
        statement: { $ref: "#/components/schemas/Statement" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StatementLine" }
        anchor:
          type: object
          description: "the statement's log anchor, as the detail endpoint serves it — `note`, `keyName`, `publicKey` and `keyHash` only when the deployment configures OXSUM_HEAD_SIGNING_KEY"
          required: [entryId, logIndex, windowHash, rollupHash, origin]
          properties:
            entryId: { type: string, format: uuid }
            logIndex: { type: integer, format: int64 }
            windowHash: { type: string, pattern: "^[0-9a-f]{64}$" }
            rollupHash: { type: string, pattern: "^[0-9a-f]{64}$" }
            origin: { type: string }
            note: { type: [string, "null"] }
            keyName: { type: [string, "null"] }
            publicKey: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
            keyHash: { type: [string, "null"], pattern: "^[0-9a-f]{8}$" }
        windowHashes:
          type: array
          items: { type: string, pattern: "^[0-9a-f]{64}$" }
          description: "the covered entries' content hashes in log order — the verifier folds these under `oxsum/statement-window/v1` and checks the result against `anchor.windowHash` rather than trusting the served digest"
        expectedHead:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/TreeHead" }]
          description: "the signed tree head at `anchor.logIndex + 1` — the head whose log already contains the anchor; null on a deployment that signs no heads, the same honesty `anchor.note` keeps"
        expectedOrigin: { type: string, description: "the tenant ledger origin, `oxsum/ledgers/<tenant>` — the same string `anchor.origin` and `GET /api/v1/log/head` carry" }
    AmountRequest:
      type: object
      required: [idempotencyKey, amountMinor]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, description: UTF-8 idempotency key; the server accepts at most 128 bytes }
        amountMinor: { type: integer, format: int64, minimum: 1 }
    X402TopupRequest:
      type: object
      required: [payment]
      properties:
        payment:
          type: string
          minLength: 1
          maxLength: 8192
          description: |
            base64url of the signed payment authorization. Two wires, one field —
            whichever rail is configured parses it:

            - **facilitator** (`OXSUM_X402_FACILITATOR_*` set): the V1 x402
              `PaymentPayload` — `{x402Version, scheme, network, payload:
              {signature, authorization: {from, to, value, validAfter,
              validBefore, nonce}}}` — the same blob the protocol's `X-PAYMENT`
              header carries. `authorization.nonce` anchors `payment_ref`.
            - **stand-in** (`OXSUM_X402_VERIFYING_KEY` only): the test-scheme
              `{scheme, network, asset, amountMinor, payTo, nonce, payer,
              signature}` whose Ed25519 `signature` is checked against the
              pinned key.

            A payload that is not the configured rail's wire is a 403,
            indistinguishable from an unverified one.
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: |
            The credit amount the deployment requires the payment to cover.
            Under the facilitator rail this becomes the `paymentRequirements`'s
            `maxAmountRequired` — unset, the authorization's own `value` stands
            (chain-asset atomic units, USDC's 6 decimals, map 1:1 onto credit
            minor units). The stand-in ignores it: the signed body commits the
            amount.
    SettleRequest:
      type: object
      required: [holdKey, actualMinor]
      properties:
        holdKey: { type: string, minLength: 1, maxLength: 128, description: the idempotency key of the hold this settlement releases; the hold's amount is read from the ledger, and one hold settles at most once }
        actualMinor: { type: integer, format: int64, minimum: 0, description: actual usage, must not exceed the hold's amount }
    EventUsage:
      type: object
      description: |
        A metered event's usage, in the UsageRecord's own shape: the structured
        fields are the token-metered dimensions — on an `event` price they are
        the event's units in whatever denomination the billableCode's price
        defines — plus the context slots. `eventType` names the event and is
        required; a dimension the resolved price cannot bill is refused, never
        billed at zero.
      properties:
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cachedTokens: { type: integer, format: int64, minimum: 0 }
        cacheWrite5mTokens: { type: integer, format: int64, minimum: 0 }
        cacheWrite1hTokens: { type: integer, format: int64, minimum: 0 }
        reasoningTokens: { type: integer, format: int64, minimum: 0 }
        toolCalls: { type: integer, format: int64, minimum: 0 }
        imageInputTokens: { type: integer, format: int64, minimum: 0 }
        audioInputTokens: { type: integer, format: int64, minimum: 0 }
        videoInputTokens: { type: integer, format: int64, minimum: 0 }
        imageOutputTokens: { type: integer, format: int64, minimum: 0 }
        audioOutputTokens: { type: integer, format: int64, minimum: 0 }
        serviceTier: { type: string, maxLength: 64, description: a pricing slot — rules may match on it }
        eventType: { type: string, minLength: 1, maxLength: 64, description: what kind of billable event this is — required }
        endUser: { type: string, maxLength: 128, description: the service's own end-user id, for attribution }
        tags:
          type: object
          additionalProperties: { type: string, maxLength: 64 }
          description: "cost-centre attribution; at most 10 pairs, keys and values 64 characters"
        usageDetails:
          type: object
          description: "the escape hatch — provider extras that fit no column; never reaches the ledger description"
    MeteringHoldRequest:
      type: object
      required: [idempotencyKey, organizationId, channel, billableCode, usage]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, description: "UTF-8 idempotency key; the hold entry's key is `metering:<key>:hold`" }
        organizationId: { type: string, format: uuid, description: whose wallet freezes }
        channel: { type: string, description: "the channel whose `mode: event` price version for the code applies" }
        billableCode: { type: string, minLength: 1, maxLength: 200, description: "what is being billed — the price book's model name on that channel" }
        eventId: { type: string, maxLength: 128, description: "the service's own identifier for the event, recorded as the usage row's request id; defaults to the hold key" }
        usage: { $ref: "#/components/schemas/EventUsage" }
    MeteringSettleRequest:
      type: object
      required: [organizationId, holdKey, usage]
      properties:
        organizationId: { type: string, format: uuid }
        holdKey: { type: string, minLength: 1, description: the holdKey a `holds` answer returned }
        eventId: { type: string, maxLength: 128, description: overrides the hold's eventId when the service learned a better identifier since }
        usage: { $ref: "#/components/schemas/EventUsage" }
    MeteringReleaseRequest:
      type: object
      required: [organizationId, holdKey]
      properties:
        organizationId: { type: string, format: uuid }
        holdKey: { type: string, minLength: 1 }
    MeteringSettlementRequest:
      type: object
      required: [idempotencyKey, organizationId, channel, billableCode, usage]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        organizationId: { type: string, format: uuid, description: whose wallet pays }
        channel: { type: string }
        billableCode: { type: string, minLength: 1, maxLength: 200 }
        eventId: { type: string, maxLength: 128 }
        usage: { $ref: "#/components/schemas/EventUsage" }
    MeteringHold:
      type: object
      required: [holdKey, freezeMinor, priceVersion]
      properties:
        holdKey: { type: string, description: the key `settle` and `release` name }
        freezeMinor: { type: integer, format: int64, minimum: 1, description: the frozen bound — the declared usage itemized at the pinned price }
        priceVersion: { type: integer, minimum: 1, description: the code's price version in force, pinned to the hold }
    MeteringSettlement:
      type: object
      required: [chargedMinor, kind, priceVersion]
      properties:
        chargedMinor: { type: integer, format: int64, minimum: 0, description: what the settlement charged — never more than the freeze }
        kind:
          type: string
          enum: [usage, capped, released]
          description: "`usage` when the declared usage priced inside the freeze, `capped` when it priced above and the freeze was charged, `released` when the hold was let go at zero"
        priceVersion: { type: integer, minimum: 1, description: the price version the usage priced at — the hold's pin on `settle`/`release`, the latest on a one-shot }
        settlementId: { type: string, format: uuid, description: the settlement ledger entry's id — derivable as `entry_id_for(settlement_key_for(holdKey))` }
    ServiceCredentialRequest:
      type: object
      properties:
        name: { type: string, maxLength: 80, description: "which service holds this credential — the name settlement descriptions record as the reporter" }
    ServiceCredential:
      type: object
      required: [credentialId, prefix, createdAt]
      properties:
        credentialId: { type: string, format: uuid }
        name: { type: [string, "null"], maxLength: 80 }
        prefix: { type: string, description: "the secret's leading characters, for recognizing it in a list" }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    CreatedServiceCredential:
      allOf:
        - $ref: "#/components/schemas/ServiceCredential"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "`oxs-svc-` plus 64 hex characters — answered once, never stored readable" }
    RedeemRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "the redemption code as minted, `oxr-` plus 64 hex characters" }
    RedemptionCodeBatchRequest:
      type: object
      required: [count, amountMinor]
      properties:
        count: { type: integer, minimum: 1, maximum: 1000, description: how many codes this batch mints }
        amountMinor: { type: integer, format: int64, minimum: 1, description: what each code credits }
        expiresAt: { type: [string, "null"], format: date-time, description: when the codes stop redeeming; absent means never }
    Redemption:
      allOf:
        - $ref: "#/components/schemas/Receipt"
        - type: object
          required: [amountMinor]
          properties:
            amountMinor: { type: integer, format: int64, description: what the code credited }
    RedemptionCodeBatch:
      type: object
      required: [batchId, count, amountMinor, expiresAt, codes]
      properties:
        batchId: { type: string, format: uuid, description: names the batch in deposit metadata and a future admin list }
        count: { type: integer }
        amountMinor: { type: integer, format: int64 }
        expiresAt: { type: [string, "null"], format: date-time }
        codes:
          type: array
          items: { type: string }
          description: the plaintext codes — answered once, never stored readable
    Receipt:
      type: object
      required: [entryId, contentHash, isNew]
      properties:
        entryId: { type: string, format: uuid }
        logIndex: { type: [integer, "null"], format: int64 }
        contentHash: { type: string, description: 32-byte hash, lowercase hex; keep it for verification }
        isNew: { type: boolean, description: false means an idempotent replay, nothing new was written }
    TreeHead:
      type: object
      required: [size, root]
      properties:
        size: { type: integer, format: int64, description: "tree size: number of entries in the log" }
        root: { type: string, description: 32-byte hash, lowercase hex }
    VerifyingKey:
      type: object
      required: [keyName, publicKey, keyHash]
      properties:
        keyName: { type: string, description: "the key name the operator signs under" }
        publicKey: { type: string, description: "the operator's Ed25519 verifying key, base64 of 32 bytes" }
        keyHash: { type: string, description: "the 4-byte selector this key's note signatures carry, lowercase hex" }
    SignedTreeHead:
      type: object
      required: [note, origin, keyName, publicKey, keyHash, size, root]
      properties:
        note: { type: string, description: "the complete C2SP signed-note text: body, blank line, signature lines" }
        origin: { type: string, description: "the log this head belongs to: `oxsum/ledgers/<tenant_id>`" }
        keyName: { type: string }
        publicKey: { type: string, description: "the operator's Ed25519 verifying key, base64 of 32 bytes" }
        keyHash: { type: string, description: "the 4-byte selector this key's note signatures carry, lowercase hex" }
        size: { type: integer, format: int64, description: "tree size: number of entries in the log" }
        root: { type: string, description: 32-byte hash, lowercase hex }
    SignedPriceHead:
      type: object
      required: [note, origin, channel, model, version, rowHash, keyName, publicKey, keyHash]
      properties:
        note: { type: string, description: "the complete C2SP signed-note text: body, blank line, signature lines" }
        origin: { type: string, description: "the catalog this checkpoint belongs to: `oxsum/price-catalog/<channel>`" }
        channel: { type: string, description: "the channel whose price is signed" }
        model: { type: string, description: "the model the price row prices" }
        version: { type: integer, format: int64, description: "the price version the checkpoint attests; the note's size slot carries it" }
        rowHash: { type: string, description: "hash of the canonical price row bytes, lowercase hex; the note's root carries it" }
        keyName: { type: string }
        publicKey: { type: string, description: "the operator's Ed25519 verifying key, base64 of 32 bytes" }
        keyHash: { type: string, description: "the 4-byte selector this key's note signatures carry, lowercase hex" }
    PriceLink:
      type: object
      required: [channel, model, version, row, note, keyName, publicKey, keyHash]
      description: |
        The signed link a settlement's proof bundle carries between the
        `(channel, model, priceVersion)` it records and the catalog row it priced
        under (issue #204). Self-contained: the canonical row bytes, the checkpoint
        note, and the published key, so the verifier never asks the server twice.
        `publicKey` and `keyHash` spell lowercase hex here — the encoding a verifier
        reads — unlike the base64 the endpoint response uses.
      properties:
        channel: { type: string, description: "the channel the price belongs to" }
        model: { type: string, description: "the model the price prices" }
        version: { type: integer, format: int64, description: "the price version the checkpoint attests" }
        row: { type: string, description: "the canonical JSON the checkpoint root commits to — the exact bytes hashed, hashed verbatim" }
        note: { type: string, description: "the C2SP signed-note attesting `row`'s hash under `version`" }
        keyName: { type: string, description: "the key name the operator signs under" }
        publicKey: { type: string, description: "the operator's Ed25519 verifying key, lowercase hex of 32 bytes" }
        keyHash: { type: string, description: "the 4-byte selector this key's note signatures carry, lowercase hex" }
    ConsistencyProof:
      type: object
      required: [oldSize, newSize, path]
      properties:
        oldSize: { type: integer, format: int64, description: "the tree size the proof starts at; never 0" }
        newSize: { type: integer, format: int64, description: "the tree size the proof ends at" }
        path: { type: array, items: { type: string }, description: "proof hashes, lowercase hex, in doubleentry's consistency-proof order" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, INSUFFICIENT_FUNDS, KEY_LIMIT_EXCEEDED, RATE_LIMITED, TOO_MANY_HOLDS, TOKENS_PER_MINUTE, POOL_BUSY, NOT_FOUND, CONFLICT, DAY_SEALED, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
            message: { type: string }
            details: { type: array, items: {} }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      description: |
        The fields the gateway acts on. Everything else is forwarded to upstream unchanged — temperature,
        tools, response_format, seed and the rest — which is what keeps an OpenAI SDK working here.
      properties:
        model: { type: string, description: must be a model with a configured price }
        messages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ChatMessage" }
        stream: { type: [boolean, "null"], default: false, description: "absent or null counts as false; a stream is terminated by `data: [DONE]`" }
        max_tokens: { type: [integer, "null"], format: int64, minimum: 1, description: "the output upper bound the freeze uses; absent or null means the model's configured maximum, and a value below 1 is 400" }
        max_completion_tokens: { type: [integer, "null"], format: int64, minimum: 1, description: "newer spelling of max_tokens; when both are present this one wins, and null counts as absent" }
        user: { type: [string, "null"], maxLength: 128, description: "the caller's own end-user id, recorded on the turn's usage record for attribution; never priced on and never shown to other organizations. Longer than 128 characters is 400" }
        metadata:
          type: [object, "null"]
          description: "the caller's own tags on the turn, recorded on its usage record for attribution and filtering: at most 10 key/value pairs, keys and values at most 64 characters and strings only; anything else is 400"
          additionalProperties: { type: string, maxLength: 64 }
        service_tier: { type: [string, "null"], maxLength: 64, description: "the service tier the caller asks for, recorded on the turn's usage record and forwarded upstream unchanged; no tier is priced until a channel prices one" }
      additionalProperties: true
    ChatMessage:
      type: object
      description: |
        One message, as the gateway reads it. What it does not read — `role` included — is forwarded
        upstream unchanged, and upstream is the authority on it. `content` is read, to compute the
        input bound the freeze is computed for, and only text is accepted: a part of any other type
        (an image, say) has no computable bound, so the request is refused with 400. An absent or
        null `content` is accepted too — an assistant turn that only calls a tool carries no text and
        contributes none to the bound.
      properties:
        role: { type: string, description: "sent upstream as written; the gateway accepts any role and validates none" }
        content:
          type: [string, array, "null"]
          description: "text, an array of text parts, or absent/null. Anything else — a number, an object, a part whose `type` is not `text`, or a text part without a `text` string — is 400"
          items:
            type: object
            required: [type, text]
            properties:
              type: { type: string, const: text }
              text: { type: string }
        name: { type: string }
        tool_call_id: { type: string }
      additionalProperties: true
    ChatCompletion:
      type: object
      description: |
        Upstream's response, passed through unchanged. The only field oxsum reads is `usage`; without it
        the turn settles on local estimation.
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer, format: int64 }
        model: { type: string }
        choices: { type: array, items: { type: object } }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer, format: int64 }
            completion_tokens: { type: integer, format: int64 }
            total_tokens: { type: integer, format: int64 }
      additionalProperties: true
    ResponsesRequest:
      type: object
      required: [model, input]
      description: |
        The fields the gateway acts on (issue #495). Everything else is forwarded to
        upstream unchanged — `tools`, `reasoning`, `text`, `truncation` and the
        rest — which is what keeps an OpenAI SDK working here. `store` and
        `previous_response_id` are pass-through: the response's state lives in the
        upstream's store, not in oxsum.
      properties:
        model: { type: string, description: "must be a model an openai channel serves with a configured `mode: chat` price" }
        instructions: { type: [string, "null"], description: "the system/developer prompt, counted toward the input bound" }
        input:
          description: "a string, or the items list: message items carry `content` parts, structured items are read as their serialized JSON for the bound; a media part (`input_image`, `input_file`, `input_audio`) is 400"
          oneOf:
            - { type: string }
            - type: array
              minItems: 1
              items: { $ref: "#/components/schemas/ResponsesInputItem" }
        stream: { type: [boolean, "null"], default: false, description: "absent or null counts as false; a stream ends on `response.completed`, `response.failed` or `response.incomplete`, never `[DONE]`" }
        max_output_tokens: { type: [integer, "null"], format: int64, minimum: 1, description: "the output upper bound the freeze uses; absent or null means the model's configured maximum, and a value below 1 is 400" }
        user: { type: [string, "null"], maxLength: 128, description: "the caller's own end-user id, recorded on the turn's usage record for attribution" }
        metadata:
          type: [object, "null"]
          description: "the caller's own tags on the turn: at most 10 key/value pairs, keys and values at most 64 characters and strings only"
          additionalProperties: { type: string, maxLength: 64 }
        service_tier: { type: [string, "null"], maxLength: 64, description: "the service tier the caller asks for, recorded and forwarded unchanged" }
        store: { type: [boolean, "null"], description: "forwarded unchanged — asks upstream to retain the response for a later `previous_response_id` chain" }
        previous_response_id: { type: [string, "null"], description: "forwarded unchanged — the earlier response this turn continues, in upstream's store" }
      additionalProperties: true
    ResponsesInputItem:
      type: object
      description: |
        One input item, as the gateway reads it. What it does not read — `type`,
        `role`, the call ids — is forwarded upstream unchanged. An item carrying
        `content` is read as a message: a string contributes it, an array reads
        each part (`input_text`/`output_text` contributes its `text`, a media part
        is refused 400, any other shape contributes its serialized JSON). An item
        with no `content` — a `function_call`, `function_call_output`, `reasoning`
        record — contributes its serialized JSON as the computable bound.
      properties:
        type: { type: string, description: "sent upstream as written; `message` is the conversation item, the rest are structured inputs" }
        role: { type: string }
        content:
          type: [string, array, "null"]
          description: "text or an array of content parts; a media part is 400"
          items:
            type: object
            required: [type]
            properties:
              type: { type: string }
              text: { type: string }
      additionalProperties: true
    Response:
      type: object
      description: |
        Upstream's response, passed through unchanged. The only field oxsum reads is
        `usage` (on the body, or on `response` inside a terminal stream event);
        without it the turn settles on local estimation.
      properties:
        id: { type: string }
        object: { type: string, const: response }
        model: { type: string }
        status: { type: string }
        output: { type: array, items: { type: object } }
        usage:
          type: object
          properties:
            input_tokens: { type: integer, format: int64, description: "includes the cached share in `input_tokens_details`" }
            output_tokens: { type: integer, format: int64, description: "includes the reasoning share in `output_tokens_details`" }
            total_tokens: { type: integer, format: int64 }
            input_tokens_details:
              type: object
              properties:
                cached_tokens: { type: integer, format: int64 }
            output_tokens_details:
              type: object
              properties:
                reasoning_tokens: { type: integer, format: int64 }
      additionalProperties: true
    MessagesRequest:
      type: object
      required: [model, messages]
      description: |
        The fields the gateway acts on. Everything else is forwarded to upstream unchanged —
        `temperature`, `tools`, `top_k`, `stop_sequences` and the rest — which is what keeps
        an Anthropic SDK working here.
      properties:
        model: { type: string, description: "must be a model an anthropic-protocol channel serves with a configured price" }
        messages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AnthropicMessageParam" }
        system:
          type: [string, array, "null"]
          description: "a string or an array of content blocks, counted like message content toward the input bound"
        stream: { type: [boolean, "null"], default: false, description: "absent or null counts as false; a stream ends with `message_stop`" }
        max_tokens: { type: [integer, "null"], format: int64, minimum: 1, description: "the output upper bound the freeze uses; absent or null means the model's configured maximum, and a value below 1 is 400. Upstream requires it, so the gateway always sends the bound it computed" }
        metadata:
          type: [object, "null"]
          description: "only `user_id` is read: the caller's own end-user id, recorded on the turn's usage record for attribution; everything else is forwarded unchanged"
          properties:
            user_id: { type: [string, "null"], maxLength: 128 }
          additionalProperties: true
      additionalProperties: true
    AnthropicMessageParam:
      type: object
      description: |
        One message, as the gateway reads it. What it does not read — `role` included — is
        forwarded upstream unchanged. `content` is read to compute the input bound: a string,
        or an array of blocks where a `text` block contributes its `text`, a
        `tool_use`/`tool_result`/`thinking`-style block contributes its serialized JSON, and
        a media block (`image`, `document`, `audio`, `video`) is refused 400 because it has
        no computable bound. Absent or null `content` contributes nothing.
      properties:
        role: { type: string, description: "sent upstream as written; the gateway accepts any role and validates none" }
        content:
          type: [string, array, "null"]
          description: "text or an array of content blocks; a number, an object, or a media block is 400"
          items:
            type: object
            required: [type]
            properties:
              type: { type: string }
              text: { type: string }
    AnthropicMessage:
      type: object
      description: |
        Upstream's response, passed through unchanged. The only field oxsum reads is `usage`;
        without it the turn settles on local estimation.
      properties:
        id: { type: string }
        type: { type: string, const: message }
        role: { type: string, const: assistant }
        model: { type: string }
        content: { type: array, items: { type: object } }
        stop_reason: { type: [string, "null"] }
        usage:
          type: object
          properties:
            input_tokens: { type: integer, format: int64, description: "excludes the cached counts; the billed input adds them" }
            output_tokens: { type: integer, format: int64 }
            cache_read_input_tokens: { type: integer, format: int64 }
            cache_creation_input_tokens: { type: integer, format: int64 }
            cache_creation:
              type: object
              properties:
                ephemeral_5m_input_tokens: { type: integer, format: int64 }
                ephemeral_1h_input_tokens: { type: integer, format: int64 }
      additionalProperties: true
    GeminiGenerateRequest:
      type: object
      required: [contents]
      description: |
        The fields the gateway acts on (issue #494). Everything else is forwarded to
        upstream unchanged — `tools`, `safetySettings`, `generationConfig`'s other keys
        and the rest — which is what keeps a Gemini SDK working here. The model is the
        path's `{model}` segment; a `model` field may only repeat it, never disagree.
        `stream` is refused: the action in the URL chooses streaming, not a field.
      properties:
        contents:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/GeminiContent" }
          description: "the conversation; each entry's `parts` are read for the input bound"
        systemInstruction:
          $ref: "#/components/schemas/GeminiContent"
        generationConfig:
          type: [object, "null"]
          description: "only `maxOutputTokens` is read — the output bound the freeze uses; everything else is forwarded unchanged"
          properties:
            maxOutputTokens: { type: [integer, "null"], format: int64, minimum: 1 }
          additionalProperties: true
        labels:
          type: [object, "null"]
          description: "the caller's tags on the turn, recorded on the usage record like OpenAI's `metadata` — strings only, at most 10 entries, keys and values 1-64 characters"
          additionalProperties: { type: string, maxLength: 64 }
      additionalProperties: true
    GeminiContent:
      type: object
      description: |
        One content object, as the gateway reads it. What it does not read — `role`
        included — is forwarded upstream unchanged. `parts` is read to compute the
        input bound: a `text` part contributes its text; a `functionCall`,
        `functionResponse` or `executableCode`-style part contributes its serialized
        JSON as the bound for whatever it carries; an `inlineData` or `fileData`
        part is refused 400 because it has no computable bound. Absent or null
        `parts` contributes nothing.
      properties:
        role: { type: string, description: "sent upstream as written; the gateway accepts any role and validates none" }
        parts:
          type: [array, "null"]
          items:
            type: object
            description: "a part object; `text` strings count, `inlineData`/`fileData` are refused, any other shape counts its serialized JSON"
            additionalProperties: true
    GeminiGenerateResponse:
      type: object
      description: |
        Upstream's response, passed through unchanged. The only field oxsum reads is
        `usageMetadata`; without it the turn settles on local estimation.
      properties:
        candidates: { type: array, items: { type: object } }
        usageMetadata:
          type: object
          properties:
            promptTokenCount: { type: integer, format: int64, description: "includes the cached share" }
            toolUsePromptTokenCount: { type: integer, format: int64, description: "outside promptTokenCount; the billed input adds it" }
            candidatesTokenCount: { type: integer, format: int64, description: "excludes the thinking share; the billed output adds thoughtsTokenCount" }
            thoughtsTokenCount: { type: integer, format: int64 }
            cachedContentTokenCount: { type: integer, format: int64 }
            totalTokenCount: { type: integer, format: int64 }
      additionalProperties: true
    EmbeddingsRequest:
      type: object
      required: [model, input]
      description: |
        The fields the gateway acts on. Everything else is forwarded to upstream unchanged —
        `dimensions`, `encoding_format` and the rest. `input` may be a string, an array of
        strings, an array of token ids, or an array of token-id arrays: token arrays freeze at
        their exact count, string input at the text bound. There is no output side, so `stream`
        is refused rather than ignored.
      properties:
        model: { type: string, description: "must be a model an openai channel prices with `mode: embeddings`" }
        input:
          description: "a string, an array of strings, an array of token ids, or an array of token-id arrays; anything else is 400"
          oneOf:
            - { type: string }
            - type: array
              minItems: 1
              items: { type: string }
            - type: array
              minItems: 1
              items: { type: integer, format: int64 }
            - type: array
              minItems: 1
              items:
                type: array
                minItems: 1
                items: { type: integer, format: int64 }
        stream: { type: [boolean, "null"], default: false, description: "embeddings do not stream; true is 400" }
        user: { type: [string, "null"], maxLength: 128, description: "the caller's own end-user id, recorded on the turn's usage record for attribution; never priced on. Longer than 128 characters is 400" }
        metadata:
          type: [object, "null"]
          description: "the caller's own tags on the turn, recorded on its usage record: at most 10 key/value pairs, keys and values at most 64 characters and strings only; anything else is 400"
          additionalProperties: { type: string, maxLength: 64 }
        service_tier: { type: [string, "null"], maxLength: 64, description: "the service tier the caller asks for, recorded on the turn's usage record; no tier is priced until a channel prices one" }
      additionalProperties: true
    EmbeddingsResponse:
      type: object
      description: |
        Upstream's response, passed through unchanged. The only field oxsum reads is `usage`;
        without it the turn settles `estimated` from the request's own input bound.
      properties:
        object: { type: string }
        model: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              object: { type: string }
              index: { type: integer }
              embedding: { type: array, items: { type: number } }
        usage:
          type: object
          description: "what settles the turn: `prompt_tokens` is the billed input total"
          properties:
            prompt_tokens: { type: integer, format: int64 }
            total_tokens: { type: integer, format: int64 }
      additionalProperties: true
    RerankRequest:
      type: object
      required: [model, query, documents]
      description: |
        The fields the gateway acts on, in the shape Jina and Cohere speak. Everything else —
        `top_n`, `return_documents` and the rest — is forwarded unchanged. `documents` may be
        strings or `{"text": …}` objects; their text plus `query` gives the input bound. There
        is no output side, so `stream` is refused rather than ignored.
      properties:
        model: { type: string, description: "must be a model an openai channel prices with `mode: rerank`" }
        query: { type: string, description: "what the documents are ranked against" }
        documents:
          type: array
          minItems: 1
          description: "strings or `{\"text\": …}` objects; a document of any other shape has no computable bound and is 400"
          items:
            oneOf:
              - { type: string }
              - type: object
                required: [text]
                properties:
                  text: { type: string }
                additionalProperties: true
        top_n: { type: [integer, "null"], format: int64, minimum: 1 }
        stream: { type: [boolean, "null"], default: false, description: "rerank does not stream; true is 400" }
        user: { type: [string, "null"], maxLength: 128, description: "the caller's own end-user id, recorded on the turn's usage record for attribution; never priced on. Longer than 128 characters is 400" }
        metadata:
          type: [object, "null"]
          description: "the caller's own tags on the turn, recorded on its usage record: at most 10 key/value pairs, keys and values at most 64 characters and strings only; anything else is 400"
          additionalProperties: { type: string, maxLength: 64 }
        service_tier: { type: [string, "null"], maxLength: 64, description: "the service tier the caller asks for, recorded on the turn's usage record; no tier is priced until a channel prices one" }
      additionalProperties: true
    RerankResponse:
      type: object
      description: |
        Upstream's response, passed through unchanged. The only field oxsum reads is `usage`;
        without it the turn settles `estimated` from the request's own input bound.
      properties:
        model: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              relevance_score: { type: number }
              document: { type: object }
        usage:
          type: object
          description: "what settles the turn: `total_tokens` — query and documents together — is the billed input"
          properties:
            total_tokens: { type: integer, format: int64 }
      additionalProperties: true
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            type: object
            required: [id, object, created, owned_by]
            properties:
              id: { type: string }
              object: { type: string, const: model }
              created: { type: integer, format: int64 }
              owned_by: { type: string, description: the configured channel's name }
    GatewayError:
      type: object
      required: [error]
      description: OpenAI's error object, because that is what an OpenAI SDK shows its caller.
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - rate_limit_exceeded
                - insufficient_quota
                - api_error
            param: { type: [string, "null"] }
            code:
              type: [string, "null"]
              description: >-
                oxsum's own code: VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, CONFLICT,
                INSUFFICIENT_FUNDS, KEY_LIMIT_EXCEEDED, RATE_LIMITED, TOO_MANY_HOLDS,
                TOKENS_PER_MINUTE, POOL_BUSY, IDEMPOTENCY_IN_FLIGHT, IDEMPOTENCY_MISMATCH,
                UPSTREAM_ERROR or INTERNAL_ERROR.
                A key past its spend limit arrives as 429 KEY_LIMIT_EXCEEDED with the
                `insufficient_quota` type, the same type the 402 INSUFFICIENT_FUNDS
                refusal carries; a key past its request, concurrency or settled-token
                allowance arrives as 429 with the `rate_limit_exceeded` type and the
                `Retry-After`/`X-RateLimit-*` headers. A saturated connection pool
                arrives as 429 POOL_BUSY with `Retry-After` alone — backpressure,
                not a caller quota.
    AnthropicError:
      type: object
      required: [type, error]
      description: >-
        Anthropic's error envelope, because that is what an Anthropic SDK shows its
        caller. `error.type` maps from the OpenAI spelling: `insufficient_quota` and
        `rate_limit_exceeded` become `invalid_request_error` and `rate_limit_error`;
        `error.code` still carries oxsum's own code.
      properties:
        type: { type: string, const: error }
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - rate_limit_error
                - overloaded_error
                - api_error
            code:
              type: [string, "null"]
              description: "oxsum's own code — the same list the `GatewayError` schema documents"
  responses:
    Receipt:
      description: The ledger receipt
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/Receipt" }
    Error:
      description: An error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GatewayError:
      description: An OpenAI-shaped error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GatewayError" }
    AnthropicError:
      description: An Anthropic-shaped error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnthropicError" }
