                  data: { $ref: "#/components/schemas/BusinessMutationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/collection-terms:
    get:
      operationId: getCollectionTerms
      summary: Read the operator's current collection currency and conversion
      description: Customer-readable collection policy. Personal display preferences do not change these terms. Historical orders retain their own snapshots. Current provider amounts use two decimal minor digits; a conflicting historical currency blocks new collection.
      security: [{ sessionCookie: [] }, { bearer: [] }]
      responses:
        "200":
          description: Effective persisted terms and history guard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CollectionTerms" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/business/collection-terms:
    get:
      operationId: getBusinessCollectionTerms
      summary: Read collection settings
      description: Requires current business overviewRead authority.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Effective persisted terms and history guard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CollectionTerms" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: setBusinessCollectionTerms
      summary: Set owner-authorized collection settings
      description: Requires owner-only collectionWrite. Exact unchanged retries replay their immutable receipt. Revision conflicts preserve the caller draft. Currency cannot change once a payment intent or financial history commits it; rate revisions affect new intents only. No provider request is made. Existing deployment display defaults bootstrap only once and never overwrite this saved policy.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionTermsRequest" }
      responses:
        "200":
          description: Immutable mutation result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CollectionTermsMutation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/business/registration:
    post:
      operationId: setBusinessRegistration
      summary: Select customer registration policy
      description: Owner only. Fresh and upgraded installations remain invite-only until this audited change. Password, GitHub and OIDC new-account paths enforce the saved policy in their creation transaction.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessRegistrationRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BusinessMutationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/admin/business/setup-tokens:
    post:
      summary: Authorize an expiring owner setup invitation
      description: |
        One business per deployment. Deployment authority binds a 30-minute, one-use
        setup token to the intended owner's email. The owner supplies their own session
        or creates a new account with that email. Initialization, owner membership,
        token consumption and redacted audit commit together. An initialized business
        cannot be claimed again. A token is returned only once; an identical mint retry
        returns its metadata with token null. Unknown/expired/wrong-owner tokens are 404
        before initialization; initialized businesses answer 409 on any further setup.
        The setup policy is invite-only; staff sessions and registration policy enforcement
        are a separate dependent change. No provider/payment call is made.
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessSetupTokenRequest" }
      responses:
        "200":
          description: Setup authorization or initialized business (registration includes the initial customer key)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BusinessSetupToken" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/business/setup:
    post:
      summary: Accept business ownership as the invited logged-in user
      description: |
        One business per deployment. Deployment authority binds a 30-minute, one-use
        setup token to the intended owner's email. The owner supplies their own session
        or creates a new account with that email. Initialization, owner membership,
        token consumption and redacted audit commit together. An initialized business
        cannot be claimed again. A token is returned only once; an identical mint retry
        returns its metadata with token null. Unknown/expired/wrong-owner tokens are 404
        before initialization; initialized businesses answer 409 on any further setup.
        The setup policy is invite-only; staff sessions and registration policy enforcement
        are a separate dependent change. No provider/payment call is made.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessSetupRequest" }
      responses:
        "200":
          description: Setup authorization or initialized business (registration includes the initial customer key)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BusinessSetupResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/business/setup/register:
    post:
      summary: Register the invited initial owner and initialize the business
      description: |
        One business per deployment. Deployment authority binds a 30-minute, one-use
        setup token to the intended owner's email. The owner supplies their own session
        or creates a new account with that email. Initialization, owner membership,
        token consumption and redacted audit commit together. An initialized business
        cannot be claimed again. A token is returned only once; an identical mint retry
        returns its metadata with token null. Unknown/expired/wrong-owner tokens are 404
        before initialization; initialized businesses answer 409 on any further setup.
        The setup policy is invite-only; staff sessions and registration policy enforcement
        are a separate dependent change. No provider/payment call is made.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessSetupRegistrationRequest" }
      responses:
        "200":
          description: Setup authorization or initialized business (registration includes the initial customer key)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BusinessSetupResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/business:
    get:
      summary: Read the deployment business and ownership migration receipt
      description: |
        Deployment authority only. One business is supported per deployment. Existing
        organizations remain customer billing accounts with unchanged IDs and tenant ledgers.
        Schema migration maps existing customers/channels/plans without appointing staff.
        Setup remains required until an explicitly authenticated setup appoints the owner.
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: Business profile and immutable counts captured when ownership was mapped
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BusinessOwnership" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/business/customers/{organizationId}:
    get:
      summary: Read a customer identity within the deployment business
      description: Preserves legacy organizationId and tenantId. Unknown or foreign business ownership answers 404.
      security: [{ adminToken: [] }]
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Customer profile, with no credentials
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CustomerProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels:
    get:
      summary: List the channels, with the current price version of each of their models
      description: |
        The platform admin's view. Only the last four characters of an upstream credential are ever
        returned; the credential itself is sealed at rest and never leaves the server.

        This is what is *in force*: `GET /api/v1/admin/channels/{channelName}/prices` is the history.
      security:
        - adminToken: []
      responses:
        "200":
          description: Every channel, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a channel, or replace the connection of one that exists
      description: |
        The name is the identity: posting an existing name moves that channel to a new upstream address
        or credential and leaves its prices exactly as they are. A credential is sealed with
        `OXSUM_SECRET_KEY` before it is stored.

        A deployment with no channels yet is seeded from the environment at startup instead
        (`OXSUM_UPSTREAM_BASE_URL`, `OXSUM_UPSTREAM_API_KEY`, `OXSUM_MODELS`); this endpoint is for
        everything after that.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelRequest" }
      responses:
        "200":
          description: The channel as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/prices:
    get:
      summary: Every price version of a channel, newest first
      description: |
        The history rather than the current state: a price change appends a version and never rewrites
        one, so the version a settlement names is still here to be checked, however old the bill is.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      responses:
        "200":
          description: Every version of every model of that channel, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ModelPrice" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Append a price version for one of a channel's models
      description: |
        Appends; never overwrites. The version in force when a gateway request starts is the version
        that prices that request and the one its settlement names, so a price change lands on later
        requests and leaves in-flight turns and written bills untouched.

        A model may be priced on several channels (issue #168): each row names
        one route's version and `weight`, the relative preference for leading a
        request — the first attempt is a weighted pick, the rest follow in
        descending weight when a turn fails over. Changing the weight alone is
        a price append like any other: the settlement names the version the
        route carried.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceRequest" }
      responses:
        "200":
          description: The version that was written
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PriceVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/aliases:
    get:
      summary: One channel's aliases, oldest first
      description: |
        The public names this channel serves that rename the upstream model they
        relay (issue #286). `GET /v1/models` lists them beside the direct names.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      responses:
        "200":
          description: The channel's aliases, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ModelAlias" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Claim an alias for a channel
      description: |
        Callers write `alias` on every surface the channel speaks; the gateway
        forwards `upstreamModel` instead (issue #286). An alias is a rename, not
        a routing layer — the name resolves to this one channel.

        One name answers one route set: a name already claimed as an alias on
        any channel, or spelled as a direct model name on a different channel,
        is a `409`. The alias's own price row wins over the upstream model's on
        this channel, so a public name can be priced differently; an alias with
        no price of its own bills at the upstream model's.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: The alias as claimed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ModelAlias" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/aliases/{alias}:
    delete:
      summary: Drop one of a channel's aliases
      description: |
        Aliases are mutable routing configuration, not ledger data: the delete
        is hard, and bills already written still name the alias the caller used
        (issue #286). A name that is not this channel's — unknown to it, or
        claimed by another channel — is a `404`.
      security:
        - adminToken: []
      parameters:
        - { $ref: "#/components/parameters/ChannelName" }
        - name: alias
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: the alias to drop, as callers wrote it
      responses:
        "200":
          description: The alias is gone
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/credentials:
    post:
      summary: Add one credential to a channel's pool
      description: |
        One channel carries several upstream keys (issue #444): a single
        account's 429 or quota wall fails over onto the pool's next credential
        of the *same* channel — same model, same price — before the turn has to
        leave for a differently-priced route. The key lands sealed at the pool's
        end; reorder by re-posting `apiKeys` on `POST /api/v1/admin/channels`.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey: { type: string, minLength: 1, description: "the upstream credential to add; sealed with OXSUM_SECRET_KEY, only its last four readable afterwards" }
      responses:
        "200":
          description: The credential as stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ChannelCredential" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/credentials/{credentialId}:
    patch:
      summary: Switch one credential between active and disabled
      description: |
        The operator's way of taking a key out of the pick without losing its
        record (issue #444): `disabled` keeps the credential's health state and
        can be re-enabled, which a drop does not survive. A credential that is
        not this channel's is a `404`.
      security:
        - adminToken: []
      parameters:
        - { $ref: "#/components/parameters/ChannelName" }
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: the credential to switch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: The credential's new status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Drop one credential from a channel's pool
      description: |
        Credentials are routing configuration, not ledger data: the delete is
        hard. A credential that is not this channel's is a `404`; the pool's
        last credential is a `400` — a channel with no key cannot serve, so it
        stays until the operator disables it or retires the channel.
      security:
        - adminToken: []
      parameters:
        - { $ref: "#/components/parameters/ChannelName" }
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: the credential to drop
      responses:
        "200":
          description: The credential is gone
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations:
    get:
      summary: List every organization, with its balance
      description: |
        The platform admin's view of whom the ledger holds money for: organizations, oldest
        first, with their kind, their headcount and what their wallet shows — `availableMinor`
        (settled minus unsettled holds) and `reservedMinor` (the sum of its outstanding holds).
        Balances are integer minor units, 1 credit = 1_000_000 minor, and reading one creates
        the organization's ledger if it does not exist yet, the same way the dashboard's
        overview does. The list paginates: `limit` caps a page at 100 rows, and a full page
        answers `nextCursor`, which the next call echoes back as `cursor` — opaque, never
        constructed by hand; absent means the list is done. Moving an organization's money is
        `POST /api/v1/admin/organizations/{organizationId}/adjustments`.
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: cursor
          in: query
          description: An earlier answer's `nextCursor`, echoed verbatim.
          schema: { type: string }
      responses:
        "200":
          description: One page of organizations, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [organizations]
                    properties:
                      organizations:
                        type: array
                        items: { $ref: "#/components/schemas/AdminOrganization" }
                      nextCursor:
                        type: string
                        description: The cursor the next page asks with; absent at the list's end.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/requests:
    get:
      summary: Search every organization's request log (issue #505)
      description: |
        The operator's read of the same `request_log` the member endpoint
        serves: one row per gateway request across every organization, settled
        or refused, newest first. Where a member's read is locked to their own
        organization, this one reads all of them and narrows with
        `organizationId` — the SRE query "show me every refused request on
        this channel this hour" runs here.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
          description: only this organization's requests; omit for every organization
        - name: keyId
          in: query
          schema: { type: string, format: uuid }
          description: only requests this key made
        - name: model
          in: query
          schema: { type: string }
          description: only requests that served this model
        - name: channel
          in: query
          schema: { type: string }
          description: only requests this channel served
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: rows at or after this instant
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: rows before this instant
        - name: status
          in: query
          schema: { type: string, enum: [settled, errored, refused] }
          description: only requests with this terminal status
        - name: minCharge
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: only requests charged at least this much, in minor units
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: rows per page
        - name: cursor
          in: query
          schema: { type: string }
          description: An earlier answer's `nextCursor`, echoed verbatim.
      responses:
        "200":
          description: One page of request-log rows, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/RequestLogRow" }
                      nextCursor:
                        type: string
                        description: The cursor the next page asks with; absent at the log's start.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/operations:
    get:
      summary: Every organization's durable operations (issue #601)
      description: |
        The operator's read of the same `request_operations` the member
        endpoint serves: one row per billable turn across every organization,
        newest first. Where a member's read is locked to their own
        organization, this one reads all of them and narrows with
        `organizationId` — the SRE query "show me every operation stuck
        `running` past its lease" runs here.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
          description: only this organization's operations; omit for every organization
        - name: state
          in: query
          schema:
            type: string
            enum: [created, leased, running, succeeded, failed, cancelled, timed_out]
          description: only operations in this lifecycle state
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: rows per page
        - name: cursor
          in: query
          schema: { type: string }
          description: An earlier answer's `nextCursor`, echoed verbatim.
      responses:
        "200":
          description: One page of operations, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OperationListPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/adjustments:
    post:
      summary: Adjust an organization's balance
      description: |
        Books a signed amount into the named organization's ledger, with a required
        `reason`: a positive `amountMinor` grants credits, a negative one deducts
        them. The entry is new history — an adjustment never modifies an existing
        entry, so every bill's proof stays valid. A deduction that would push the
        balance below what the wallet holds is `402 INSUFFICIENT_FUNDS`: the ledger's
        no-overdraft rule refuses it, not the route. `402` reads as the refusal it is;
        `400` answers a zero amount, an empty reason or a missing idempotency key;
        `404` an organization that does not exist. The idempotency key makes a retried
        call the same entry — the answer carries `entryId`, which `entry_id_for` derives
        from it.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustOrganizationRequest" }
      responses:
        "200":
          description: The adjustment as booked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminAdjustment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/credit-notes:
    get:
      summary: An organization's credit notes, newest first
      description: |
        Every credit note issued into this organization's wallet (issue #352,
        decision D12), newest first: the amount, the reason, the ledger entry
        that carries it, and when it was issued. A credit note moves no money
        and reverses no deposit — it is a reasoned credit beside the charges,
        not a refund.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The notes, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/AdminCreditNote" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Issue a credit note into an organization's wallet
      description: |
        Credits the wallet with a reasoned, positive amount, posting one ledger
        entry — Revenue debited, Wallet credited, the reason as the entry's
        description — so the charge it answers stays in history beside the
        credit. No money moves: this is not a refund, and no deposit is
        reversed. A retried `idempotencyKey` answers the standing note instead
        of crediting twice; zero or negative amounts are `400`, and an
        organization that does not exist is `404`.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueCreditNoteRequest" }
      responses:
        "200":
          description: The note as issued, with the balance after it
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminCreditNote" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/promo-lots:
    get:
      summary: An organization's promo lots, soonest-expiring first
      description: |
        Every promo lot granted into this organization's promo pool (issue
        #609), in the order admission draws them — soonest expiry first,
        never-expiring last. `remainingMinor` is the part new holds can still
        pin, `reservedMinor` what open holds already named. `includeClosed=true`
        keeps expired and cancelled lots in the answer; absent lists only what
        can still fund a hold.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: includeClosed
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The lots, soonest-expiring first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PromoLot" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Grant a promo lot into an organization's promo pool
      description: |
        Posts a granted lot: the `promo_lots` row and the `debit Adjustments /
        credit Promo` ledger entry commit in one transaction, so the grant
        cannot exist without the projection that names it. `idempotencyKey`
        is the lot's `sourceRef` — a retried grant answers the standing lot
        instead of posting twice, and a different body under the same key is
        `409 CONFLICT`. `expiresAt` of absent means the lot never expires;
        `amountMinor` must be positive.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantPromoLotRequest" }
      responses:
        "200":
          description: The lot as granted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PromoLot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/promo-lots/{lotId}/cancel:
    post:
      summary: Cancel a promo lot's unspent remainder
      description: |
        Burns the lot's unreserved remainder to `Equity:PromoExpiry` and closes
        it `cancelled`: the part open holds still reserve keeps its reservation
        until those holds release into the closed lot, where it burns too. The
        promo is a grant, not a liability — a refund's correction cancels it
        here, never converting it back into refundable cash (issue #609). A
        retried or repeated cancel answers the standing closed lot.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelPromoLotRequest" }
      responses:
        "200":
          description: The lot as it now stands — closed `cancelled`
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PromoLot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/promo-lots:
    get:
      summary: The organization's promo lots, soonest-expiring first
      description: |
        The member's own list of the organization's promo lots (issue #609) —
        granted credit that spends before every other pool because it is the
        money that can lapse. `includeClosed=true` keeps expired and cancelled
        lots in the answer.
      x-consumption-key-access: own-records-or-metadata
      security: [{ sessionCookie: [] }, { bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      parameters:
        - name: includeClosed
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The lots, soonest-expiring first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PromoLot" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}:
    patch:
      summary: Set an organization's billing terms — credit limit, payment terms
      description: |
        Updates the named organization's billing terms; at least one of
        `creditLimitMinor` and `paymentTermsDays` must be present — a call
        carrying neither is `400`.

        `creditLimitMinor` grants or resizes the credit line the organization
        may draw: after its bonus and purchased pools exhaust, its holds and
        settlements keep drawing down to `-creditLimitMinor` of own funds —
        borrow first, settle monthly. The grant is a ledger entry, not a flag:
        the operator's facility funds a credit-line pool that holds reserve
        against like the wallet does, and the whole draw is part of the
        verifiable history. The limit is absolute, not a delta: the entry the
        call books is the difference from the limit already committed, and
        setting the same limit again books nothing. Shrinking the line below
        what the organization already owes is `400 VALIDATION_ERROR` — the
        ledger's own no-overdraft rule on the credit-line pool refuses the
        write, and the refusal is a property of the request, not of the
        balance. `400` also answers a negative limit or a missing idempotency
        key; `404` an organization that does not exist. The idempotency key
        makes a retried call the same entry, and the answer's `entryId` is its
        name — absent when the limit did not move and nothing was written.
        Reusing the key for a different limit is `409 CONFLICT`.

        `paymentTermsDays` is how long a finalized statement's payment has
        before it is due — the count is snapshotted onto each statement at
        finalization, so changing it affects only statements finalized after.
        It is a column on the organization, not a ledger entry. `400` answers
        a negative value.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: The billing terms as they now stand
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminCreditLimit" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/subscription-plans:
    get:
      summary: List the subscription plans
      description: |
        Every plan the deployment defines, ordered by `sort_order` — the order
        that also decides whether a rebind is an `upgrade` or a `downgrade` on
        the closed period's outcome. Disabled plans are listed too; they
        cannot be bound or checked out.
      security:
        - adminToken: []
      responses:
        "200":
          description: The plans, in catalog order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionPlan" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/subscription-plans/{name}:
    put:
      summary: Create or update a subscription plan
      description: |
        Upserts the plan by `name` (the unique catalog name in the path).
        `quotaMinor` is the per-period credit quota in minor units; `null`
        (explicit or absent) makes the plan unmetered — every request draws in
        full. `resetPeriod` is `daily`, `weekly`, `monthly` or `never`: the
        boundary on which `consumedMinor` returns to zero by closing the old
        period as `boundary` and opening a fresh one — lazily on the first
        draw after the boundary, and hourly from the rollover job; `never`
        plans carry no `currentPeriodEnd` at all — they neither roll nor
        expire, and only a cancel or the rail's `deleted` event ends them.
        `allowWalletOverflow` decides what happens once the period quota is
        exhausted: `true` (the default) holds the overflow against the
        organization's wallet; `false` refuses the gateway request. Changing a
        plan does not re-meter organizations already bound to it: the
        `quotaMinor` and `allowWalletOverflow` a period runs under are
        snapshotted onto the binding and its periods at bind and rollover
        time.
      security:
        - adminToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetSubscriptionPlanRequest" }
      responses:
        "200":
          description: The plan as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SubscriptionPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/subscription:
    put:
      summary: Bind a subscription plan to an organization
      description: |
        Makes the `planId`'s plan the organization's metering subscription.
        Rebinding the same plan it already runs is a no-op that answers the
        current binding; binding a different plan closes the open period with
        `outcome` `upgrade` or `downgrade` — decided by the plans' `sort_order`
        — and opens a fresh binding whose period starts now. `source` names
        how the binding came about (`admin` by default; `stripe` when a
        checkout session completed); `stripeSubscriptionId` attaches the
        Stripe subscription the webhook's `invoice.paid` and
        `customer.subscription.deleted` events key on, and must be unique
        across bindings (409 `CONFLICT`). A plan that does not exist is `404`,
        a disabled one `400 VALIDATION_ERROR`.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindSubscriptionRequest" }
      responses:
        "200":
          description: The organization's binding as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrgSubscription" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel the organization's subscription
      description: |
        Ends the active binding: the subscription's state becomes `cancelled`,
        its open period closes with `outcome` `cancelled`, and the
        organization's next gateway request meters against the wallet alone.
        Cancelling with no active binding is `404`.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The cancelled subscription
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OrgSubscription" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/guardrail-policies:
    get:
      summary: List the configured guardrail policies
      description: |
        Every policy the gateway's pre_call/post_call hooks may evaluate
        (issue #502), ordered by name. A policy is a named rule — `keyword`,
        `pii` or `moderation` — whose `config` is its kind's own shape. The
        `moderation` kind's sealed bearer never leaves the row: the answer
        carries the rule, never the credential.
      security:
        - adminToken: []
      responses:
        "200":
          description: Every configured policy, ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GuardrailPolicy" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/guardrail-policies/{name}:
    put:
      summary: Write or replace one guardrail policy
      description: |
        `name` is the policy's address — what bindings and a key's
        `requiredPolicies` reference — matching
        `^[a-z0-9][a-z0-9._-]{0,63}$`. The kind picks the config's shape:
        `keyword` takes `{patterns: [{re, action}]}` (each `action` `flag` or
        `block`, compiled at write — a pattern the gateway could not build is
        a 400); `pii` takes `{}` (its pattern set is the impl's, not config);
        `moderation` takes `{endpoint, timeoutMs?}` — an absolute http(s) URL
        the request's texts are posted to, plus `apiKey`, the endpoint's
        bearer, sealed under the deployment's secret the way an upstream key
        is. An absent `apiKey` keeps the stored bearer, so re-writing a
        moderation policy's endpoint does not demand its key again. The write
        lands in the admin audit log.
      security:
        - adminToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardrailPolicyRequest" }
      responses:
        "200":
          description: The policy as written
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GuardrailPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a guardrail policy
      description: |
        Removes the policy; an unknown name is 404. Bindings and keys that
        named it keep the dangling name — the gateway skips what does not
        resolve rather than refuse the turn, so a retired policy's name
        unguards quietly until its references are updated. The delete lands in
        the admin audit log.
      security:
        - adminToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The policy was deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      deleted: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/guardrail-bindings:
    get:
      summary: List the guardrail bindings
      description: |
        Every scope's policy set: `channel` bindings apply to every turn the
        channel leads, `key` bindings to every key. Ordered by `(scope,
        target)`.
      security:
        - adminToken: []
      responses:
        "200":
          description: Every binding, ordered by scope and target
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GuardrailBinding" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/guardrail-bindings/{scope}/{target}:
    put:
      summary: Replace one scope's guardrail binding
      description: |
        `scope` is `channel` (target the channel's name) or `key` (target the
        key's id). `policies` is the ordered set of policy names the scope
        runs — every name must already exist as a configured policy, because a
        binding that names nothing would silently unguard the turns it claims
        to protect: the write refuses a dangling name before it lands. The
        write lands in the admin audit log.
      security:
        - adminToken: []
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, enum: [channel, key] }
        - name: target
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardrailBindingRequest" }
      responses:
        "200":
          description: The binding as written
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GuardrailBinding" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove one scope's guardrail binding
      description: |
        Removes the binding; an unknown `(scope, target)` is 404. A `PUT`
        with `policies: []` writes the same "runs nothing" — the delete exists
        so the row does not linger as configuration noise. Lands in the admin
        audit log.
      security:
        - adminToken: []
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, enum: [channel, key] }
        - name: target
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The binding was removed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      deleted: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/model-fallbacks/{model}:
    get:
      summary: Read one model's fallback chain
      description: |
        The ordered list of models a request naming `model` may serve under
        when its own channels all fail, in try order (issue #500). Empty for a
        model with no chain.
      security:
        - adminToken: []
      parameters:
        - name: model
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The model's fallback chain
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ModelFallbackChain" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace one model's fallback chain
      description: |
        `fallbacks` is the whole ordered set, replaced atomically: a request
        tries every route of `model` first, then each fallback in position
        order. Every name must resolve to a served model or a registered alias
        — a chain naming an unserved model would dead-end a request that
        already failed once, so the write refuses a 400 rather than landing a
        route that cannot serve — and `model` may not appear inside its own
        chain. `model` itself must be served. An empty `fallbacks` clears the
        chain. Lands in the admin audit log.
      security:
        - adminToken: []
      parameters:
        - name: model
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelFallbackChain" }
      responses:
        "200":
          description: The chain as written
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ModelFallbackChain" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Drop one model's fallback chain
      description: |
        Removes the chain; a model that had none is 404. The chain is routing
        configuration, not ledger data, so the delete is hard — a settled bill
        still names the model that answered. Lands in the admin audit log.
      security:
        - adminToken: []
      parameters:
        - name: model
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The chain was removed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      cleared: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/groups:
    get:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: List the current organization's request groups
      description: |
        Read-only access for organization credentials and members. Each group
        carries channelIds for writes and channels with readable channel names
        so a key owner can verify the effective access set. Groups are
        operator-managed channel restrictions. Assigning a group requires an
        owner/admin session or an ungrouped organization key. A grouped bearer
        cannot create or change keys, including clearing its own restriction.
        Groups restrict bearer access; they do not isolate trusted member sessions.
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The organization's groups
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RequestGroup" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/groups:
    get:
      summary: List an organization's request groups
      description: |
        The request groups of one organization, each with channel ids and
        readable channel identities for the channels a
        grouped key may reach (issue #508). A group is a key/channel scoping
        dimension: a key assigned to a group may only serve through its
        channels, so an operator can split traffic — "team X on the paid
        channel, team Y on the mirror" — inside one organization.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The organization's groups
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RequestGroup" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/groups/{name}:
    put:
      summary: Create or replace a group's channel set
      description: |
        `channelIds` is the whole set, replaced atomically: a grouped key may
        serve only through these channels. Every id must name a real channel —
        a group pointing at a channel that does not exist would scope keys to
        a serving that can never answer, so the write refuses a 400 rather
        than land it. An empty set denies all channels. New requests read the
        saved set; requests already admitted retain their snapshot through
        retries, fallback and cache serving. Lands in the admin audit log.
        An unknown organization is 404.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestGroupChannels" }
      responses:
        "200":
          description: The group as written
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RequestGroup" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Drop a request group
      description: |
        Removes the group; the organization having none of that name is 404.
        Returns 409 CONFLICT while any key (including a revoked key) remains
        assigned. Reassign or explicitly ungroup those keys first; deletion
        never broadens their access. Lands in the admin audit log.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The group was removed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      deleted: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/holds:
    get:
      summary: List every unsettled hold, across all organizations
      description: |
        The in-flight requests the platform is holding money for: every watched hold,
        newest first — the organization it belongs to, the request id, the model and
        channel, the price version the turn froze at, the frozen amount and when the
        hold opened. The list is the sweeper's watch table: a row whose hold already
        settled is cleaned up rather than shown, so a hold listed here is one the
        ledger still reserves.
      security:
        - adminToken: []
      responses:
        "200":
          description: Every unsettled hold, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminHold" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/anomalies:
    get:
      summary: The settled turns that did not price cleanly, across all organizations
      description: |
        Every settlement whose kind is `capped`, `estimated`, `client_cancelled`,
        `swept` or `unpriced`, newest first — the turns where usage was never reported,
        the caller left mid-stream, the upstream price ran over the freeze, the sweeper
        had to release a hold nobody settled, or the usage named a dimension the price
        book cannot bill. Each row carries `score` (0–100) and `severity` (`low`,
        `medium`, `high`) computed at read time from facts the ledger already stores —
        the kind's base weighted by the charge ratio, the upstream-cost divergence,
        failover attempts and the request id's repeat-offender count (issue #263).
        `?severity=` filters to one band and `?sort=score` orders by score descending;
        the default stays newest first. Scoring is read-only — it never changes what
        a turn charged or wrote.
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [low, medium, high] }
          description: filter to one severity band
        - name: sort
          in: query
          schema: { type: string, enum: [score, date] }
          description: "`score` orders by score descending; `date` (default) is newest first"
      security:
        - adminToken: []
      responses:
        "200":
          description: The anomalous turns, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAnomaly" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/deposits:
    get:
      summary: The newest deposits, platform-wide or for one organization
      description: |
        The money-in record (issue #354): one row per rail payment — a manual
        top-up, a redemption code, a Stripe, Airwallex or Hyperswitch charge, an
        x402 settlement — newest first, with its rail, status, the amount
        opened for, what the rail reported paid (`receivedMinor`, when it
        differs), the rail's `paymentRef`, and the ledger entry once credited.
        Read-only: nothing here confirms, credits or reverses a deposit; those
        are a webhook's or an operator action's own calls.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: narrow to one organization; an unknown id is 404
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The deposits, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminDeposit" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/deposits/{depositId}/reverse:
    post:
      summary: Reverse a credited deposit — refund through the rail when it offers one
      description: |
        Reverses one `credited` deposit (issue #356, decision D12): posts one
        ledger entry — Wallet debited, Cash credited, the reason as the entry's
        description — and flips the deposit to `reversed`, recording
        `reversalEntryId` and `reversedAt` on the row.

        One reversal per deposit ever: the entry's idempotency key is derived
        from the deposit id, so a retried call or a double-click answers the
        standing reversal instead of posting a second one — the answer is the
        already-`reversed` deposit, not a new write.

        The ledger's own no-overdraft rule refuses a reversal the wallet cannot
        cover — the customer already spent the credit — as `402
        INSUFFICIENT_FUNDS`, never a silent negative balance. A deposit that is
        not `credited` (`pending`, `confirmed`, `expired`) is `409 CONFLICT`,
        and one that does not exist is `404`. An empty reason is `400`.

        A bound `hyperswitch` deposit commits a durable refund identity beside
        its local reversal before any provider I/O. New refunds send that UUID
        as Hyperswitch's body `refund_id`; recovery reads and validates the
        same merchant/version/payment/amount/currency before a create. At most
        five leased attempts run, with 1m/2m/5m/15m delays. Repeating this
        endpoint does not bypass the lease or allocate a new refund identity.
        A successful HTTP response records a handle, not terminal payment truth;
        only an authenticated matching refund event establishes succeeded/failed.
        Transport errors, mismatched replies and exhausted attempts stay unknown
        and require reconciliation. Historical reversed deposits never receive a
        new create identity: a known handle can be read, an unbound result is
        fenced. The original metadata and local reversal remain intact.
        Other rails answer `refundStatus: null`; a local reversal never proves
        the external processor returned money.
      security:
        - adminToken: []
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseDepositRequest" }
      responses:
        "200":
          description: The deposit, now reversed, with the entry that reversed it
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminDeposit" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/margin:
    get:
      summary: What the platform charged versus what upstream cost it, per channel and model
      description: |
        Each settled gateway turn records what its channel's `upstream` prices
        made of the same usage beside what the organization was charged — the
        mutable usage row, never the bill itself. This view sums the two per
        `(channel, model)`: what the platform took in, what upstream billed it,
        the margin between, and how many turns carried no upstream cost at all —
        a price without an `upstream` block, a swept hold, history from before
        the column existed. `untrackedTurns` is the number a growing gap in the
        coverage shows up in first; it is also where upstream misbilling would
        hide if a channel were priced but not tracked. `providerBilledMinor`
        (issue #283) is what the provider actually billed the channel — the
        daily `upstream-bill-sync` pass's answer against the estimate
        `upstreamCostMinor` keeps — channel-scoped and repeated per model row,
        `null` while no bill pass has reconciled the channel.
      security:
        - adminToken: []
      responses:
        "200":
          description: The margin per channel and model
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminMargin" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/diagnostics:
    get:
      summary: Read a sanitized deployment diagnostic snapshot
      description: |
        Deployment operator token only. Read-only local configuration and one
        repeatable-read database snapshot, with a five-second query timeout and
        six-second total deadline including database pool acquisition.
        Does not call SMTP, suppliers or payment providers and does not reconcile
        or repair data. Presence/counts do not certify external connectivity.
        No names, identifiers, URLs, amounts, secrets, raw errors or payloads are
        returned. Queue counts are null when schema is absent/incompatible or
        storage is unavailable; they are never replaced with misleading zeros.
      security:
        - adminToken: []
      responses:
        "200":
          description: Sanitized diagnostic snapshot; database state may be unavailable
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OperatorDiagnostics" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/reconciliation:
    get:
      summary: The drift between the ledgers and the tables that project them
      description: |
        Scans every organization's ledger against the oxsum-owned records
        that claim to describe it and answers one entry per drift class:
        `usage_orphans` (a usage row whose settlement entry is not on the
        books), `settlements_unrecorded` (a settled turn that wrote no usage
        row), `deposits_unbooked` (a deposit marked credited whose entry is
        missing), `deposits_mismatched` (the rail paid a different amount
        than the deposit expected), `deposits_stuck` (confirmed by the rail
        but never credited or reversed), `watches_orphaned` (a hold watch
        row with no pending posting behind it), `holds_unwatched` (a pending
        hold no watch row covers — invisible to the sweeper),
        `holds_dead_lettered` (a watched hold whose sweep has failed ten
        times — it retries hourly and needs an operator), `log_gaps`
        (a ledger log whose positions are not dense), `jobs_dead` (a
        periodic job run that exhausted its attempts — platform drift, not
        any organization's) and `upstream_price_drift` (a stored upstream
        rate that no longer matches the live catalog the channel serves —
        platform drift, not any organization's) and `anchored_day_altered`
        (a day leaf that no longer folds to the map root its daily anchor
        committed — a late settlement or a hand edit rewrote a leaf the
        ledger had already fixed). Each class carries a
        count and a bounded sample of the offending identifiers. The report
        is read-only: drift is for an operator to read, never for the
        reconciler to patch.
      security:
        - adminToken: []
      responses:
        "200":
          description: The reconciliation report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReconciliationReport" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/redemption-codes:
    post:
      summary: Mint a batch of redemption codes
      description: |
        Generates `count` codes worth `amountMinor` each — every code is `oxr-` plus
        32 random bytes, and the database keeps only its SHA-256 hash, so this answer
        is the only time the codes exist in readable form. The batch shares one id
        and one optional expiry; a code without `expiresAt` never expires. Codes
        redeem through `POST /api/v1/redemptions`.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedemptionCodeBatchRequest" }
      responses:
        "200":
          description: The minted batch; the only answer that carries the codes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RedemptionCodeBatch" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/closings:
    get:
      summary: The sealed months, across all organizations
      description: |
        Every period seal the ledgers hold, newest first and per organization: the
        closing records. A seal commits to the log's tree head at sealing, the
        period's entry count and the closing trial balance, and chains onto the
        seal before it — so the list is the history of what the books committed to,
        not a copy of it.
      security:
        - adminToken: []
      responses:
        "200":
          description: The sealed periods, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminClosing" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Close a month
      description: |
        Seals the period `month` (`YYYY-MM`) in every organization's ledger: defines
        the period if the ledger does not know it, stops new postings, and appends
        the seal that is the month's closing record. From then on no entry may carry
        a booking date in that month — the engine's sealed watermark refuses it at
        seal time, which is the promise "after closing, that month accepts no new
        entries" made structural.

        Only a month that has fully ended can be closed: one that still contains the
        server's current UTC date answers `400`, as does a malformed `month`. A month
        that is already closed answers its existing record — the call is idempotent,
        and the seals table's primary key is what makes a double-close impossible
        rather than merely reported. Answers the closing record of every
        organization.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseMonthRequest" }
      responses:
        "200":
          description: The closing record of every organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminClosing" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements:
    get:
      summary: List statements across organizations
      description: |
        Every statement the platform has generated, newest period first —
        drafts and finalized alike, optionally narrowed by `period`
        (`YYYY-MM`) or `organizationId`. A pending statement whose due date
        has passed reports `overdue`, and the read is what flips it.
      security:
        - adminToken: []
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: organizationId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The statements, newest period first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Generate draft statements for a closed month
      description: |
        Builds the `YYYY-MM` statement for one organization — `organizationId`
        in the body — or for every organization the period's usage records
        cover when it is absent. Generation is idempotent per organization and
        period: a draft is rebuilt from the usage rows each time, so a late
        settlement that lands after generation is picked up by regenerating;
        a statement already finalized stands — the committed document is the
        answer, not a rebuilt draft. Only a month that has fully ended
        generates: the running month is `400`, as is a malformed `period`.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateStatementsRequest" }
      responses:
        "200":
          description: The statements the period produced, drafts and standing finals alike
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}:
    get:
      summary: One statement, with its lines
      description: |
        The statement and its itemized lines — the period's settled usage
        aggregated per channel and model. `logFromIndex`/`logToIndex` bound the
        ledger window the lines prove.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The statement and its lines
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StatementDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}/export.pdf:
    get:
      summary: A finalized statement as a PDF (admin)
      description: |
        The same rendered document the organization downloads from
        `/api/v1/statements/{statementId}/export.pdf` — the admin view, able to
        reach any organization's statement. Only `finalized` statements export;
        a draft or a missing id answers 404 — an unissued document does not
        exist to export. The body is binary `application/pdf`.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The statement as a PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}/finalize:
    post:
      summary: Finalize a draft statement
      description: |
        Locks the draft's lines and totals and issues the statement: the due
        date is set from the organization's `paymentTermsDays`, `creditDrawnMinor`
        is read from the ledger — the period's settled draws on the credit
        line, what the organization owes — and `logFromIndex`/`logToIndex` pin
        the ledger window the lines prove. Finalizing is idempotent: an
        already-final statement answers itself. A draft for a month that has
        not fully ended is `400`; a statement that is not a draft is the
        standing document, not an error.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatementTransitionRequest" }
      responses:
        "200":
          description: The finalized statement
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}/payments:
    post:
      summary: Record a payment against a statement
      description: |
        Books the payment into the organization's ledger — `debit Cash`,
        repaying the drawn credit line first, the remainder into the wallet —
        and applies it to the statement: `paidMinor` grows, and the statement
        turns `paid` once the payments cover `creditDrawnMinor`. Repayments
        settle the line's draws oldest-first, so the amount may be as large as
        the credit-line debt outstanding through the statement's period —
        earlier draws take their share even when their period was never
        billed — and never larger (`400`). A statement with nothing owed
        refuses a payment the same way. The idempotency key names the ledger
        entry, which can never book twice: a retried payment on a still-open
        statement replays the receipt; one that arrives after the statement
        paid is refused as `400`, and the same key under a different amount is
        `409`.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordStatementPaymentRequest" }
      responses:
        "200":
          description: The statement after the payment
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StatementPayment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/statements/{statementId}/suspend:
    post:
      summary: Mark a statement's payment suspended
      description: |
        Marks an unpaid finalized statement `suspended` — the standing the
        platform puts an organization in when the bill has gone unpaid past
        its grace. Only a `pending` or `overdue` statement suspends; a paid
        one and a draft are `400`. A later payment still settles it — a
        suspended statement that is paid turns `paid`.
      security:
        - adminToken: []
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatementTransitionRequest" }
      responses:
        "200":
          description: The suspended statement
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{userId}/password-reset:
    post:
      summary: Reset a user's password
      description: |
        Sets a new password for the named user and revokes every session that
        user holds, so the old credential dies with the reset — the only
        recovery path v1 has, since no email is sent. An unknown user is 404;
        the admin token already authorizes the call, so the code can say which
        of the two it was.
      security:
        - adminToken: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: The reset, with the sessions it revoked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PasswordReset" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tiers:
    get:
      summary: List the tier profiles
      description: |
        Every tier profile, name first, with the count of organizations
        assigned to it. A tier is a capability package — limits and
        allowlists the gateway enforces at admission — never a pricing
        input.
      security:
        - adminToken: []
      responses:
        "200":
          description: The tier profiles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TierProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/tiers/{tier}:
    put:
      summary: Write a tier profile
      description: |
        Creates the named tier profile, or replaces the one that exists
        under the name — the request names the whole package, so a field
        left out clears rather than keeps its old value. A `PUT` to the
        same name with the same body is the natural replay: it changes
        nothing, which is why the request carries no idempotency key.

        `requestsPerMinute` is one rolling-minute allowance shared by
        every key of every organization on the tier — counted at
        admission, refused 429 `RATE_LIMITED` — and `modelAllowlist`
        bounds the models those organizations may call; `null` means all
        models the deployment serves. `400` answers a malformed name, a
        non-positive allowance or a malformed allowlist.
      security:
        - adminToken: []
      parameters:
        - name: tier
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](-?[a-z0-9])*$'
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTierRequest" }
      responses:
        "200":
          description: The tier profile as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TierProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Retire a tier profile
      description: |
        Removes the named tier. A tier organizations are still assigned
        to refuses `409 CONFLICT` — reassign or clear them first, so a
        deleted package never silently uncaps its members.
      security:
        - adminToken: []
      parameters:
        - name: tier
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The tier is gone
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/discounts:
    get:
      summary: List the pricing discounts
      description: |
        Every discount row, newest first, ended or not — the full history,
        because a settlement snapshots only the percent and the list is
        how an operator reads back why a period billed what it did.
      security:
        - adminToken: []
      responses:
        "200":
          description: The discounts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Discount" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a pricing discount
      description: |
        Grants a discount to an organization and/or a model — both absent
        means every organization on every model — over a validity window
        (`validFrom` defaults to now, `validUntil` absent means it does
        not expire). When several rows match a turn the single most
        favorable applies; discounts never stack. `percent` is 1 to 100 —
        100 settles at zero, recorded as a discount, not as an unpriced
        anomaly.

        The settlement snapshots the percent into its description, so a
        later change here rewrites no bill. `400` answers a percent out
        of range, a window that ends before it starts, or an organization
        that does not exist. A retry with the same `idempotencyKey` and
        the same fields answers the row it created; the same key with
        different fields is `409 CONFLICT`.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDiscountRequest" }
      responses:
        "200":
          description: The discount row — the created one, or the one its idempotency key already wrote
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Discount" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/discounts/{discountId}:
    delete:
      summary: End a discount early
      description: |
        Sets the discount's `validUntil` to now: it stops applying to
        turns that start after the call, and stays in the list — the
        history a settled bill's `discountPercent` points back at.
        Deleting an already-ended or expired discount is the same answer;
        an unknown id is `404`.
      security:
        - adminToken: []
      parameters:
        - name: discountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The discount, now ended
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Discount" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/audit:
    get:
      summary: Read the admin audit log
      description: |
        Every mutating call on this surface appends one row to
        `oxsum.admin_audit`: the action (`channel.set`, `organization.adjust`,
        `tier.delete`, …), what it acted on, the request's detail with
        credentials redacted, and the idempotency key it carried. Rows are
        written only after the mutation commits, so a crash may omit one but
        the log never describes a change that did not happen. Manual receipts are
        the exception: `manual_receipt.authorized` records the immutable authority
        before crediting, so it may describe a receipt still awaiting fulfillment.
        Newest first;
        a full page answers `nextCursor`, echoed back as `cursor` — opaque,
        never constructed by hand; absent means the log is read out.
        `action` narrows to one action's rows exactly.
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: cursor
          in: query
          description: An earlier answer's `nextCursor`, echoed verbatim.
          schema: { type: string }
        - name: action
          in: query
          description: Narrow the page to one action, exactly.
          schema: { type: string }
      responses:
        "200":
          description: One page of audit rows, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [entries]
                    properties:
                      entries:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEntry" }
                      nextCursor:
                        type: string
                        description: The cursor the next page asks with; absent at the log's end.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/service-credentials:
    get:
      summary: List the metering service credentials
      description: >-
        Every service credential, newest first — metadata only: the secret exists
        once, at mint. The list answers `prefix`, `createdAt` and `revokedAt`, so a
        deployment can inspect legacy credentials. All legacy credentials are disabled at upgrade; metadata remains available for recovery audits.
      security:
        - adminToken: []
      responses:
        "200":
          description: The service credentials
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Retired global service credential issuance
      description: Returns 403 before body parsing. The current business owner must issue scoped credentials through /business/integration-credentials.
      deprecated: true
      security: [{ adminToken: [] }]
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/service-credentials/{credentialId}:
    delete:
      summary: Revoke a service credential
      description: >-
        The credential authenticates nothing from the revocation on; nothing it
        already wrote changes. Revoking an absent or already-revoked credential is
        404. The revoke lands in the admin audit log.
      security:
        - adminToken: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The revoked credential
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServiceCredential" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/models:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      summary: List the served models, in OpenAI's shape
      description: |
        Only models with a relayable price are listed: a model the gateway cannot price cannot be
        frozen, so it cannot be served — and a `mode: event` price is a billable code for
        `/api/v1/metering`, so it is omitted unless the channel uses the generic `tasks`
        protocol. Task entries identify the generic task adapter, not certified media support.
        `owned_by` is the channel that serves the model, and `created` is when the version in force
        was written. Model aliases are listed beside the direct names (issue
        #286): a caller writes the public name and the channel relays the
        upstream model it renames. Only the authenticated customer's business channels,
        tier-authorized models, key-authorized models and request-group channels appear.
        Both public alias and resolved target must be allowed; denied or unpriced aliases
        are omitted. Catalog reads never open provider credentials.
      responses:
        "200":
          description: The model list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
  /v1/chat/completions:
    post:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      summary: Chat completion, billed by freezing credit first and settling against upstream usage
      description: |
        The gateway computes the most the request could cost, freezes that much, and only then
        contacts upstream. Upstream's request always carries the output upper bound as `max_tokens`,
        and a streaming request always carries `stream_options.include_usage = true`, so upstream
        cannot return more than the freeze was computed for and its usage arrives in the final chunk.
        The request settles against that usage, capped at the freeze.

        Normal and cache-hit calls enforce current key state, model access,
        organization manual/dunning/archive restrictions, mandate validity and
        concurrent-request limits even when prepaid quota covers the complete
        charge. Plan-statement dunning restricts wallet overage only; previously
        paid quota remains usable. The quota draw, wallet-side reservation,
        durable watch and operation binding commit together before serving.
        Rejected admission reserves neither quota nor money.

        Explicit zero-priced terms are valid: the request reserves a concurrency
        slot but no wallet money or paid quota. Its settlement records a
        verifiable zero-cost receipt. The receipt's balanced metadata postings
        do not fund a wallet or recognize usage revenue. Every independently
        admitted request has its own operation, even when its body matches an
        earlier request; only an explicit Idempotency-Key replays a turn.

        Every response carries `x-oxsum-request-id`. A monetary reservation uses
        `req-<id>:hold`; settlement derives `settle:<hold-entry-id>` from that
        key. A request reserving no wallet money writes only the settlement
        receipt. The settlement's description carries the channel, the price version in
        force when the request started, the token counts and the prices that produced the charge, so a
        bill can be verified down to the arithmetic years later.

        Request content is text-only in v1: a message whose `content` is an array containing anything
        but text is refused with 400, because the input upper bound must be computable for the freeze
        promise to hold.

        A `stream: true` response ends with `data: [DONE]`. If upstream reports usage, the last frame
        before it carries the `usage` object, and that is what was billed. If the client disconnects,
        the upstream call is cancelled and the turn settles on local estimation, marked as estimated
        in the settlement description; if upstream is unreachable or answers with an error before
        emitting anything, the whole freeze is released and nothing is charged.

        An `Idempotency-Key` header makes a retried request the same turn: the first request
        claims the key, and a retry carrying it is answered from the record rather than run
        again — a completed non-streamed turn replays its stored response, a completed
        streamed turn (whose bytes cannot be replayed) answers its settled receipt, and a
        retry that lands while the first turn is still running is refused 409. The same key
        under a different request body is refused 422. A refusal that never reached the wallet
        releases the key, so retrying a corrected request is always possible; a key expires
        24 hours after it was first claimed.

        Every answer that took the hold — a completion or an upstream refusal — carries
        `x-oxsum-freeze-minor` (the reserved bound) on the response head. Customer-wide
        balances are not disclosed to consumption keys. The settled charge rides as
        `x-oxsum-charged-minor`: a header on a non-streamed answer and on a refusal that
        settled `Charge::Nothing`, and — because the head goes out before a streamed turn
        settles — an HTTP trailer on a streamed answer, announced by `Trailer`.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: >-
            Upstream's completion, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
            x-oxsum-cache: { $ref: "#/components/headers/CacheStatus" }
            Trailer: { schema: { type: string, example: "x-oxsum-charged-minor" }, description: "on a streamed answer, announces the settled charge arrives as a trailer" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletion" }
            text/event-stream:
              schema:
                type: string
                description: "OpenAI SSE frames, passed through unchanged, terminated by `data: [DONE]`"
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
  /v1/responses:
    post:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      summary: Responses turn, billed by freezing credit first and settling against upstream usage
      description: |
        The same freeze-then-settle contract as `/v1/chat/completions`, in OpenAI's
        newer Responses wire (issue #495): `input` rather than `messages`,
        `instructions` for the system prompt, `max_output_tokens` the only output
        ceiling, and `store`/`previous_response_id` forwarded for the upstream's
        stateful flow — the gateway keeps no response state, so the chain lives in
        the upstream's store, not here. The surface serves the same `openai`
        channels as `/v1/chat/completions`; upstream is called at
        `{baseUrl}/responses` with the channel credential as `Authorization: Bearer`.

        `input` is a string or the items list: a `message` item's `input_text`
        parts contribute their text to the input bound, a structured item — a
        `function_call`, `function_call_output`, `reasoning` record — contributes
        its serialized JSON, and a media part (`input_image`, `input_file`,
        `input_audio`) is refused 400 like every surface's media. The forwarded
        body always carries `max_output_tokens` set to the freeze's bound, and a
        stream carries `stream_options.include_usage = true`, because the terminal
        `response.completed` event is where the usage report rides. Errors answer
        in OpenAI's envelope, the same as `/v1/chat/completions`.

        Usage normalization follows the Responses report: `usage.input_tokens` is
        the billed input (already including `input_tokens_details.cached_tokens`)
        and `usage.output_tokens` the billed output (already including
        `output_tokens_details.reasoning_tokens`). A `stream: true` response
        relays the event stream unchanged and ends on `response.completed`,
        `response.failed` or `response.incomplete` — there is no `[DONE]` on this
        wire. The cost headers and `Idempotency-Key` contract are
        `/v1/chat/completions`'s.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsesRequest" }
      responses:
        "200":
          description: >-
            Upstream's response, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
            Trailer: { schema: { type: string, example: "x-oxsum-charged-minor" }, description: "on a streamed answer, announces the settled charge arrives as a trailer" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Response" }
            text/event-stream:
              schema:
                type: string
                description: "Responses SSE events, passed through unchanged, ending on `response.completed`"
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
  /v1/tasks:
    post:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      summary: Submit a long-running upstream task, billed by a frozen bound that settles on terminal state
      description: |
        The task relay (issue #503): a turn whose upstream work runs for
        minutes — an image render, a video generation, a batch — where neither
        side wants a socket held open. The surface serves only channels whose
        `protocol` is `tasks`; upstream is called at `{baseUrl}/tasks` with the
        channel credential as `Authorization: Bearer`. Customer tier, consumption-key
        model and group-channel restrictions apply. Public aliases and signed spend
        mandates are not supported by this generic task adapter and are refused
        before provider contact. Use a permitted direct task model.

        Submission freezes the request's declared upper bound (`maxCostMinor`,
        or the channel price's own bound when the request names none), relays
        the body upstream, records the returned task id, and answers
        `{taskId, state: "submitted"}`. The task then runs on a `poll-tasks`
        periodic pass: each pass asks `{baseUrl}/tasks/{externalTaskId}` for
        the still-open tasks, writes the reported state, and on a terminal
        state settles the hold — `succeeded` against the result's usage report
        (`usage` on the task body, itemized against the channel's price),
        `failed`/`cancelled` at zero — and enqueues `task.succeeded` or
        `task.failed` to the organization's subscribed webhook endpoints.

        `GET /v1/tasks/{taskId}` reads the row back — the caller's poll is a
        database read, not a second upstream call — and `POST
        /v1/tasks/{taskId}/cancel` asks upstream to stop the job and releases
        the hold either way (a refused upstream cancel still ends the billing
        side, since the caller said they no longer want the work).

        Usage normalization on the terminal report reads `usage.input_tokens`
        / `usage.output_tokens` when upstream reports tokens, and the
        task-shaped units — `usage.image_count`, `usage.seconds`,
        `usage.unit_count` — ride in `usage_details` for the price book's
        `event`-mode rules to itemize. A task result with no usage settles on
        the local estimate of the submission's declared cost, the same as a
        reportless chat turn. Errors answer in OpenAI's envelope, the same as
        `/v1/chat/completions`.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskSubmitRequest" }
      responses:
        "200":
          description: "The submitted task; `Idempotent-Replayed: true` marks a replayed `Idempotency-Key`"
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
  /v1/tasks/{taskId}:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      summary: Read a task's state — the caller's poll is a database read, never a second upstream call
      description: |
        The task row as the last `poll-tasks` pass (or the submit, or the
        cancel) left it: `state` is `submitted` while upstream has not been
        asked yet, `running` while the job is mid-flight, and `succeeded`,
        `failed` or `cancelled` once terminal — the terminal transition is
        also the settlement, so a terminal state means the bill is written.
        `result` carries upstream's answer body on success, `error` the
        reported failure. Only the exact consumption key that submitted the task
        may read or cancel it. Unknown, foreign-customer and sibling-key task
        IDs all return 404 without contacting upstream or changing funds.
      responses:
        "200":
          description: The task row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "404": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
  /v1/tasks/{taskId}/cancel:
    post:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      summary: Best-effort cancel — releases the hold and asks upstream to stop the job
      description: |
        Only the exact submitting key may cancel; every out-of-scope ID is 404.
        Asks upstream to cancel the external task
        (`POST {baseUrl}/tasks/{externalTaskId}/cancel`), then releases the
        hold at zero whether upstream accepted or not: the billing side ends
        because the caller said the work is no longer wanted. A task already
        terminal answers it back unchanged — cancelling a settled task is a
        no-op, not an error, since a racing poll may have finished it first.
      responses:
        "200":
          description: The task row after the cancel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "404": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
  /v1/messages:
    post:
      summary: Anthropic Messages turn, billed by freezing credit first and settling against upstream usage
      description: |
        The same freeze-then-settle contract as `/v1/chat/completions`, in Anthropic's
        request and response shapes. The surface serves only channels whose `protocol` is
        `anthropic`: a model that no anthropic channel serves is refused 400, exactly as an
        unserved model is on the OpenAI surface — there is no cross-protocol translation.
        Errors are answered in Anthropic's shape, `{"type": "error", "error": {…}}`, and
        `error.code` still carries oxsum's own code.

        The credential is the same organization API key, presented either as
        `Authorization: Bearer` or `x-api-key`. `anthropic-version` and `anthropic-beta`
        are forwarded to upstream; when no `anthropic-version` is sent, `2023-06-01` is
        sent in its place. Upstream is called at `{baseUrl}/messages` and is authenticated
        with the channel credential as `x-api-key`.

        Upstream's request always carries the output upper bound as `max_tokens`, so
        upstream cannot return more than the freeze was computed for. Usage normalization
        follows Anthropic's report: `usage.input_tokens` excludes the cached counts, so the
        billed input total is `input_tokens + cache_read_input_tokens +
        cache_creation_input_tokens`; `cache_creation.ephemeral_5m_input_tokens` and
        `ephemeral_1h_input_tokens` split the write into the two cache-write dimensions,
        and a `cache_creation_input_tokens` lump without the split counts toward the
        5-minute tier. On a stream, `message_start` carries the input side and each
        `message_delta` carries cumulative `output_tokens`; the last report wins per field.

        Content is text-computable: a `text` block contributes its `text`, a
        `tool_use`/`tool_result`/`thinking` block contributes its serialized JSON, and a
        media block (`image`, `document`, `audio`, `video`) has no computable bound and is
        refused 400. `system` accepts a string or an array of `text` blocks. Attributing a
        turn is `metadata.user_id`, which lands on the usage record's `endUser`.

        A `stream: true` response relays Anthropic's event stream unchanged and ends with
        `message_stop`. The cost headers are `x-oxsum-freeze-minor` on the head
        and `x-oxsum-charged-minor` on a non-streamed head
        or a streamed trailer. `Idempotency-Key` behaves exactly as it does on
        `/v1/chat/completions`.
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
        - name: anthropic-version
          in: header
          required: false
          schema: { type: string, default: "2023-06-01" }
          description: forwarded to upstream; `2023-06-01` is sent when absent
        - name: anthropic-beta
          in: header
          required: false
          schema: { type: string }
          description: forwarded to upstream unchanged when present
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessagesRequest" }
      responses:
        "200":
          description: >-
            Upstream's message, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
            Trailer: { schema: { type: string, example: "x-oxsum-charged-minor" }, description: "on a streamed answer, announces the settled charge arrives as a trailer" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnthropicMessage" }
            text/event-stream:
              schema:
                type: string
                description: "Anthropic SSE events, passed through unchanged, ending with `message_stop`"
        "400": { $ref: "#/components/responses/AnthropicError" }
        "401": { $ref: "#/components/responses/AnthropicError" }
        "402": { $ref: "#/components/responses/AnthropicError" }
        "403": { $ref: "#/components/responses/AnthropicError" }
        "409": { $ref: "#/components/responses/AnthropicError" }
        "422": { $ref: "#/components/responses/AnthropicError" }
        "429": { $ref: "#/components/responses/AnthropicError" }
        "500": { $ref: "#/components/responses/AnthropicError" }
        "502": { $ref: "#/components/responses/AnthropicError" }
  /v1/embeddings:
    post:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      summary: Embeddings, billed by freezing the input bound first and settling against upstream usage
      description: |
        The input-only half of the gateway (issue #170), in OpenAI's request and response
        shapes, served only by `openai` channels whose price for the model carries
        `mode: embeddings`. The turn freezes the input bound — token-array `input` counts
        exactly, string input at the usual text bound — plus the flat fee before upstream is
        contacted, and settles against `usage.prompt_tokens` afterward, capped at the freeze.

        There is no output side: `stream` is refused, and no `max_tokens` is injected into the
        forwarded body. The failover, bounded `Retry-After`, `Idempotency-Key` and
        cost-header contract is the shared pipeline's — `x-oxsum-freeze-minor` on the
        head and `x-oxsum-charged-minor` once the turn settles. Customer balance is
        never returned to a gateway caller.

        Upstream is called at `{baseUrl}/embeddings` with the channel credential as
        `Authorization: Bearer`. A response without a usage report settles `estimated`,
        priced from the request's own input bound.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingsRequest" }
      responses:
        "200":
          description: >-
            Upstream's embeddings response, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingsResponse" }
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
  /v1/rerank:
    post:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      summary: Rerank, billed by freezing the input bound first and settling against upstream usage
      description: |
        The second input-only surface (issue #170), in the shape Jina and Cohere speak:
        `query` plus a `documents` array — strings or `{"text": …}` objects — whose combined
        text gives the input bound. The turn freezes that bound plus the flat fee under a
        `mode: rerank` price and settles against `usage.total_tokens`, capped at the freeze.

        The failover, bounded `Retry-After`, `Idempotency-Key` and cost-header contract is the
        shared pipeline's, unchanged. Upstream is called at `{baseUrl}/rerank` with the
        channel credential as `Authorization: Bearer`; a response without a usage report
        settles `estimated` from the request's own input bound.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RerankRequest" }
      responses:
        "200":
          description: >-
            Upstream's rerank response, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RerankResponse" }
  /v1beta/models/{model}:generateContent:
    post:
      summary: Gemini generateContent turn, billed by freezing credit first and settling against upstream usage
      description: |
        The same freeze-then-settle contract as `/v1/chat/completions`, in Gemini's
        request and response shapes (issue #494). Two details make the surface unlike
        the other chat surfaces: the model is the path's `{model}` segment — a `model`
        body field may only repeat it, never disagree — and streaming is a separate
        action (`/v1beta/models/{model}:streamGenerateContent`), so there is no
        `stream` field on this wire; sending one is 400.

        The surface serves only channels whose `protocol` is `gemini`: a model that no
        gemini channel serves is refused 400, exactly as an unserved model is on the
        OpenAI surface — there is no cross-protocol translation. Errors answer in the
        `{"error": {…}}` object a Gemini SDK reads, with oxsum's own code kept on
        `error.code`.

        Upstream is called at `{baseUrl}/models/{model}:generateContent` with the
        channel credential sent as `x-goog-api-key`, the spelling both
        `generativelanguage.googleapis.com` and `*-aiplatform.googleapis.com` accept.
        The forwarded body's `generationConfig.maxOutputTokens` carries the freeze's
        output bound, so upstream cannot return more than was priced.

        Usage normalization follows `usageMetadata`: `promptTokenCount` already
        includes `cachedContentTokenCount`, `candidatesTokenCount` excludes
        `thoughtsTokenCount` (so the billed output adds it back), and
        `toolUsePromptTokenCount` sits outside `promptTokenCount` (so the billed input
        adds it in).

        The cost headers are the same two: `x-oxsum-freeze-minor` on the head and
        `x-oxsum-charged-minor` on a non-streamed head. Customer balance is never
        returned to a gateway caller. `Idempotency-Key` behaves exactly as it does on
        `/v1/chat/completions`.
        `labels` maps onto the turn's usage tags, like OpenAI's `metadata` — strings
        only, ten entries, 64 characters a side.
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
        - name: model
          in: path
          required: true
          schema: { type: string }
          description: "the model the turn bills under — `gemini-2.5-flash` or an alias a `gemini` channel claims; must be served with a configured price"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeminiGenerateRequest" }
      responses:
        "200":
          description: >-
            Upstream's answer, passed through unchanged — or, for a replayed
            `Idempotency-Key`, the stored response or the settled receipt, marked
            `Idempotent-Replayed: true`
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            x-oxsum-charged-minor: { $ref: "#/components/headers/ChargedMinor" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeminiGenerateResponse" }
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
  /v1beta/models/{model}:streamGenerateContent:
    post:
      summary: Gemini streamGenerateContent turn — the same contract, streamed over SSE
      description: |
        The streaming action of the Gemini surface (issue #494): everything the
        `generateContent` entry documents applies, and upstream is called at
        `{baseUrl}/models/{model}:streamGenerateContent?alt=sse` instead. The
        answer is Gemini's event stream passed through unchanged; the last event
        carries a candidate `finishReason`, and the socket close is the close —
        there is no `[DONE]` sentinel on this protocol. The settled charge still
        arrives as the `x-oxsum-charged-minor` trailer the other surfaces use.
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Mandate" }
        - name: model
          in: path
          required: true
          schema: { type: string }
          description: "the model the turn bills under, served by a `gemini` channel with a configured price"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeminiGenerateRequest" }
      responses:
        "200":
          description: Gemini's event stream, passed through unchanged, ending when upstream closes it
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
            x-oxsum-freeze-minor: { $ref: "#/components/headers/FreezeMinor" }
            Trailer: { schema: { type: string, example: "x-oxsum-charged-minor" }, description: "announces the settled charge arrives as a trailer" }
          content:
            text/event-stream:
              schema:
                type: string
                description: "Gemini SSE events, passed through unchanged; the last event carries a candidate `finishReason` and the socket close ends the stream"
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "422": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "An oxsum API key: `oxs-` followed by 32 random bytes, shown once at creation."
    adminToken:
      type: http
      scheme: bearer
      description: |
        The operator token from `OXSUM_ADMIN_TOKEN`, at least 16 characters, compared in constant time.
        It is not an API key and belongs to no organization: it is whoever deploys oxsum. A deployment
        that sets no token has no admin surface at all.
    integrationCredential:
      type: http
      scheme: bearer
      description: |
        Owner-issued oxs-int- secret with selected customer IDs or one stable application namespace, and explicit scopes.
        customersRead grants scoped customer list/detail; meteringWrite grants only
        metering for those customers. Application metering operation identity survives
        credential replacement; existing explicit grants retain credential-local replay. No gateway, personal, deployment,
        funds-crediting or staff authority. Expired/revoked/legacy credentials fail
        authentication. Explicit Authorization never falls back to cookies.
    sessionCookie:
      type: apiKey
      in: cookie
      name: oxsum_session
      description: |
        A web session from `POST /api/v1/auth/login`: `oxsess-` followed by 32 random bytes, carried
        in the `oxsum_session` cookie (`HttpOnly`, `SameSite=Lax`, `Path=/`, plus `Secure` when the
        deployment sets `OXSUM_SESSION_COOKIE_SECURE`). The database keeps only its SHA-256 hash.
        Accepted only where the operation declares `sessionCookie`; customer context and
        current membership are required for customer routes. Never accepted on `/v1` or
        `/v1beta`, where the gateway takes a consumption key only.
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: >-
        The same consumption key as `bearer`, in the spelling an Anthropic SDK sends.
        Accepted by the gateway and scoped customer reads. An explicit Authorization
        header takes precedence, even when malformed.
    googApiKeyHeader:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: >-
        The same consumption key in the spelling a Gemini SDK sends. An explicit
        Authorization or x-api-key header takes precedence, even when malformed.
  parameters:
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: the id of the user whose membership this is, as a member's `userId`
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: the id of the team this endpoint addresses, as a team's `teamId`
    ExperimentName:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
      description: the experiment's name — unique per organization
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: the experiment's own id, as an experiment's `id`
    ChannelName:
      name: channelName
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,40}$" }
      description: the channel's name, which is its identity
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: the webhook endpoint's id
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255 }
      description: >-
        makes a retried request the same turn: the same key under the same request body
        replays the first response, under a different body it is refused 422, and while the
        first turn is still running it is refused 409
    Mandate:
      name: X-Oxsum-Mandate
      in: header
      required: false
      schema: { type: string }
      description: >-
        a signed spend mandate (issue #262): base64url of the canonical-JSON body plus its
        Ed25519 signature, minted by `POST /api/v1/org/keys/{keyId}/mandates`. Presented on
        `/v1/*`, it binds the request inside the mandate's
        `capMinor`, `models` and validity window — a refusal reads `invalid_mandate`,
        `mandate_expired` or `mandate_exceeded`, distinct from the key's own limits
  headers:
    RequestId:
      description: "the id the ledger entries are keyed by: `req-<id>:hold` and `req-<id>:settle`"
      schema: { type: string }
    FreezeMinor:
      description: "minor units this request froze — the most it can cost"
      schema: { type: integer }
    BalanceMinor:
      description: "Retired in 0.105.0: consumption credentials do not disclose the customer's balance. This header is omitted."
      deprecated: true
      schema: { type: integer }
    ChargedMinor:
      description: "minor units the settled turn actually charged — a header on non-streamed answers and post-hold refusals, a trailer on streamed ones"
      schema: { type: integer }
    CacheStatus:
      description: "`hit` when the semantic cache answered instead of upstream (issue #497): the stored body re-served, billed at the cache-read rate, the settlement's v10 `cache` block naming the original turn's entry. Absent on a miss, a stream, or a channel that never opted in."
      schema: { type: string, enum: [hit] }
  schemas:
    OperatorDiagnostics:
      type: object
      additionalProperties: false
      required: [version, gitSha, schemaVersion, databaseState, appliedSchemaVersion, configuration, counts]
      properties:
        version: { type: string, description: Built package version. }
        gitSha: { type: string, description: Built source revision or unknown. }
        schemaVersion: { type: string, description: Schema required by this binary. }
        databaseState: { type: string, enum: [ready, schemaMismatch, unmigrated, unavailable] }
        appliedSchemaVersion: { type: [string, "null"], description: Sanitized applied migration version when readable. }
        configuration:
          type: object
          additionalProperties: false
          required: [smtpConfigured, publicUrlConfigured, credentialSealConfigured, headSigningConfigured, stripeConfigured, airwallexConfigured, hyperswitchConfigured, x402Configured]
          properties:
            smtpConfigured: { type: boolean }
            publicUrlConfigured: { type: boolean }
            credentialSealConfigured: { type: boolean }
            headSigningConfigured: { type: boolean }
            stripeConfigured: { type: boolean }
            airwallexConfigured: { type: boolean }
            hyperswitchConfigured: { type: boolean }
            x402Configured: { type: boolean }
        counts:
          oneOf:
            - { $ref: "#/components/schemas/OperatorDiagnosticCounts" }
            - { type: "null" }
    OperatorDiagnosticCounts:
      type: object
      additionalProperties: false
      required: [providerChannels, providerCredentialsActive, providerCredentialsCooling, providerCredentialsDisabled, merchantsEnabled, merchantsDisabled, jobsScheduled, jobsDue, jobsRunning, jobClaimsExpired, jobsDead, operationsOpen, operationLeasesExpired, holdsOpen, holdsDead, paidOrdersUnfulfilled, paymentOrdersNeedAttention, merchantEventsPending, merchantEventsAccepted, refundsRetryDue, refundsNeedReview, legacyRefundsRetryDue, legacyRefundsNeedReview]
      properties:
        providerChannels: { type: integer, format: int64, minimum: 0, description: "Configured provider channel rows; not an external reachability claim." }
        providerCredentialsActive: { type: integer, format: int64, minimum: 0, description: "Credentials enabled and outside cooldown at snapshot time." }
        providerCredentialsCooling: { type: integer, format: int64, minimum: 0, description: "Enabled credentials whose cooldown is in the future." }
        providerCredentialsDisabled: { type: integer, format: int64, minimum: 0, description: "Explicitly disabled credentials." }
        merchantsEnabled: { type: integer, format: int64, minimum: 0, description: "Enabled merchant accounts across test/live modes." }
        merchantsDisabled: { type: integer, format: int64, minimum: 0, description: "Disabled merchant accounts." }
        jobsScheduled: { type: integer, format: int64, minimum: 0, description: "Pending jobs scheduled strictly after snapshot time." }
        jobsDue: { type: integer, format: int64, minimum: 0, description: "Pending jobs at or before snapshot time." }
        jobsRunning: { type: integer, format: int64, minimum: 0, description: "Jobs with running status, including expired claims." }
        jobClaimsExpired: { type: integer, format: int64, minimum: 0, description: "Running jobs with null claim time or at least the five-minute claim lease elapsed." }
        jobsDead: { type: integer, format: int64, minimum: 0, description: "Retained dead job rows; history count, not necessarily current outage." }
        operationsOpen: { type: integer, format: int64, minimum: 0, description: "Request operations in created, leased or running state." }
        operationLeasesExpired: { type: integer, format: int64, minimum: 0, description: "Gateway sweeper candidates: non-metering leased/running operations with expired leases, or created operations older than the gateway lease duration. Fresh admissions and metering are excluded." }
        holdsOpen: { type: integer, format: int64, minimum: 0, description: "Open hold watch rows; no ledger scan is performed." }
        holdsDead: { type: integer, format: int64, minimum: 0, description: "Open hold watch rows marked dead for hourly retry/operator review." }
        paidOrdersUnfulfilled: { type: integer, format: int64, minimum: 0, description: "Orders in paid status awaiting fulfillment." }
        paymentOrdersNeedAttention: { type: integer, format: int64, minimum: 0, description: "Orders in needs_attention status." }
        merchantEventsPending: { type: integer, format: int64, minimum: 0, description: "Inbox events in pending state." }
        merchantEventsAccepted: { type: integer, format: int64, minimum: 0, description: "Accepted inbox events awaiting application." }
        refundsRetryDue: { type: integer, format: int64, minimum: 0, description: "Provider-pending refunds whose next retry is due." }
        refundsNeedReview: { type: integer, format: int64, minimum: 0, description: "Provider-pending refunds with no next retry." }
        legacyRefundsRetryDue: { type: integer, format: int64, minimum: 0, description: "Unknown/pending legacy deposit refunds whose next attempt is due." }
        legacyRefundsNeedReview: { type: integer, format: int64, minimum: 0, description: "Unknown/pending legacy deposit refunds with no next attempt." }
    Branding:
      type: object
      additionalProperties: false
      required: [name, logoUrl, accentColor, contactEmail, helpUrl]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Effective public seller name; saved profile, setup name, or deployment default in that order.
        logoUrl:
          type: [string, "null"]
          maxLength: 2048
          description: Optional absolute HTTP(S) image URL without user info or control characters; null clears a saved override.
        accentColor:
          type: [string, "null"]
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Optional accent color as #rrggbb; null retains the standard palette.
        contactEmail:
          type: [string, "null"]
          format: email
          maxLength: 320
          description: Public customer support address, not a secret or an outbound mail configuration.
        helpUrl:
          type: [string, "null"]
          maxLength: 2048
          description: Public help link; absolute HTTP(S) without user info or control characters.
    BusinessReadinessStep:
      type: object
      additionalProperties: false
