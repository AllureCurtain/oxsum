    CustomerBilling:
      type: object
      description: "a granted customer's current balance plus a window of the ledger entries that moved money — the service-facing mirror of the customer `balance` and `bills` surfaces"
      required: [balance, bills]
      properties:
        balance:
          type: object
          required: [availableMinor, creditLimitMinor, creditUsedMinor, reservedMinor, spentThisMonthMinor]
          properties:
            availableMinor: { type: integer, format: int64, description: "everything the organization can still reserve: own funds plus the undrawn credit line" }
            creditLimitMinor: { type: integer, format: int64, minimum: 0, description: "the credit facility the operator granted — 0 without one" }
            creditUsedMinor: { type: integer, format: int64, minimum: 0, description: "the drawn plus reserved part of the credit line" }
            reservedMinor: { type: integer, format: int64, minimum: 0, description: "what outstanding holds freeze right now" }
            spentThisMonthMinor: { type: integer, format: int64, minimum: 0, description: "what this UTC calendar month has settled so far" }
        bills:
          type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: "#/components/schemas/BillRow" }
            nextCursor:
              type: integer
              format: int64
              description: present while an older page exists
    BusinessRole:
      type: string
      enum: [owner, admin, finance, support, viewer]
    BusinessCapability:
      type: string
      enum: [overviewRead, customersRead, customersWrite, customersSuspend, requestsRead, catalogWrite, routingWrite, providerSecretsWrite, commercialWrite, fundsWrite, refundsWrite, reportsRead, merchantSecretsWrite, staffManage, ownershipTransfer, registrationWrite, integrationsManage, profileWrite, collectionWrite]
    BusinessPrincipal:
      type: object
      required: [businessId, userId, role, capabilities]
      properties:
        businessId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/BusinessRole" }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/BusinessCapability" }
    SessionContextInfo:
      type: object
      required: [context, user, organizationId, business]
      properties:
        context: { type: string, enum: [customer, business] }
        user: { $ref: "#/components/schemas/User" }
        organizationId: { type: [string, "null"], format: uuid, description: Null in business context or when the user has no remaining customer membership. }
        business:
          oneOf:
            - $ref: "#/components/schemas/BusinessPrincipal"
            - type: "null"
          description: >-
            The session's staff principal — the role and capability set the membership
            carries whenever the user is staff, in either context. `context` names which
            authority the session currently acts under: a `customer` answer carrying a
            non-null `business` means staff authority is claimable via `POST
            /session/context`, never that it is selected (every `/business/*` call still
            requires `context: business`); null means the user holds no staff seat.
    SessionContextRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, context]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        context: { type: string, enum: [customer, business] }
        organizationId: { type: [string, "null"], format: uuid, description: Customer membership to select; omitted retains the existing customer selection. Forbidden for business context. }
