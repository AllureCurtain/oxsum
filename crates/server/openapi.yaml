        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/topups:
    post:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Retired customer manual top-up
      deprecated: true
      description: |
        Always refuses authenticated customer credentials with 403. Customers may initiate
        a configured payment checkout or redeem an issued code, but cannot assert money arrived.
        Deployment-authorized out-of-band receipts use the admin manual-receipts endpoint.
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/manual-receipts:
    post:
      summary: Record verified out-of-band money received
      description: |
        Deployment authority only. Requires a unique payment reference and reason.
        The immutable authorization and audit commit before crediting; repeating the same
        request recovers interrupted fulfillment without crediting twice. Changed terms conflict.
        Reference uniqueness is deployment-wide; idempotency keys are customer-scoped.
        Amounts are credits in integer minor units, not a fiat conversion assertion.
        Promotional grants use adjustments instead. Repays existing credit debt before adding
        purchased funds. New business currency/conversion payment orders arrive separately.
      security: [{ adminToken: [] }]
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey, amountMinor, reference, reason]
              properties:
                idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
                amountMinor: { type: integer, format: int64, minimum: 1 }
                reference: { type: string, minLength: 1, maxLength: 200 }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/topups/stripe:
    post:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Open a Stripe checkout to top up
      description: |
        The `stripe` deposit rail: opens a `pending` deposit (`payment_ref` =
        the `idempotencyKey`), asks Stripe for a checkout session and answers
        the redirect URL. A replayed intent (same `idempotencyKey`) answers the
        same checkout URL — the deposit's unique constraint is the idempotency
        anchor, not a lookup. A deployment without `OXSUM_STRIPE_*` answers
        503: the rail is configured or it is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The checkout URL and the deposit id it credits
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [checkoutUrl, depositId]
                    properties:
                      checkoutUrl: { type: string, format: uri, description: "the hosted-payment-page URL the browser follows" }
                      depositId: { type: string, format: uuid, description: "the pending deposit this session confirms" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/topups/airwallex:
    post:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Open an Airwallex payment page to top up
      description: |
        The `airwallex` deposit rail (issue #285): opens a `pending` deposit
        (`payment_ref` = the `idempotencyKey`), asks Airwallex for a
        PaymentIntent and answers the hosted-page URL the payer's browser
        follows plus the `clientSecret` the SDK confirms against. A replayed
        intent (same `idempotencyKey`) answers the same URL and secret — the
        deposit's unique constraint is the idempotency anchor, not a lookup. A
        deployment without `OXSUM_AIRWALLEX_*` answers 503: the rail is
        configured or it is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The hosted-page URL, the intent identity and the deposit it credits
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [checkoutUrl, intentId, depositId]
                    properties:
                      checkoutUrl: { type: string, format: uri, description: "the hosted-payment-page URL the browser follows" }
                      intentId: { type: string, description: "the PaymentIntent id the webhook names" }
                      clientSecret: { type: string, description: "the secret the hosted page's SDK confirms against" }
                      depositId: { type: string, format: uuid, description: "the pending deposit this intent confirms" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/topups/x402:
    post:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Credit a signed x402 payment authorization
      description: |
        The `x402` deposit rail (issues #264, #282): the caller presents a
        signed payment authorization (`payment`, base64url) and the rail
        verifies it, settles it, and books the deposit through the same
        pending → confirmed → credited walk every rail shares —
        `payment_ref` carries the signed `nonce`, so a replayed authorization
        credits once (and settles once: the deposit row's `FOR UPDATE` claim
        serializes a same-nonce race behind the winner's on-chain settle).

        Two verifier configurations:

        - **Facilitator-delegated** (issue #282): `OXSUM_X402_FACILITATOR_URL` +
          `OXSUM_X402_NETWORK` + `OXSUM_X402_ASSET` + `OXSUM_X402_PAY_TO` —
          verify and settle delegate to an x402-rs facilitator sidecar over
          its V1 HTTP API, and the settle answer's chain transaction hash lands
          on the deposit's `facilitator_tx_hash`. This is the real rail:
          EIP-3009 signatures, real wallet authorizations, real finality.
        - **Ed25519 stand-in** (issue #264): `OXSUM_X402_VERIFYING_KEY` alone
          keeps the test scheme (`scheme: "exact"`, `network: "oxsum-ed25519"`,
          `asset: "OXSUM-CREDIT"`) — no chain, for tests and for deployments
          exercising the bookkeeping without a payment network. A deployment
          with neither answers 503: the rail is configured or it is not.

        Whichever rail serves, a payload that fails its wire's parse is the
        same 403 an unverified signature earns.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/X402TopupRequest" }
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/stripe:
    post:
      summary: Stripe's deposit and subscription callback
      description: |
        The provider's unauthenticated webhook: `Stripe-Signature` verifies
        against `OXSUM_STRIPE_WEBHOOK_SECRET` (the same `t=<unix>,v1=<hex>`
        shape oxsum's own outbound webhooks use). `checkout.session.completed`
        confirms and credits the deposit the session names — the credit replays
        under `stripe:<session_id>` so a retried or raced delivery writes
        nothing twice — and `checkout.session.expired` closes it. A session
        opened in `subscription` mode instead binds the plan its metadata
        names (`oxsum_plan_id`) to the `client_reference_id` organization,
        with `source: stripe`. `invoice.paid` renews that binding's period at
        the invoice line's period end, and `customer.subscription.deleted`
        cancels it. `received_minor` records what Stripe reports paid; a
        number that disagrees with `amount_minor` is for a human, never
        auto-patched. A deployment without `OXSUM_STRIPE_*` answers 404: an
        unconfigured rail has no webhook to verify.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the raw Stripe event envelope; `data.object.id` is the session
      responses:
        "200":
          description: acknowledged — every verified event is answered 200 whether the deposit moved or not
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/airwallex:
    post:
      summary: Airwallex's deposit-rail callback
      description: |
        The provider's unauthenticated webhook (issue #285): `x-timestamp` and
        `x-signature` verify the body under `OXSUM_AIRWALLEX_WEBHOOK_SECRET` —
        hex HMAC-SHA256 of `timestamp + raw_body`, compared in constant time.
        `payment_intent.succeeded` confirms and credits the deposit the intent
        names — the credit replays under `airwallex:<intent_id>` so a retried
        or raced delivery writes nothing twice — and
        `payment_intent.cancelled`/`payment_intent.expired` close it.
        `data.object.amount` (decimal major units) converts to the recorded
        `received_minor` in cents; a number that disagrees with `amount_minor`
        is for a human, never auto-patched. A deployment without
        `OXSUM_AIRWALLEX_*` answers 404: an unconfigured rail has no webhook to
        verify.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the raw Airwallex event envelope; `data.object.id` is the intent
      responses:
        "200":
          description: acknowledged — every verified event is answered 200 whether the deposit moved or not
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/topups/hyperswitch:
    post:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Create a Hyperswitch payment to top up
      description: |
        The `hyperswitch` deposit rail (issue #319): opens a `pending` deposit
        (`payment_ref` = the `idempotencyKey`), creates a payment on the switch
        (`POST /payments`, automatic capture, `confirm: false`) and answers the
        payment id, the `clientSecret` the browser SDK confirms against, the
        `publishableKey` the SDK initializes with, and the `sdkUrl` origin the
        dashboard loads `HyperLoader.js` from — the API and the SDK bundle are
        different services, so the rail carries both origins (issue #320). A
        replayed intent (same `idempotencyKey`) answers the same handles — the
        deposit's unique constraint is the idempotency anchor, not a lookup. A
        deployment without `OXSUM_HYPERSWITCH_*` answers 503: the rail is
        configured or it is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The payment identity, the browser secret and the deposit it credits
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [paymentId, clientSecret, publishableKey, depositId, sdkUrl]
                    properties:
                      paymentId: { type: string, description: "the switch's payment id the webhook names" }
                      clientSecret: { type: string, description: "the secret the browser SDK confirms against" }
                      publishableKey: { type: string, description: "the key the browser SDK initializes with" }
                      depositId: { type: string, format: uuid, description: "the pending deposit this payment confirms" }
                      sdkUrl: { type: string, description: "the origin serving HyperLoader.js — the dashboard prepends it to /HyperLoader.js" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/hyperswitch:
    post:
      summary: Hyperswitch's deposit-rail callback
      description: |
        The switch's unauthenticated webhook (issue #319):
        `X-Webhook-Signature-512` verifies the raw body as hex HMAC-SHA512 under
        the business profile's `payment_response_hash_key`
        (`OXSUM_HYPERSWITCH_WEBHOOK_SECRET`), compared in constant time.
        Every verified event is recorded under its `event_id` before it acts — a
        replayed delivery is acknowledged and credits nothing. `payment_succeeded`
        confirms and credits the deposit the payment names — the credit replays
        under `hyperswitch:<payment_id>` so a retried or raced delivery writes
        nothing twice — and `payment_cancelled`/`payment_expired` close it.
        `content.object.amount` is recorded as `received_minor`; a number that
        disagrees with `amount_minor` is for a human, never auto-patched. A
        deployment without `OXSUM_HYPERSWITCH_*` answers 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the raw switch envelope; `event_id`, `event_type` and `content.object.payment_id` are what the handler reads
      responses:
        "200":
          description: acknowledged — every verified event is answered 200 whether the deposit moved or not
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/redemptions:
    post:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Redeem a code into the acting organization's wallet
      description: |
        The `redemption` deposit rail: a code the operator minted (`POST
        /api/v1/admin/redemption-codes`) credits its amount to the purchased pool.
        Redeeming is one atomic claim — the code's row is locked, the deposit is
        recorded (`rail = redemption`, `payment_ref` = the code's id), and the ledger
        credits the wallet under idempotency key `redemption:<code_id>`; a retried
        redeem replays the same credit, and two concurrent redeems of one code leave
        exactly one winner. A code that is unknown, already spent or past its expiry
        answers `404` whichever it is: which of the three is wrong is the holder's
        business. The answer is the ledger receipt of the credit plus what it credited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The receipt of the credit, with the amount the code carried
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Redemption" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/holds:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: The organization's in-flight holds
      description: |
        The holds the ledger still reserves for this organization — the
        dashboard's "in-flight" table. A hold listed here is one the sweeper
        watches: rows whose ledger hold is gone heal themselves away, so the
        list is the ledger's own outstanding set, newest first.
      responses:
        "200":
          description: The open holds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [holds]
                    properties:
                      holds:
                        type: array
                        items: { $ref: "#/components/schemas/OpenHoldView" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      deprecated: true
      summary: Customer raw holds are forbidden
      description: |
        Authenticated customer sessions and API keys receive 403 before body parsing
        or any ledger/watch mutation. The gateway owns request admission; trusted
        service integrations use the separately authenticated metering API.
        GET /api/v1/holds remains available.
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/settlements:
    post:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      deprecated: true
      summary: Customer raw settlements are forbidden
      description: |
        Authenticated customer sessions and API keys receive 403 before body parsing.
        Customers cannot set a charge or release a gateway-managed hold. Gateway,
        recovery and service-metering settlement keep their own trusted authority.
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/bills:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: The organization's transactions, newest first
      description: |
        Every ledger entry that moved money — top-ups, adjustments, settled
        turns — as the dashboard's bills page lists them: the booking date, the
        signed amount, the description and the content hash the entry's
        inclusion proof commits to. `before` walks older pages by log index;
        the answer's `nextCursor` is the cursor the next page asks with.
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: the log index the page continues back from; absent means the newest page
      responses:
        "200":
          description: The transaction page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/BillRow" }
                      nextCursor:
                        type: integer
                        format: int64
                        description: present while an older page exists
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/statements:
    get:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: The organization's finalized statements
      description: |
        The monthly billing documents the operator has finalized, newest period
        first: each statement itemizes a closed `YYYY-MM` month's settled usage
        and carries its payment standing — `pending`, `paid`, `overdue` or
        `suspended`. Drafts are the operator's working copy and never appear
        here. `creditDrawnMinor` is what the period put on the credit line —
        what the organization owes — and `outstandingMinor` is the part still
        unpaid; a top-up repays the line and counts against the oldest open
        statement first.
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The finalized statements, newest period first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Statement" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/statements/{statementId}:
    get:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: One finalized statement, with its lines
      description: |
        The statement and its itemized lines — settled usage aggregated per
        channel and model. Only `finalized` statements are readable here; a
        draft, another organization's statement and a missing id are all 404.
        `logFromIndex`/`logToIndex` bound the ledger window the lines prove:
        every charge sits in an entry a bill proof verifies.
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The statement and its lines
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StatementDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/statements/{statementId}/proof:
    get:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: The statement's self-contained proof bundle
      description: |
        Everything `verify_statement_anchor` needs in one GET (issue #479):
        the statement and its itemized lines, the log anchor that commits its
        two digests, the covered entries' content hashes in log order
        (`windowHashes`), the signed tree head right after the anchor
        (`expectedHead`) and the tenant origin (`expectedOrigin`) — the same
        objects the detail endpoint serves, plus the two inputs a caller would
        otherwise have to stitch together from `/api/v1/entries/{id}/proof`
        and `/api/v1/log/head`. Only `finalized` statements answer; a draft,
        another organization's statement and a missing id are all 404, the
        same guard the detail endpoint keeps.
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The statement and the pieces its anchor check folds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StatementProof" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/statements/{statementId}/export.pdf:
    get:
      x-customer-role-access: owner-admin
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: A finalized statement as a PDF
      description: |
        The rendered document (issue #205): the organization and period, the
        statement meta (status, payment standing, due date), the itemized
        lines, the totals, and a footer anchoring the page to the ledger —
        `logFromIndex`/`logToIndex` beside a QR pointing back at `/verify`.
        Only `finalized` statements export; a draft, another organization's
        statement and a missing id are all 404, the same guard the detail
        endpoint keeps. The body is binary `application/pdf`, not the JSON
        envelope, and the export always renders the stored lines, so it can
        never disagree with the detail endpoint's own answer.
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The statement as a PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/balance:
    get:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Available balance (settled minus unsettled holds)
      description: |
        `availableMinor` is everything the organization can still reserve: its own
        funds (bonus and purchased pools) plus the undrawn part of its credit line.
        `creditLimitMinor` is the facility the operator granted — 0 for an
        organization without one — and `creditUsedMinor` is how much of it is
        drawn or held against right now. What the organization holds of its own
        money is `availableMinor - (creditLimitMinor - creditUsedMinor)`.
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The balance
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [availableMinor, creditLimitMinor, creditUsedMinor, reservedMinor, spentThisMonthMinor]
                    properties:
                      availableMinor: { type: integer, format: int64 }
                      creditLimitMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: the credit limit the operator granted, in minor units
                      creditUsedMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: the drawn plus reserved part of the credit line, in minor units
                      reservedMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: what outstanding holds freeze right now — the dashboard's frozen total
                      spentThisMonthMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: "what this UTC calendar month has settled so far — the dashboard's month-spend figure"
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/usage:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: Daily usage rollup
      description: |
        The `oxsum.usage_daily` rows the dashboard sums, answered as data: one row per
        `(day, keyId, channel, model)` bucket with settled-turn and token sums and the
        charged total. `from` and `to` are inclusive dates; `to` defaults to today and
        `from` to 31 days before it, and the window is bounded to 92 days — a wider
        span, an inverted span, or a malformed date answers `VALIDATION`.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: first day of the window, inclusive; defaults to `to` minus 31 days
        - name: to
          in: query
          schema: { type: string, format: date }
          description: last day of the window, inclusive; defaults to today
      responses:
        "200":
          description: Daily rows, ordered by day
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [days]
                    properties:
                      days:
                        type: array
                        items: { $ref: "#/components/schemas/UsageDay" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/budget:
    get:
      x-consumption-key-access: denied
      security: [{ sessionCookie: [] }]
      summary: Budget-consumption snapshot
      description: |
        Every budget scope the caller can read, with the committed figure and the
        percentage consumed of its limit (issue #232). `committed` is the figure the
        hold-side checks read: settled spend plus every outstanding hold, windowed to
        the key's `budgetDuration` when it has one. `consumedPercent` floors
        `committed * 100 / limit` and is null where no numeric limit exists. Three
        scopes: `organization` carries the credit line beside the wallet balances,
        `member` the acting member's own `budgetLimitMinor` (null for a
        seat with no limit), `keys` every live key the principal's scope reaches with
        its `spendLimitMinor`, `budgetDuration` and `windowStart`.
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The budget snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BudgetSnapshot" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/billing-records:
