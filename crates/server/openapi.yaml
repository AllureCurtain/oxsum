                      head:
                        type: object
                        properties:
                          size: { type: integer, format: int64 }
                          root: { type: string, description: 32-byte hash, lowercase hex }
                      proof: { type: object }
                      price:
                        $ref: "#/components/schemas/PriceLink"
                        # Absent on a non-settlement entry, a bundle made before price
                        # binding, or a deployment that signs no heads.
                      sale:
                        $ref: "#/components/schemas/SaleLink"
                        # Absent on a non-settlement entry, a settlement that priced
                        # under the wholesale channel catalog rather than a sale book
                        # (v14's optional `sale` digest), or a deployment that signs
                        # no heads.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/entries:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: The ledger's entries, newest first
      description: |
        Every entry the organization's append-only log carries — holds,
        settlements, top-ups, markers — as the dashboard's transaction-log page
        lists them: log index, entry id, description, content hash. `before`
        walks older pages by log index; `nextCursor` is the cursor the next
        page asks with. `limit` bounds the page (1–100, default 100).
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: The entries page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows]
                    properties:
                      rows:
                        type: array
                        items: { $ref: "#/components/schemas/LogEntryView" }
                      nextCursor:
                        type: integer
                        format: int64
                        description: present while an older page exists
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/log/head:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: "The current tree head of the organization's ledger, signed by the operator"
      description: |
        The head of the append-only Merkle log this organization's ledger lives in, as a C2SP
        signed-note (tlog-checkpoint) carrying the operator's Ed25519 note signature. The note text
        is what the signature covers, byte for byte, so verify what you read, not what you
        re-render: parse `note`, find the signature line whose selector is `keyHash`, check it
        against `publicKey`, then check that the body carries `origin`, `size` and `root`.
        The origin names this tenant's ledger (`oxsum/ledgers/<tenant_id>`); the operator signs
        under the fixed key name `oxsum/tree-heads`. `publicKey` and `keyHash` are repeated here so
        the note is self-describing; the same key is published at `GET /api/v1/log/key`.
        A deployment with no `OXSUM_HEAD_SIGNING_KEY` answers 503.
      responses:
        "200":
          description: The signed head
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedTreeHead" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/consistency:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: "Prove the current head extends a head the caller already holds"
      description: |
        For a user holding an old head: the current head as a signed note, the old head the log
        recomputed at `from`, and the consistency proof between them. Verify the note signature
        against the published key, then check the proof against the two heads — it answers true
        only when the new tree is the old tree with entries appended. A second history at the
        same size cannot produce a verifying proof, which is the guarantee this endpoint exists
        for. A deployment with no `OXSUM_HEAD_SIGNING_KEY` answers 503.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: |
            The tree size of the old head. Must be at least 1: every log extends the empty tree,
            so a proof from size 0 would verify against any history at all and is refused (400)
            rather than answered. Anything beyond the log's current size is 400 as well.
      responses:
        "200":
          description: The signed new head, the old head, and the proof between them
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [note, keyName, publicKey, keyHash, oldHead, head, proof]
                    properties:
                      note: { type: string, description: "the complete C2SP signed-note text for the new head: body, blank line, signature lines" }
                      keyName: { type: string, description: "the key name the operator signs under" }
                      publicKey: { type: string, description: "the operator's Ed25519 verifying key, base64 of 32 bytes" }
                      keyHash: { type: string, description: "the 4-byte selector this key's note signatures carry, lowercase hex" }
                      oldHead: { $ref: "#/components/schemas/TreeHead" }
                      head: { $ref: "#/components/schemas/TreeHead" }
                      proof: { $ref: "#/components/schemas/ConsistencyProof" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/price-head:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: "A channel-model price row, signed by the operator"
      description: |
        Current customer/key model and channel grants filter this direct price read.
        Historical proof bundles already exported remain independently verifiable.
        The signed checkpoint of one `(channel, model)` price row — `version`'s exact
        row, or the latest when `version` is omitted — as a C2SP signed-note under the
        same Ed25519 key that signs tree heads (issue #204). The body reuses the
        tlog-checkpoint shape: `origin` is the catalog `oxsum/price-catalog/<channel>`,
        the note's size slot carries `priceVersion`, and its root carries the hash of
        the canonical row bytes — the price the catalog actually held, attested.
        Signing is stateless and deterministic over (key, origin, version, row), so a
        stored row signs identically whenever it is asked for: a bill that named an
        older version stays verifiable after the catalog moves on, and no snapshot
        table exists to drift. Verify the note signature against `publicKey` exactly
        as for `GET /api/v1/log/head`; the same key is published at `GET /api/v1/log/key`.
        A deployment with no `OXSUM_HEAD_SIGNING_KEY` answers 503.
      parameters:
        - name: channel
          in: query
          required: true
          schema: { type: string }
          description: The channel name whose catalog the checkpoint covers.
        - name: model
          in: query
          required: true
          schema: { type: string }
          description: The model whose price row is signed.
        - name: version
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
          description: |
            The price version to sign; omitted signs the latest. A bill names the
            version it priced under — pass that to verify an older price.
      responses:
        "200":
          description: The signed price checkpoint
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedPriceHead" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/sale-head:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: "A customer sale snapshot, signed by the operator"
      description: |
        The signed checkpoint of one resolved customer sale snapshot — the
        customer-visible terms a settlement priced under — as a C2SP signed-note
        under the same Ed25519 key that signs tree heads (issue #600). The body
        reuses the tlog-checkpoint shape: `origin` is the business's sale catalog
        `oxsum/sale-catalog/<businessId>`, the note's size slot carries the
        snapshot's book `version` (0 when the snapshot names none), and its root
        carries the tagged-BLAKE3 digest of the canonical snapshot bytes — the
        same `sale.digest` a v14 settlement description commits. The canonical
        bytes bind the *customer* terms only: organization, model, the
        book/version/draft/legacy provenance, the effective window and the sale
        price plus discount. Supplier (`upstream`) rates are never part of a sale
        snapshot, so the evidence they produce cannot attest a supplier cost.
        Signing is stateless and deterministic over (key, origin, digest, row), so
        a snapshot already served re-signs identically whenever it is asked for:
        a bill that named an older snapshot stays verifiable after the sale book
        moves on, and no snapshot table exists to drift. Look the snapshot up by
        `digest` — the value a settlement records — or by `organizationId`,
        `model` and `at` to re-resolve what was in force. Verify the note
        signature against `publicKey` exactly as for `GET /api/v1/log/head`; the
        same key is published at `GET /api/v1/log/key`. A deployment with no
        `OXSUM_HEAD_SIGNING_KEY` answers 503.
      parameters:
        - name: digest
          in: query
          required: false
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
          description: |
            The snapshot digest a settlement records, lowercase hex. When given,
            it selects the snapshot directly and `organizationId`/`model`/`at`
            are ignored.
        - name: organizationId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: The customer organization whose sale terms are signed; required without `digest`.
        - name: model
          in: query
          required: false
          schema: { type: string }
          description: The model whose sale snapshot is signed; required without `digest`.
        - name: at
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: |
            The instant to resolve the snapshot at; defaults to the current time.
            A bill names the digest it priced under — pass that, not `at`, to
            verify an older snapshot.
      responses:
        "200":
          description: The signed sale-snapshot checkpoint
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedSaleHead" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/key:
    get:
      x-consumption-key-access: public
      summary: "The operator's tree-head verifying key"
      description: |
        The public half of the key that signs tree heads. No credential: this is a public key.
        Fetching it from the server is convenience — a verifier must have chosen this key through
        a channel the operator does not control before the operator had anything to gain, or the
        signature proves only that the server agrees with itself.
      security: []
      responses:
        "200":
          description: The verifying key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/VerifyingKey" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/checkpoint:
    get:
      security: [{ bearer: [] }, { apiKeyHeader: [] }, { googApiKeyHeader: [] }, { sessionCookie: [] }]
      x-consumption-key-access: own-records-or-metadata
      summary: "Latest externally anchored checkpoint with witness cosignatures"
      description: |
        The head the `witness-checkpoints` pass last published to the witnesses
        configured in `OXSUM_WITNESS_URLS`, together with the cosigned C2SP notes
        they returned (issue #231). `note` is the operator-signed tlog-checkpoint
        covering `headSize`; each `cosignatures[]` entry is one witness's signed
        note for that same head — verify the signature lines against the keys the
        respective witnesses publish. `data` is `null` while nothing is anchored:
        before the first pass or when no witnesses are configured. A third party
        verifies a head by checking the operator's signature (key at
        `GET /api/v1/log/key`), the witnesses' signature lines, and — for their
        own held head — a consistency proof from `GET /api/v1/log/consistency`.

        `witnessKeys` (issue #259) carries the deployment's pinned witness
        keyset — the same answer `OXSUM_WITNESS_KEYS` configured: a
        `cosignature/v1` line under the listed `keyName`/`publicKey` is what a
        real third-party witness produced. A verifier that does not trust the
        deployment's pinset may substitute its own — the same "don't trust the
        server for the key" choice the operator's published key already asks
        for.
      responses:
        "200":
          description: The anchored checkpoint, or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    nullable: true
                    properties:
                      headSize: { type: integer, format: int64, description: "tree size the stored note attests" }
                      note: { type: string, description: "the operator-signed C2SP note covering the head, byte for byte" }
                      cosignatures:
                        type: array
                        items:
                          type: object
                          properties:
                            witnessUrl: { type: string, description: "the witness endpoint as configured in OXSUM_WITNESS_URLS" }
                            note: { type: string, description: "the cosigned C2SP note the witness returned — its signature line is the verifiable part" }
                            firstSeen: { type: string, format: date-time }
                      witnessKeys:
                        type: array
                        description: "the deployment's pinned witness keyset (OXSUM_WITNESS_KEYS): which `cosignature/v1` key a signature line under each URL must verify against"
                        items:
                          type: object
                          properties:
                            witnessUrl: { type: string, description: "the witness endpoint this pin applies to" }
                            keyName: { type: string, description: "the name the signature line carries (`— <keyName> <blob>`)" }
                            publicKey: { type: string, description: "the Ed25519 verifying key, hex" }
                            keyHash: { type: string, description: "the C2SP key hash (hex) the signature line's selector must equal" }
                      updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/metering/holds:
    post:
      x-integration-scope: meteringWrite
      summary: Freeze credit for a billable event a service will settle later
      description: |
        A service credential reports an event bound: the `billableCode` resolves to
        `channel`'s latest `mode: event` price version, the declared `usage` is the
        event's upper bound in the code's own units, and the freeze is that usage
        itemized — a hold, never more, never silently zero. An `eventType` names what
        the event is (`"inference"`, `"email.send"`, …); it rides the usage record and
        the settlement's `usage.eventType`. Usage naming a dimension the price cannot
        bill — a media token, a tool call — is refused, not partial-billed: the service
        declares the usage, so it can fix the request. `organizationId` names whose
        wallet freezes; a suspended organization answers `403` and an insolvent one
        `402`, like every hold. The hold is watched by the sweeper: a hold that never
        settles releases at zero with kind `swept`. Replay of the same
