openapi: 3.1.0
info:
  title: oxsum API
  version: 0.16.0
  description: |
    Common conventions (auth, idempotency, error format, money units) are documented in docs/api.md.

    Three surfaces, deliberately different:

    - `/api/v1/*` is oxsum's own API: enveloped responses (`{"data": …}`), oxsum error codes, camelCase.
    - `/v1/*` is the OpenAI-compatible gateway: OpenAI's request and response shapes, OpenAI's error
      object, and everything the gateway does not understand is passed upstream unchanged, so an OpenAI
      SDK works by changing `base_url` only. A gateway request freezes credit before upstream is
      contacted and settles against the usage upstream reports.
    - `/api/v1/admin/*` is the platform admin's surface: whoever deploys oxsum manages channels and
      their prices with an operator token, not with an organization's API key.

    0.2.0 changed the auth model: an API key belongs to exactly one organization and decides whose
    balance a request spends, so the ledger endpoints no longer name a tenant in the path. 0.3.0 added
    the gateway surface. 0.4.0 added channel and price configuration: prices are append-only versions,
    and a request is priced by the version in force when it starts. 0.5.0 added web login: a session
    is a second credential next to the API key, carried in a cookie, and the role rules (owner, admin,
    member) now constrain what a session principal may do with the organization's keys. 0.6.0 added
    trustworthy tree heads: the operator signs each tenant's ledger head (a C2SP signed-note), and
    `/api/v1/log/consistency` proves the current head extends a head the caller already holds. 0.7.0
    added per-key spend limits: `spendLimitMinor` caps what one key may have committed — settled
    charges plus outstanding holds attributed to it — a key takes that limit at creation or through
    `PATCH /api/v1/org/keys/{keyId}`, and a hold that would exceed it is refused with 429
    `KEY_LIMIT_EXCEEDED` on `/api/v1` and `insufficient_quota` on the gateway. 0.8.0 added membership
    management: an owner or an admin may add an existing account by email, remove a member, change a
    member's role and transfer ownership (`/api/v1/org/members`, `/api/v1/org/members/{userId}`,
    `/api/v1/org/ownership`). Membership management is a person's action: an API key names no role and
    is refused there, which is the one place a key does not act with the organization's full
    authority. Invitations for people who have no account yet are issue #59 and are not part of this
    contract. 0.9.0 widened the platform-admin surface past channels: `GET /api/v1/admin/organizations`
    lists every organization with its balance, so the deployment can see whom the ledger holds money
    for. Adjusting or topping up another organization is still not in the contract (issue #60).
    0.10.0 added `GET /api/v1/admin/holds`, 0.11.0 `GET /api/v1/admin/anomalies`, and 0.12.0
    `GET`/`POST /api/v1/admin/closings`: the monthly closing, which seals a `YYYY-MM` period in
    every organization's ledger — after a month is sealed, no entry may carry a booking date in it
    again, and the seal itself is the closing record. 0.13.0 adds team organizations: `GET`/`POST
    /api/v1/orgs` lists and creates the session user's organizations, and `POST
    /api/v1/session/organization` switches which organization the session acts as.
    0.14.0 adds invitation links (`/api/v1/org/invitations`, `/api/v1/invitations/redeem`):
    an owner or admin mints a one-use link, and the person holding it registers into the
    organization — the only registration `OXSUM_SIGNUP=invite` allows. 0.15.0 gives the platform admin
    the write half of the organizations list: `POST
    /api/v1/admin/organizations/{organizationId}/adjustments` books a signed amount with a
    required reason into that organization's ledger.

    Every `/api/v1` endpoint that takes a bearer key also accepts the session cookie, except
    `/api/v1/auth/login`, `/api/v1/auth/logout` and `/api/v1/auth/register`, which take no
    credential at all. The cookie is never accepted on `/v1`: the gateway takes an API key only.
servers:
  - url: http://localhost:3000
security:
  - bearer: []
paths:
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema: { type: string, example: ok }
  /api/v1/auth/register:
    post:
      summary: Register a user, its personal organization and the first API key
      description: |
        Refused with `FORBIDDEN` unless the deployment allows self-service signup (`OXSUM_SIGNUP=open`).
        The API key secret is returned once, here, and is never retrievable again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: The new user and organization, plus the one API key secret
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Registration" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/invitations/redeem:
    post:
      summary: Register through an invitation link
      description: |
        The one registration an `invite`-mode deployment allows — the link is the
        credential, so no other authentication applies, whatever `OXSUM_SIGNUP` is.
        The token names one live invitation: usable once, valid seven days from minting,
        and unknown, spent and expired tokens are all `404 NOT_FOUND` — which is wrong
        is the holder's business. The new account joins the invitation's organization as
        a `member`, with the first API key minted for that organization; no personal
        organization is created — that is what `auth/register` is for.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemInvitationRequest" }
      responses:
        "200":
          description: The new user and organization, plus the one API key secret
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Registration" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      summary: Log in with email and password
      description: |
        Mints a session and answers it in the body together with a `Set-Cookie` header carrying the
        session cookie (`oxsum_session`, `HttpOnly`, `SameSite=Lax`, `Path=/`, plus `Secure` when the
        deployment sets `OXSUM_SESSION_COOKIE_SECURE`).

        An unknown email and a wrong password answer the same 401 with the same message, and the
        unknown-email path still pays for one password-hash verification, so neither timing nor
        wording reveals whether an account exists. The session acts as the user's organization, in
        their role; it expires thirty days after login and stops authenticating the moment the
        user's membership in that organization is gone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: The user, the organization, the role and the session; the `Set-Cookie` header carries the session cookie
          headers:
            Set-Cookie:
              description: "the session cookie: `oxsum_session=<token>; Path=/; HttpOnly; SameSite=Lax`, plus `; Secure` when the deployment sets `OXSUM_SESSION_COOKIE_SECURE`"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      summary: Log out
      description: |
        Revokes the session the cookie names and clears the cookie with a `Set-Cookie` header
        (`Max-Age=0`). Always 200: logging out twice is not an error, and neither is logging out
        without a session at all — which is why this route takes no credential.
      security: []
      responses:
        "200":
          description: Logged out; the `Set-Cookie` header clears the cookie
          headers:
            Set-Cookie:
              description: "`oxsum_session=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0`, plus `; Secure` when the deployment sets `OXSUM_SESSION_COOKIE_SECURE`"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LogoutResponse" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/session:
    get:
      summary: The current session
      description: |
        Who is logged in, as which organization, in which role. Takes the session cookie; a bearer
        key names no session and answers 404.
      security:
        - bearer: []
        - sessionCookie: []
      responses:
        "200":
          description: The session, the user, the organization and the role
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/session/organization:
    post:
      summary: Switch the organization the session acts as
      description: |
        Carries the session's acting organization — the choice the dashboard's switcher makes.
        `organizationId` must name an organization the user is a member of; any other value, a real
        organization the user does not belong to included, answers `404` so memberships cannot be
        probed. The session row is updated, so the choice survives reloads and new tabs alike, and
        every organization-scoped read follows it. A person's action: an API key already *is* an
        organization and cannot act as another, so it is refused (403).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchOrganizationRequest" }
      responses:
        "200":
          description: The session, now acting as the chosen organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/orgs:
    get:
      summary: The organizations the session's user belongs to
      description: |
        Every organization the logged-in user is a member of, oldest membership first, each with
        the role the user holds in it — the list the organization switcher offers. A person's list:
        an API key belongs to one organization and names no member, so it is refused (403).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The user's organizations with their roles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UserOrganization" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a team organization
      description: |
        Creates a `team` organization — its own ledger, its own keys, its own balance — and makes
        the session's user its owner. There is deliberately no `personal` kind to create: a personal
        organization is exactly what signup makes. A person's action: an API key has no user to own
        the new organization, so it is refused (403). The session keeps acting as the organization
        it had; switching to the new one is `POST /api/v1/session/organization`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "200":
          description: The created organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org:
    get:
      summary: The authenticated organization
      description: The organization the presented credential belongs to.
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/keys:
    get:
      summary: List the organization's API keys
      description: |
        Metadata only. Neither a secret nor a hash is ever returned. Members see only the keys they
        created; owners and admins see every key of the organization. An API key acting as the
        organization sees all of them, as before sessions.
      responses:
        "200":
          description: The organization's keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create an API key
      description: |
        Returns the secret once. A key minted through a session records who minted it (`createdBy`),
        for the per-member role rules; a key minted with an API key records no creator, because no
        person acts there.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKeyRequest" }
      responses:
        "200":
          description: The new key and its secret, shown only here
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedApiKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/keys/{keyId}:
    patch:
      summary: Set or clear an API key's spend limit
      description: |
        `spendLimitMinor` caps what the key may have committed — settled charges plus
        outstanding holds attributed to it, in minor units; `null` clears the limit back to
        unlimited. A hold that would push the key past its limit is refused with 429
        `KEY_LIMIT_EXCEEDED`, atomically with the ledger append, so concurrent requests
        cannot exceed it. The scope rules are the revoke's: a member may change only the keys
        they created — any other key id answers 404 and the key is untouched; owners, admins
        and API keys acting as the organization may change any key of the organization. A key
        id belonging to another organization is `NOT_FOUND`.
      parameters: [{ $ref: "#/components/parameters/KeyId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spendLimitMinor]
              properties:
                spendLimitMinor: { type: [integer, "null"], format: int64, minimum: 0, description: "the new limit in minor units, or null for unlimited" }
      responses:
        "200":
          description: The key with its new limit
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Revoke an API key
      description: |
        Permanent and idempotent. A member may revoke only the keys they created — revoking any
        other answers 404 and the key stays live; owners and admins may revoke any key. A key id
        belonging to another organization is `NOT_FOUND`.
      parameters: [{ $ref: "#/components/parameters/KeyId" }]
      responses:
        "200":
          description: The revoked key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/invitations:
    post:
      summary: Mint an invitation link
      description: |
        A link into this organization: `/register?invite=<token>` in the dashboard, or
        `POST /api/v1/invitations/redeem` with the token, an email and a password. The
        token is answered exactly once, here; the database keeps only its hash. An
        invitation is valid seven days and works once. Owners and admins mint links;
        a member is refused, and a person's action means a bearer API key is refused
        too — a key is not a person.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The invitation, with the one time the token is visible
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CreatedInvitation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/members:
    post:
      summary: Add an existing account to the organization as a member
      description: |
        The email names an account that already exists, and that account becomes a member.
        Someone who has no account yet comes in through an invitation link instead:
        `POST /api/v1/org/invitations` mints one and `POST /api/v1/invitations/redeem`
        registers through it. An unknown email here is `NOT_FOUND`, never a stored
        invitation.

        Only an owner or an admin may manage memberships, and only a logged-in person: an API key is
        not a person and names no role, so it is refused here too (docs/decisions.md, "membership
        management is a person's action"). A member is refused. A new membership's role is always
        `member`; ownership is never granted here, and only `POST /api/v1/org/ownership` can move
        the owner seat.

        Adding the second person to a personal organization flips its kind to `team`; the ledger
        does not move. An account that is already a member is `CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "200":
          description: The new membership
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/members/{userId}:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    patch:
      summary: Change a member's role
      description: |
        `role` is `admin` or `member`, and there is deliberately no `owner` value: ownership is a
        single seat, moved by `POST /api/v1/org/ownership`, so no role change can promote anyone to
        owner (a body naming `owner` is `VALIDATION_ERROR`, not a promotion). Only an owner or an
        admin, and only a session: an API key or a member is refused.

        An admin may not change an owner's role (403 `FORBIDDEN`) — an admin manages members, not
        the owner — and the last owner of an organization cannot be demoted (409 `CONFLICT`): an
        organization always has an owner. Setting the role a member already has answers the
        membership unchanged, so a retry is not an error. A user id that is not a member of the
        caller's organization is `NOT_FOUND`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeMemberRoleRequest" }
      responses:
        "200":
          description: The membership with its new role
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a member from the organization
      description: |
        The membership row is deleted; the user and their personal organization are untouched. Only
        an owner or an admin, and only a session: an API key or a member is refused. An admin may
        not remove an owner (403 `FORBIDDEN`), and the last owner cannot be removed (409
        `CONFLICT`) — transfer ownership first. Removing a user who is not a member of the caller's
        organization is `NOT_FOUND`, so a second removal is not a silent success.

        Removing the person a session acts for ends that session: resolution joins `memberships`,
        so a session cannot outlive the membership it names.
      responses:
        "200":
          description: The membership that was removed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/org/ownership:
    post:
      summary: Transfer ownership of the organization
      description: |
        The one way to become the owner, and the only way an owner stops being one: the named member
        is promoted to `owner` and the transferring owner becomes an `admin`, in one transaction, so
        the organization has exactly one owner before and after. Only an owner may call this
        (403 `FORBIDDEN` for an admin, a member or an API key), and the target must be a member of
        the same organization: an owner cannot transfer ownership to themselves (`CONFLICT`) or to a
        user who is not a member (`NOT_FOUND`).

        The owner seat is never left empty: the last owner can neither be removed nor demoted, and
        this endpoint moves the seat rather than creating a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferOwnershipRequest" }
      responses:
        "200":
          description: The new owner and the previous owner, now an admin
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Ownership" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/topups:
    post:
      summary: Top up credits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/holds:
    post:
      summary: Hold credits (before a streaming call starts)
      description: |
        A hold taken with an API key is checked against the key's spend limit when it has one:
        when settled charges plus outstanding holds attributed to the key would exceed
        `spendLimitMinor`, the hold is refused with 429 `KEY_LIMIT_EXCEEDED`, checked under a
        per-key lock and atomic with the ledger append, so concurrent holds cannot together
        exceed it. A session holds unattributed, with no limit to check.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/settlements:
    post:
      summary: "Settle a hold: release it and charge the actual usage"
      description: >-
        A settlement names the hold it releases (`holdKey`); the server reads the hold's amount
        from the hold entry in the ledger, so there is no amount to assert. One hold settles at
        most once: the settlement entry's idempotency key is derived from the hold's key
        (`oxsum_core::settlement_key_for`), and the ledger's idempotency gate refuses a second
        settlement of the same hold with 409, inside the append, so concurrent settlements naming
        one hold cannot both release it. Retrying the identical settlement replays it. Naming a
        hold that is not outstanding is 404, even when other holds would cover the amount; the
        wallet's limit still refuses a release the outstanding reservations cannot cover, as the
        backstop behind the pairing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettleRequest" }
      responses:
        "200": { $ref: "#/components/responses/Receipt" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/balance:
    get:
      summary: Available balance (settled minus unsettled holds)
      responses:
        "200":
          description: The balance
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [availableMinor]
                    properties:
                      availableMinor: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/entries/{entryId}/proof:
    get:
      summary: "Bill proof bundle: entry source + inclusion proof + tree head"
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The proof bundle. The internal shape of entry/head/proof follows doubleentry's serde encoding.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [entry, head, proof]
                    properties:
                      entry: { type: object }
                      head:
                        type: object
                        properties:
                          size: { type: integer, format: int64 }
                          root: { type: string, description: 32-byte hash, lowercase hex }
                      proof: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/log/head:
    get:
      summary: "The current tree head of the organization's ledger, signed by the operator"
      description: |
        The head of the append-only Merkle log this organization's ledger lives in, as a C2SP
        signed-note (tlog-checkpoint) carrying the operator's Ed25519 note signature. The note text
        is what the signature covers, byte for byte, so verify what you read, not what you
        re-render: parse `note`, find the signature line whose selector is `keyHash`, check it
        against `publicKey`, then check that the body carries `origin`, `size` and `root`.
        The origin names this tenant's ledger (`oxsum/ledgers/<tenant_id>`); the operator signs
        under the fixed key name `oxsum/tree-heads`. `publicKey` and `keyHash` are repeated here so
        the note is self-describing; the same key is published at `GET /api/v1/log/key`.
        A deployment with no `OXSUM_HEAD_SIGNING_KEY` answers 503.
      responses:
        "200":
          description: The signed head
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedTreeHead" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/consistency:
    get:
      summary: "Prove the current head extends a head the caller already holds"
      description: |
        For a user holding an old head: the current head as a signed note, the old head the log
        recomputed at `from`, and the consistency proof between them. Verify the note signature
        against the published key, then check the proof against the two heads — it answers true
        only when the new tree is the old tree with entries appended. A second history at the
        same size cannot produce a verifying proof, which is the guarantee this endpoint exists
        for. A deployment with no `OXSUM_HEAD_SIGNING_KEY` answers 503.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: |
            The tree size of the old head. Must be at least 1: every log extends the empty tree,
            so a proof from size 0 would verify against any history at all and is refused (400)
            rather than answered. Anything beyond the log's current size is 400 as well.
      responses:
        "200":
          description: The signed new head, the old head, and the proof between them
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [note, keyName, publicKey, keyHash, oldHead, head, proof]
                    properties:
                      note: { type: string, description: "the complete C2SP signed-note text for the new head: body, blank line, signature lines" }
                      keyName: { type: string, description: "the key name the operator signs under" }
                      publicKey: { type: string, description: "the operator's Ed25519 verifying key, base64 of 32 bytes" }
                      keyHash: { type: string, description: "the 4-byte selector this key's note signatures carry, lowercase hex" }
                      oldHead: { $ref: "#/components/schemas/TreeHead" }
                      head: { $ref: "#/components/schemas/TreeHead" }
                      proof: { $ref: "#/components/schemas/ConsistencyProof" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/log/key:
    get:
      summary: "The operator's tree-head verifying key"
      description: |
        The public half of the key that signs tree heads. No credential: this is a public key.
        Fetching it from the server is convenience — a verifier must have chosen this key through
        a channel the operator does not control before the operator had anything to gain, or the
        signature proves only that the server agrees with itself.
      security: []
      responses:
        "200":
          description: The verifying key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/VerifyingKey" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels:
    get:
      summary: List the channels, with the current price version of each of their models
      description: |
        The platform admin's view. Only the last four characters of an upstream credential are ever
        returned; the credential itself is sealed at rest and never leaves the server.

        This is what is *in force*: `GET /api/v1/admin/channels/{channelName}/prices` is the history.
      security:
        - adminToken: []
      responses:
        "200":
          description: Every channel, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a channel, or replace the connection of one that exists
      description: |
        The name is the identity: posting an existing name moves that channel to a new upstream address
        or credential and leaves its prices exactly as they are. A credential is sealed with
        `OXSUM_SECRET_KEY` before it is stored.

        A deployment with no channels yet is seeded from the environment at startup instead
        (`OXSUM_UPSTREAM_BASE_URL`, `OXSUM_UPSTREAM_API_KEY`, `OXSUM_MODELS`); this endpoint is for
        everything after that.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelRequest" }
      responses:
        "200":
          description: The channel as it now stands
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/channels/{channelName}/prices:
    get:
      summary: Every price version of a channel, newest first
      description: |
        The history rather than the current state: a price change appends a version and never rewrites
        one, so the version a settlement names is still here to be checked, however old the bill is.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      responses:
        "200":
          description: Every version of every model of that channel, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ModelPrice" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Append a price version for one of a channel's models
      description: |
        Appends; never overwrites. The version in force when a gateway request starts is the version
        that prices that request and the one its settlement names, so a price change lands on later
        requests and leaves in-flight turns and written bills untouched.

        A model belongs to exactly one channel in v1 (docs/product.md), so pricing a model another
        channel already serves is `CONFLICT`.
      security:
        - adminToken: []
      parameters: [{ $ref: "#/components/parameters/ChannelName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceRequest" }
      responses:
        "200":
          description: The version that was written
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PriceVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations:
    get:
      summary: List every organization, with its balance
      description: |
        The platform admin's view of whom the ledger holds money for: every organization, oldest
        first, with its kind, its headcount and what its wallet shows — `availableMinor` (settled
        minus unsettled holds) and `reservedMinor` (the sum of its outstanding holds). Balances are
        integer minor units, 1 credit = 1_000_000 minor, and reading one creates the organization's
        ledger if it does not exist yet, the same way the dashboard's overview does.
        Moving an organization's money is `POST
        /api/v1/admin/organizations/{organizationId}/adjustments`.
      security:
        - adminToken: []
      responses:
        "200":
          description: Every organization, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminOrganization" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/organizations/{organizationId}/adjustments:
    post:
      summary: Adjust an organization's balance
      description: |
        Books a signed amount into the named organization's ledger, with a required
        `reason`: a positive `amountMinor` grants credits, a negative one deducts
        them. The entry is new history — an adjustment never modifies an existing
        entry, so every bill's proof stays valid. A deduction that would push the
        balance below what the wallet holds is `402 INSUFFICIENT_FUNDS`: the ledger's
        no-overdraft rule refuses it, not the route. `402` reads as the refusal it is;
        `400` answers a zero amount, an empty reason or a missing idempotency key;
        `404` an organization that does not exist. The idempotency key makes a retried
        call the same entry — the answer carries `entryId`, which `entry_id_for` derives
        from it.
      security:
        - adminToken: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustOrganizationRequest" }
      responses:
        "200":
          description: The adjustment as booked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdminAdjustment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/holds:
    get:
      summary: List every unsettled hold, across all organizations
      description: |
        The in-flight requests the platform is holding money for: every watched hold,
        newest first — the organization it belongs to, the request id, the model and
        channel, the price version the turn froze at, the frozen amount and when the
        hold opened. The list is the sweeper's watch table: a row whose hold already
        settled is cleaned up rather than shown, so a hold listed here is one the
        ledger still reserves.
      security:
        - adminToken: []
      responses:
        "200":
          description: Every unsettled hold, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminHold" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/anomalies:
    get:
      summary: The settled turns that did not price cleanly, across all organizations
      description: |
        Every settlement whose kind is `capped`, `estimated`, `client_cancelled` or
        `swept`, newest first — the turns where usage was never reported, the caller
        left mid-stream, the upstream price ran over the freeze, or the sweeper had to
        release a hold nobody settled. The records are the settlement descriptions the
        ledgers themselves hold, so every row is exactly what its bill proves; a
        hand-driven settlement carries no record and is not listed.
      security:
        - adminToken: []
      responses:
        "200":
          description: The anomalous turns, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAnomaly" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/closings:
    get:
      summary: The sealed months, across all organizations
      description: |
        Every period seal the ledgers hold, newest first and per organization: the
        closing records. A seal commits to the log's tree head at sealing, the
        period's entry count and the closing trial balance, and chains onto the
        seal before it — so the list is the history of what the books committed to,
        not a copy of it.
      security:
        - adminToken: []
      responses:
        "200":
          description: The sealed periods, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminClosing" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      summary: Close a month
      description: |
        Seals the period `month` (`YYYY-MM`) in every organization's ledger: defines
        the period if the ledger does not know it, stops new postings, and appends
        the seal that is the month's closing record. From then on no entry may carry
        a booking date in that month — the engine's sealed watermark refuses it at
        seal time, which is the promise "after closing, that month accepts no new
        entries" made structural.

        Only a month that has fully ended can be closed: one that still contains the
        server's current UTC date answers `400`, as does a malformed `month`. A month
        that is already closed answers its existing record — the call is idempotent,
        and the seals table's primary key is what makes a double-close impossible
        rather than merely reported. Answers the closing record of every
        organization.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseMonthRequest" }
      responses:
        "200":
          description: The closing record of every organization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminClosing" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{userId}/password-reset:
    post:
      summary: Reset a user's password
      description: |
        Sets a new password for the named user and revokes every session that
        user holds, so the old credential dies with the reset — the only
        recovery path v1 has, since no email is sent. An unknown user is 404;
        the admin token already authorizes the call, so the code can say which
        of the two it was.
      security:
        - adminToken: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: The reset, with the sessions it revoked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PasswordReset" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/models:
    get:
      summary: List the served models, in OpenAI's shape
      description: |
        Only models with a price are listed: a model the gateway cannot price cannot be frozen, so it
        cannot be served. `owned_by` is the channel that serves the model, and `created` is when the
        version in force was written.
      responses:
        "200":
          description: The model list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
  /v1/chat/completions:
    post:
      summary: Chat completion, billed by freezing credit first and settling against upstream usage
      description: |
        The gateway computes the most the request could cost, freezes that much, and only then
        contacts upstream. Upstream's request always carries the output upper bound as `max_tokens`,
        and a streaming request always carries `stream_options.include_usage = true`, so upstream
        cannot return more than the freeze was computed for and its usage arrives in the final chunk.
        The request settles against that usage, capped at the freeze.

        Every response carries `x-oxsum-request-id`. The two ledger entries use `req-<id>:hold` and
        `req-<id>:settle`, and the settlement's description carries the channel, the price version in
        force when the request started, the token counts and the prices that produced the charge, so a
        bill can be verified down to the arithmetic years later.

        Request content is text-only in v1: a message whose `content` is an array containing anything
        but text is refused with 400, because the input upper bound must be computable for the freeze
        promise to hold.

        A `stream: true` response ends with `data: [DONE]`. If upstream reports usage, the last frame
        before it carries the `usage` object, and that is what was billed. If the client disconnects,
        the upstream call is cancelled and the turn settles on local estimation, marked as estimated
        in the settlement description; if upstream is unreachable or answers with an error before
        emitting anything, the whole freeze is released and nothing is charged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: Upstream's completion, passed through unchanged
          headers:
            x-oxsum-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletion" }
            text/event-stream:
              schema:
                type: string
                description: "OpenAI SSE frames, passed through unchanged, terminated by `data: [DONE]`"
        "400": { $ref: "#/components/responses/GatewayError" }
        "401": { $ref: "#/components/responses/GatewayError" }
        "402": { $ref: "#/components/responses/GatewayError" }
        "403": { $ref: "#/components/responses/GatewayError" }
        "409": { $ref: "#/components/responses/GatewayError" }
        "429": { $ref: "#/components/responses/GatewayError" }
        "500": { $ref: "#/components/responses/GatewayError" }
        "502": { $ref: "#/components/responses/GatewayError" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "An oxsum API key: `oxs-` followed by 32 random bytes, shown once at creation."
    adminToken:
      type: http
      scheme: bearer
      description: |
        The operator token from `OXSUM_ADMIN_TOKEN`, at least 16 characters, compared in constant time.
        It is not an API key and belongs to no organization: it is whoever deploys oxsum. A deployment
        that sets no token has no admin surface at all.
    sessionCookie:
      type: apiKey
      in: cookie
      name: oxsum_session
      description: |
        A web session from `POST /api/v1/auth/login`: `oxsess-` followed by 32 random bytes, carried
        in the `oxsum_session` cookie (`HttpOnly`, `SameSite=Lax`, `Path=/`, plus `Secure` when the
        deployment sets `OXSUM_SESSION_COOKIE_SECURE`). The database keeps only its SHA-256 hash.
        Accepted on `/api/v1` wherever a bearer key is; never accepted on `/v1`, where the gateway
        takes an API key only.
  parameters:
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: the id of the user whose membership this is, as a member's `userId`
    ChannelName:
      name: channelName
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,40}$" }
      description: the channel's name, which is its identity
  headers:
    RequestId:
      description: "the id the ledger entries are keyed by: `req-<id>:hold` and `req-<id>:settle`"
      schema: { type: string }
  schemas:
    CreatedInvitation:
      type: object
      required: [id, token, expiresAt]
      properties:
        id: { type: string, format: uuid }
        token:
          type: string
          description: "`oxi-` plus 32 random bytes — answered once; only its hash is stored"
        expiresAt: { type: string, format: date-time, description: seven days from minting }
    RedeemInvitationRequest:
      type: object
      required: [token, email, password]
      properties:
        token: { type: string, description: "the invitation link's token" }
        email: { type: string, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256 }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256, description: at least 12 characters }
        organizationName: { type: string, minLength: 1, maxLength: 80, description: name of the personal organization; defaults to the local part of the email }
    Registration:
      type: object
      required: [user, organization, apiKey]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        apiKey: { $ref: "#/components/schemas/CreatedApiKey" }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256, description: at least 12 characters }
    Session:
      type: object
      required: [id, createdAt, expiresAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "absolute expiry: thirty days after login, no sliding renewal in v1" }
        lastUsedAt: { type: string, format: date-time, description: "the last authenticated request; touched at most once per five minutes" }
    UserOrganization:
      type: object
      required: [organization, role]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        role: { type: string, enum: [owner, admin, member], description: "the role the session's user holds in this organization" }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "the new team organization's name" }
    SwitchOrganizationRequest:
      type: object
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid, description: "must be an organization the session's user is a member of" }
    SessionInfo:
      type: object
      required: [user, organization, role, session]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        role: { type: string, enum: [owner, admin, member], description: "the user's role in the organization the session acts as" }
        session: { $ref: "#/components/schemas/Session" }
    LogoutResponse:
      type: object
      description: "empty: the logout is in the Set-Cookie header that clears the cookie"
    Organization:
      type: object
      required: [id, name, tenantId, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenantId: { type: string, description: "ledger tenant id; the ledger lives in the schema ledger_<tenantId>" }
        kind: { type: string, enum: [personal, team] }
        createdAt: { type: string, format: date-time }
    CreateKeyRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expiresAt: { type: [string, "null"], format: date-time, description: optional expiry; an expired key authenticates nothing }
        spendLimitMinor: { type: [integer, "null"], format: int64, minimum: 0, description: "the key's spend limit in minor units: settled charges plus outstanding holds attributed to the key may not exceed it; null (the default) is unlimited" }
    ApiKey:
      type: object
      required: [id, name, prefix, createdBy, createdAt, expiresAt, revokedAt, spendLimitMinor]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        prefix: { type: string, description: "leading characters of the secret, for recognizing the key in a list" }
        createdBy: { type: [string, "null"], format: uuid, description: "the user who minted the key, for the per-member role rules; null for keys minted with an API key" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        spendLimitMinor: { type: [integer, "null"], format: int64, minimum: 0, description: "the key's spend limit in minor units; null is unlimited" }
    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "the plaintext key; shown once and stored only as a SHA-256 hash" }
    Member:
      type: object
      required: [userId, email, role, joinedAt]
      properties:
        userId: { type: string, format: uuid, description: "the user's id, which the membership endpoints address a member by" }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member], description: "the member's role in this organization; a platform admin is a deployment identity, not a role here" }
        joinedAt: { type: string, format: date-time, description: when the membership was created }
    AddMemberRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320
          description: |
            the email of an account that already exists; the comparison is case-insensitive. An
            email no account holds is `NOT_FOUND` — a person without an account is invited by link
            (`POST /api/v1/org/invitations`) — and one that is already a member of this organization
            is `CONFLICT`.
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
          description: |
            the member's new role. `owner` is not a value here on purpose: ownership is a single
            seat moved by `POST /api/v1/org/ownership`, so this endpoint cannot promote anyone.
    TransferOwnershipRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid, description: "the member who becomes the owner; they are an admin or a member of this organization" }
    Ownership:
      type: object
      required: [owner, previousOwner]
      properties:
        owner: { $ref: "#/components/schemas/Member", description: "the new owner, in the owner role" }
        previousOwner: { $ref: "#/components/schemas/Member", description: "the owner who transferred it, now an admin" }
    ChannelRequest:
      type: object
      required: [name, baseUrl, apiKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9._-]+$", description: the channel's identity; posting an existing name replaces its connection }
        baseUrl: { type: string, format: uri, description: "where the OpenAI-compatible surface lives, http or https; `/chat/completions` is appended to it" }
        apiKey: { type: string, minLength: 1, description: "the upstream credential; sealed with OXSUM_SECRET_KEY, only its last four characters readable afterwards" }
    Channel:
      type: object
      required: [name, baseUrl, apiKeyLast4, createdAt, models]
      properties:
        name: { type: string }
        baseUrl: { type: string }
        apiKeyLast4: { type: string, description: "the last four characters of the stored credential, and nothing more of it" }
        createdAt: { type: string, format: date-time }
        models:
          type: array
          description: one entry per model, at its current version
          items: { $ref: "#/components/schemas/ModelPrice" }
    ModelPrice:
      type: object
      required: [model, version, inputPricePerMillion, outputPricePerMillion, maxOutputTokens, createdAt]
      properties:
        model: { type: string }
        version: { type: integer, minimum: 1, description: "counted per model from 1; a settlement names the version that priced it" }
        inputPricePerMillion: { type: integer, format: int64, minimum: 0, description: minor units per million input tokens }
        outputPricePerMillion: { type: integer, format: int64, minimum: 0, description: minor units per million output tokens }
        maxOutputTokens: { type: integer, format: int64, minimum: 1, description: "the most output the model may produce; also the ceiling a caller's max_tokens is clamped to" }
        createdAt: { type: string, format: date-time, description: "when this version was written" }
    PriceRequest:
      type: object
      required: [model, inputPricePerMillion, outputPricePerMillion, maxOutputTokens]
      properties:
        model: { type: string, minLength: 1, maxLength: 200 }
        inputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        outputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        maxOutputTokens: { type: integer, format: int64, minimum: 1 }
    PriceVersion:
      type: object
      required: [model, version]
      properties:
        model: { type: string }
        version: { type: integer, minimum: 1, description: the version this change appended }
    AdjustOrganizationRequest:
      type: object
      required: [amountMinor, reason, idempotencyKey]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: "signed minor units: positive grants, negative deducts; never zero"
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: "why the money moved — stored as the entry's description, covered by its hash"
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: a retry writes no second entry; the same key replays the same adjustment
    PasswordResetRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 256
          description: the replacement password; the same rule signup applies
    PasswordReset:
      type: object
      required: [userId, sessionsRevoked]
      properties:
        userId: { type: string, format: uuid, description: the account the password now belongs to }
        sessionsRevoked: { type: integer, minimum: 0, description: live sessions the reset revoked }
    AdminAdjustment:
      type: object
      required: [entryId, organizationId, amountMinor, reason, availableMinor]
      properties:
        entryId: { type: string, description: "the ledger entry's id, derived from the idempotency key" }
        organizationId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64 }
        reason: { type: string }
        availableMinor:
          type: integer
          format: int64
          description: the organization's available balance after the adjustment
    AdminOrganization:
      type: object
      required: [id, name, kind, members, createdAt, availableMinor, reservedMinor]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [personal, team] }
        members: { type: integer, format: int64, minimum: 0, description: how many people belong to the organization }
        createdAt: { type: string, format: date-time }
        availableMinor: { type: integer, format: int64, description: settled minus unsettled holds }
        reservedMinor: { type: integer, format: int64, minimum: 0, description: the sum of the organization's outstanding holds }
    AdminHold:
      type: object
      required: [organization, requestId, model, channel, priceVersion, freezeMinor, openedAt]
      properties:
        organization: { type: string, description: the name of the organization whose ledger holds the freeze }
        requestId: { type: string, description: "the x-oxsum-request-id the turn was taken under" }
        model: { type: string }
        channel: { type: string }
        priceVersion: { type: integer, minimum: 1, description: the version the turn froze at }
        freezeMinor: { type: integer, format: int64, minimum: 1, description: what was frozen, in minor units }
        openedAt: { type: string, format: date-time, description: when the hold was taken }
    AdminAnomaly:
      type: object
      required: [organization, requestId, model, channel, priceVersion, kind, chargedMinor, freezeMinor, bookedOn]
      properties:
        organization: { type: string, description: the organization whose ledger recorded the turn }
        requestId: { type: string }
        model: { type: string }
        channel: { type: string, description: the channel that served the turn }
        priceVersion: { type: integer, minimum: 1 }
        kind: { type: string, enum: [capped, estimated, client_cancelled, swept], description: how the turn was priced; the anomalous kinds }
        chargedMinor: { type: integer, format: int64, minimum: 0, description: what the settlement charged, in minor units }
        freezeMinor: { type: integer, format: int64, minimum: 1, description: what had been frozen, in minor units }
        bookedOn: { type: string, format: date, description: the settlement's booking date }
    AdminClosing:
      type: object
      required: [organization, period, entryCount, treeSize, treeRoot, trialBalanceRoot, sealHash]
      properties:
        organization: { type: string, description: the organization whose ledger sealed the month }
        period: { type: string, description: "the sealed period, `YYYY-MM`" }
        entryCount: { type: integer, format: int64, minimum: 0, description: how many of the log's entries the period contains }
        treeSize: { type: integer, format: int64, minimum: 0, description: the log's size at the moment of sealing }
        treeRoot: { type: string, description: the log's tree head at sealing, hex — what the month committed to }
        trialBalanceRoot: { type: string, description: the Merkle root over the period's closing trial balance, hex }
        sealHash: { type: string, description: the seal's own hash, hex — it chains onto the seal before it }
    CloseMonthRequest:
      type: object
      required: [month]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", description: "the month to close, `YYYY-MM`; it must have fully ended" }
    AmountRequest:
      type: object
      required: [idempotencyKey, amountMinor]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, description: UTF-8 idempotency key; the server accepts at most 128 bytes }
        amountMinor: { type: integer, format: int64, minimum: 1 }
    SettleRequest:
      type: object
      required: [holdKey, actualMinor]
      properties:
        holdKey: { type: string, minLength: 1, maxLength: 128, description: the idempotency key of the hold this settlement releases; the hold's amount is read from the ledger, and one hold settles at most once }
        actualMinor: { type: integer, format: int64, minimum: 0, description: actual usage, must not exceed the hold's amount }
    Receipt:
      type: object
      required: [entryId, contentHash, isNew]
      properties:
        entryId: { type: string, format: uuid }
        logIndex: { type: [integer, "null"], format: int64 }
        contentHash: { type: string, description: 32-byte hash, lowercase hex; keep it for verification }
        isNew: { type: boolean, description: false means an idempotent replay, nothing new was written }
    TreeHead:
      type: object
      required: [size, root]
      properties:
        size: { type: integer, format: int64, description: "tree size: number of entries in the log" }
        root: { type: string, description: 32-byte hash, lowercase hex }
    VerifyingKey:
      type: object
      required: [keyName, publicKey, keyHash]
      properties:
        keyName: { type: string, description: "the key name the operator signs under" }
        publicKey: { type: string, description: "the operator's Ed25519 verifying key, base64 of 32 bytes" }
        keyHash: { type: string, description: "the 4-byte selector this key's note signatures carry, lowercase hex" }
    SignedTreeHead:
      type: object
      required: [note, origin, keyName, publicKey, keyHash, size, root]
      properties:
        note: { type: string, description: "the complete C2SP signed-note text: body, blank line, signature lines" }
        origin: { type: string, description: "the log this head belongs to: `oxsum/ledgers/<tenant_id>`" }
        keyName: { type: string }
        publicKey: { type: string, description: "the operator's Ed25519 verifying key, base64 of 32 bytes" }
        keyHash: { type: string, description: "the 4-byte selector this key's note signatures carry, lowercase hex" }
        size: { type: integer, format: int64, description: "tree size: number of entries in the log" }
        root: { type: string, description: 32-byte hash, lowercase hex }
    ConsistencyProof:
      type: object
      required: [oldSize, newSize, path]
      properties:
        oldSize: { type: integer, format: int64, description: "the tree size the proof starts at; never 0" }
        newSize: { type: integer, format: int64, description: "the tree size the proof ends at" }
        path: { type: array, items: { type: string }, description: "proof hashes, lowercase hex, in doubleentry's consistency-proof order" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, INSUFFICIENT_FUNDS, KEY_LIMIT_EXCEEDED, NOT_FOUND, CONFLICT, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
            message: { type: string }
            details: { type: array, items: {} }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      description: |
        The fields the gateway acts on. Everything else is forwarded to upstream unchanged — temperature,
        tools, response_format, seed and the rest — which is what keeps an OpenAI SDK working here.
      properties:
        model: { type: string, description: must be a model with a configured price }
        messages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ChatMessage" }
        stream: { type: [boolean, "null"], default: false, description: "absent or null counts as false; a stream is terminated by `data: [DONE]`" }
        max_tokens: { type: [integer, "null"], format: int64, minimum: 1, description: "the output upper bound the freeze uses; absent or null means the model's configured maximum, and a value below 1 is 400" }
        max_completion_tokens: { type: [integer, "null"], format: int64, minimum: 1, description: "newer spelling of max_tokens; when both are present this one wins, and null counts as absent" }
      additionalProperties: true
    ChatMessage:
      type: object
      description: |
        One message, as the gateway reads it. What it does not read — `role` included — is forwarded
        upstream unchanged, and upstream is the authority on it. `content` is read, to compute the
        input bound the freeze is computed for, and only text is accepted: a part of any other type
        (an image, say) has no computable bound, so the request is refused with 400. An absent or
        null `content` is accepted too — an assistant turn that only calls a tool carries no text and
        contributes none to the bound.
      properties:
        role: { type: string, description: "sent upstream as written; the gateway accepts any role and validates none" }
        content:
          type: [string, array, "null"]
          description: "text, an array of text parts, or absent/null. Anything else — a number, an object, a part whose `type` is not `text`, or a text part without a `text` string — is 400"
          items:
            type: object
            required: [type, text]
            properties:
              type: { type: string, const: text }
              text: { type: string }
        name: { type: string }
        tool_call_id: { type: string }
      additionalProperties: true
    ChatCompletion:
      type: object
      description: |
        Upstream's response, passed through unchanged. The only field oxsum reads is `usage`; without it
        the turn settles on local estimation.
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer, format: int64 }
        model: { type: string }
        choices: { type: array, items: { type: object } }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer, format: int64 }
            completion_tokens: { type: integer, format: int64 }
            total_tokens: { type: integer, format: int64 }
      additionalProperties: true
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            type: object
            required: [id, object, created, owned_by]
            properties:
              id: { type: string }
              object: { type: string, const: model }
              created: { type: integer, format: int64 }
              owned_by: { type: string, description: the configured channel's name }
    GatewayError:
      type: object
      required: [error]
      description: OpenAI's error object, because that is what an OpenAI SDK shows its caller.
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - insufficient_quota
                - api_error
            param: { type: [string, "null"] }
            code:
              type: [string, "null"]
              description: >-
                oxsum's own code: VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, CONFLICT,
                INSUFFICIENT_FUNDS, KEY_LIMIT_EXCEEDED, UPSTREAM_ERROR or INTERNAL_ERROR.
                A key past its spend limit arrives as 429 KEY_LIMIT_EXCEEDED with the
                `insufficient_quota` type, the same type the 402 INSUFFICIENT_FUNDS refusal carries.
  responses:
    Receipt:
      description: The ledger receipt
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/Receipt" }
    Error:
      description: An error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GatewayError:
      description: An OpenAI-shaped error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GatewayError" }
