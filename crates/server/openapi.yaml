        ratePerCredit: { type: string, maxLength: 30, pattern: '^[0-9]+(\.[0-9]+)?$', description: Exact positive currency-major amount per one credit; at most eight fractional digits and a signed-64-bit mantissa. Provider minor amounts use two decimal digits. }
