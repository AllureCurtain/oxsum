      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256, description: at least 12 characters }
        organizationName: { type: string, minLength: 1, maxLength: 80, description: name of the personal organization; defaults to the local part of the email }
        turnstileToken: { type: [string, "null"], description: "the widget's response token — required when the deployment configures the anti-bot check" }
    Registration:
      type: object
      required: [user, organization, apiKey, verificationSent]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        apiKey: { $ref: "#/components/schemas/CreatedApiKey" }
        verificationSent:
          type: boolean
          description: whether a verification mail went out — always false on a deployment without a mailer
    DeviceCodeResponse:
      type: object
      required: [deviceCode, userCode, verificationUri, expiresIn, interval]
      properties:
        deviceCode:
          type: string
          description: "the tool's credential for polling, `oxd-` plus 32 random bytes — only its SHA-256 is stored"
        userCode:
          type: string
          description: "what the user types at the approval page, `XXXX-XXXX` — only its SHA-256 is stored"
        verificationUri: { type: string, description: "the page that takes the user code; built from OXSUM_PUBLIC_URL" }
        expiresIn: { type: integer, description: "seconds until both codes lapse" }
        interval: { type: integer, description: "minimum seconds between token polls" }
    DeviceRequest:
      type: object
      required: [userCode, createdAt, expiresAt]
      properties:
        userCode: { type: string, description: "the code as it was minted, `XXXX-XXXX`" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    DeviceAuthorizeRequest:
      type: object
      required: [userCode, approve]
      properties:
        userCode: { type: string, description: "the code the user typed; dashes and case are ignored" }
        approve: { type: boolean, description: "true grants a key into the session's organization; false denies the request" }
    DeviceTokenRequest:
      type: object
      required: [deviceCode]
      properties:
        deviceCode: { type: string }
    DeviceTokenResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, denied, approved, consumed]
          description: "pending waits on the user; denied is final; approved carries the minted key, once; consumed means the key was already delivered"
        apiKey:
          $ref: "#/components/schemas/CreatedApiKey"
    User:
      type: object
      required: [id, email, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        emailVerified:
          type: boolean
          description: whether the address has been verified through a mailed token
    VerifyRequestResult:
      type: object
      required: [sent, alreadyVerified]
      properties:
        sent:
          type: boolean
          description: whether a verification mail went out — false is the sixty-second resend cooldown
        alreadyVerified:
          type: boolean
          description: the address was already verified, so nothing was mailed
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 256, description: the `oxt-…` token the verification mail's link carries }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 256, description: the `oxt-…` token the reset mail's link carries }
        password: { type: string, minLength: 12, maxLength: 256, description: at least 12 characters }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256, description: at least 12 characters }
    Session:
      type: object
      required: [id, createdAt, expiresAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "absolute expiry: thirty days after login, no sliding renewal in v1" }
        lastUsedAt: { type: string, format: date-time, description: "the last authenticated request; touched at most once per five minutes" }
    UserOrganization:
      type: object
      required: [organization, role]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        role: { type: string, enum: [owner, admin, member], description: "the role the session's user holds in this organization" }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "the new team organization's name" }
    SwitchOrganizationRequest:
      type: object
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid, description: "must be an organization the session's user is a member of" }
    AccountDeletion:
      type: object
      description: What `DELETE /api/v1/users/me` removed — the ledger is untouched, so no count covers it.
      required: [sessionsRevoked, keysRevoked, membershipsRemoved]
      properties:
        sessionsRevoked: { type: integer, format: int64, description: "sessions the account held, now dead" }
        keysRevoked: { type: integer, format: int64, description: "API keys the account minted, now dead" }
        membershipsRemoved: { type: integer, format: int64, description: "memberships the account left; the organizations stay" }
    SessionInfo:
      type: object
      required: [user, organization, role, session]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        role: { type: string, enum: [owner, admin, member], description: "the user's role in the organization the session acts as" }
        session: { $ref: "#/components/schemas/Session" }
    LogoutResponse:
      type: object
      description: "empty: the logout is in the Set-Cookie header that clears the cookie"
    TotpRequired:
      type: object
      required: [requiresTotp, challengeToken]
      description: "`POST /api/v1/auth/login`'s answer on an account with a confirmed second factor — no session, no cookie; `POST /api/v1/auth/totp` trades `challengeToken` plus a live code for the session (issue #504)"
      properties:
        requiresTotp: { type: boolean, enum: [true] }
        challengeToken: { type: string, description: "single-use, ten-minute-lived; present it with a code at `POST /api/v1/auth/totp`" }
    AuthMethods:
      type: object
      required: [oauthGithub, oidcProviders]
      properties:
        oauthGithub: { type: boolean, description: "true when the GitHub OAuth client pair is configured" }
        oidcProviders:
          type: array
          items: { type: string }
          description: "the route names of the configured OIDC providers (`oidc:{name}`, one per `OXSUM_OIDC_PROVIDERS` entry) — the login page draws one button per entry"
        turnstileSiteKey: { type: [string, "null"], description: "the Turnstile site key when the anti-bot check is configured — public by design, the page hands it to the widget" }
    TotpLoginRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string, description: "the `challengeToken` `POST /api/v1/auth/login` answered with `requiresTotp: true`" }
        code: { type: string, description: "a live six-digit authenticator code, or a `xxxx-xxxx` backup code (consumed on use)" }
    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "a live six-digit authenticator code" }
    TotpEnrollResponse:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret: { type: string, description: "the shared secret as base32 — the form an authenticator accepts typed in by hand" }
        otpauthUrl: { type: string, description: "`otpauth://totp/…` — what the client renders a QR from" }
    TotpConfirmResponse:
      type: object
      required: [backupCodes]
      properties:
        backupCodes:
          type: array
          items: { type: string }
          description: "ten `xxxx-xxxx` single-use recovery codes, answered this once and stored only as hashes"
    Organization:
      type: object
      required: [id, name, tenantId, kind, createdAt, displayCurrency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenantId: { type: string, description: "ledger tenant id; the ledger lives in the schema ledger_<tenantId>" }
        kind: { type: string, enum: [personal, team] }
        createdAt: { type: string, format: date-time }
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          description: "the fiat unit this organization displays its credit figures in — presentational only, set through `PATCH /api/v1/admin/organizations/{organizationId}`; null renders credits alone"
    DisplayCurrency:
      type: object
      required: [code, ratePerCredit, decimals]
      description: |
        How one credit renders as a fiat amount (issue #257). Purely presentational:
        ledger entries, settlement descriptions and proofs keep integer minor units of
        credit, and the conversion never reaches a charge — so a display-currency
        change can never alter a settled bill's verified charge.
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
          description: "the ISO 4217 unit — USD, EUR, CNY; informational: the conversion needs only the rate, so an unrecognized-but-well-formed code still renders"
        ratePerCredit:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: "how many of the unit one credit displays as, as a decimal literal — \"0.0014\" renders 1_500_000 minor (1.5 credits) as 0.00 at 2 decimals; stored as text so no float ever touches money"
        decimals:
          type: integer
          minimum: 0
          maximum: 6
          description: "the decimal places the unit renders with — 2 for most currencies, 0 for JPY-shaped ones; the render rounds half-up to this precision"
    CreateKeyRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expiresAt: { type: [string, "null"], format: date-time, description: optional expiry; an expired key authenticates nothing }
        spendLimitMinor: { type: [integer, "null"], format: int64, minimum: 0, description: "the key's spend limit in minor units: settled charges plus outstanding holds attributed to the key may not exceed it; null (the default) is unlimited" }
        budgetDuration: { type: [string, "null"], enum: [daily, weekly, monthly], description: "makes spendLimitMinor periodic over the current UTC calendar period; requires spendLimitMinor, meaningless without it" }
        modelAllowlist: { type: [array, "null"], items: { type: string, minLength: 1 }, description: "the gateway models this key may call; null (the default) allows all served models" }
        requestsPerMinute: { type: [integer, "null"], minimum: 1, description: "requests the key may start inside a rolling minute, on the gateway; null (the default) is uncapped" }
        maxConcurrentHolds: { type: [integer, "null"], minimum: 1, description: "holds the key may have outstanding at once; null (the default) is uncapped" }
        tokensPerMinute: { type: [integer, "null"], minimum: 1, description: "settled input+output tokens the key may burn inside a trailing minute, checked at admission on the gateway; null (the default) is uncapped" }
        tokensPerMinuteScopes: { $ref: "#/components/schemas/TokensPerMinuteScopes" }
        requiredPolicies: { type: [array, "null"], maxItems: 8, uniqueItems: true, items: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }, description: "the guardrail policies this key's turns must run (issue #502); every name must already exist as a configured policy, and null (the default) requires none — a turn still runs whatever its channel binds" }
        groupId: { type: [string, "null"], format: uuid, description: "the request group the key joins at mint (issue #508); the group must be the organization's own — a grouped key reaches only its group's channels, null or absent (the default) leaves it ungrouped and reaching every channel" }
    UpdateKeyConstraintsRequest:
      type: object
      properties:
        spendLimitMinor: { type: [integer, "null"], format: int64, minimum: 0, description: "the new limit in minor units, or null for unlimited" }
        budgetDuration: { type: [string, "null"], enum: [daily, weekly, monthly], description: "periodic limit window; requires spendLimitMinor; null or absent clears it" }
        modelAllowlist: { type: [array, "null"], items: { type: string, minLength: 1 }, description: "models the key may call; null or absent clears the list to allow all" }
        requestsPerMinute: { type: [integer, "null"], minimum: 1, description: "the new per-minute request allowance, or null to uncap" }
        maxConcurrentHolds: { type: [integer, "null"], minimum: 1, description: "the new outstanding-holds cap, or null to uncap" }
        tokensPerMinute: { type: [integer, "null"], minimum: 1, description: "the new per-minute settled-token allowance, or null to uncap" }
        tokensPerMinuteScopes: { $ref: "#/components/schemas/TokensPerMinuteScopes" }
        requiredPolicies: { type: [array, "null"], maxItems: 8, uniqueItems: true, items: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }, description: "the guardrail policies the key's turns must run; null or absent clears it back to none" }
        groupId: { type: [string, "null"], format: uuid, description: "the request group the key joins (issue #508) — a triple-state field: absent keeps the current group, null ungroups the key (it reaches every channel again), a group id reassigns it to that group, which must be the organization's own; assignment and constraints commit atomically; only an owner/admin session or ungrouped bearer may change groupId, and a grouped bearer cannot mutate keys" }
    ApiKey:
      type: object
      required: [id, name, prefix, createdBy, createdAt, expiresAt, revokedAt, spendLimitMinor, budgetDuration, modelAllowlist, requestsPerMinute, maxConcurrentHolds, tokensPerMinute, tokensPerMinuteScopes, requiredPolicies, groupId]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        prefix: { type: string, description: "leading characters of the secret, for recognizing the key in a list" }
        createdBy: { type: [string, "null"], format: uuid, description: "the user who minted the key, for the per-member role rules; null for keys minted with an API key" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        spendLimitMinor: { type: [integer, "null"], format: int64, minimum: 0, description: "the key's spend limit in minor units; null is unlimited" }
        budgetDuration: { type: [string, "null"], enum: [daily, weekly, monthly], description: "the window spendLimitMinor applies to; null makes the limit cumulative" }
        modelAllowlist: { type: [array, "null"], items: { type: string }, description: "models the key may call on the gateway; null allows all" }
        requestsPerMinute: { type: [integer, "null"], minimum: 1, description: "the key's rolling-minute request allowance; null is uncapped" }
        maxConcurrentHolds: { type: [integer, "null"], minimum: 1, description: "the key's outstanding-holds cap; null is uncapped" }
        tokensPerMinute: { type: [integer, "null"], minimum: 1, description: "the key's rolling-minute settled-token allowance; null is uncapped" }
        tokensPerMinuteScopes: { $ref: "#/components/schemas/TokensPerMinuteScopes" }
        requiredPolicies: { type: [array, "null"], items: { type: string }, description: "the retained guardrail policies the key's turns must run; null requires none. New writes and effective turn unions are limited to eight distinct names; historical oversized lists remain readable." }
        groupId: { type: [string, "null"], format: uuid, description: "the request group the key belongs to (issue #508); a grouped key reaches only its group's channels, null reaches every channel" }
    RequestGroupChannel:
      type: object
      required: [id, name]
      description: "A channel identity exposed with a request group so operators and key owners can review the effective access set without resolving UUIDs themselves."
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    RequestGroup:
      type: object
      required: [id, name, channelIds, channels]
      description: "A request group (issue #508): a named subset of an organization's channels its keys may serve through."
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channelIds: { type: array, items: { type: string, format: uuid }, description: "the channels a grouped key may reach" }
        channels: { type: array, items: { $ref: "#/components/schemas/RequestGroupChannel" }, description: "the readable identity of every channel in channelIds, in the same order" }
    RequestGroupChannels:
      type: object
      required: [channelIds]
      description: "The whole channel set a group installs — every id must name a real channel."
      properties:
        channelIds: { type: array, items: { type: string, format: uuid } }
    TokensPerMinuteScopes:
      type: ["object", "null"]
      additionalProperties: { $ref: "#/components/schemas/TokenScope" }
      description: "Tag-scoped slices of the key's settled-token allowance (issue #209). Maps a request `metadata` tag key to one scope; each scoped bucket is an additional cap alongside `tokensPerMinute`, not a replacement. null (the default) scopes nothing."
    ReasonCommitment:
      type: object
      additionalProperties: false
      required: [sha256, utf8Bytes]
      description: v15 settlement commitment to a complete reason omitted from inline JSON. Hashes exact UTF-8 bytes; a proof without full text does not establish reason matching or policy correctness.
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        utf8Bytes: { type: integer, format: int64, minimum: 1, maximum: 9223372036854775807 }
    GuardrailPolicy:
      type: object
      required: [name, kind, config, createdAt]
      description: "A configured guardrail policy (issue #502). `config` is the kind's own shape: `keyword` holds `{patterns: [{re, action}]}` with `action` `flag` or `block`, `pii` holds `{}`, `moderation` holds `{endpoint, timeoutMs?}`. A `moderation` policy's bearer is stored sealed and never serialized."
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }
        kind: { type: string, enum: [keyword, pii, moderation] }
        config: { type: object }
        createdAt: { type: string, format: date-time }
    GuardrailPolicyRequest:
      type: object
      required: [kind, config]
      properties:
        kind: { type: string, enum: [keyword, pii, moderation] }
        config: { type: object, description: "the kind's own shape — keyword has 1–64 patterns, each regex at most 4096 UTF-8 bytes and action flag or block; pii is the empty object; moderation is {endpoint, timeoutMs?}, with a 65536-byte response-body limit and a maximum ten-second deadline. An existing bound keyword configuration exceeding these limits refuses admission." }
        apiKey: { type: string, description: "the `moderation` kind's bearer, sealed on write and never echoed; absent keeps a stored bearer, required on the first write of a moderation policy that screens" }
    GuardrailBinding:
      type: object
      required: [scope, target, policies]
      properties:
        scope: { type: string, enum: [channel, key] }
        target: { type: string, description: "the channel's name, or the key's id" }
        policies: { type: array, items: { type: string }, description: "the retained ordered policy names; new writes and effective turn unions are limited to eight distinct names" }
    GuardrailBindingRequest:
      type: object
      required: [policies]
      properties:
        policies: { type: array, maxItems: 8, uniqueItems: true, items: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }, description: "Every name must already exist. The complete channel/key/mandate union may contain at most eight policies; an oversized effective union refuses before execution." }
    TokenScope:
      type: object
      description: "One tag scope (issue #209): exactly one of `each`, `concrete`, or `total` is set. A settled turn accrues into the bucket its `metadata` tag selects — `each` fans out per value (`tag=value`), `concrete` only the pinned value, `total` the whole tag — and the bucket's cap is checked `window-actual + estimate ≤ cap` at admission, 429 when full while other buckets stay open."
      oneOf:
        - type: object
          required: [each]
          properties:
            each: { type: integer, minimum: 1, description: "a separate bucket per value of this tag, each capped here" }
          additionalProperties: false
        - type: object
          required: [concrete, tokensPerMinute]
          properties:
            concrete: { type: string, minLength: 1, maxLength: 64, description: "the one tag value this bucket pins" }
            tokensPerMinute: { type: integer, minimum: 1, description: "the pinned bucket's settled-token allowance per minute" }
          additionalProperties: false
        - type: object
          required: [total]
          properties:
            total: { type: integer, minimum: 1, description: "one bucket over every value of this tag, capped here" }
          additionalProperties: false
    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "the plaintext key; shown once and stored only as a SHA-256 hash" }
    Entitlement:
      type: object
      required: [allowed]
      description: "The read-only admission preview (issue #501): whether the key's request would be admitted now, and the headroom each checked constraint leaves. A snapshot, not a reservation — a racing request may spend what it reports."
      properties:
        allowed: { type: boolean, description: "whether a request with these parameters would be admitted now" }
        reason:
          type: [string, "null"]
          enum: [key_inactive, org_suspended, model_not_allowed, rpm_exceeded, tpm_exceeded, budget_exhausted, concurrent_holds, mandate_invalid, mandate_window, mandate_model, mandate_cap, null]
          description: "which check refused, when `allowed` is false; null when admitted"
        remainingRpm: { type: [integer, "null"], minimum: 0, description: "free request slots in the key's rolling minute; null while the window itself refuses" }
        remainingTpm: { type: [integer, "null"], format: int64, minimum: 0, description: "settled-token headroom inside the rolling minute against the estimate; null when the key is uncapped" }
        remainingBudgetMinor: { type: [integer, "null"], format: int64, description: "the spend limit minus committed spend, in minor units; null when the key is unlimited" }
        concurrentHolds: { type: integer, format: int64, minimum: 0, description: "how many holds the key has outstanding now" }
        retryAfterSecs: { type: [integer, "null"], minimum: 0, description: "when a refusing window frees — for `Retry-After`-style backoff" }
        checks:
          type: object
          description: "the per-constraint verdict, for a surface that wants the whole picture rather than the first refusal"
          properties:
            keyActive: { type: boolean }
            orgSuspended: { type: boolean }
            modelAllowed: { type: [boolean, "null"], description: "null when no model was asked" }
            rpmOk: { type: [boolean, "null"], description: "null when the key is uncapped" }
            tpmOk: { type: [boolean, "null"], description: "null when the key is uncapped" }
            budgetOk: { type: [boolean, "null"], description: "null when the key is unlimited" }
            holdsOk: { type: [boolean, "null"], description: "null when the key is uncapped" }
            mandateOk: { type: [boolean, "null"], description: "null when no mandate was presented" }
    Mandate:
      type: object
      required: [mandateId, keyId, capMinor, models, requiredPolicies, notBefore, notAfter, nonce]
      properties:
        mandateId: { type: string, format: uuid, description: "the stable id a mandate's committed spend keys on" }
        keyId: { type: string, format: uuid, description: "the key this delegates" }
        capMinor: { type: integer, format: int64, minimum: 1, description: "total committed spend this mandate may carry, in minor units" }
        models: { type: [array, "null"], items: { type: string }, description: "the model allowlist — a subset of the key's own; null means all the key serves" }
        requiredPolicies: { type: [array, "null"], items: { type: string }, description: "the retained guardrail policies this mandate requires — a subset of the key's own; null means all the key requires (issue #502). Historical oversized lists remain readable; effective turn unions are limited to eight distinct names." }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time, description: "when the mandate expires — there is no revocation, so mandates are short-lived" }
        nonce: { type: string, description: "uniqueness; hex of 16 random bytes" }
        createdAt: { type: string, format: date-time }
    CreatedMandate:
      allOf:
        - $ref: "#/components/schemas/Mandate"
        - type: object
          required: [mandate]
          properties:
            mandate: { type: string, description: "base64url of the canonical body plus its Ed25519 signature — the blob the delegate presents in `X-Oxsum-Mandate`" }
    CreateMandateRequest:
      type: object
      required: [capMinor, notAfter]
      properties:
        capMinor: { type: integer, format: int64, minimum: 1, description: "total committed spend the mandate may carry — must sit inside the key's own `spendLimitMinor` when the key has one" }
        models: { type: [array, "null"], items: { type: string }, description: "the model allowlist — must be a subset of the key's own `modelAllowlist` when the key has one; omitted or null means all the key serves" }
        requiredPolicies: { type: [array, "null"], maxItems: 8, uniqueItems: true, items: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }, description: "the guardrail policies the mandate's turns must run (issue #502) — a subset of the key's own `requiredPolicies`, never an addition the key does not already name; omitted or null means all the key requires" }
        notBefore: { type: string, format: date-time, description: "when the mandate starts being honored; absent means now" }
        notAfter: { type: string, format: date-time, description: "when the mandate expires — required, because no revocation exists" }
    Member:
      type: object
      required: [userId, email, role, joinedAt]
      properties:
        userId: { type: string, format: uuid, description: "the user's id, which the membership endpoints address a member by" }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member], description: "the member's role in this organization; a platform admin is a deployment identity, not a role here" }
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: "the member's committed-spend cap across every key they minted; null carries none"
        teamId:
          type: string
          format: uuid
          nullable: true
          description: "the team the member belongs to (issue #440); null means unassigned — no team cap applies to the member's keys"
        joinedAt: { type: string, format: date-time, description: when the membership was created }
    Experiment:
      type: object
      required: [id, name, variants, status, createdAt]
      properties:
        id: { type: string, format: uuid, description: "the experiment's own id — what `X-Oxsum-Experiment` and `experimentId` name" }
        name: { type: string, description: "the experiment's name — unique per organization" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
          description: "the variant set `[{model, weight}]` the pick draws from"
        status:
          type: string
          enum: [open, ended]
          description: "`open` serves variants under `X-Oxsum-Experiment`; `ended` resolves the plain `model` instead"
        createdAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true, description: "when the experiment was ended; null while open" }
    Variant:
      type: object
      required: [model, weight]
      properties:
        model: { type: string, minLength: 1, maxLength: 200, description: "the model this variant serves — must resolve to a served model or an alias" }
        weight: { type: integer, format: int64, minimum: 1, description: "the variant's relative share of the weighted pick" }
    PutExperimentRequest:
      type: object
      required: [variants]
      properties:
        variants:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/Variant" }
          description: "the whole variant set — replaced atomically; every `model` must be served, every `weight` ≥ 1"
    VariantResult:
      type: object
      required: [variant, turns, inputTokens, outputTokens, chargedMinor, errored]
      properties:
        variant: { type: string, description: "the variant's model name — the group key" }
        turns: { type: integer, format: int64, description: "how many settled turns served this variant" }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        chargedMinor: { type: integer, format: int64, description: "what the variant's turns charged, in minor units" }
        errored: { type: integer, format: int64, description: "how many turns errored — served nothing after their hold" }
    Team:
      type: object
      required: [teamId, name, members, createdAt]
      properties:
        teamId: { type: string, format: uuid, description: "the team's id, which the team endpoints address it by" }
        name: { type: string, description: "the subgroup's name — unique per organization" }
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: "the team's committed-spend cap across every key its members minted; null carries none"
        members: { type: integer, format: int64, description: "how many memberships the team groups today" }
        createdAt: { type: string, format: date-time, description: when the team was created }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "the subgroup's name — unique per organization" }
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: "the team's committed-spend cap across every key its members minted; absent or null carries none"
    UpdateTeamRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "the team's new name" }
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: |
            the team's committed-spend cap across every key its members minted — absent leaves it,
            an explicit null clears it. At least one of `name` and `budgetLimitMinor` is required.
    UpdateMemberRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, member]
          description: |
            the member's new role. `owner` is not a value here on purpose: ownership is a single
            seat moved by `POST /api/v1/org/ownership`, so this endpoint cannot promote anyone.
        budgetLimitMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: |
            the member's committed-spend cap across every key they minted — absent leaves it, an
            explicit null clears it.
        teamId:
          type: string
          format: uuid
          nullable: true
          description: |
            the team the member joins (issue #440) — absent leaves the assignment, an explicit
            null unassigns, a team id moves the member under that team's `budgetLimitMinor` for
            their *next* hold. Committed spend follows the roster: the money their keys already
            spent moves with them. A team outside the organization is `NOT_FOUND`. At least one
            of `role`, `budgetLimitMinor` and `teamId` is required.
    TransferOwnershipRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid, description: "the member who becomes the owner; they are an admin or a member of this organization" }
    Ownership:
      type: object
      required: [owner, previousOwner]
      properties:
        owner: { $ref: "#/components/schemas/Member", description: "the new owner, in the owner role" }
        previousOwner: { $ref: "#/components/schemas/Member", description: "the owner who transferred it, now an admin" }
    WebhookEndpoint:
      type: object
      required: [id, url, events, enabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: "where signed events are posted" }
        events:
          type: array
          items:
            type: string
            enum:
              - request.settled
              - org.suspended
              - deposit.credited
              - deposit.failed
              - deposit.reversed
              - balance.low
              - statement.finalized
              - statement.payment_overdue
              - statement.payment_status_updated
              - org.credit_limit_exceeded
              - anomaly.detected
              - budget.exhaustion_forecast
              - budget.threshold_crossed
          description: the event types this endpoint is subscribed to
        enabled: { type: boolean, description: "a disabled endpoint enqueues nothing" }
        balanceLowMinor:
          type: integer
          format: int64
          nullable: true
          description: "the available-balance line `balance.low` fires below; absent or null leaves the endpoint deaf to the balance"
        budgetThresholdsPercent:
          type: array
          items: { type: integer, minimum: 1, maximum: 100 }
          description: "the consumption percentages `budget.threshold_crossed` fires at — each scope a settle re-evaluates (key spendLimitMinor, minting member's budgetLimitMinor, organization credit line) fires once per window; empty leaves the endpoint deaf"
        secretLast4: { type: string, description: "the last four characters of the signing secret, for recognizing it" }
        createdAt: { type: string, format: date-time }
    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri, minLength: 1, maxLength: 500, description: "the HTTPS (or localhost HTTP) address events are posted to" }
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - request.settled
              - org.suspended
              - deposit.credited
              - deposit.failed
              - deposit.reversed
              - balance.low
              - statement.finalized
              - statement.payment_overdue
              - statement.payment_status_updated
              - org.credit_limit_exceeded
              - anomaly.detected
              - budget.exhaustion_forecast
              - budget.threshold_crossed
          description: "the event types to subscribe; the catalog is listed under the operation's description"
        balanceLowMinor:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: "the available-balance line `balance.low` fires below; absent or null leaves the endpoint deaf to the balance"
        budgetThresholdsPercent:
          type: array
          items: { type: integer, minimum: 1, maximum: 100 }
          description: "the consumption percentages `budget.threshold_crossed` fires at (issue #232); absent or empty leaves the endpoint deaf"
    CreatedWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "the signing secret (`whsec-…`); shown once, stored sealed under OXSUM_SECRET_KEY" }
    WebhookDelivery:
      type: object
      required: [id, eventType, status, attempts, nextAttemptAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        endpointId: { type: string, format: uuid }
        eventType:
          type: string
          enum:
            - request.settled
            - org.suspended
            - deposit.credited
            - deposit.failed
            - deposit.reversed
            - balance.low
            - statement.finalized
            - statement.payment_overdue
            - statement.payment_status_updated
            - org.credit_limit_exceeded
            - anomaly.detected
            - budget.exhaustion_forecast
        status: { type: string, enum: [pending, sending, delivered, failed], description: "sending is a worker's claim in flight; delivered means a 2xx; failed means the ten-attempt budget ran out" }
        attempts: { type: integer, minimum: 0 }
        nextAttemptAt: { type: string, format: date-time, description: "when the worker next tries a pending delivery; the creation time for a finished one" }
        responseStatus: { type: [integer, "null"], description: "the HTTP status the receiver last answered, when it answered at all" }
        lastError: { type: [string, "null"], description: "the last failure, when the last attempt failed before a response" }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
    ChannelRequest:
      type: object
      required: [name, baseUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9._-]+$", description: the channel's identity; posting an existing name replaces its connection }
        baseUrl: { type: string, format: uri, description: "where the upstream surface lives, http or https; the protocol's path (`/chat/completions`, `/messages`, `models/{model}:<action>`) is appended to it" }
        apiKey: { type: string, minLength: 1, description: "the upstream credential, single-key spelling — merged into `apiKeys` when both arrive. Sealed with OXSUM_SECRET_KEY, only its last four characters readable afterwards. Sent upstream as `Authorization: Bearer` on an `openai` channel, as `x-api-key` on an `anthropic` one, and as `x-goog-api-key` on a `gemini` one" }
        apiKeys:
          type: array
          items: { type: string, minLength: 1 }
          description: "the channel's credential pool (issue #444): the whole ordered set of upstream keys — a `set` re-credentials the channel wholesale, so every key the pool should hold goes here. Absent leaves the stored pool untouched; a present empty array is VALIDATION_ERROR — a channel with no key cannot serve. One of `apiKey`/`apiKeys` is required when creating a channel."
        billKey: { type: string, minLength: 1, nullable: true, description: "the admin billing credential the upstream-bill-sync pass reads the provider's cost API under (issue #283) — sealed beside the metering keys, deliberately separate so a relay credential never reads the org's bill. Omit to leave any stored billing key untouched; explicit null clears it." }
        protocol: { type: string, enum: [openai, anthropic, gemini], description: "the upstream protocol the channel speaks, which selects the usage adapter its reports are normalized by and which surface serves its models: `/v1/*` for `openai` and `anthropic`, `/v1beta/*` for `gemini`; defaults to `openai` — any other name is VALIDATION_ERROR" }
        destinationPolicy: { $ref: "#/components/schemas/ProviderDestinationPolicy" }
        semanticCache:
          type: object
          nullable: true
          description: "the channel's semantic response cache policy (issue #497): `{enabled, ttlSeconds?, excludeSystem?}` — `enabled` gates the whole feature; `ttlSeconds` bounds a stored answer's lifetime (absent means no expiry); `excludeSystem` is deprecated and ignored; system/instructions always participate in the complete request digest. Omit to leave the stored policy untouched; explicit null clears `settings.semanticCache`; a non-object or a malformed policy is VALIDATION_ERROR."
          properties:
            enabled: { type: boolean }
            ttlSeconds: { type: integer, format: int64, minimum: 1 }
            excludeSystem: { type: boolean, deprecated: true, description: "Accepted for compatibility, ignored; system/instructions always participate in the cache key." }
          additionalProperties: true
    ChannelCredential:
      type: object
      required: [credentialId, apiKeyLast4, position, status, cooldownUntil, lastError, lastUsedAt, createdAt]
      properties:
        credentialId: { type: string, format: uuid }
        apiKeyLast4: { type: string, description: "the last four characters of the upstream key, and nothing more of it" }
        position: { type: integer, description: "the pick order inside the pool — lower tries first when nothing else ranks" }
        status: { type: string, enum: [active, disabled], description: "`active` picks normally; `disabled` is kept on record, never picked" }
        cooldownUntil: { type: [string, "null"], format: date-time, description: "the health cool-down the pick honours until — a credential that kept refusing upstream rests out the window, then lets itself back in" }
        lastError: { type: [string, "null"], description: "what cooled it, for the admin list; observability, never a pick input" }
        lastUsedAt: { type: [string, "null"], format: date-time, description: "when this credential last led an upstream call — the least-recently-used pick's input; null means never used" }
        createdAt: { type: string, format: date-time }
    Channel:
      type: object
      required: [id, name, baseUrl, protocol, credentials, billKeyLast4, settings, createdAt, models]
      properties:
        id: { type: string, format: uuid, description: "stable channel identity used in request groups" }
        name: { type: string }
        baseUrl: { type: string }
        protocol: { type: string, description: "the upstream protocol the channel speaks" }
        credentials:
          type: array
          description: "the channel's credential pool (issue #444): one entry per upstream key, ordered by position, each showing only its last four plus the health state the pick reads"
          items: { $ref: "#/components/schemas/ChannelCredential" }
        billKeyLast4: { type: string, nullable: true, description: "the last four characters of the admin billing credential (issue #283), and nothing more of it; null when the channel carries none" }
        settings:
          type: object
          description: "The channel's settings (issue #497); business reads redact unsupported fields. An absent destinationPolicy means public."
          additionalProperties: true
          properties:
            destinationPolicy: { $ref: "#/components/schemas/ProviderDestinationPolicy" }
        createdAt: { type: string, format: date-time }
        models:
          type: array
          description: one entry per model, at its current version
          items: { $ref: "#/components/schemas/ModelPrice" }
    CheckoutChoice:
      type: object
      additionalProperties: false
      required: [revision, merchantId, versionId]
      properties:
        revision: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        merchantId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
    CheckoutRoute:
      type: object
      required: [rail, revision, source, merchantId, versionId, name, mode, available]
      properties:
        rail: { $ref: "#/components/schemas/MerchantRail" }
        revision: { type: integer, format: int64, minimum: 0 }
        source: { type: string, enum: [owner, environment, unconfigured] }
        merchantId: { type: [string, "null"], format: uuid }
        versionId: { type: [string, "null"], format: uuid }
        name: { type: [string, "null"] }
        mode: { anyOf: [{ $ref: "#/components/schemas/MerchantMode" }, { type: "null" }] }
        available: { type: boolean, description: Selected merchant is enabled; no external certification implied. }
    CheckoutRouteRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, rail, expectedRevision, merchantId]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        rail: { $ref: "#/components/schemas/MerchantRail" }
        expectedRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        merchantId: { type: [string, "null"], format: uuid, description: Null explicitly disables this rail. }
    CheckoutRouteMutation:
      type: object
      required: [id, route]
      properties:
        id: { type: string, format: uuid }
        route: { $ref: "#/components/schemas/CheckoutRoute" }
    MerchantRail:
      type: string
      enum: [hyperswitch, stripe, airwallex]
    MerchantMode:
      type: string
      enum: [test, live]
    MerchantVersionInput:
      type: object
      additionalProperties: false
      required: [apiUrl, apiKey, webhookSecret]
      description: Complete configuration for one immutable version. Hyperswitch requires publishableKey and sdkUrl; Airwallex requires clientId and checkoutUrl. Fields belonging only to another rail are rejected. API destination rules are shared with provider connections; browser SDK/checkout URLs must be public HTTPS URLs without user info, query or fragment. Secrets are encrypted together and never returned.
      properties:
        apiUrl: { type: string, format: uri }
        apiKey: { type: string, minLength: 8, maxLength: 8192, writeOnly: true }
        webhookSecret: { type: string, minLength: 8, maxLength: 8192, writeOnly: true }
        clientId: { type: [string, "null"], minLength: 1, maxLength: 200, writeOnly: true }
        publishableKey: { type: [string, "null"], minLength: 1, maxLength: 200 }
        sdkUrl: { type: [string, "null"], format: uri }
        checkoutUrl: { type: [string, "null"], format: uri }
        destinationPolicy: { $ref: "#/components/schemas/ProviderDestinationPolicy" }
    MerchantCreateRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, name, rail, mode, accountId, config]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        name: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        rail: { $ref: "#/components/schemas/MerchantRail" }
        mode: { $ref: "#/components/schemas/MerchantMode" }
        accountId: { type: string, minLength: 1, maxLength: 200, description: Stable provider merchant/account identifier; unique per business, rail and mode. }
        config: { $ref: "#/components/schemas/MerchantVersionInput" }
    MerchantVersionRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, config]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        config: { $ref: "#/components/schemas/MerchantVersionInput" }
    MerchantStatusRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, enabled]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        enabled: { type: boolean }
    MerchantMutationResult:
      type: object
      required: [id, merchantId, versionId, revision, enabled]
      properties:
        id: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        enabled: { type: boolean }
    MerchantVersion:
      type: object
      required: [id, merchantId, revision, apiUrl, publishableKey, sdkUrl, checkoutUrl, destinationPolicy, source, validationStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        apiUrl: { type: string, format: uri }
        publishableKey: { type: [string, "null"] }
        sdkUrl: { type: [string, "null"], format: uri }
        checkoutUrl: { type: [string, "null"], format: uri }
        destinationPolicy: { $ref: "#/components/schemas/ProviderDestinationPolicy" }
        source: { type: string, enum: [owner, environment] }
        validationStatus: { type: string, enum: [locallyValidated], description: Shape and destination syntax validated; external credentials and payments remain uncertified. }
        createdAt: { type: string, format: date-time }
    Merchant:
      type: object
      required: [id, businessId, name, rail, mode, accountId, connector, supportStatus, enabled, currentVersion]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        name: { type: string }
        rail: { $ref: "#/components/schemas/MerchantRail" }
        mode: { $ref: "#/components/schemas/MerchantMode" }
        accountId: { type: string }
        connector: { type: string, enum: [stripe, direct] }
        supportStatus: { type: string, enum: [primary, compatibility] }
        enabled: { type: boolean }
        currentVersion: { $ref: "#/components/schemas/MerchantVersion" }
    MerchantPage:
      type: object
      required: [merchants, nextCursor]
      properties:
        merchants: { type: array, items: { $ref: "#/components/schemas/Merchant" } }
        nextCursor: { type: [string, "null"], format: uuid }
    MerchantVersionPage:
      type: object
      required: [versions, nextCursor]
      properties:
        versions: { type: array, items: { $ref: "#/components/schemas/MerchantVersion" } }
        nextCursor: { type: [integer, "null"], format: int64 }
    SalePriceSet:
      type: object
      additionalProperties: false
      description: Customer rates only. Optional cache/reasoning rates fall back to their base input/output rate. No supplier cost fields.
      required: [inputPricePerMillion]
      properties:
        inputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        outputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        maxOutputTokens: { type: integer, format: int64, minimum: 0 }
        cacheReadPricePerMillion: { type: [integer, "null"], format: int64, minimum: 0 }
        cacheWrite5mPricePerMillion: { type: [integer, "null"], format: int64, minimum: 0 }
        cacheWrite1hPricePerMillion: { type: [integer, "null"], format: int64, minimum: 0 }
        reasoningPricePerMillion: { type: [integer, "null"], format: int64, minimum: 0 }
        costPerRequest: { type: [integer, "null"], format: int64, minimum: 0 }
    SalePriceMatch:
      type: object
      additionalProperties: false
      description: At least one condition; inclusive token bounds. Equal-specificity overlapping rules are refused.
      properties:
        serviceTier: { type: [string, "null"], minLength: 1, maxLength: 64 }
        minInputTokens: { type: [integer, "null"], format: int64, minimum: 0 }
        maxInputTokens: { type: [integer, "null"], format: int64, minimum: 0 }
    SalePriceRule:
      type: object
      additionalProperties: false
      required: [match, price]
      properties:
        match: { $ref: "#/components/schemas/SalePriceMatch" }
        price: { $ref: "#/components/schemas/SalePriceSet" }
    SalePrice:
      type: object
      additionalProperties: false
      description: Existing whole-set conditional rating. Chat requires positive maxOutputTokens; embeddings/rerank require zero output and maximum; event requires zero maximum.
      required: [inputPricePerMillion]
      properties:
        inputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        outputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        maxOutputTokens: { type: integer, format: int64, minimum: 0 }
        cacheReadPricePerMillion: { type: [integer, "null"], format: int64, minimum: 0 }
        cacheWrite5mPricePerMillion: { type: [integer, "null"], format: int64, minimum: 0 }
        cacheWrite1hPricePerMillion: { type: [integer, "null"], format: int64, minimum: 0 }
        reasoningPricePerMillion: { type: [integer, "null"], format: int64, minimum: 0 }
        costPerRequest: { type: [integer, "null"], format: int64, minimum: 0 }
        mode: { type: string, enum: [chat, embeddings, rerank, event], default: chat }
        rules: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/SalePriceRule" } }
    SaleTerms:
      type: object
      additionalProperties: false
      description: The selected percentage is the only discount, applied once; zero means no discount. All amounts are credits in integer minor units.
      required: [price]
      properties:
        price: { $ref: "#/components/schemas/SalePrice" }
        discountPercent: { type: integer, format: int64, minimum: 0, maximum: 100, default: 0 }
    CreateSaleBook:
      type: object
      additionalProperties: false
      required: [operation, name]
      properties:
        operation: { const: createBook }
        name: { type: string, minLength: 1, maxLength: 200 }
    SaveSaleDraft:
      type: object
      additionalProperties: false
      required: [operation, bookId, expectedRevision, models]
      properties:
        operation: { const: saveDraft }
        bookId: { type: string, format: uuid }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
        models: { type: object, minProperties: 1, maxProperties: 500, additionalProperties: { $ref: "#/components/schemas/SaleTerms" } }
    PublishSaleDraft:
      type: object
      additionalProperties: false
      required: [operation, bookId, draftRevision]
      properties:
        operation: { const: publishDraft }
        bookId: { type: string, format: uuid }
        draftRevision: { type: integer, format: int64, minimum: 1 }
    ScheduleDefaultSaleBook:
      type: object
      additionalProperties: false
      required: [operation, bookId, version]
      properties:
        operation: { const: scheduleDefault }
        bookId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        effectiveFrom: { type: [string, "null"], format: date-time }
        effectiveUntil: { type: [string, "null"], format: date-time }
        replaces: { type: [string, "null"], format: uuid }
    AssignCustomerSaleBook:
      type: object
      additionalProperties: false
      required: [operation, organizationId, bookId, version]
      properties:
        operation: { const: assignBook }
        organizationId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        effectiveFrom: { type: [string, "null"], format: date-time }
        effectiveUntil: { type: [string, "null"], format: date-time }
        replaces: { type: [string, "null"], format: uuid }
    OverrideCustomerSaleModel:
      type: object
      additionalProperties: false
      required: [operation, organizationId, model, terms]
      properties:
        operation: { const: overrideModel }
        organizationId: { type: string, format: uuid }
        model: { type: string, minLength: 1, maxLength: 200 }
        terms: { $ref: "#/components/schemas/SaleTerms" }
        effectiveFrom: { type: [string, "null"], format: date-time }
        effectiveUntil: { type: [string, "null"], format: date-time }
        replaces: { type: [string, "null"], format: uuid }
    EndSaleSchedule:
      type: object
      additionalProperties: false
      required: [operation, scheduleId, effectiveUntil]
      properties:
        operation: { const: endSchedule }
        scheduleId: { type: string, format: uuid }
        effectiveUntil: { type: string, format: date-time }
    SaleChange:
      oneOf:
        - $ref: "#/components/schemas/CreateSaleBook"
        - $ref: "#/components/schemas/SaveSaleDraft"
        - $ref: "#/components/schemas/PublishSaleDraft"
        - $ref: "#/components/schemas/ScheduleDefaultSaleBook"
        - $ref: "#/components/schemas/AssignCustomerSaleBook"
        - $ref: "#/components/schemas/OverrideCustomerSaleModel"
        - $ref: "#/components/schemas/EndSaleSchedule"
      discriminator:
        propertyName: operation
        mapping:
          createBook: '#/components/schemas/CreateSaleBook'
          saveDraft: '#/components/schemas/SaveSaleDraft'
          publishDraft: '#/components/schemas/PublishSaleDraft'
          scheduleDefault: '#/components/schemas/ScheduleDefaultSaleBook'
          assignBook: '#/components/schemas/AssignCustomerSaleBook'
          overrideModel: '#/components/schemas/OverrideCustomerSaleModel'
          endSchedule: '#/components/schemas/EndSaleSchedule'
    SaleChangeRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, change]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        change: { $ref: "#/components/schemas/SaleChange" }
    SaleMutationResult:
      type: object
      additionalProperties: false
      required: [id, resourceId, revision]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        revision: { type: [integer, "null"], format: int64 }
    SaleBook:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    SaleBookPage:
      type: object
      additionalProperties: false
      required: [books, nextAfter]
      properties:
        books: { type: array, items: { $ref: "#/components/schemas/SaleBook" } }
        nextAfter: { type: [string, "null"], format: uuid }
    SaleDraft:
      type: object
      additionalProperties: false
      required: [revision, models, createdAt]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        models: { type: object, minProperties: 1, maxProperties: 500, additionalProperties: { $ref: "#/components/schemas/SaleTerms" } }
        createdAt: { type: string, format: date-time }
    SaleVersion:
      type: object
      additionalProperties: false
      required: [version, draftRevision, models, publishedAt]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        draftRevision: { type: integer, format: int64, minimum: 1 }
        models: { type: object, minProperties: 1, maxProperties: 500, additionalProperties: { $ref: "#/components/schemas/SaleTerms" } }
        publishedAt: { type: string, format: date-time }
    SaleSchedule:
      type: object
      additionalProperties: false
      description: Original schedule and its possibly shortened effective end. An end at the start cancels a future schedule; rows and end events remain immutable.
      required: [id, kind, organizationId, model, bookId, version, terms, effectiveFrom, scheduledUntil, effectiveUntil, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [default, assigned, override] }
        organizationId: { type: [string, "null"], format: uuid }
        model: { type: [string, "null"] }
        bookId: { type: [string, "null"], format: uuid }
        version: { type: [integer, "null"], format: int64 }
        terms: { anyOf: [{ $ref: "#/components/schemas/SaleTerms" }, { type: "null" }] }
        effectiveFrom: { type: string, format: date-time }
        scheduledUntil: { type: [string, "null"], format: date-time }
        effectiveUntil: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    SaleBookHistory:
      type: object
      additionalProperties: false
      required: [book, drafts, versions, schedules]
      properties:
        book: { $ref: "#/components/schemas/SaleBook" }
        drafts: { type: array, items: { $ref: "#/components/schemas/SaleDraft" } }
        versions: { type: array, items: { $ref: "#/components/schemas/SaleVersion" } }
        schedules: { type: array, items: { $ref: "#/components/schemas/SaleSchedule" } }
    SaleScheduleList:
      type: array
      items: { $ref: "#/components/schemas/SaleSchedule" }
    EffectiveSaleSelector:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { const: effective }
    DraftSaleSelector:
      type: object
      additionalProperties: false
      required: [kind, bookId, revision]
      properties:
        kind: { const: draft }
        bookId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
    LegacySaleSelector:
      type: object
      additionalProperties: false
      required: [kind, channel, version]
      properties:
        kind: { const: legacy }
        channel: { type: string, minLength: 1, maxLength: 200 }
        version: { type: integer, minimum: 1, maximum: 2147483647 }
    SalePreviewSource:
      oneOf:
        - $ref: "#/components/schemas/EffectiveSaleSelector"
        - $ref: "#/components/schemas/DraftSaleSelector"
        - $ref: "#/components/schemas/LegacySaleSelector"
      discriminator:
        propertyName: kind
        mapping:
          effective: '#/components/schemas/EffectiveSaleSelector'
          draft: '#/components/schemas/DraftSaleSelector'
          legacy: '#/components/schemas/LegacySaleSelector'
    SalePreviewUsage:
      type: object
      additionalProperties: false
      description: Normalized usage only. Missing counts are zero. Cache reads/writes are subsets of input; reasoning is a subset of output. Unsupported positive tool/media quantities are refused. Extra fields are refused.
      properties:
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cachedTokens: { type: integer, format: int64, minimum: 0 }
        cacheWrite5mTokens: { type: integer, format: int64, minimum: 0 }
        cacheWrite1hTokens: { type: integer, format: int64, minimum: 0 }
        reasoningTokens: { type: integer, format: int64, minimum: 0 }
        toolCalls: { type: integer, format: int64, minimum: 0 }
        imageInputTokens: { type: integer, format: int64, minimum: 0 }
        audioInputTokens: { type: integer, format: int64, minimum: 0 }
        videoInputTokens: { type: integer, format: int64, minimum: 0 }
        imageOutputTokens: { type: integer, format: int64, minimum: 0 }
        audioOutputTokens: { type: integer, format: int64, minimum: 0 }
        serviceTier: { type: [string, "null"], maxLength: 64 }
        eventType: { type: [string, "null"], maxLength: 64 }
    SalePreviewRequest:
      type: object
      additionalProperties: false
      required: [organizationId, model, usage]
      properties:
        organizationId: { type: string, format: uuid }
        model: { type: string, minLength: 1, maxLength: 200 }
        at: { type: [string, "null"], format: date-time }
        source: { $ref: "#/components/schemas/SalePreviewSource" }
        usage: { $ref: "#/components/schemas/SalePreviewUsage" }
    SalePriceSnapshot:
      type: object
      additionalProperties: false
      description: Self-contained immutable terms selected for a model and customer. This is not yet a signed sale proof. Existing legacy price identities remain explicitly distinguishable.
      required: [businessId, organizationId, model, at, source, scheduleId, bookId, version, draftRevision, legacyChannel, effectiveFrom, effectiveUntil, terms]
      properties:
        businessId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        model: { type: string, minLength: 1, maxLength: 200 }
        at: { type: string, format: date-time }
        source: { type: string, enum: [default, assigned, override, draft, legacy] }
        scheduleId: { type: [string, "null"], format: uuid }
        bookId: { type: [string, "null"], format: uuid }
        version: { type: [integer, "null"], format: int64 }
        draftRevision: { type: [integer, "null"], format: int64 }
        legacyChannel: { type: [string, "null"] }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: [string, "null"], format: date-time }
        terms: { $ref: "#/components/schemas/SaleTerms" }
    SaleBillLine:
      type: array
      minItems: 3
      maxItems: 3
      prefixItems:
        - { type: string }
        - { type: integer, format: int64, minimum: 0 }
        - { type: integer, format: int64, minimum: 0 }
    SalePricePreview:
      type: object
      additionalProperties: false
      required: [snapshot, lines, matchedRule, undiscountedMinor, chargeMinor]
      properties:
        snapshot: { $ref: "#/components/schemas/SalePriceSnapshot" }
        lines: { type: array, items: { $ref: "#/components/schemas/SaleBillLine" } }
        matchedRule: { anyOf: [{ $ref: "#/components/schemas/SalePriceMatch" }, { type: "null" }] }
        undiscountedMinor: { type: integer, format: int64, minimum: 0 }
        chargeMinor: { type: integer, format: int64, minimum: 0 }
    PriceSet:
      type: object
      required: [inputPricePerMillion]
      description: "the rates one request bills at under one mode. `outputPricePerMillion` and `maxOutputTokens` are required on a `chat` price and absent or zero on the input-only modes (`embeddings`, `rerank`) — there is no output side to price."
      properties:
        inputPricePerMillion: { type: integer, format: int64, minimum: 0, description: minor units per million input tokens }
        outputPricePerMillion: { type: integer, format: int64, minimum: 0, description: "minor units per million output tokens; required on `chat`, absent or zero on the input-only modes" }
        maxOutputTokens: { type: integer, format: int64, minimum: 0, description: "the most output the model may produce; also the ceiling a caller's max_tokens is clamped to — positive on `chat`, absent or zero on the input-only modes" }
        cacheReadPricePerMillion: { type: integer, format: int64, minimum: 0, description: "minor units per million cached input tokens; absent bills the cached part at the input price" }
        cacheWrite5mPricePerMillion: { type: integer, format: int64, minimum: 0, description: "minor units per million tokens written into the 5-minute provider cache tier; absent bills them at the input price" }
        cacheWrite1hPricePerMillion: { type: integer, format: int64, minimum: 0, description: "as cacheWrite5mPricePerMillion, for the 1-hour tier" }
        reasoningPricePerMillion: { type: integer, format: int64, minimum: 0, description: "minor units per million reasoning tokens; absent bills the reasoning part at the output price" }
        costPerRequest: { type: integer, format: int64, minimum: 0, description: "a flat amount in minor units, charged once per billed request in addition to the token lines" }
        upstream: { $ref: "#/components/schemas/UpstreamPrices" }
    UpstreamPrices:
      type: object
      description: "what the upstream bills the deployment for the same usage, in the same units — the margin and misbilling view reads it; an organization never sees it"
      properties:
        inputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        outputPricePerMillion: { type: integer, format: int64, minimum: 0 }
        cacheReadPricePerMillion: { type: integer, format: int64, minimum: 0 }
        cacheWrite5mPricePerMillion: { type: integer, format: int64, minimum: 0 }
        cacheWrite1hPricePerMillion: { type: integer, format: int64, minimum: 0 }
        reasoningPricePerMillion: { type: integer, format: int64, minimum: 0 }
        costPerRequest: { type: integer, format: int64, minimum: 0 }
    PriceMatch:
      type: object
      description: "the conditions a request must satisfy: every present field must hold, and the count of present fields is the rule's specificity"
      properties:
        serviceTier: { type: string, maxLength: 64, description: "matches when the caller asked for this service tier" }
        minInputTokens: { type: integer, format: int64, minimum: 0, description: "matches when the turn's input reaches this count" }
        maxInputTokens: { type: integer, format: int64, minimum: 0, description: "matches when the turn's input stays under this count" }
    PriceRule:
      type: object
      required: [match, price]
      description: "a conditional price: when the request matches, this rule's price set replaces the whole base set — never a field-level diff. The most specific matching rule wins; two rules that could match the same request at the same specificity are refused when the price is written."
      properties:
        match: { $ref: "#/components/schemas/PriceMatch" }
        price: { $ref: "#/components/schemas/PriceSet" }
    ModelPrice:
      allOf:
        - $ref: "#/components/schemas/PriceSet"
        - type: object
          required: [model, version, weight, createdAt]
          properties:
            model: { type: string }
            version: { type: integer, minimum: 1, description: "counted per model from 1; a settlement names the version that priced it" }
            weight:
              type: integer
              minimum: 1
              maximum: 1000
              description: "the route's relative preference for leading a request against other channels serving the same model (issue #168)"
            mode: { type: string, enum: [chat, embeddings, rerank, event], description: "the billing mode this price applies to — which surface may serve it and what its counts mean; `event` prices meter `/api/v1/metering` reports and serve no gateway surface" }
            rules:
              type: array
              description: "the conditional price sets; empty when every request pays the base set"
              items: { $ref: "#/components/schemas/PriceRule" }
            createdAt: { type: string, format: date-time, description: "when this version was written" }
    PriceRequest:
      allOf:
        - $ref: "#/components/schemas/PriceSet"
        - type: object
          required: [model]
          properties:
            model: { type: string, minLength: 1, maxLength: 200 }
            weight:
              type: integer
              minimum: 1
              maximum: 1000
              default: 100
              description: "the route's relative preference for leading a request; absent means 100"
            mode:
              type: string
              enum: [chat, embeddings, rerank, event]
              default: chat
              description: "the billing mode the price serves; absent means `chat`. `embeddings` and `rerank` prices are input-only: `outputPricePerMillion` and `maxOutputTokens` must be absent or zero. `event` prices are metered through `/api/v1/metering` only: `maxOutputTokens` must be absent or zero — nothing is forwarded, so there is no output bound — while `outputPricePerMillion` stays allowed for services that meter an output side"
            rules:
              type: array
              description: "conditional price sets, evaluated most-specific-wins; two rules that could match the same request at the same specificity are refused"
              items: { $ref: "#/components/schemas/PriceRule" }
    PriceVersion:
      type: object
      required: [model, version]
      properties:
        model: { type: string }
        version: { type: integer, minimum: 1, description: the version this change appended }
    AliasRequest:
      type: object
      required: [alias, upstreamModel]
      description: "an alias claim (issue #286): the public name callers write, and the upstream model the channel relays it as"
      properties:
        alias: { type: string, minLength: 1, maxLength: 200, description: "the public name; unique across channels — a name another channel serves directly is a conflict" }
        upstreamModel: { type: string, minLength: 1, maxLength: 200, description: "the model the channel actually serves, forwarded upstream in place of the alias" }
    ModelFallbackChain:
      type: object
      required: [fallbacks]
      properties:
        fallbacks:
          type: array
          items: { type: string }
          description: "the ordered set of models a request may serve under when `model`'s channels all fail — position order, every name a served model or alias"
    ModelAlias:
      type: object
      required: [alias, channel, upstreamModel, createdAt]
      properties:
        alias: { type: string, description: "the public name callers write" }
        channel: { type: string, description: "the channel that claims the alias" }
        upstreamModel: { type: string, description: "the upstream model the channel relays" }
        createdAt: { type: string, format: date-time, description: "when the alias was claimed" }
    OpenHoldView:
      type: object
      description: "one hold the ledger still reserves — the in-flight table's row"
      required: [requestId, model, freezeMinor]
      properties:
        requestId: { type: string, description: "the caller's request id — `x-oxsum-request-id`" }
        model: { type: string }
        freezeMinor: { type: integer, format: int64, minimum: 0, description: "what the hold reserves, in minor units" }
        keyPrefix:
          type: string
          description: the display prefix of the key that took the hold; absent for unattributed holds
    LogEntryView:
      type: object
      description: one ledger entry as the transaction log lists it
      required: [index, id, description, contentHash]
      properties:
        index: { type: integer, format: int64, description: "the entry's position in the log" }
        id: { type: string, format: uuid, description: "the entry id — `GET /api/v1/entries/{entryId}/proof` names it" }
        description: { type: string, maxLength: 16384, description: "what the writer recorded — a settlement record, a hold, a reason; Unicode scalar limit, requiring a compatible verifier" }
        contentHash: { type: string, pattern: "^[0-9a-f]{64}$", description: "the hash the Merkle log commits to" }
    UsageReport:
      type: object
      description: |
        A signed end-user usage report (issue #261): the committed subset of
        settlement entries for one `endUser` over `[from, to]`, the marker
        entry that bound it into the organization's ledger once, and every
        shown entry's own inclusion proof — everything a third party needs to
        run `oxsum_verify::verify_usage_report` with no second call.
      required: [reportId, endUser, from, to, entryCount, chargedTotalMinor, subsetHash, marker, entries, head, note, keyName, publicKey, keyHash]
      properties:
        reportId:
          type: string
          format: uuid
          description: the marker entry's own id — `GET .../entries/{id}/proof` resolves it
        endUser: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        entryCount:
          type: integer
          format: int64
          description: settlements the subset commits — a customer's own count spot-checks this
        chargedTotalMinor:
          type: integer
          format: int64
          description: the subset's summed settled charge in minor units
        subsetHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: fold of the shown entries' content hashes in log order, `oxsum/usage-report/v1`
        marker:
          type: object
          description: the usage-report marker entry — the entry itself (whose DocumentRef binds the subset digest and whose description commits the report), its recorded content hash, and its inclusion proof
          required: [entry, contentHash, proof]
          properties:
            entry:
              type: object
              description: the marker entry, doubleentry's serde encoding — the verifier recomputes its hash and reads its DocumentRef + description
            contentHash:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: the hash the Merkle log commits to — the verifier re-derives it with `adopt_verified` before trusting the entry
            proof:
              type: object
              description: the marker's inclusion proof into `head`
        entries:
          type: array
          description: every settlement entry the subset shows, in log order — each proves its own membership against `head`
          items:
            type: object
            required: [entry, contentHash, proof]
            properties:
              entry:
                type: object
                description: the settlement entry, doubleentry's serde encoding
              contentHash:
                type: string
                pattern: "^[0-9a-f]{64}$"
                description: the hash the Merkle log commits to — re-derived with `adopt_verified`
              proof:
                type: object
                description: this entry's inclusion proof into `head`
        head:
          type: object
          description: the tree head every proof anchors to, at report time
          properties:
            size: { type: integer, format: int64 }
            root: { type: string, pattern: "^[0-9a-f]{64}$" }
        note:
          type: string
          nullable: true
          description: the operator-signed head note, when the deployment signs heads
        keyName: { type: string, nullable: true }
        publicKey: { type: string, nullable: true, description: the operator's Ed25519 verifying key, hex }
        keyHash: { type: string, nullable: true, description: the signature-line selector, hex }
        witnessOrigin:
          type: string
          nullable: true
          description: |
            the tenant log's origin (`oxsum/ledgers/<tenant>`), so a reader's
            witness check knows which log the cosignatures must name (issue #328)
        witnessKeys:
          type: array
          description: |
            the deployment's pinned witness keys — public by design, and absent
            (or empty) when the deployment pins none
          items:
            type: object
            required: [witnessUrl, keyName, publicKey, keyHash]
            properties:
              witnessUrl: { type: string, format: uri }
              keyName: { type: string }
              publicKey: { type: string, description: "the Ed25519 verifying key, hex" }
              keyHash: { type: string, description: "the C2SP key hash, hex" }
        witnessNotes:
          type: array
          description: |
            the cosigned notes stored for this bundle's head, absent when none
            are; a reader checks them with `verify_witnesses`
          items:
            type: object
            required: [witnessUrl, note]
            properties:
              witnessUrl: { type: string, format: uri }
              note: { type: string, description: "the cosigned C2SP note text" }
        completeness:
          type: object
          description: |
            The anchored-day completeness proof (issue #339), present when a
            daily anchor covers the span: the anchor entry that fixed the
            customer's day-log head, the head itself, its inclusion in the
            anchor's sorted map, and every day leaf the head was folded from.
            The verifier rebuilds each day leaf from the rows the proof assigns
            to that day, so a dropped day or a misattributed row fails. Absent,
            completeness remains the organization's claim.
          required: [v, anchor, head, mapProof, days]
          properties:
            v: { type: integer, minimum: 1 }
            anchor:
              type: object
              description: the ledger entry the daily pass appended, its recorded hash and its inclusion proof into `head`
              required: [entry, day, mapRoot, enduserCount]
              properties:
                entry:
                  type: object
                  required: [entry, contentHash, proof]
                  properties:
                    entry: { type: object, description: "doubleentry's serde encoding of the anchor entry" }
                    contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
                    proof: { type: object }
                day: { type: string, format: date, description: "the anchored UTC day" }
                mapRoot:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: the sorted-map root over every customer's day-log head at that day
                enduserCount: { type: integer, format: int64, description: "customers the map covered" }
            head:
              type: object
              description: the customer's day-log head at the anchor day
              required: [root, size]
              properties:
                root: { type: string, pattern: "^[0-9a-f]{64}$" }
                size: { type: integer, format: int64 }
            mapProof:
              type: object
              description: the customer's head-pair inclusion in `anchor.mapRoot` (the proof carries the position)
            days:
              type: array
              description: every day leaf the head covers, in index order
              items:
                type: object
                required: [day, index, leaf, proof]
                properties:
                  day: { type: string, format: date }
                  index: { type: integer, format: int64, minimum: 0 }
                  leaf: { type: string, pattern: "^[0-9a-f]{64}$" }
                  proof: { type: object, description: the leaf's inclusion proof into `head` }
                  rows:
                    type: array
                    description: positions in `entries` this day's leaf was rebuilt from (span days only)
                    items: { type: integer, minimum: 0 }
    UsageReportSummary:
      type: object
      description: |
        A minted usage report's descriptor — what `GET .../usage-reports` lists.
        Carries no rows or proofs; `GET .../usage-reports/{reportId}` serves the
        full bundle.
      required: [reportId, endUser, from, to, entryCount, chargedTotalMinor, subsetHash]
      properties:
        reportId:
          type: string
          format: uuid
          description: the marker entry's own id — the bundle's `GET` path parameter
        endUser: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        entryCount: { type: integer, format: int64 }
        chargedTotalMinor: { type: integer, format: int64 }
        subsetHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    EvidenceBundle:
      type: object
      description: |
        A version-2 customer evidence bundle (issue #616): the manifest the
        ledger's marker committed, every artifact the manifest names, the
        ledger entries the money artifacts point at, and the signed head every
        proof anchors to — everything `oxsum_verify::verify_evidence_bundle`
        needs to check the bundle offline with no second call. `version` is
        always `2`: the dispatch field a v1 bill bundle lacks, which routes it
        to `verify_evidence_bundle` rather than `verify_bundle`.
      required: [version, kind, bundleId, organizationId, manifestDigest, anchorLogIndex, scope, artifacts, manifest, entries, head]
      properties:
        version:
          type: integer
          enum: [2]
          description: always 2 — the field `verify_bundle`'s legacy wire lacks
        kind:
          type: string
          enum: [period, statement]
          description: a closed-span bundle or a single-statement bundle
        bundleId:
          type: string
          format: uuid
          description: the marker entry's own id — `GET .../entries/{id}/proof` resolves it
        organizationId:
          type: string
          description: the customer the bundle is for — a bundle minted for another org fails the verifier here
        manifestDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: "the manifest digest `H(oxsum/evidence-manifest/v1)` over the canonical manifest — the digest the marker's DocumentRef binds"
        periodFrom:
          type: string
          format: date
          nullable: true
          description: first UTC day of the covered span, present on `period`
        periodTo:
          type: string
          format: date
          nullable: true
          description: last UTC day of the covered span, present on `period`
        statementId:
          type: string
          format: uuid
          nullable: true
          description: the statement a `statement` bundle wraps
        anchorLogIndex:
          type: integer
          format: int64
          description: the marker's position in the ledger
        scope:
          type: object
          description: |
            The honest-scope block — the committed claims. `covered` names the
            artifact classes the bundle attests; `excluded` names what it does
            not (the platform's own upstream costs, another organization's
            rows, history outside the span, in-flight operations). Part of the
            committed bytes, so a bundle cannot quietly drop the honesty.
          required: [covered, excluded, upstreamCostIncluded]
          properties:
            covered:
              type: array
              items: { type: string }
              description: the artifact classes the bundle commits
            excluded:
              type: array
              items: { type: string }
              description: the claim classes the bundle says it does not attest
            upstreamCostIncluded:
              type: boolean
              description: whether `upstreamCostMinor` exported — the `OXSUM_EVIDENCE_UPSTREAM_COST` opt-in
        artifacts:
          type: object
          description: |
            The committed artifacts, grouped `{kind: {id: json}}` — a two-level
            object so a verifier names the missing row without index
            arithmetic. Every value re-canonicalizes and digests to the
            manifest row that names it.
        manifest:
          type: array
          description: every committed artifact's `(kind, id, digest)` row, sorted by `(kind, id)` — order is load-bearing in the fold
          items:
            type: object
            required: [kind, id, digest]
            properties:
              kind: { type: string, description: "the artifact class, `evidence-artifact/v1/<kind>`'s suffix" }
              id: { type: string, description: the artifact's own id within its class }
              digest:
                type: string
                pattern: "^[0-9a-f]{64}$"
                description: "the artifact digest `H(oxsum/evidence-artifact/v1/<kind>)` over the artifact's canonical bytes"
        entries:
          type: array
          description: |
            The ledger entries the bundle carries, `{entry, contentHash,
            proof, forKind, forId}` like a usage-report row — `entries[0]` is
            the marker whose DocumentRef binds the manifest digest; the rest
            are the money artifacts' ledger links, each proven against `head`.
          items:
            type: object
            required: [entry, contentHash, proof, forKind, forId]
            properties:
              entry:
                type: object
                description: the ledger entry, doubleentry's serde encoding — re-derived with `adopt_verified`
              contentHash:
                type: string
                pattern: "^[0-9a-f]{64}$"
                description: the hash the Merkle log commits to
              proof:
                type: object
                description: this entry's inclusion proof into `head`
              forKind: { type: string, description: the artifact class this entry proves — `bundle` for the marker }
              forId: { type: string, description: the artifact id this entry proves }
        head:
          type: object
          description: the tree head every proof anchors to, at mint
          properties:
            size: { type: integer, format: int64 }
            root: { type: string, pattern: "^[0-9a-f]{64}$" }
        note:
          type: string
          nullable: true
          description: the operator-signed head note, when the deployment signs heads
        keyName: { type: string, nullable: true }
        publicKey: { type: string, nullable: true, description: the operator's Ed25519 verifying key, hex }
        keyHash: { type: string, nullable: true, description: the signature-line selector, hex }
    EvidenceBundleSummary:
      type: object
      description: |
        A minted evidence bundle's descriptor — what `GET
        .../evidence-bundles` lists and the `POST` answers. Carries no
        artifacts or proofs; `GET .../evidence-bundles/{bundleId}` serves the
        full bundle.
      required: [bundleId, kind, manifestDigest, anchorLogIndex, entryCount, createdAt]
      properties:
        bundleId:
          type: string
          format: uuid
          description: the marker entry's own id — the bundle's `GET` path parameter
        kind:
          type: string
          enum: [period, statement]
        periodFrom:
          type: string
          format: date
          nullable: true
          description: first UTC day of the span, present on `period`
        periodTo:
          type: string
          format: date
          nullable: true
          description: last UTC day of the span, present on `period`
        statementId:
          type: string
          format: uuid
          nullable: true
          description: the wrapped statement, present on `statement`
        manifestDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        anchorLogIndex:
          type: integer
          format: int64
        entryCount:
          type: integer
          format: int64
          description: ledger entries the bundle carries
        createdAt: { type: string, format: date-time }
    EvidenceShare:
      type: object
      description: |
        A share token's descriptor — the API's list answer, never the token,
        which exists only in the create response.
      required: [shareId, bundleId, createdAt, expiresAt, downloadCount]
      properties:
        shareId:
          type: string
          format: uuid
          description: the share's own id
        bundleId:
          type: string
          format: uuid
          description: the bundle it opens
        label:
          type: string
          nullable: true
          description: the organization's own note for the recipient
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: when the token stops resolving
        maxDownloads:
          type: integer
          nullable: true
          description: the download budget at mint; absent means unbounded until expiry
        downloadCount:
          type: integer
          description: how many downloads the token has served — the audit figure
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastDownloadAt:
          type: string
          format: date-time
          nullable: true
          description: when the token last served a download
    CreatedEvidenceShare:
      type: object
      required: [share, token]
      properties:
        share: { $ref: "#/components/schemas/EvidenceShare" }
        token:
          type: string
          description: |
            the plaintext capability token, answered once — the public
            `GET /api/v1/evidence/{token}` resolves it and the database keeps
            only its SHA-256
    CreateEvidenceShareRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 128
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: defaults to 30 days from now; at most 90 days out
        maxDownloads:
          type: integer
          minimum: 1
          nullable: true
          description: how many times the token resolves before it dies; absent means unbounded until expiry
    LinkScope:
      type: string
      enum: [report, end_user]
      description: |
        What a share link resolves to: `report` pins one minted usage report —
        the customer's bill for one span — while `end_user` names one downstream
        customer and lists the reports the organization has issued them.
    ReportLink:
      type: object
      description: |
        A capability link the organization minted. The token itself is never
        part of this shape; it exists only in the create response.
      required: [linkId, scope, endUser, createdAt, expiresAt]
      properties:
        linkId: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/LinkScope" }
        reportId:
          type: string
          format: uuid
          nullable: true
          description: the pinned report for `report` scope; absent for `end_user`
        endUser: { type: string }
        label:
          type: string
          nullable: true
          description: the organization's own note for the recipient
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: when the link stops resolving
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: when the link last resolved — the customer opened the bill
    CreatedReportLink:
      type: object
      required: [link, token]
      properties:
        link: { $ref: "#/components/schemas/ReportLink" }
        token:
          type: string
          description: |
            the plaintext capability token, answered once — the deployment serves
            `/bill/{token}` for it and the database keeps only its SHA-256
        delivery:
          type: string
          enum: [sent, failed]
          nullable: true
          description: |
            present only when the mint asked for a mail: `sent` when the SMTP
            transport accepted it, `failed` when it did not — the link and token
            are still the answer, so the operator can pass the link on by hand
    CreateReportLinkRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 128
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: defaults to 30 days from now; at most 90 days out
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: |
            mail the link here at creation — the only moment the plaintext token
            exists; a deployment without a mailer refuses it
    CreateEndUserLinkRequest:
      type: object
      required: [endUser]
      properties:
        endUser:
          type: string
          minLength: 1
          maxLength: 128
          description: the downstream customer the reports are attributed to
        label:
          type: string
          maxLength: 128
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: defaults to 30 days from now; at most 90 days out
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: |
            mail the link here at creation — the only moment the plaintext token
            exists; a deployment without a mailer refuses it
    BillRow:
      type: object
      description: one transaction as the bills page lists it — every ledger entry that moved money
      required: [index, entryId, bookedOn, kind, amountMinor, description, contentHash]
      properties:
        index: { type: integer, format: int64 }
        entryId: { type: string, format: uuid }
        bookedOn: { type: string, format: date, description: "the server's UTC date the entry was written" }
        kind:
          type: string
          enum: [topUp, adjustment, settlement]
          description: "the entry's movement kind: money in, an operator's book entry, or a settled charge"
        amountMinor:
          type: integer
          format: int64
          description: "the entry's effect on the settled balance, signed: top-ups read positive, charges negative"
        description: { type: string }
        contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
    UsageDay:
      type: object
      required: [day, channel, model, turns, inputTokens, outputTokens, cachedTokens, reasoningTokens, chargedMinor]
      properties:
        day: { type: string, format: date, description: the booking date these turns settled under }
        keyId:
          type: string
          format: uuid
          description: the key that paid; absent for shared unattributed usage
        channel: { type: string }
        model: { type: string }
        turns: { type: integer, format: int64, description: settled turns the bucket sums }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cachedTokens: { type: integer, format: int64 }
        reasoningTokens: { type: integer, format: int64 }
        chargedMinor: { type: integer, format: int64 }
    BudgetSnapshot:
      type: object
      required: [organization, member, keys]
      properties:
        organization:
          type: object
          required: [availableMinor, reservedMinor]
          properties:
            availableMinor: { type: integer, format: int64 }
            reservedMinor: { type: integer, format: int64 }
            creditLimitMinor: { type: integer, format: int64, nullable: true }
            creditUsedMinor: { type: integer, format: int64, nullable: true }
            consumedPercent: { type: integer, nullable: true, description: "creditUsed/creditLimit floored to a whole percent; null with no line" }
        member:
          type: object
          nullable: true
          properties:
            budgetLimitMinor: { type: integer, format: int64 }
            committedMinor: { type: integer, format: int64 }
            consumedPercent: { type: integer, nullable: true }
        keys:
          type: array
          items:
            type: object
            required: [keyId, prefix, committedMinor]
            properties:
              keyId: { type: string, format: uuid }
              name: { type: string, nullable: true }
              prefix: { type: string }
              spendLimitMinor: { type: integer, format: int64, nullable: true }
              budgetDuration: { type: string, nullable: true, enum: [daily, weekly, monthly] }
              windowStart: { type: string, format: date, nullable: true, description: "the UTC date the current budget window began; null for a cumulative limit" }
              committedMinor: { type: integer, format: int64 }
              consumedPercent: { type: integer, nullable: true }
    BillingRecord:
      type: object
      required: [bookedOn, requestId, entryId, model, kind, inputTokens, outputTokens, chargedMinor, upstreamAttempts]
      properties:
        bookedOn: { type: string, format: date, description: the server's UTC date the settlement was written }
        requestId:
          type: string
          description: the caller's request id; the settlement entry is `req-<requestId>:settle`
        entryId:
          type: string
          format: uuid
          description: the settlement entry's own id — `GET /api/v1/entries/{entryId}/proof` answers this turn's proof bundle directly
        model: { type: string }
        status:
          type: string
          enum: [settled, errored, refused]
          description: >
            how the turn ended: `settled` covers every settled outcome including
            the anomalous kinds; `errored` marks the turns that served nothing
            after their hold (`upstream_error`, `upstream_unreachable`,
            `swept`); `refused` marks a request admission turned away before a
            hold, recorded as a marker entry so a 4xx or 429 still lands on the
            billing page
        failureReason:
          type: string
          description: >
            why the turn refused or errored, when the settlement recorded a
            complete inline reason — the caller-facing words the answer already
            carried. Absent on a clean settle or when v15 carries a commitment.
        failureReasonCommitment:
          $ref: "#/components/schemas/ReasonCommitment"
          description: >
            v15 identity of the complete failure reason retained separately;
            exclusive with failureReason. This projection reads the immutable
            entry and does not claim the full text was independently compared.
        kind:
          type: string
          enum: [usage, estimated, client_cancelled, upstream_error, upstream_unreachable, capped, swept, unpriced, released, refused]
          description: how the turn was priced
        inputTokens: { type: integer, format: int64, description: tokens billed as input }
        outputTokens: { type: integer, format: int64, description: tokens billed as output }
        chargedMinor: { type: integer, format: int64 }
        upstreamAttempts:
          type: integer
          format: int64
          minimum: 0
          description: "how many upstream calls the turn made — above 1 means it failed over between channels (issue #168); a metered event never calls upstream, so it records 0"
        discountPercent:
          type: integer
          minimum: 1
          maximum: 100
          description: the discount applied between the priced sum and the cap — absent when none applied
        keyId:
          type: string
          format: uuid
          description: the key that paid; absent for an unattributed hold
    RequestLogRow:
      type: object
      description: >
        One gateway request's operational record (issue #505) — the search
        surface over `usage_records`, written post-settlement. `entryId` joins
        the row to the settlement entry whose proof
        `GET /api/v1/entries/{entryId}/proof` serves; `NULL` on a refusal that
        never reached a hold. Read by `GET /api/v1/requests` (org-scoped) and
        `GET /api/v1/admin/requests` (all organizations).
      required: [requestId, modelRequested, modelServed, admissionOutcome, status, createdAt]
      properties:
        requestId:
          type: string
          description: the caller's request id; the settlement entry is `req-<requestId>:settle`
        entryId:
          type: string
          format: uuid
          description: the settlement entry's id — `GET /api/v1/entries/{entryId}/proof` answers its proof; absent on a refusal
        organizationId:
          type: string
          format: uuid
          description: the organization the request billed; present on the admin read, elided on the org-scoped member read
        keyId:
          type: string
          format: uuid
          description: the key that paid; absent for an unattributed hold or a refusal
        modelRequested:
          type: string
          description: the model the caller asked for
        modelServed:
          type: string
          description: the model that answered — differs from `modelRequested` only under a cross-model failover (issue #500); empty on a refusal that never resolved one
        channel:
          type: string
          description: the channel that served; empty on a refusal
        admissionOutcome:
          type: string
          enum: [admitted, refused]
          description: whether the turn reached a hold (`admitted`) or admission turned it away (`refused`)
        status:
          type: string
          enum: [settled, errored, refused]
          description: how the turn ended, mirroring `usage_records.status`
        ttftMs:
          type: integer
          format: int64
          description: milliseconds to the first upstream byte; absent on a whole-body read or a refusal
        totalMs:
          type: integer
          format: int64
          description: milliseconds admission→settle — the turn's whole wall clock
        inputTokens: { type: integer, format: int64, description: tokens billed as input }
        outputTokens: { type: integer, format: int64, description: tokens billed as output }
        cachedTokens: { type: integer, format: int64, description: input served from the cache }
        chargeMinor: { type: integer, format: int64, description: what the turn charged, in minor units; 0 on a refusal }
        upstreamAttempts:
          type: integer
          format: int64
          minimum: 0
          description: how many upstream calls the turn made — above 1 means it failed over or fell back between models
        errorKind:
          type: string
          description: the settlement kind or failure reason on a non-settled turn — the terminal cause
        httpStatus:
          type: integer
          description: the gateway's own answer status when it served one
        createdAt:
          type: string
          format: date-time
          description: when the row was written — just after the turn settled
    RequestOperation:
      type: object
      description: >
        One billable turn's durable record (issue #601): the parent row every
        gateway call and task submit writes before the hold binds, leased to
        the serving worker while it is open and closed by the settlement — or
        by the sweeper, which claims a lapsed lease and ends the operation
        `timed_out` with `chargedMinor` 0. Read by `GET /api/v1/operations`
        (org-scoped), `GET /api/v1/operations/{operationId}` (with attempts)
        and `GET /api/v1/admin/operations` (all organizations).
      required: [operationId, surface, boundMinor, state, model, createdAt]
      properties:
        operationId:
          type: string
          format: uuid
          description: the operation's id — the gateway turn's request id, or the task's `taskId`
        organizationId:
          type: string
          format: uuid
          description: the organization the turn billed; present on the admin read, elided on the member read
        keyId:
          type: string
          format: uuid
          description: the consumption key that admitted the turn; absent when none did
        surface:
          type: string
          description: >
            which surface admitted it — `chat`, `responses`, `messages`,
            `embeddings`, `rerank`, `task:{kind}` for the async relay, or
            `metering` for a privileged service-credential event (issue #604).
            `metering` operations carry no `keyId`: the caller is a service
            credential, not a consumption key.
        boundMinor:
          type: integer
          format: int64
          minimum: 0
          description: the upper bound frozen when the turn started, in minor units
        holdKey:
          type: string
          description: the `open_holds` watch row this operation binds (`req-<id>:hold`); absent until the hold lands
        state:
          type: string
          enum: [created, leased, running, succeeded, failed, cancelled, timed_out]
          description: >
            the lifecycle: `created` → `leased` → `running` while the worker
            owns it, then a terminal state — `succeeded` when usage settled,
            `failed` on an upstream or admission failure, `cancelled` when the
            caller walked away, `timed_out` when the sweeper recovered a
            lapsed lease
        chargedMinor:
          type: integer
          format: int64
          description: what the settlement charged, in minor units; absent until the operation is terminal
        outcomeKind:
          type: string
          description: >
            the settlement kind or terminal cause — `usage`, `estimated`,
            `swept`, `released`, `cache_hit` when the answer came off the
            semantic cache rather than a fresh upstream attempt, or `metered`
            for a privileged service-credential event (issue #604). `cache_hit`
            and `metered` let a cost-allocation read tell re-served and
            internal usage apart from customer-billable upstream turns.
        model:
          type: string
          description: the model the turn asked for
        channel:
          type: string
          description: the channel that answered; absent until one did
        createdAt:
          type: string
          format: date-time
          description: when the operation was admitted
        completedAt:
          type: string
          format: date-time
          description: when the operation went terminal; absent while it is open
    OperationAttempt:
      type: object
      description: >
        One upstream try inside an operation (issue #601): a failover or
        fallback makes several — one `answered` attempt carries the usage the
        settlement charged, the `refused`/`unreachable` ones are the audit of
        what was tried first.
      required: [attemptId, channel, status, startedAt]
      properties:
        attemptId:
          type: string
          format: uuid
        channel:
          type: string
          description: the channel this try went to
        credentialId:
          type: string
          format: uuid
          description: the upstream credential the try spent
        externalId:
          type: string
          description: the upstream's own response id (`chatcmpl-…`, the task id), when the answer carried one
        status:
          type: string
          enum: [started, answered, refused, unreachable]
          description: how the try ended — `answered` is the one the settlement bills
        usageJson:
          type: object
          description: the usage the upstream reported, verbatim; present on the winning `answered` attempt
        error:
          type: string
          description: why the try failed, on a `refused`/`unreachable` one
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          description: absent while the try is still in flight
    OperationListPage:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items: { $ref: "#/components/schemas/RequestOperation" }
        nextCursor:
          type: string
          description: The cursor the next page asks with; absent at the list's start.
    EstimatePriceRequest:
      type: object
      required: [model]
      properties:
        model: { type: string, minLength: 1, maxLength: 200 }
        mode:
          type: string
          enum: [chat, embeddings, rerank, event]
          default: chat
          description: "which billing mode's routes to price against — an `embeddings` estimate reads the model's embeddings prices, ignoring `outputTokens`; `event` prices a billableCode's declared units"
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: the input side of the shape; omit for a prompt-empty estimate
        outputTokens:
          type: integer
          format: int64
          description: the output the shape asks for; omit to estimate against the model's `maxOutputTokens` ceiling — unused by the input-only modes
        serviceTier:
          type: string
          description: the conditional-pricing dimension, as a chat completion's `service_tier`
    PricedModel:
      allOf:
        - $ref: "#/components/schemas/ModelPrice"
        - type: object
          required: [channel, protocol]
          properties:
            channel: { type: string, description: the channel the model is sold through }
            protocol:
              type: string
              description: the upstream protocol — the surface `model` answers on, `openai`, `anthropic` or `gemini`
    AdjustOrganizationRequest:
      type: object
      required: [amountMinor, reason, idempotencyKey]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: "signed minor units: positive grants, negative deducts; never zero"
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: "why the money moved — stored as the entry's description, covered by its hash"
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: a retry writes no second entry; the same key replays the same adjustment
    UpdateOrganizationRequest:
      type: object
      required: [idempotencyKey]
      properties:
        creditLimitMinor:
          type: integer
          format: int64
          minimum: 0
          description: the credit line the organization may draw, absolute — not a delta
        paymentTermsDays:
          type: integer
          format: int32
          minimum: 0
          description: days a finalized statement's payment has before it falls due — snapshotted onto each statement at finalization
        tier:
          type: string
          nullable: true
          description: the tier profile to assign — a capability package, never a pricing input; an explicit null clears it
        suspended:
          type: boolean
          description: |
            suspend the organization's spend (true) or reinstate it (false). A suspended
            organization's new holds refuse — 403 on `/v1` —
            while its in-flight holds still settle and money-in still lands; suspending enqueues
            `org.suspended` to its subscribed webhook endpoints. A manual suspension is
            never the dunning sweep's to lift. Reinstating here clears only manual
            suspension; an overdue or archived customer remains blocked.
        dunningGraceDays:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            days past a finalized statement's due date before the statements job's
            dunning sweep suspends the organization's spend — an explicit null switches
            the automation off; absent leaves it alone. The sweep also marks and marks
            its own suspensions, reinstating the organization once nothing unpaid stands
            past grace (or when the grace is switched off here).
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          nullable: true
          description: |
            the fiat unit the organization displays its balances, bills and statements
            in (issue #257) — `code` plus `ratePerCredit` (a decimal literal like
            "0.0014": how much of the unit one credit renders as), plus the `decimals`
            the figure rounds to. Presentational only: the write touches no ledger and
            moves no money, so it never alters a settled bill's verified charge.
            An explicit null clears the display — the organization renders credits alone.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: a retry writes no second entry; the same key replays the same change. At least one of creditLimitMinor, paymentTermsDays, tier, suspended, dunningGraceDays and displayCurrency must be present.
    UpdateOrgDisplayRequest:
      type: object
      required: [displayCurrency]
      properties:
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          nullable: true
          description: |
            the fiat unit the organization renders in (issue #257), or null to
            render credits alone — the only field this PATCH takes; the write is
            presentational and moves no money.
    PasswordResetRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 12
          maxLength: 256
          description: the replacement password; the same rule signup applies
    PasswordReset:
      type: object
      required: [userId, sessionsRevoked]
      properties:
        userId: { type: string, format: uuid, description: the account the password now belongs to }
        sessionsRevoked: { type: integer, minimum: 0, description: live sessions the reset revoked }
    AdminAdjustment:
      type: object
      required: [entryId, organizationId, amountMinor, reason, availableMinor]
      properties:
        entryId: { type: string, description: "the ledger entry's id, derived from the idempotency key" }
        organizationId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64 }
        reason: { type: string }
        availableMinor:
          type: integer
          format: int64
          description: the organization's available balance after the adjustment
    AdminCreditNote:
      type: object
      description: |
        One credit note (issue #352, decision D12): a reasoned ledger credit the
        operator issued. The entry is the fact; this is the lookup.
      required: [creditNoteId, entryId, organizationId, amountMinor, reason, createdAt]
      properties:
        creditNoteId: { type: string, format: uuid }
        entryId:
          type: string
          format: uuid
          description: the ledger entry that carries the credit (Revenue debit / Wallet credit)
        organizationId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, description: the note's reason — also the entry's description }
        createdAt: { type: string, format: date-time }
        availableMinor:
          type: integer
          format: int64
          description: the organization's available balance after the write; present on the issuance answer only
    IssueCreditNoteRequest:
      type: object
      required: [amountMinor, reason, idempotencyKey]
      additionalProperties: false
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 1 }
    PromoLot:
      type: object
      description: |
        One promo lot (issue #609): granted credit with a provenance and an
        optional expiry. The lot row is the projection of the ledger's
        `Equity:Promo` pool — `remainingMinor` is what new holds can still pin,
        `reservedMinor` what open holds already named. `closedAt`/`closeReason`
        mark a terminal close that was not an ordinary draw-down: `expired`
        burned to `Equity:PromoExpiry`, `cancelled` the same burn booked by a
        correction. Promo is a grant, not a liability — it can never refund to
        cash.
      required: [lotId, organizationId, source, sourceRef, amountMinor, remainingMinor, reservedMinor, expiresAt, createdAt, closedAt, closeReason]
      properties:
        lotId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        source:
          type: string
          enum: [grant, admin, bundle_promo, legacy_migration]
          description: where the lot came from — an admin grant, a bundle fulfillment's promo leg, or the bonus-pool migration
        sourceRef:
          type: string
          description: the source event's own identity — the idempotency anchor
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: what the grant posted, immutable
        remainingMinor:
          type: integer
          format: int64
          minimum: 0
          description: the unreserved part still fundable by new holds
        reservedMinor:
          type: integer
          format: int64
          minimum: 0
          description: the part open holds currently reserve against the lot
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: when the lot lapses — null never expires
        createdAt: { type: string, format: date-time }
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: when a terminal close landed — null while the lot is open
        closeReason:
          type: string
          enum: [expired, cancelled]
          nullable: true
          description: why the lot closed
    GrantPromoLotRequest:
      type: object
      required: [amountMinor, idempotencyKey]
      additionalProperties: false
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1 }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: when the lot lapses — absent never expires
        reason:
          type: string
          description: the grant's reason — also the ledger entry's description
        idempotencyKey: { type: string, minLength: 1 }
    CancelPromoLotRequest:
      type: object
      required: [idempotencyKey]
      additionalProperties: false
      properties:
        reason:
          type: string
          description: the cancellation's reason, recorded in the audit detail
        idempotencyKey: { type: string, minLength: 1 }
    AdminCreditLimit:
      type: object
      required: [organizationId, creditLimitMinor, creditUsedMinor, availableMinor, paymentTermsDays, tier, suspended, dunningGraceDays, dunningSuspendedAt, displayCurrency]
      properties:
        entryId:
          type: string
          description: "the ledger entry's id, derived from the idempotency key — absent when the limit did not move"
        organizationId: { type: string, format: uuid }
        creditLimitMinor: { type: integer, format: int64, minimum: 0 }
        creditUsedMinor: { type: integer, format: int64, minimum: 0 }
        availableMinor:
          type: integer
          format: int64
          description: the organization's spendable balance after the change, own funds plus undrawn credit
        paymentTermsDays:
          type: integer
          format: int32
          minimum: 0
          description: days a finalized statement's payment has before it falls due
        tier:
          type: string
          nullable: true
          description: the tier profile the organization is assigned to — null when it carries none
        suspended:
          type: boolean
          description: whether the organization's spend is suspended — new holds refuse, in-flight holds settle
        dunningGraceDays:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: the dunning grace configured — null when the sweep automation is off
        dunningSuspendedAt:
          type: string
          format: date-time
          nullable: true
          description: when the dunning sweep itself suspended the organization — null when the suspension standing is the operator's or none
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          nullable: true
          description: the display unit the organization renders in — null renders credits alone
    AdminOrganization:
      type: object
      required: [id, name, kind, members, createdAt, availableMinor, reservedMinor, creditLimitMinor, creditUsedMinor, suspended, displayCurrency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [personal, team] }
        members: { type: integer, format: int64, minimum: 0, description: how many people belong to the organization }
        createdAt: { type: string, format: date-time }
        availableMinor: { type: integer, format: int64, description: settled minus unsettled holds, own funds plus undrawn credit }
        reservedMinor: { type: integer, format: int64, minimum: 0, description: the sum of the organization's outstanding holds }
        creditLimitMinor: { type: integer, format: int64, minimum: 0, description: the credit limit the operator granted }
        creditUsedMinor: { type: integer, format: int64, minimum: 0, description: the drawn plus reserved part of the credit line }
        tier:
          type: string
          nullable: true
          description: the tier profile assigned — its limits and allowlist gate the organization's requests; null when none
        suspendedAt:
          type: string
          format: date-time
          nullable: true
          description: when the organization was suspended — null while its spend runs normally
        displayCurrency:
          $ref: "#/components/schemas/DisplayCurrency"
          nullable: true
          description: the display unit the organization renders in — null renders credits alone
    AdminHold:
      type: object
      required: [organization, requestId, model, channel, priceVersion, freezeMinor, openedAt]
      properties:
        organization: { type: string, description: the name of the organization whose ledger holds the freeze }
        requestId: { type: string, description: "the x-oxsum-request-id the turn was taken under" }
        model: { type: string }
        channel: { type: string }
        priceVersion: { type: integer, minimum: 1, description: the version the turn froze at }
        freezeMinor: { type: integer, format: int64, minimum: 1, description: what was frozen, in minor units }
        openedAt: { type: string, format: date-time, description: when the hold was taken }
        sweepAttempts: { type: integer, minimum: 0, description: how many sweep passes have tried to settle it }
        lastError: { type: string, nullable: true, description: "the last failed settle's error, so the operator sees what is stuck" }
        deadAt: { type: string, format: date-time, nullable: true, description: "set once the hold has failed ten sweeps — the dead-letter marker; the sweeper retries it hourly from then on" }
    TierProfile:
      type: object
      required: [name, requestsPerMinute, modelAllowlist, organizations]
      properties:
        name: { type: string, description: the package's slug — `organizations.tier` references it }
        requestsPerMinute:
          type: integer
          nullable: true
          minimum: 1
          description: one rolling-minute allowance shared by every key of the assigned organizations; null uncapped
        modelAllowlist:
          type: array
          nullable: true
          items: { type: string }
          description: the models the assigned organizations may call; null means all served models
        organizations: { type: integer, format: int64, minimum: 0, description: how many organizations are assigned the tier }
    SetTierRequest:
      type: object
      properties:
        requestsPerMinute:
          type: integer
          nullable: true
          minimum: 1
          description: the organization-wide rolling-minute allowance; absent or null uncaps
        modelAllowlist:
          type: array
          nullable: true
          items: { type: string }
          description: the models the tier may call; absent or null means all served models
    Discount:
      type: object
      required: [discountId, percent, validFrom, createdAt]
      properties:
        discountId: { type: string, format: uuid }
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: the organization the discount applies to; null is every organization
        organization:
          type: string
          nullable: true
          description: the scoped organization's name — the operator's label for the row
        model:
          type: string
          nullable: true
          description: the model the discount applies to; null is every model
        percent:
          type: integer
          minimum: 1
          maximum: 100
          description: the percent taken off the priced sum, applied before the freeze cap; 100 settles at zero
        label:
          type: string
          nullable: true
          description: why the discount exists — the operator's own words, for the audit of a bill that cites it
        validFrom: { type: string, format: date-time, description: turns starting at or after this qualify }
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: turns starting at or after this do not qualify; null does not expire
        createdAt: { type: string, format: date-time }
    CreateDiscountRequest:
      type: object
      required: [percent, idempotencyKey]
      properties:
        percent:
          type: integer
          minimum: 1
          maximum: 100
          description: the percent taken off the priced sum
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: scope the discount to one organization; absent scopes it to all
        model:
          type: string
          nullable: true
          description: scope the discount to one model; absent scopes it to all
        label:
          type: string
          maxLength: 200
          nullable: true
          description: why the discount exists — recorded for the audit
        validFrom:
          type: string
          format: date-time
          description: defaults to now
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: the end of the window; absent does not expire
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: a retry answers the row it created; the same key under different fields is 409
    SubscriptionPlan:
      type: object
      required: [planId, name, quotaMinor, resetPeriod, allowWalletOverflow, priceMinor, stripePriceId, enabled, sortOrder]
      properties:
        planId: { type: string, format: uuid }
        name: { type: string, description: "the catalog name — unique, and the PUT path's {name}" }
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: the per-period credit quota; null meters the subscription without a quota — every request draws in full
        resetPeriod:
          type: string
          enum: [daily, weekly, monthly, never]
          description: the boundary on which the period closes as `boundary` and a fresh one opens; `never` plans carry no `currentPeriodEnd` — they neither roll nor expire
        allowWalletOverflow:
          type: boolean
          description: what an exhausted quota does — `true` holds the overflow against the wallet, `false` refuses the gateway request
        priceMinor:
          type: integer
          format: int64
          minimum: 0
          description: what the plan costs per period, for display and checkout — subscription quota itself is entitlement, not ledger money
        stripePriceId:
          type: string
          nullable: true
          description: the Stripe price a subscription checkout creates sessions for; null means the plan is admin-bound only
        enabled: { type: boolean, description: a disabled plan cannot be bound or checked out }
        sortOrder:
          type: integer
          description: catalog order — a rebind to a higher `sortOrder` closes the period as `upgrade`, a lower one as `downgrade`
    SetSubscriptionPlanRequest:
      type: object
      required: [quotaMinor, resetPeriod]
      properties:
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: the per-period quota; absent or null unmeters the plan
        resetPeriod:
          type: string
          enum: [daily, weekly, monthly, never]
        allowWalletOverflow:
          type: boolean
          default: true
          description: what an exhausted quota does — overflow to the wallet, or refuse
        priceMinor:
          type: integer
          format: int64
          minimum: 0
          default: 0
        stripePriceId:
          type: string
          nullable: true
        enabled:
          type: boolean
          default: true
        sortOrder:
          type: integer
          default: 0
    OrgSubscription:
      type: object
      required: [subscriptionId, organizationId, planId, state, currentPeriodStart, currentPeriodEnd, consumedMinor, quotaMinor, allowWalletOverflow, source, stripeSubscriptionId, createdAt]
      properties:
        subscriptionId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        state:
          type: string
          enum: [active, cancelled, expired]
          description: only an `active` binding meters requests
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
          description: the boundary the period rolls at; null for a `never` plan, which has no boundary to roll and no lapse to expire
        consumedMinor:
          type: integer
          format: int64
          minimum: 0
          description: what this period has drawn against `quotaMinor`
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: the plan quota snapshotted at bind time — a later plan change does not re-meter a running binding
        allowWalletOverflow:
          type: boolean
          description: the plan's overflow flag snapshotted at bind time
        source:
          type: string
          description: how the binding came about — `admin` for an operator bind, `stripe` for a checkout session
        stripeSubscriptionId:
          type: string
          nullable: true
          description: the Stripe subscription the `invoice.paid`/`customer.subscription.deleted` webhook events key on
        createdAt: { type: string, format: date-time }
    SubscriptionPeriod:
      type: object
      required: [periodId, subscriptionId, organizationId, periodStart, periodEnd, quotaMinor, consumedMinor, outcome, createdAt]
      properties:
        periodId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time }
        periodEnd:
          type: string
          format: date-time
          nullable: true
          description: the boundary the period was meant to roll at; null for a `never` plan
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: the quota this period ran under, snapshotted when it opened
        consumedMinor:
          type: integer
          format: int64
          minimum: 0
          description: what the period drew — settled draws only move this counter; a released share returns
        outcome:
          type: string
          enum: [open, boundary, cancelled, expired, upgrade, downgrade]
          description: "`open` while it meters; `boundary` on a rollover; `cancelled`, `expired`, `upgrade` or `downgrade` for how it ended"
        createdAt: { type: string, format: date-time }
    BindSubscriptionRequest:
      type: object
      required: [planId]
      properties:
        planId: { type: string, format: uuid }
        source:
          type: string
          default: admin
          description: the binding's provenance — `admin` for an operator bind; the Stripe checkout webhook binds with `stripe`
        stripeSubscriptionId:
          type: string
          nullable: true
          description: attaches the Stripe subscription id the webhook renewals and cancellations key on; must be unique across bindings
    SubscriptionCheckoutRequest:
      type: object
      required: [planId]
      properties:
        planId:
          type: string
          format: uuid
          description: must name an enabled plan with a `stripePriceId`
    SoldPlan:
      type: object
      required: [planVersionId, planId, businessId, version, name, priceMinor, currency, quotaMinor, periodKind, overageEnabled, sortOrder, publishedAt, retiredAt, createdAt, accountingPolicyVersion]
      properties:
        accountingPolicyVersion:
          type: integer
          enum: [1, 2]
          description: "1 retains historical period-close recognition; 2 invoices at paid activation and recognizes completed UTC service days. A version change applies only to a newly authorized period."
        planVersionId:
          type: string
          format: uuid
          description: the version row's own id — what a binding and a `planPeriod` order's `purposeRef` name
        planId:
          type: string
          format: uuid
          description: the plan's stable identity across versions
        businessId: { type: string, format: uuid }
        version:
          type: integer
          description: monotonic within the plan; a catalogue edit mints the next one
        name: { type: string }
        priceMinor:
          type: integer
          format: int64
          minimum: 0
          description: the catalogue price in ledger minor units; 0 is a free plan activated on a complimentary grant
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: the display currency the price is quoted in
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: quota per period in credit minor units; null is unmetered
        periodKind:
          type: string
          enum: [calendarMonth, anniversary]
          description: "`calendarMonth` keeps the legacy UTC-month boundary; `anniversary` rolls on the activation date's monthly anniversary, clamped to the month's last day"
        overageEnabled:
          type: boolean
          description: opt-in — an exhausted period may draw past quota against the wallet at the plan's rates
        sortOrder: { type: integer }
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: when the version went on sale; null is a draft
        retiredAt:
          type: string
          format: date-time
          nullable: true
          description: when the version stopped accepting new binds; existing subscriptions run under it to their boundaries
        createdAt: { type: string, format: date-time }
    CustomerPlan:
      type: object
      required: [customerPlanId, organizationId, planVersionId, subscriptionId, state, activatedAt, cancelAtPeriodEnd, scheduledChange, createdAt, updatedAt]
      properties:
        customerPlanId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        planVersionId:
          type: string
          format: uuid
          description: the exact sold version the customer bought
        subscriptionId:
          type: string
          format: uuid
          nullable: true
          description: the quota engine row this entitlement runs on; null until the first period activates
        state:
          type: string
          enum: [pendingPayment, active, renewalPending, pastDue, expired, cancelled]
          description: "D06: pendingPayment → active → renewalPending/pastDue → active|expired; cancelled the explicit exit"
        activatedAt:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
          description: serves through the paid period but blocks renewal
        scheduledChange:
          type: string
          format: uuid
          nullable: true
          description: a booked plan-version swap effective at the next boundary; null when unscheduled
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlanPeriod:
      type: object
      required: [planPeriodId, customerPlanId, periodIndex, periodStart, periodEnd, quotaMinor, consumedMinor, authorizationKind, authorizationRef, state, createdAt, accountingPolicyVersion]
      properties:
        accountingPolicyVersion:
          type: integer
          enum: [1, 2]
          description: "1 retains historical period-close recognition; 2 invoices at paid activation and recognizes completed UTC service days. A version change applies only to a newly authorized period."
        planPeriodId: { type: string, format: uuid }
        customerPlanId: { type: string, format: uuid }
        periodIndex:
          type: integer
          minimum: 0
          description: 0-based; period 0 is the activation period
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
        consumedMinor:
          type: integer
          format: int64
          minimum: 0
        authorizationKind:
          type: string
          enum: [paymentOrder, complimentary]
          description: what authorized the period — a paid `paymentOrders` row, or a free plan's grant
        authorizationRef:
          type: string
          format: uuid
          description: the authorizing fact — the order id or the grant key
        state:
          type: string
          enum: [active, closed, expired]
        createdAt: { type: string, format: date-time }
    OrgPlanView:
      type: object
      required: [plan, periods]
      properties:
        plan:
          $ref: "#/components/schemas/CustomerPlan"
          nullable: true
          description: the live plan, or null while the customer has none
        periods:
          type: array
          items: { $ref: "#/components/schemas/PlanPeriod" }
          description: every period the plan has authorized, in index order
        credit:
          $ref: "#/components/schemas/PlanCreditStanding"
          nullable: true
          description: the binding's credit standing beside it (issue #612, T21); null while the customer has no live plan. Wallet admission also evaluates all positive debt past grace before the periodic worker stamps dunning.
    PlanCreditStanding:
      type: object
      required: [creditLimitMinor, outstandingMinor, nextDueAt]
      properties:
        creditLimitMinor:
          type: integer
          format: int64
          nullable: true
          description: the binding's wallet-side overage cap; null is unlimited
        outstandingMinor:
          type: integer
          format: int64
          description: remaining statement debt and posted journals without live statements; admission additionally counts open holds
        nextDueAt:
          type: string
          format: date-time
          nullable: true
          description: earliest effective debt due date, including the retained due date of a document-only void
    InvoiceJournal:
      type: object
      required: [journalId, customerPlanId, organizationId, planPeriodId, periodIndex, state, totalMinor, settledMinor, currency, paidOrderId, disputedMinor, replacesJournalId, voidReason, postedAt, paidAt, voidedAt, createdAt, accountingPolicyVersion]
      properties:
        accountingPolicyVersion:
          type: integer
          enum: [1, 2]
          description: "1 retains historical period-close recognition; 2 invoices at paid activation and recognizes completed UTC service days. A version change applies only to a newly authorized period."
        journalId: { type: string, format: uuid }
        customerPlanId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        planPeriodId:
          type: string
          format: uuid
          nullable: true
          description: the `planPeriods` row this journal bills; null on a staff-issued correction journal
        periodIndex:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [posted, paid, void]
          description: "`posted` is the open receivable — the journal is billed, not yet settled. `draft` exists only inside the close transaction and never answers a read."
        totalMinor:
          type: integer
          format: int64
          description: the lines' sum — charges positive, credits negative; what the receivable was opened for
        settledMinor:
          type: integer
          format: int64
          minimum: 0
          description: how much of `totalMinor` the clearing legs (prepayment, order payments) already covered
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        paidOrderId:
          type: string
          format: uuid
          nullable: true
          description: the `planPeriod` order whose payment completed the settlement — the link a refund or dispute hangs its correction on
        disputedMinor:
          type: integer
          format: int64
          minimum: 0
          description: what open disputes contest of this journal's receivable
        replacesJournalId:
          type: string
          format: uuid
          nullable: true
          description: the journal this one reissues after a staff void
        voidReason:
          type: string
          nullable: true
        postedAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        voidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
    InvoiceJournalLine:
      type: object
      required: [lineId, journalId, kind, amountMinor, description, sourceRef, createdAt]
      properties:
        lineId: { type: string, format: uuid }
        journalId: { type: string, format: uuid }
        kind:
          type: string
          enum: [baseFee, usageOverage, discount, promoCredit, tax]
          description: "`baseFee` the sold version's price, `usageOverage` the overage-enabled plan's wallet-billed overflow at par, `discount` a credit note or grant write-off, `promoCredit` promo money covering the fee, `tax` reserved"
        amountMinor:
          type: integer
          format: int64
          description: signed — charges positive, credits negative; `totalMinor` is their sum
        description: { type: string }
        sourceRef:
          type: string
          format: uuid
          nullable: true
          description: the fact the line came from — a `planPeriods` id, a `creditNotes` id, a promo lot or grant key, or the line a void reversal mirrors
        createdAt: { type: string, format: date-time }
    InvoiceJournalDetail:
      allOf:
        - $ref: "#/components/schemas/InvoiceJournal"
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: "#/components/schemas/InvoiceJournalLine" }
    InvoiceJournalPage:
      type: object
      required: [journals, nextCursor]
      properties:
        journals:
          type: array
          items: { $ref: "#/components/schemas/InvoiceJournal" }
        nextCursor:
          type: string
          format: uuid
          nullable: true
    VoidJournalRequest:
      type: object
      required: [idempotencyKey, reason]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PlanStatement:
      type: object
      required: [statementId, customerPlanId, organizationId, periodIndex, journalId, state, totalMinor, paidMinor, currency, issuedAt, dueAt, paidAt, pastDueAt, voidedAt, voidReason, replacesStatementId, paidOrderId, createdAt]
      properties:
        statementId: { type: string, format: uuid }
        customerPlanId:
          type: string
          format: uuid
          nullable: true
          description: the binding the statement bills; null on a wallet-only statement a dispute chargeback opened when no plan stands
        organizationId: { type: string, format: uuid }
        periodIndex:
          type: integer
          minimum: 0
          nullable: true
          description: the `(customerPlanId, periodIndex)` pair the wrapped journal keys on
        journalId:
          type: string
          format: uuid
          nullable: true
          description: the `invoice_journals` row whose receivable this statement surfaces
        state:
          type: string
          enum: [issued, paid, pastDue, void]
          description: "`issued` is the open receivable, `pastDue` the receivable past `dueAt`. `open` exists only inside the close transaction and never answers a read."
        totalMinor:
          type: integer
          format: int64
          description: the lines' sum — what the customer owes
        paidMinor:
          type: integer
          format: int64
          minimum: 0
          description: what reconciled payments already covered; `totalMinor − paidMinor` is what is still owed
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        issuedAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: "`issuedAt + netTerms` — when the receivable falls due"
        paidAt:
          type: string
          format: date-time
          nullable: true
        pastDueAt:
          type: string
          format: date-time
          nullable: true
          description: when the statement first answered past due
        voidedAt:
          type: string
          format: date-time
          nullable: true
        voidReason:
          type: string
          nullable: true
        replacesStatementId:
          type: string
          format: uuid
          nullable: true
          description: the statement this one reissues after a staff void
        paidOrderId:
          type: string
          format: uuid
          nullable: true
          description: the order whose payment completed the settlement — the dispute link
        createdAt: { type: string, format: date-time }
    PlanStatementLine:
      type: object
      required: [lineId, statementId, kind, amountMinor, description, sourceRef, createdAt]
      properties:
        lineId: { type: string, format: uuid }
        statementId: { type: string, format: uuid }
        kind:
          type: string
          enum: [planFee, usage, discount, refundCredit, disputeChargeback, paymentApplied]
          description: "`planFee` the sold version's price, `usage` a retained historical overage line (new closes do not charge settled usage again), `discount` a credit or grant write-off, `refundCredit` a refund's note, `disputeChargeback` a lost dispute's restored receivable, `paymentApplied` a reconciling payment"
        amountMinor:
          type: integer
          format: int64
          description: signed — charges positive, credits negative; `totalMinor` is their sum
        description: { type: string }
        sourceRef:
          type: string
          format: uuid
          nullable: true
          description: the fact the line came from — a journal line, a refund, an order, a dispute, or the line a void reversal mirrors
        createdAt: { type: string, format: date-time }
    PlanStatementDetail:
      allOf:
        - $ref: "#/components/schemas/PlanStatement"
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items: { $ref: "#/components/schemas/PlanStatementLine" }
    PlanStatementPage:
      type: object
      required: [statements, nextCursor]
      properties:
        statements:
          type: array
          items: { $ref: "#/components/schemas/PlanStatement" }
        nextCursor:
          type: string
          format: uuid
          nullable: true
    ReleaseStatementRequest:
      type: object
      required: [idempotencyKey, action, reason]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        action:
          type: string
          enum: [extendGrace, void]
          description: "`extendGrace` restores this statement to issued and retains suspension for other past-grace debt; `void` atomically reverses the backing journal and statement without moving Cash, refusing ambiguous sources"
        reason: { type: string, minLength: 1, maxLength: 500 }
    PublishPlanRequest:
      type: object
      required: [name, priceMinor, currency, quotaMinor, periodKind]
      properties:
        planId:
          type: string
          format: uuid
          nullable: true
          description: publish the next version of this plan; absent mints a new plan at version 1
        name: { type: string }
        priceMinor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        quotaMinor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
        periodKind:
          type: string
          enum: [calendarMonth, anniversary]
        overageEnabled: { type: boolean, default: false }
        sortOrder: { type: integer, default: 0 }
    BindPlanRequest:
      type: object
      required: [planVersionId]
      properties:
        planVersionId:
          type: string
          format: uuid
          description: must name a published, unretired sold version
        complimentaryGrant:
          type: string
          format: uuid
          nullable: true
          description: required for a free plan — the grant key period 0 authorizes under; refused on a priced plan
    PlanChangeRequest:
      type: object
      required: [planVersionId]
      properties:
        planVersionId:
          type: string
          format: uuid
          description: the sold version the change books, effective at the next boundary
    AuditEntry:
      type: object
      required: [auditId, recordedAt, actor, action, detail]
      properties:
        auditId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
        actor:
          type: string
          description: who acted — "operator" today; the single admin token is the only admin identity
        action:
          type: string
          description: the mutating call, as a dotted name — manual_receipt.authorized, channel.set, channel.price.append, organization.adjust, organization.update, tier.set, tier.delete, discount.create, discount.end, user.password_reset, codes.mint, closing.close, statement.generate, statement.finalize, statement.payment, statement.suspend
        target:
          type: string
          nullable: true
          description: what the action acted on — a channel name, an organization id, a statement id
        detail:
          type: object
          description: the request's fields that are safe to show — credentials (a channel's apiKey) are never recorded
        idempotencyKey:
          type: string
          nullable: true
          description: the key the request carried, when it did — the write it names replays rather than doubles
    AdminAnomaly:
      type: object
      required: [organization, requestId, model, channel, priceVersion, kind, upstreamAttempts, chargedMinor, freezeMinor, bookedOn, score, severity]
      properties:
        organization: { type: string, description: the organization whose ledger recorded the turn }
        requestId: { type: string }
        model: { type: string }
        channel: { type: string, description: the channel that served the turn }
        priceVersion: { type: integer, minimum: 1 }
        kind: { type: string, enum: [capped, estimated, client_cancelled, swept, unpriced], description: how the turn was priced; the anomalous kinds }
        upstreamAttempts:
          type: integer
          format: int64
          minimum: 0
          description: "how many upstream calls the turn made — above 1 means it failed over between channels (issue #168); a metered event records 0"
        chargedMinor: { type: integer, format: int64, minimum: 0, description: what the settlement charged, in minor units }
        freezeMinor: { type: integer, format: int64, minimum: 1, description: what had been frozen, in minor units }
        bookedOn: { type: string, format: date, description: the settlement's booking date }
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: "the anomaly's severity 0–100, derived at read time from the kind's base weighted by the charge ratio, upstream-cost divergence, failover attempts and the request's repeat-offender count (issue #263); read-only — never an input to what is charged"
        severity: { type: string, enum: [low, medium, high], description: "the band `score` falls into — low < 40, medium < 70, high ≥ 70" }
    AdminMargin:
      type: object
      required: [channel, model, turns, chargedMinor, upstreamCostMinor, marginMinor, untrackedTurns]
      properties:
        channel: { type: string }
        model: { type: string }
        turns: { type: integer, format: int64, minimum: 0, description: the settled turns the row sums }
        chargedMinor: { type: integer, format: int64, description: what the organizations were charged, in minor units }
        upstreamCostMinor: { type: integer, format: int64, description: what the channel's upstream prices made of the same usage, over the turns that track it }
        providerBilledMinor: { type: integer, format: int64, nullable: true, description: what the provider actually billed the channel, summed across every (channel, day) bill row the upstream-bill-sync pass has written — channel-scoped, so the same value repeats on each of that channel's model rows; null when the pass has never reconciled the channel }
        marginMinor: { type: integer, format: int64, description: chargedMinor minus upstreamCostMinor }
        untrackedTurns: { type: integer, format: int64, minimum: 0, description: settled turns with no upstream cost recorded — an untracked price, a swept hold, or history }
    AdminDeposit:
      type: object
      description: |
        One money-in row (issue #354): the deposit record the rail wrote, never
        the ledger entry itself — `entryId` names that once credited.
      required: [depositId, organizationId, organization, rail, paymentRef, amountMinor, status, createdAt]
      properties:
        depositId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organization: { type: string, description: the organization's display name }
        rail:
          type: string
          enum: [manual, redemption, stripe, crypto-evm, x402, airwallex, hyperswitch]
          description: the rail that carried the payment
        paymentRef: { type: string, description: "the rail's reference — an idempotency key, a charge id, a code id" }
        amountMinor: { type: integer, format: int64, minimum: 1, description: the amount the deposit was opened for }
        receivedMinor:
          type: integer
          format: int64
          nullable: true
          description: what the rail reported paid, when it differs from `amountMinor`
        status:
          type: string
          enum: [pending, confirmed, credited, reversed, expired]
          description: |
            `pending` (opened, not paid), `confirmed` (the rail says paid, the
            ledger has not credited yet), `credited` (the wallet moved, `entryId`
            names the entry), `reversed` (a refund/chargeback outcome) or
            `expired` (never paid in time)
        entryId: { type: string, format: uuid, nullable: true, description: the ledger entry that credited the wallet, once credited }
        reversalEntryId: { type: string, format: uuid, nullable: true, description: the ledger entry that reversed the credit (Wallet debited, Cash credited), once reversed }
        reversedAt: { type: string, format: date-time, nullable: true, description: when the deposit reversed }
        refundStatus:
          type: string
          enum: [pending, unknown, succeeded, failed]
          nullable: true
          description: |
            The durable external refund outcome. `pending` means a matching
            provider handle was observed; `unknown` means no terminal result is
            established, including timeout, historical unbound operation or
            exhausted recovery. Only exact signed terminal evidence establishes
            `succeeded`/`failed`. The local reversal stands independently; a retry
            never allocates another external identity. `null` means no reversal
            refund has been requested or the rail has no external refund path.
        disputedAt: { type: string, format: date-time, nullable: true, description: "when a dispute opened on the payment, when the rail reported one (issue #360)" }
        createdAt: { type: string, format: date-time }
    ReverseDepositRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, description: "why the deposit is reversed — becomes the reversal entry's description, so it is part of what a bill's proof covers" }
    ReconciliationReport:
      type: object
      required: [checkedAt, organizations, clean, classes]
      properties:
        checkedAt: { type: string, format: date-time, description: when the scan ran }
        organizations: { type: integer, format: int64, minimum: 0, description: the organizations whose ledgers were scanned }
        clean: { type: boolean, description: every class counted zero }
        classes:
          type: array
          description: every drift class, zero-count ones included, in a fixed order
          items: { $ref: "#/components/schemas/ReconciliationClass" }
    ReconciliationClass:
      type: object
      required: [class, count, samples]
      properties:
        class:
          type: string
          enum: [usage_orphans, settlements_unrecorded, deposits_unbooked, deposits_mismatched, deposits_stuck, watches_orphaned, holds_unwatched, holds_dead_lettered, log_gaps, jobs_dead, upstream_price_drift, anchored_day_altered]
        count: { type: integer, format: int64, minimum: 0, description: how much drift the class holds }
        samples:
          type: array
          description: a bounded sample of the offending identifiers, newest first
          items: { $ref: "#/components/schemas/ReconciliationSample" }
    ReconciliationSample:
      type: object
      required: [organization, detail]
      properties:
        organization: { type: string, description: the organization the drift belongs to }
        detail: { type: string, description: "the identifier an operator follows: the request id, hold key, deposit ref or gap position" }
    AdminClosing:
      type: object
      required: [organization, period, entryCount, treeSize, treeRoot, trialBalanceRoot, sealHash]
      properties:
        organization: { type: string, description: the organization whose ledger sealed the month }
        period: { type: string, description: "the sealed period, `YYYY-MM`" }
        entryCount: { type: integer, format: int64, minimum: 0, description: how many of the log's entries the period contains }
        treeSize: { type: integer, format: int64, minimum: 0, description: the log's size at the moment of sealing }
        treeRoot: { type: string, description: the log's tree head at sealing, hex — what the month committed to }
        trialBalanceRoot: { type: string, description: the Merkle root over the period's closing trial balance, hex }
        sealHash: { type: string, description: the seal's own hash, hex — it chains onto the seal before it }
    CloseMonthRequest:
      type: object
      required: [month]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", description: "the month to close, `YYYY-MM`; it must have fully ended" }
    GenerateStatementsRequest:
      type: object
      required: [period]
      properties:
        period: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", description: "the month to bill, `YYYY-MM`; it must have fully ended" }
        organizationId: { type: string, format: uuid, description: generate for this organization only; absent means every organization the period's usage covers }
    StatementTransitionRequest:
      type: object
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200, description: carried for uniformity; the transition is idempotent on its own }
    RecordStatementPaymentRequest:
      type: object
      required: [amountMinor, idempotencyKey]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1, description: the payment's amount — may not exceed what the statement still owes }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200, description: names the ledger repayment entry; a retry replays it, a different amount under it conflicts }
    Statement:
      type: object
      required: [id, organizationId, period, status, paymentStatus, totalMinor, creditDrawnMinor, paidMinor, outstandingMinor, paymentTermsDays, entryCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        period: { type: string, description: "the billed month, `YYYY-MM`" }
        status: { type: string, enum: [draft, finalized], description: draft is the operator's working copy — rebuilt on regeneration; finalized is issued and immutable }
        paymentStatus: { type: string, enum: [pending, paid, overdue, suspended], description: pending while the drawn part is unpaid; overdue once the due date has passed; suspended when the operator marks it; paid once payments cover creditDrawnMinor }
        totalMinor: { type: integer, format: int64, minimum: 0, description: the period's settled usage charges, own funds and credit alike }
        creditDrawnMinor: { type: integer, format: int64, minimum: 0, description: the part of the period's charges the credit line carried — what the statement is owed }
        paidMinor: { type: integer, format: int64, minimum: 0, description: payments allocated to the statement so far }
        outstandingMinor: { type: integer, format: int64, minimum: 0, description: creditDrawnMinor minus paidMinor — what is still owed }
        paymentTermsDays: { type: integer, format: int32, minimum: 0, description: the organization's payment terms at finalization, snapshotted }
        dueDate: { type: [string, "null"], format: date, description: when payment falls due — set at finalization }
        logFromIndex: { type: [integer, "null"], format: int64, description: the first covered ledger entry's log index — the proof window's lower bound, set at finalization }
        logToIndex: { type: [integer, "null"], format: int64, description: the last covered ledger entry's log index — the proof window's upper bound, set at finalization }
        entryCount: { type: integer, format: int64, minimum: 0, description: usage rows the statement itemizes }
        finalizedAt: { type: [string, "null"], format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        overdueAt: { type: [string, "null"], format: date-time, description: when the statement first answered past due }
        suspendedAt: { type: [string, "null"], format: date-time }
        anchorEntryId: { type: [string, "null"], format: uuid, description: "the ledger marker committing the statement's window and rollup digests — appended at finalization" }
        anchorLogIndex: { type: [integer, "null"], format: int64, description: "the anchor entry's position in the tenant log" }
        windowHash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: "digest folded in log order over the covered entries' content hashes — a truncated or reordered window no longer matches" }
        rollupHash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: "digest over the statement's canonical lines and totals" }
        createdAt: { type: string, format: date-time }
    StatementLine:
      type: object
      required: [channel, model, turns, inputTokens, outputTokens, cachedTokens, reasoningTokens, amountMinor]
      properties:
        channel: { type: string }
        model: { type: string }
        turns: { type: integer, format: int64, minimum: 0, description: settled requests the line aggregates }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cachedTokens: { type: integer, format: int64, minimum: 0 }
        reasoningTokens: { type: integer, format: int64, minimum: 0 }
        amountMinor: { type: integer, format: int64, minimum: 0, description: what the line's usage was charged }
    StatementDetail:
      type: object
      required: [statement, lines]
      properties:
        statement: { $ref: "#/components/schemas/Statement" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StatementLine" }
        anchor:
          type: object
          description: "the statement's log anchor; present once the statement is finalized — `note`, `keyName`, `publicKey` and `keyHash` only when the deployment configures OXSUM_HEAD_SIGNING_KEY"
          required: [entryId, logIndex, windowHash, rollupHash, origin]
          properties:
            entryId: { type: string, format: uuid, description: "the marker entry committing the digests" }
            logIndex: { type: integer, format: int64, description: "the marker's position in the tenant log" }
            windowHash: { type: string, pattern: "^[0-9a-f]{64}$", description: "digest folded in log order over the covered entries' content hashes" }
            rollupHash: { type: string, pattern: "^[0-9a-f]{64}$", description: "digest over the statement's canonical lines and totals" }
            origin: { type: string, description: "the ledger's origin, `oxsum/ledgers/<tenant>`" }
            note: { type: [string, "null"], description: "signed-note text over the tree head right after the anchor — the anchor's inclusion is proven by the head that follows it" }
            keyName: { type: [string, "null"], description: "the signing key's published name, present when the note is" }
            publicKey: { type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: "the operator's Ed25519 public key, lowercase hex, present when the note is" }
            keyHash: { type: [string, "null"], pattern: "^[0-9a-f]{8}$", description: "the key's short fingerprint, lowercase hex, present when the note is" }
    StatementPayment:
      type: object
      required: [statement, entryId, amountMinor]
      properties:
        statement: { $ref: "#/components/schemas/Statement" }
        entryId: { type: string, description: "the repayment's ledger entry, derived from the idempotency key" }
        amountMinor: { type: integer, format: int64, description: the payment as booked }
    StatementProof:
      type: object
      description: "the self-contained bundle `GET /api/v1/statements/{id}/proof` answers (issue #479): the statement detail plus the two inputs `verify_statement_anchor` cannot read out of the document itself — the covered entries' content hashes and the head that follows the anchor"
      required: [statement, lines, windowHashes, expectedHead, expectedOrigin]
      properties:
        statement: { $ref: "#/components/schemas/Statement" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StatementLine" }
        anchor:
          type: object
          description: "the statement's log anchor, as the detail endpoint serves it — `note`, `keyName`, `publicKey` and `keyHash` only when the deployment configures OXSUM_HEAD_SIGNING_KEY"
          required: [entryId, logIndex, windowHash, rollupHash, origin]
          properties:
            entryId: { type: string, format: uuid }
            logIndex: { type: integer, format: int64 }
            windowHash: { type: string, pattern: "^[0-9a-f]{64}$" }
            rollupHash: { type: string, pattern: "^[0-9a-f]{64}$" }
            origin: { type: string }
            note: { type: [string, "null"] }
            keyName: { type: [string, "null"] }
            publicKey: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
            keyHash: { type: [string, "null"], pattern: "^[0-9a-f]{8}$" }
        windowHashes:
          type: array
          items: { type: string, pattern: "^[0-9a-f]{64}$" }
          description: "the covered entries' content hashes in log order — the verifier folds these under `oxsum/statement-window/v1` and checks the result against `anchor.windowHash` rather than trusting the served digest"
        expectedHead:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/TreeHead" }]
          description: "the signed tree head at `anchor.logIndex + 1` — the head whose log already contains the anchor; null on a deployment that signs no heads, the same honesty `anchor.note` keeps"
        expectedOrigin: { type: string, description: "the tenant ledger origin, `oxsum/ledgers/<tenant>` — the same string `anchor.origin` and `GET /api/v1/log/head` carry" }
    AmountRequest:
      type: object
      required: [idempotencyKey, amountMinor]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, description: UTF-8 idempotency key; the server accepts at most 128 bytes }
        amountMinor: { type: integer, format: int64, minimum: 1 }
    X402TopupRequest:
      type: object
      required: [payment]
      properties:
        payment:
          type: string
          minLength: 1
          maxLength: 8192
          description: |
            base64url of the signed payment authorization. Two wires, one field —
            whichever rail is configured parses it:

            - **facilitator** (`OXSUM_X402_FACILITATOR_*` set): the V1 x402
              `PaymentPayload` — `{x402Version, scheme, network, payload:
              {signature, authorization: {from, to, value, validAfter,
              validBefore, nonce}}}` — the same blob the protocol's `X-PAYMENT`
              header carries. `authorization.nonce` anchors `payment_ref`.
            - **stand-in** (`OXSUM_X402_VERIFYING_KEY` only): the test-scheme
              `{scheme, network, asset, amountMinor, payTo, nonce, payer,
              signature}` whose Ed25519 `signature` is checked against the
              pinned key.

            A payload that is not the configured rail's wire is a 403,
            indistinguishable from an unverified one.
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: |
            The credit amount the deployment requires the payment to cover.
            Under the facilitator rail this becomes the `paymentRequirements`'s
            `maxAmountRequired` — unset, the authorization's own `value` stands
            (chain-asset atomic units, USDC's 6 decimals, map 1:1 onto credit
            minor units). The stand-in ignores it: the signed body commits the
            amount.
    SettleRequest:
      type: object
      required: [holdKey, actualMinor]
      properties:
        holdKey: { type: string, minLength: 1, maxLength: 128, description: the idempotency key of the hold this settlement releases; the hold's amount is read from the ledger, and one hold settles at most once }
        actualMinor: { type: integer, format: int64, minimum: 0, description: actual usage, must not exceed the hold's amount }
    EventUsage:
      type: object
      description: |
        A metered event's usage, in the UsageRecord's own shape: the structured
        fields are the token-metered dimensions — on an `event` price they are
        the event's units in whatever denomination the billableCode's price
        defines — plus the context slots. `eventType` names the event and is
        required; a dimension the resolved price cannot bill is refused, never
        billed at zero.
      properties:
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cachedTokens: { type: integer, format: int64, minimum: 0 }
        cacheWrite5mTokens: { type: integer, format: int64, minimum: 0 }
        cacheWrite1hTokens: { type: integer, format: int64, minimum: 0 }
        reasoningTokens: { type: integer, format: int64, minimum: 0 }
        toolCalls: { type: integer, format: int64, minimum: 0 }
        imageInputTokens: { type: integer, format: int64, minimum: 0 }
        audioInputTokens: { type: integer, format: int64, minimum: 0 }
        videoInputTokens: { type: integer, format: int64, minimum: 0 }
        imageOutputTokens: { type: integer, format: int64, minimum: 0 }
        audioOutputTokens: { type: integer, format: int64, minimum: 0 }
        serviceTier: { type: string, maxLength: 64, description: a pricing slot — rules may match on it }
        eventType: { type: string, minLength: 1, maxLength: 64, description: what kind of billable event this is — required }
        endUser: { type: string, maxLength: 128, description: the service's own end-user id, for attribution }
        tags:
          type: object
          additionalProperties: { type: string, maxLength: 64 }
          description: "cost-centre attribution; at most 10 pairs, keys and values 64 characters"
        usageDetails:
          type: object
          description: "the escape hatch — provider extras that fit no column; never reaches the ledger description"
    MeteringHoldRequest:
      type: object
      required: [idempotencyKey, organizationId, channel, billableCode, usage]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200, description: "UTF-8 idempotency key, scoped to the credential and customer; the returned opaque holdKey binds both" }
        organizationId: { type: string, format: uuid, description: whose wallet freezes }
        channel: { type: string, description: "the channel whose `mode: event` price version for the code applies" }
        billableCode: { type: string, minLength: 1, maxLength: 200, description: "what is being billed — the price book's model name on that channel" }
        eventId: { type: string, maxLength: 128, description: "the service's own event label, recorded in settlement evidence; the usage projection uses the credential/customer-bound hold key to avoid global label collisions; defaults to the hold key" }
        usage: { $ref: "#/components/schemas/EventUsage" }
    MeteringSettleRequest:
      type: object
      required: [organizationId, holdKey, usage]
      properties:
        organizationId: { type: string, format: uuid }
        holdKey: { type: string, minLength: 1, description: the holdKey a `holds` answer returned }
        eventId: { type: string, maxLength: 128, description: overrides the hold's eventId when the service learned a better identifier since }
        usage: { $ref: "#/components/schemas/EventUsage" }
    MeteringReleaseRequest:
      type: object
      required: [organizationId, holdKey]
      properties:
        organizationId: { type: string, format: uuid }
        holdKey: { type: string, minLength: 1 }
    MeteringSettlementRequest:
      type: object
      required: [idempotencyKey, organizationId, channel, billableCode, usage]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        organizationId: { type: string, format: uuid, description: whose wallet pays }
        channel: { type: string }
        billableCode: { type: string, minLength: 1, maxLength: 200 }
        eventId: { type: string, maxLength: 128 }
        usage: { $ref: "#/components/schemas/EventUsage" }
    MeteringHold:
      type: object
      required: [holdKey, freezeMinor, priceVersion]
      properties:
        holdKey: { type: string, description: the key `settle` and `release` name }
        freezeMinor: { type: integer, format: int64, minimum: 1, description: the frozen bound — the declared usage itemized at the pinned price }
        priceVersion: { type: integer, minimum: 1, description: the code's price version in force, pinned to the hold }
    MeteringSettlement:
      type: object
      required: [chargedMinor, kind, priceVersion]
      properties:
        chargedMinor: { type: integer, format: int64, minimum: 0, description: what the settlement charged — never more than the freeze }
        kind:
          type: string
          enum: [usage, capped, released]
          description: "`usage` when the declared usage priced inside the freeze, `capped` when it priced above and the freeze was charged, `released` when the hold was let go at zero"
        priceVersion: { type: integer, minimum: 1, description: the price version the usage priced at — the hold's pin on `settle`/`release`, the latest on a one-shot }
        settlementId: { type: string, format: uuid, description: the settlement ledger entry's id — derivable as `entry_id_for(settlement_key_for(holdKey))` }
    MerchantEvent:
      type: object
      required: [id, merchantId, versionId, eventId, kind, paymentId, state, reason]
      properties:
        id: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        eventId: { type: string }
        kind: { type: string, enum: [succeeded, failed, expired, refundSucceeded, refundFailed, dispute, unsupported] }
        paymentId: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [pending, accepted, applied, rejected, ignored] }
        reason: { type: [string, "null"] }
    MerchantEventPage:
      type: object
      required: [events, nextCursor]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/MerchantEvent" } }
        nextCursor: { type: [string, "null"], format: uuid }
    BundleTerms:
      type: object
      additionalProperties: false
      required: [name, displayCurrency, displayAmountMinor, purchasedMinor, promoMinor, promoLifetimeDays]
      description: Exact immutable sold terms. Price ratio must be representable by the existing eight-decimal collection snapshot. Promotional expiry is paidAt plus lifetime days; null never expires. Delayed fulfillment cannot restart this lifetime. Purchased funds do not inherit promotional expiry. A confirmed partial or full refund cancels remaining promotional credit without cash reimbursement.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        displayCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        displayAmountMinor: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        purchasedMinor: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        promoMinor: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        promoLifetimeDays: { type: [integer, "null"], minimum: 1, maximum: 3650 }
    BundleOffer:
      type: object
      additionalProperties: false
      required: [bundleVersionId, bundleId, version, terms, publishedAt, retiredAt]
      properties:
        bundleVersionId: { type: string, format: uuid }
        bundleId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        terms: { $ref: "#/components/schemas/BundleTerms" }
        publishedAt: { type: string, format: date-time }
        retiredAt: { type: [string, "null"], format: date-time }
    BundlePublishRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, bundleId, expectedVersion, terms]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        bundleId: { type: [string, "null"], format: uuid }
        expectedVersion: { type: integer, minimum: 0 }
        terms: { $ref: "#/components/schemas/BundleTerms" }
    BundleMutation:
      type: object
      required: [id, offer]
      properties:
        id: { type: string, format: uuid }
        offer: { $ref: "#/components/schemas/BundleOffer" }
    PlanPaymentTerms:
      type: object
      additionalProperties: false
      required: [customerPlanId, planVersionId, periodIndex, periodStart, periodEnd, feeMinor, collectionRevision, displayCurrency, displayAmountMinor, rateMantissa, rateScale]
      description: Immutable plan payment intent. The exact sold fee is prepaid solely for this period, never silently allocated to older receivables. The fiat amount rounds up to the nearest supported currency minor unit; it does not enlarge or reduce the sold credit-denominated fee. Null initial bounds mean service starts at paid activation; renewal bounds name the preceding boundary and sold next end.
      properties:
        customerPlanId: { type: string, format: uuid }
        planVersionId: { type: string, format: uuid }
        periodIndex: { type: integer, minimum: 0 }
        periodStart: { type: [string, "null"], format: date-time }
        periodEnd: { type: [string, "null"], format: date-time }
        feeMinor: { type: integer, format: int64, minimum: 1 }
        collectionRevision: { type: integer, format: int64, minimum: 1 }
        displayCurrency: { type: string }
        displayAmountMinor: { type: integer, format: int64, minimum: 1 }
        rateMantissa: { type: string, description: Exact decimal integer numerator of currency-major units per credit }
        rateScale: { type: integer, minimum: 0, maximum: 8 }
    PlanPaymentQuote:
      type: object
      required: [terms, fingerprint, existingOrderId]
      properties:
        terms: { $ref: "#/components/schemas/PlanPaymentTerms" }
        fingerprint: { type: string, pattern: "^[a-f0-9]{64}$", description: Expected plan quote required for a new planPeriod order }
        existingOrderId: { type: [string, "null"], format: uuid, description: Resume this standing payment intent instead of creating another }
    OrderPurpose:
      type: string
      enum: [walletTopup, bundle, planPeriod, invoiceRepayment]
      description: The one fulfillment arm the order may take. `walletTopup` credits wallet cash only; `bundle` posts purchased credit plus a separate promo lot; `planPeriod` activates quota only; `invoiceRepayment` repays a drawn receivable only. No purpose both grants quota and wallet cash.
    OrderCreateRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, rail, purpose, displayAmountMinor, displayCurrency]
      description: The quoted payment terms. The server pins bundle amounts to the published offer and plan-period fees to the customer-scoped sold quote; other purposes derive credits from `displayAmountMinor` at the persisted Business collection rate. Customer display preferences cannot change these terms. A client-supplied `amountMinor` or `rate` is a schema rejection.
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        rail: { $ref: "#/components/schemas/MerchantRail" }
        expectedCheckout: { $ref: "#/components/schemas/CheckoutChoice", description: Optional current route/merchant/version precondition for new orders. Existing exact-key orders retain their original merchant and ignore current-choice preconditions; changing rail conflicts. }
        purpose:
          type: string
          enum: [walletTopup, bundle, planPeriod, invoiceRepayment]
        expectedCollectionRevision: { type: integer, minimum: 0, maximum: 9007199254740991, description: Optional quote precondition for a new order. Browser clients send the displayed revision; changed settings conflict before provider I/O. An existing idempotent order returns its original terms. }
        displayAmountMinor: { type: integer, format: int64, minimum: 1, description: the fiat minor amount the provider will charge }
        displayCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        purposeRef: { type: [string, "null"], format: uuid, description: Published `bundleVersionId` for a bundle, the `customerPlanId` a `planPeriod` activates or renews, or the receivable an `invoiceRepayment` settles }
        expectedPlanQuote: { type: [string, "null"], pattern: "^[a-f0-9]{64}$", description: Required for new planPeriod orders; the fingerprint from the customer-scoped quote. Never overrides the authoritative terms. }
        promoMinor: { type: [integer, "null"], format: int64, minimum: 0, description: Deprecated assertion only; zero/absent or exactly the selected bundle offer promotion. Customers cannot choose promotional credit. }
        returnUrl: { type: [string, "null"], description: "where the provider returns the browser — an absolute http(s) URL or a site-absolute path; absent, the order's own `/app/orders?order={orderId}` page" }
        cancelUrl: { type: [string, "null"], description: "the rail's cancel destination where one exists (Stripe); ignored by single-return rails" }
    PaymentOrder:
      type: object
      required: [orderId, merchantId, merchantVersionId, organizationId, purpose, amountMinor, currency, displayCurrency, displayAmountMinor, rateMantissa, rateScale, purposeRef, promoMinor, bundleOffer, planPayment, providerPaymentId, source, evidence, status, createdAt, paidAt]
      properties:
        orderId: { type: string, format: uuid }
        merchantId: { type: [string, "null"], format: uuid, description: the merchant the checkout was offered under — null on a `manual` order }
        merchantVersionId: { type: [string, "null"], format: uuid, description: the immutable merchant version — null on a `manual` order }
        organizationId: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/OrderPurpose" }
        amountMinor: { type: integer, format: int64, description: ledger credit-minor the fulfillment books, frozen at create }
        currency: { type: string, description: the ledger credit code }
        displayCurrency: { type: string }
        displayAmountMinor: { type: integer, format: int64, description: the fiat amount the provider charged or the receipt evidenced }
        rateMantissa: { type: integer, format: int64, description: the pinned conversion numerator }
        rateScale: { type: integer, description: the pinned conversion denominator exponent }
        purposeRef: { type: [string, "null"], format: uuid }
        promoMinor: { type: integer, format: int64 }
        bundleOffer: { anyOf: [{ $ref: "#/components/schemas/BundleOffer" }, { type: "null" }], description: Immutable publication snapshot for new bundle orders. Absent legacy unfulfilled bundles require operator review before checkout or granting. }
        planPayment: { anyOf: [{ $ref: "#/components/schemas/PlanPaymentTerms" }, { type: "null" }], description: Immutable period payment intent; unsafe legacy unfulfilled plan orders require operator review }
        providerPaymentId: { type: [string, "null"] }
        source: { type: string, enum: [provider, manual], description: "how the order's payment arrived — a rail's signed webhook or a staff-recorded receipt" }
        evidence: { type: object, description: "a manual order's audit payload (`reference`, `reason`, `recordedBy`); `{}` on provider orders" }
        status: { type: string, enum: [created, provider_pending, paid, fulfilled, expired, failed, needs_attention] }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
    PaymentOrderPage:
      type: object
      required: [orders, nextCursor]
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/PaymentOrder" } }
        nextCursor: { type: [string, "null"], format: uuid }
    OrderCheckout:
      type: object
      required: [order, providerPaymentId, clientSecret, checkoutUrl, publishableKey, sdkUrl]
      description: The pinned order plus the provider checkout handles the browser completes payment against — a checkout to complete, never a paid order.
      properties:
        order: { $ref: "#/components/schemas/PaymentOrder" }
        providerPaymentId: { type: [string, "null"] }
        clientSecret: { type: [string, "null"] }
        checkoutUrl: { type: [string, "null"], format: uri }
        publishableKey: { type: [string, "null"] }
        sdkUrl: { type: [string, "null"], format: uri }
    PaymentFulfillment:
      type: object
      required: [fulfillmentId, orderId, purpose, purposePayload, outboxId, fulfilledAt]
      properties:
        fulfillmentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/OrderPurpose" }
        purposePayload: { type: object, description: what the purpose's grant produced — the wallet entry, activated subscription or repaid receivable }
        outboxId: { type: [string, "null"], format: uuid }
        fulfilledAt: { type: string, format: date-time }
    OrderFulfillment:
      type: object
      required: [orderId, status, paidAt, fulfillment]
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string }
        paidAt: { type: [string, "null"], format: date-time }
        fulfillment: { anyOf: [{ $ref: "#/components/schemas/PaymentFulfillment" }, { type: "null" }] }
    OrderCheckoutSession:
      type: object
      required: [status, providerPaymentId, clientSecret, checkoutUrl, publishableKey, sdkUrl]
      description: The live checkout handles and lifecycle truth the returned or refreshed browser polls — a recovery read, never a paid promise.
      properties:
        status: { type: string, enum: [created, provider_pending, paid, fulfilled, expired, failed, needs_attention] }
        providerPaymentId: { type: [string, "null"] }
        clientSecret: { type: [string, "null"] }
        checkoutUrl: { type: [string, "null"], format: uri }
        publishableKey: { type: [string, "null"], description: the pinned merchant version's publishable key — null on a manual order }
        sdkUrl: { type: [string, "null"], format: uri }
    ManualOrderRequest:
      type: object
      additionalProperties: false
      required: [organizationId, idempotencyKey, displayAmountMinor, displayCurrency, reference, reason]
      description: A verified out-of-band receipt. The credit amount rates server-side at the stored business collection rate — a staff-supplied ledger figure never enters. `reference` is the receipt's unique evidence.
      properties:
        organizationId: { type: string, format: uuid, description: the customer the receipt funds }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        purpose: { type: [string, "null"], enum: [walletTopup], description: "fixed — a receipt only funds wallet cash" }
        expectedCollectionRevision: { type: integer, minimum: 0, maximum: 9007199254740991, description: Optional quote precondition for a new order. Browser clients send the displayed revision; changed settings conflict before provider I/O. An existing idempotent order returns its original terms. }
        displayAmountMinor: { type: integer, format: int64, minimum: 1, description: the fiat minor amount the receipt evidences }
        displayCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        reference: { type: string, minLength: 1, maxLength: 200, description: the receipt's own reference — a bank transaction id or remittance note, unique per business }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ManualOrderResult:
      type: object
      required: [order, fulfillment]
      properties:
        order: { $ref: "#/components/schemas/PaymentOrder" }
        fulfillment: { anyOf: [{ $ref: "#/components/schemas/PaymentFulfillment" }, { type: "null" }] }
    PaymentReconciliation:
      type: object
      required: [created, providerPending, paid, fulfilled, expired, failed, needsAttention, paidUnfulfilled]
      properties:
        created: { type: integer, format: int64 }
        providerPending: { type: integer, format: int64 }
        paid: { type: integer, format: int64 }
        fulfilled: { type: integer, format: int64 }
        expired: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        needsAttention: { type: integer, format: int64 }
        paidUnfulfilled: { type: array, items: { type: string, format: uuid }, description: the paid orders the recovery sweep still owes a fulfillment }
    FinancialFacts:
      type: object
      required: [usageMinor, ratedMinor, entitlementMinor, fundingMinor, earnedMinor, collectedMinor, refundMinor, receivableMinor, billedMinor, deferredMinor, discountMinor]
      description: The source-derived financial figures a period's books answer, all integer minor units — the customer's `/api/v1/org/usage-report` and the staff's `/api/v1/business/financial-facts` derive from the same source rows, so the filtered view is a projection, never a second total.
      properties:
        usageMinor: { type: integer, format: int64, description: "Σ settled `charged_minor` — what the turns cost the customer" }
        ratedMinor: { type: integer, format: int64, description: the same turns at catalog rate before discount — `rated − usage` is the granted discount }
        entitlementMinor: { type: integer, format: int64, description: subscription draws plus plan-period quota consumed — what the plan covered }
        fundingMinor: { type: integer, format: int64, description: paid orders plus credited deposits — cash in }
        billedMinor: { type: integer, format: int64, description: net billed fee; v1 posted-journal cohort plus v2 signed effect movements under the selected clock }
        deferredMinor: { type: integer, format: int64, description: net deferred-fee change from immutable v2 accounting effects under the selected clock }
        discountMinor: { type: integer, format: int64, description: noncash journal discounts and promotion credits; cash-refund credits excluded }
        earnedMinor: { type: integer, format: int64, description: net plan-fee income from source-linked recognition and correction effects; v1 retains its historical closing policy }
        collectedMinor: { type: integer, format: int64, description: net billed collection; v1 posted-journal cohort plus v2 signed collection effects }
        refundMinor: { type: integer, format: int64, description: confirmed cash returns counted once; journal credit lines do not create a second refund }
        receivableMinor: { type: integer, format: int64, description: "legacy statement/journal outstanding plus v2 receivable movement; no filter gives the cumulative position" }
    CostBasisCount:
      type: object
      required: [turns, costMinor, untrackedTurns]
      description: >-
        One `cost_basis` bucket — "cost not tracked" is never blurred with
        "cost was zero": a `missing` bucket's turns with no `costMinor` is the
        coverage gap, while a `realAttempt` `0` is a failed-but-billed attempt.
      properties:
        turns: { type: integer, format: int64 }
        costMinor: { type: integer, format: int64 }
        untrackedTurns: { type: integer, format: int64 }
    CostCoverageDay:
      type: object
      required: [serviceDate, channel, model, turns, costMinor, cacheReuseTurns, untrackedTurns]
      description: One `(serviceDate, channel, model)` grain — the provider's own cost roll-up's day.
      properties:
        serviceDate: { type: string, format: date }
        channel: { type: string }
        model: { type: string }
        turns: { type: integer, format: int64 }
        costMinor: { type: integer, format: int64 }
        cacheReuseTurns: { type: integer, format: int64, description: "turns with `upstream_attempts = 0` — no upstream call ran" }
        untrackedTurns: { type: integer, format: int64 }
    CostCoverage:
      type: object
      required: [realAttempt, cacheReuse, estimate, missing, providerReconciled, failedAttempts, byProviderDay]
      properties:
        realAttempt: { $ref: "#/components/schemas/CostBasisCount" }
        cacheReuse: { $ref: "#/components/schemas/CostBasisCount" }
        estimate: { $ref: "#/components/schemas/CostBasisCount" }
        missing: { $ref: "#/components/schemas/CostBasisCount" }
        providerReconciled: { $ref: "#/components/schemas/CostBasisCount" }
        failedAttempts:
          type: object
          required: [errored, refused]
          properties:
            errored: { type: integer, format: int64 }
            refused: { type: integer, format: int64 }
        byProviderDay: { type: array, items: { $ref: "#/components/schemas/CostCoverageDay" } }
    ReconciliationRun:
      type: object
      required: [runId, kind, periodStart, periodEnd, timeBasis, latestSnapshotId, coverage, state, expectedTotals, actualTotals, exceptionCount, requestedBy, startedAt, finishedAt, lastError]
      properties:
        runId: { type: string, format: uuid }
        kind: { type: string, enum: [daily, period_close, manual] }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        state: { type: string, enum: [running, matched, exceptions, failed] }
        timeBasis: { type: string, enum: [booking, service, payment] }
        latestSnapshotId: { type: [string, "null"], format: uuid, description: Latest retained comparison; upgraded projection-only runs point to a legacy snapshot with coverage version 0 }
        coverage: { $ref: "#/components/schemas/ReconciliationCoverage" }
        expectedTotals: { type: object, additionalProperties: { type: integer, format: int64 }, description: Only the fields named in coverage.comparedFields; legacy snapshots retain their original shape }
        actualTotals: { type: object, additionalProperties: { type: integer, format: int64 }, description: Independently derived official ledger amounts for compared fields; excluded fields are absent, never copied }
        exceptionCount: { type: integer, format: int64 }
        requestedBy: { type: [string, "null"], format: uuid, description: the staff actor on a manual run, null on a scheduled pass }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        lastError: { type: [string, "null"] }
    ReconciliationCoverage:
      type: object
      required: [version, complete, comparedFields, notCompared, organizations, sources, verifiedSources, entries, verifiedEntries, basis, limits]
      properties:
        version: { type: integer, description: 0 means retained legacy projection-only evidence; 1 means independent plan/refund comparison }
        complete: { type: boolean, description: false when any required source is missing, unsupported or corrupt }
        comparedFields: { type: array, items: { type: string } }
        notCompared: { type: array, items: { type: string }, description: Explicit exclusions; matched never attests these fields }
        organizations: { type: integer, format: int64 }
        sources: { type: integer, format: int64, description: Required source comparisons }
        verifiedSources: { type: integer, format: int64, description: Source comparisons with supported and complete ledger evidence }
        entries: { type: integer, format: int64 }
        verifiedEntries: { type: integer, format: int64 }
        basis: { type: string, description: Describes v1 net journal cohort and v2 effect movements, and separate payable/suspense positions }
        limits: { type: object, additionalProperties: { type: integer, format: int64 } }
    ReconciliationSnapshot:
      type: object
      required: [snapshotId, runId, state, expectedTotals, actualTotals, coverage, exceptionCount, capturedAt, evidence]
      properties:
        snapshotId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        state: { type: string, enum: [matched, exceptions, legacy] }
        expectedTotals: { type: object, additionalProperties: { type: integer, format: int64 } }
        actualTotals: { type: object, additionalProperties: { type: integer, format: int64 } }
        coverage: { $ref: "#/components/schemas/ReconciliationCoverage" }
        exceptionCount: { type: integer, format: int64 }
        capturedAt: { type: string, format: date-time }
        evidence: { type: [object, "null"], description: null in list summaries; detail captures source IDs, dates, verified entries, amounts and exact differences }
    ReconciliationException:
      type: object
      required: [exceptionId, runId, organizationId, kind, fact, expectedMinor, actualMinor, sourceTable, sourceRef, detail, state, resolvedBy, resolution, resolvedAt, createdAt]
      properties:
        exceptionId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        organizationId: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [unmatched_usage, unmatched_journal, unmatched_payment, amount_drift, missing_cost, double_entry] }
        expectedMinor: { type: [integer, "null"], format: int64 }
        actualMinor: { type: [integer, "null"], format: int64 }
        sourceTable: { type: [string, "null"], description: the blamed projection — usage_records, invoice_journals, payment_orders, plan_statements, ledger }
        sourceRef: { type: [string, "null"], description: the blamed row's identifier — a request id, journal id, order id or entry id }
        fact: { type: string, description: Stable compared field or source failure; distinct facts on one source remain distinct exceptions }
        detail: { type: [string, "null"], description: the check's own diff summary }
        state: { type: string, enum: [open, resolved, waived] }
        resolvedBy: { type: [string, "null"], format: uuid }
        resolution: { type: [string, "null"], description: required on a close — an exception never goes silent }
        resolvedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    ReconciliationRepair:
      type: object
      required: [repairId, exceptionId, actorUserId, action, before, after, auditRef, reason, createdAt]
      properties:
        repairId: { type: string, format: uuid }
        exceptionId: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        action: { type: string, enum: [reclassify_cost, adjust_journal, link_payment, mark_duplicate] }
        before: { type: object, description: the row's fields before the corrective write }
        after: { type: object, description: the row's fields after }
        auditRef: { type: [string, "null"], format: uuid, description: the finance_audit row authorizing the write }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    ReconciliationRunRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, periodStart, periodEnd]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        timeBasis: { type: string, enum: [booking, service, payment], default: booking }
    ReconciliationCloseRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, resolution]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        resolution: { type: string, minLength: 1, maxLength: 500, description: the corrective outcome (resolve) or why the drift is not a defect (waive) }
    ReconciliationRepairRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, action, reason]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        action: { type: string, enum: [reclassifyCost, adjustJournal, linkPayment, markDuplicate] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        patch: { type: object, description: "the action's arguments — `reclassifyCost` takes `costBasis` and an optional `upstreamCostMinor`" }
    RefundRequestBody:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200, description: the request's idempotency anchor — a replay returns the standing refund }
        amountMinor: { type: [integer, "null"], format: int64, description: the credit amount asked back, ledger minor units; absent names the whole refundable remainder }
        reason: { type: string, minLength: 1, maxLength: 500 }
    RefundResolveBody:
      type: object
      additionalProperties: false
      required: [idempotencyKey, decision]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        decision: { type: string, enum: [approve, decline] }
        reason: { type: [string, "null"], maxLength: 500 }
    DisputeResolveBody:
      type: object
      additionalProperties: false
      required: [idempotencyKey, resolution]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        resolution: { type: string, enum: [evidenceDue, won, lost, closed] }
        reason: { type: [string, "null"], maxLength: 500 }
    NonplanRefundEffect:
      type: object
      additionalProperties: false
      description: >-
        Immutable verified non-plan refund cash fact. This is separate from the
        original request/approval and credit-note state. Late or unapproved external
        money-out can coexist with an unchanged declined, failed or released state.
        Its presence does not authorize a provider call or reopen old debt. Null on
        the parent means this policy has not verified an effect, not zero money-out.
      required:
        - policy
        - refundId
        - orderId
        - organizationId
        - cashMinor
        - walletMinor
        - suspenseMinor
        - walletRestoredMinor
        - cashEntryId
        - cashEntryHash
        - cashBookingDate
        - correctionEntryId
        - correctionEntryHash
        - originalFundingEntryId
        - originalFundingEntryHash
        - eventReceiptId
        - legacyRecovery
        - requiresReview
        - reviewReasons
        - bookedAt
      properties:
        policy: { type: string, const: nonplan-refund-v1 }
        refundId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        cashMinor:
          type: integer
          format: int64
          minimum: 1
          description: Complete provider Cash outflow, in ledger credit minor units.
        walletMinor:
          type: integer
          format: int64
          minimum: 0
          description: Only provably retained original Wallet funding reclaimed.
        suspenseMinor:
          type: integer
          format: int64
          minimum: 0
          description: Cash outflow requiring source review; never invented debt.
        walletRestoredMinor:
          type: integer
          format: int64
          minimum: 0
          description: Proven historical wrong-source Wallet debit restored without another Cash outflow.
        cashEntryId: { type: string, format: uuid }
        cashEntryHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        cashBookingDate:
          type: string
          format: date
          description: Original Cash entry accounting day, retained during later source correction.
        correctionEntryId: { type: [string, 'null'], format: uuid }
        correctionEntryHash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        originalFundingEntryId: { type: [string, 'null'], format: uuid }
        originalFundingEntryHash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        eventReceiptId: { type: string, format: uuid }
        legacyRecovery: { type: boolean }
        requiresReview: { type: boolean }
        reviewReasons: { type: array, items: { type: string } }
        bookedAt:
          type: string
          format: date-time
          description: When this verified allocation metadata committed; not necessarily the Cash accounting date.
    OrderRefund:
      type: object
      required: [refundId, orderId, organizationId, amountMinor, displayAmountMinor, displayCurrency, reason, state, providerRefundId, retryCount, nextRetryAt, noteId, cashEffect, createdAt, updatedAt]
      properties:
        refundId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64, description: the credit amount asked back, ledger minor units }
        displayAmountMinor: { type: integer, format: int64, description: the fiat figure the provider is asked to return, converted at the order's pinned rate }
        displayCurrency: { type: string }
        reason: { type: string }
        state: { type: string, enum: [requested, declined, provider_pending, succeeded, failed, released] }
        providerRefundId: { type: [string, "null"], description: the provider's refund id once issued — the dedup the refund_* events name }
        retryCount: { type: integer, description: provider attempts so far }
        nextRetryAt: { type: [string, "null"], format: date-time, description: "Next bounded provider recovery attempt. Null while provider_pending means automatic recovery stopped and reconciliation is required; the reserved amount and issued note remain held." }
        noteId: { type: [string, "null"], format: uuid, description: the credit note an approval issued }
        cashEffect:
          oneOf:
            - $ref: "#/components/schemas/NonplanRefundEffect"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderRefundPage:
      type: object
      required: [refunds, nextCursor]
      properties:
        refunds: { type: array, items: { $ref: "#/components/schemas/OrderRefund" } }
        nextCursor: { type: [string, "null"], format: uuid }
    OrderRefundList:
      type: object
      required: [refunds, refundableMinor]
      properties:
        refunds: { type: array, items: { $ref: "#/components/schemas/OrderRefund" } }
        refundableMinor: { type: [integer, "null"], format: int64, description: the credit-minor still refundable on the order; null for an order with nothing refundable }
    OrderCreditNote:
      type: object
      required: [creditNoteId, organizationId, orderId, refundId, entryId, amountMinor, reason, state, cashEffect, createdAt]
      properties:
        creditNoteId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        refundId: { type: string, format: uuid }
        entryId: { type: [string, "null"], format: uuid, description: original retained note entry; cashEffect separately describes verified cash and historical correction }
        cashEffect:
          oneOf:
            - $ref: "#/components/schemas/NonplanRefundEffect"
            - type: "null"
        amountMinor: { type: integer, format: int64 }
        reason: { type: string }
        state: { type: string, enum: [issued, applied, reversed] }
        createdAt: { type: string, format: date-time }
    OrderCreditNotePage:
      type: object
      required: [notes, nextCursor]
      properties:
        notes: { type: array, items: { $ref: "#/components/schemas/OrderCreditNote" } }
        nextCursor: { type: [string, "null"], format: uuid }
    OrderDispute:
      type: object
      required: [disputeId, orderId, organizationId, providerDisputeId, amountMinor, currency, state, rechargeEntryId, cashCorrection, createdAt, updatedAt]
      properties:
        disputeId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        providerDisputeId: { type: string, description: the provider's case identifier }
        amountMinor: { type: integer, format: int64, description: contested credit amount in ledger minor units; for non-plan disputes exactly converted from the authenticated fiat amount using the order snapshot }
        currency: { type: string, description: original collection fiat currency; amountMinor remains ledger credit minor units }
        state: { type: string, enum: [opened, evidence_due, won, lost, closed] }
        rechargeEntryId: { type: [string, "null"], format: uuid, description: the ledger entry retaining the lost dispute cash effect }
        cashCorrection:
          oneOf:
            - $ref: "#/components/schemas/NonplanChargebackCorrection"
            - type: "null"
          description: Retained append-only compensation of a historical wrong-direction non-plan chargeback. The old entry and terminal outcome are preserved; null means no retained correction. This read projection does not independently reverify the evidence or certify historical correctness.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NonplanChargebackCorrection:
      type: object
      required: [policy, disputeId, orderId, organizationId, falseReceiptMinor, actualLossMinor, cashCorrectionMinor, walletMinor, suspenseMinor, preservedCreditBenefitMinor, originalEntryId, originalEntryHash, correctionEntryId, correctionEntryHash, correctionBookingDate, eventReceiptId, sourceRevision, requiresReview, reviewReasons, bookedAt]
      properties:
        policy: { type: string, const: nonplan-chargeback-recovery-v1 }
        disputeId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        falseReceiptMinor: { type: integer, format: int64, description: Original erroneous Cash debit B which must be cancelled }
        actualLossMinor: { type: integer, format: int64, description: Complete independently confirmed chargeback loss L }
        cashCorrectionMinor: { type: integer, format: int64, description: Appended Cash credit B plus L; not a second provider loss }
        walletMinor: { type: integer, format: int64, description: Proven original retained Wallet allocated only to the actual loss }
        suspenseMinor: { type: integer, format: int64, description: Correction debit not allocated to original Wallet; includes preserved credit benefit }
        preservedCreditBenefitMinor: { type: integer, format: int64, description: Original CreditLine credit B retained without reopening debt or rewriting statements }
        originalEntryId: { type: string, format: uuid }
        originalEntryHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        correctionEntryId: { type: string, format: uuid }
        correctionEntryHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        correctionBookingDate: { type: string, format: date }
        eventReceiptId: { type: string, format: uuid }
        sourceRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
        requiresReview: { type: boolean, const: true }
        reviewReasons: { type: array, items: { type: string } }
        bookedAt: { type: string, format: date-time }
    OrderDisputePage:
      type: object
      required: [disputes, nextCursor]
      properties:
        disputes: { type: array, items: { $ref: "#/components/schemas/OrderDispute" } }
        nextCursor: { type: [string, "null"], format: uuid }
    FinanceAuditEntry:
      type: object
      required: [auditId, actorUserId, action, target, detail, noteId, createdAt]
      description: One immutable `finance_audit` row — the staff financial action's authorization record. Every refund resolution, dispute close, journal void, statement release, reconciliation close/repair and explicit historical plan refund or usage correction lands one, naming the actor, the audited action and the reason it carried.
      properties:
        auditId: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid, description: the staff user who authorized the action }
        action:
          type: string
          enum: [refund.approve, refund.decline, refund.release, dispute.resolve, journal.void, statement.release, reconciliation.resolve, reconciliation.waive, reconciliation.repair, plan_refund.recover, plan_usage.correct, nonplan_refund.recover, nonplan_chargeback.recover]
          description: the audited financial action — the same vocabulary `finance_audit`'s check constraint bounds
        target: { type: string, description: the entity the action corrected — a refund, dispute, journal, statement or exception id }
        detail: { type: object, additionalProperties: true, description: the action's safe fields — reason, decision, repair patch; never a credential }
        noteId: { type: [string, "null"], format: uuid, description: the credit note a refund approval produced; null on every other action }
        createdAt: { type: string, format: date-time }
    FinanceAuditPage:
      type: object
      required: [entries, nextCursor]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/FinanceAuditEntry" } }
        nextCursor: { type: [string, "null"], format: uuid }
    ProviderMutationResult:
      type: object
      required: [id, resourceId, version]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: [string, "null"], format: uuid }
        version: { type: [integer, "null"], format: int64 }
    BusinessChannelPage:
      type: object
      required: [channels, nextCursor]
      properties:
        channels: { type: array, items: { $ref: "#/components/schemas/Channel" } }
        nextCursor: { type: [string, "null"], format: uuid }
    ProviderDestinationPolicy:
      type: object
      additionalProperties: false
      required: [network]
      description: Public requires HTTPS and globally routable IPs. Internal permits HTTP(S) only to the exact allowedIps explicitly approved by the business owner or deployment recovery authority. All DNS answers must satisfy policy, and the transport uses those addresses without a second resolution. Metadata/link-local, unspecified, multicast and reserved destinations are always refused. Redirects and environment proxies are disabled. Existing channels default to public until explicitly reauthorized.
      properties:
        network: { type: string, enum: [public, internal] }
        allowedIps:
          type: array
          maxItems: 16
          uniqueItems: true
          description: Required and nonempty for internal; absent or empty for public. Exact IPv4/IPv6 literals, never hostnames or CIDRs.
          items: { type: string }
    ProviderConnectionCheck:
      type: object
      required: [id, channelId, state, httpStatus]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        state: { type: string, enum: [pending, reachable, authenticationFailed, httpError, blocked, unreachable] }
        httpStatus: { type: [integer, "null"], minimum: 100, maximum: 599 }
    BusinessChannelRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, config]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        config:
          type: object
          additionalProperties: false
          required: [name, baseUrl, protocol]
          properties:
            name: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9._-]+$" }
            baseUrl: { type: string, format: uri, description: "HTTPS public by default; HTTP(S) for explicitly approved internal endpoints. No user info, query or fragment; no network call on save" }
            protocol: { type: string, enum: [openai, anthropic, gemini, tasks] }
            apiKeys: { type: [array, "null"], minItems: 1, maxItems: 100, items: { type: string, minLength: 8, maxLength: 8192 } }
            destinationPolicy:
              allOf: [{ $ref: "#/components/schemas/ProviderDestinationPolicy" }]
              description: Omitted preserves policy only at the same endpoint/protocol; new or changed connections default to public. Internal approval must be resupplied when repointing.
    BusinessProviderCredentialRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, config]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        config:
          type: object
          additionalProperties: false
          required: [apiKey]
          properties:
            apiKey: { type: string, minLength: 8, maxLength: 8192 }
    BusinessProviderBillKeyRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, config]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        config:
          type: object
          additionalProperties: false
          required: [apiKey]
          properties:
            apiKey: { type: [string, "null"], minLength: 8, maxLength: 8192 }
    BusinessProviderStatusRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, config]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        config:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, enum: [active, disabled] }
    BusinessProviderCacheRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason, config]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        config:
          type: object
          additionalProperties: false
          required: [policy]
