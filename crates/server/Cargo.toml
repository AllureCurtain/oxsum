[package]
name = "oxsum-server"
description = "oxsum server: axum JSON API, OpenAI-compatible gateway and Leptos web dashboard, single binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxsum"
path = "src/main.rs"

[dependencies]
oxsum-core.workspace = true
axum.workspace = true
# The verifying key is published base64; the note format keeps its own base64 inside.
base64.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
# The one pool every tenant shares is built here, at startup: see main.rs and
# docs/decisions.md, "all tenants share one connection pool".
sqlx.workspace = true
subtle.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# The relay generator, see Cargo.toml at the workspace root.
async-stream.workspace = true
# The `Stream` trait for the relay's return type; nothing else from futures is needed.
futures-core.workspace = true
# The upstream HTTP client, built once in lib.rs and shared through AppState.
reqwest.workspace = true
# Buffering a finished response body for the idempotency record.
http-body.workspace = true
http-body-util.workspace = true
# The dashboard pages: server-side rendering plus hydration, mounted through
# leptos_axum into the same binary (docs/decisions.md, "pages move to Leptos").
oxsum-web.workspace = true
leptos.workspace = true
leptos_axum.workspace = true
# Process telemetry: the recorder and its render handle live in AppState (see src/metrics.rs).
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
lettre.workspace = true
# The weighted pick that leads a request's candidate routes (issue #168).
rand.workspace = true

[dev-dependencies]
dotenvy.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
# `browser_contract.rs` matches the served HTML and the wasm glue with targeted patterns,
# rather than a substring that a rename would keep satisfying.
regex.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
uuid.workspace = true
# Integration tests verify tree-head notes and consistency proofs with the real types.
doubleentry.workspace = true
# Decoding the published verifying key in the head tests.
base64.workspace = true

[lints]
workspace = true
