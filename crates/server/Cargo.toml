[package]
name = "oxsum-server"
description = "oxsum server: axum JSON API (web dashboard mounted later), single binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxsum"
path = "src/main.rs"

[dependencies]
oxsum-core.workspace = true
axum.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
# The one pool every tenant shares is built here, at startup: see main.rs and
# docs/decisions.md, "all tenants share one connection pool".
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# The relay generator, see Cargo.toml at the workspace root.
async-stream.workspace = true
# The `Stream` trait for the relay's return type; nothing else from futures is needed.
futures-core.workspace = true
# The upstream HTTP client, built once in lib.rs and shared through AppState.
reqwest.workspace = true

[dev-dependencies]
dotenvy.workspace = true
http-body-util.workspace = true
tower.workspace = true
uuid.workspace = true

[lints]
workspace = true
