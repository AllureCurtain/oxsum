[package]
name = "oxsum-integrations"
description = "oxsum third-party service integrations: GitHub OAuth, Stripe, Turnstile, SMTP mail."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
oxsum-core.workspace = true
base64.workspace = true
# base58 for decoding the multisig/vault addresses the Squads PDA check
# derives (issue #1143).
bs58.workspace = true
# The Edwards-curve check a Solana PDA derivation needs — a valid PDA is a
# digest that is *not* a curve point (issue #1143).
curve25519-dalek.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
lettre.workspace = true
metrics.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true

[dev-dependencies]
# A stub HTTP server for the wire-level tests (the Anthropic cost_report
# contract is proven against a live axum stub, not just type-level).
axum.workspace = true
