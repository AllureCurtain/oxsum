[workspace]
resolver = "3"
members = ["crates/doubleentry", "crates/core", "crates/server", "crates/verify", "crates/web", "crates/integrations", "crates/testkit"]
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AllureCurtain/oxsum"

[workspace.dependencies]
oxsum-core = { path = "crates/core" }
oxsum-integrations = { path = "crates/integrations" }
oxsum-testkit = { path = "crates/testkit" }
oxsum-verify = { path = "crates/verify" }
oxsum-web = { path = "crates/web" }
# The `witness` feature enables doubleentry's witness module (tree-head notes and Ed25519
# signing), which the operator uses to sign ledger heads. The module is used as a dependency;
# `crates/doubleentry` itself is not modified.
doubleentry = { path = "crates/doubleentry", features = ["postgres", "serde", "witness"] }

axum = "0.8"
# Per-suite scratch databases for integration tests (issue #226): created on
# first use, dropped when the suite's process exits.
ctor = "0.2"
# Sealing channel credentials at rest: AES-256-GCM, and the base64 the stored record uses.
aes-gcm = "0.10"
base64 = "0.21"
# Signed spend mandates (issue #262): Ed25519 over the mandate's canonical body.
# Same crate doubleentry's witness feature already resolves; no `rand_core`, so
# seeds stay caller-supplied and the signing path deterministic.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
dotenvy = "0.15"
# The dashboard: Topcoat pages, server-side rendered, mounted into the same
# binary as an axum fallback service (spike/topcoat-dashboard).
topcoat = { version = "0.10", default-features = false, features = ["tower", "cookie", "view"] }
# The React dashboard's built assets, embedded into the binary and served at
# /app (issue #234). `debug-embed` reads them from disk in debug builds, so a
# frontend rebuild needs no cargo step; release builds embed and are checked
# in the Dockerfile.
rust-embed = { version = "8.5", features = ["debug-embed"] }
password-auth = "1"
proptest = "1"
rand = "0.10"
# The browser-contract test matches the served HTML and the wasm glue with targeted
# patterns, rather than a substring that a rename would keep satisfying.
regex = "1"
sha2 = "0.11"
# HMAC-SHA256 over the delivered webhook body — the version pairs with sha2 0.11's digest.
hmac = "0.13"
# The operator token on the admin surface is compared in constant time, so a wrong guess learns
# nothing from how long the comparison took.
subtle = "2"
# Parsing a channel's base URL where the rule lives (core), rather than trusting the HTTP layer to
# have checked it.
url = "2"
# The gateway's upstream client and both halves of the streaming relay: `rustls` so a
# deployment needs no OpenSSL, `stream` for the passthrough. See docs/decisions.md,
# "gateway HTTP client and token estimation".
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Polling the relay by hand needs the `Stream` trait itself, nothing else from futures.
futures-core = "0.3"
# The relay is a generator: it forwards chunks, then awaits the settlement before it ends. A
# hand-written `Stream` cannot await at its end, and awaiting there is what makes the ledger write
# visible to a client that is waiting for the stream to close.
async-stream = "0.3"
# Local token estimation, on the interruption path only; the vocabulary is built in.
tiktoken-rs = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The single feature source for sqlx: doubleentry's optional postgres backend
# needs the `time`/`Date` and `uuid`/`Uuid` Encode/Decode impls (storage/postgres.rs
# binds both), so the union lives here and doubleentry inherits it — keeping the
# two declaration sites from drifting apart and forcing duplicate sqlx builds.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "time", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["macros", "serde-well-known"] }
# `log` is what sqlx's ConnectOptions::log_slow_statements takes; the workspace does not
# log through `log` directly — tracing does that.
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OTLP trace export (issue #224): optional, env-gated on OXSUM_OTLP_ENDPOINT.
# `tracing-opentelemetry` bridges the `tracing` spans the gateway already emits
# into the OpenTelemetry SDK; `opentelemetry-otlp` ships them to a collector.
# Default features off where the exporter allows it, and HTTP (not gRPC) keeps
# the binary off tonic/prost's codegen stack.
opentelemetry = { version = "0.33", features = ["trace"] }
# `rt-tokio` alone is not enough: the default batch processor drives the exporter
# on its own thread where no tokio reactor runs, which the async `reqwest-client`
# cannot work under. The async-runtime processor variant takes `runtime::Tokio`
# explicitly, so batches are exported on the application's own runtime.
opentelemetry_sdk = { version = "0.33", features = [
    "trace",
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }
# HTTP transport only: `http-proto` + `reqwest-client` + rustls roots — the gRPC
# (`grpc-tonic`) and native-TLS paths stay out, keeping the binary off
# tonic/prost codegen and on the workspace's one TLS stack.
opentelemetry-otlp = { version = "0.33", features = ["trace", "http", "http-proto", "reqwest-client", "tls-webpki-roots", "tls-ring"] }
tracing-opentelemetry = "0.34"
uuid = { version = "1", features = ["v4", "v5"] }

tower = { version = "0.5", features = ["util"] }
# The request backstop (`TimeoutLayer` in routes.rs): already in the tree via
# axum, promoted to a direct dependency so the timeout is explicit rather than
# relying on a transitive one.
tower-http = { version = "0.6", features = ["timeout"] }
http-body = "1"
http-body-util = "0.1"
# Telemetry: the `metrics` facade's types, and the Prometheus recorder whose handle renders
# `/metrics`. Default features off — the exporter's own HTTP listener and push gateway would
# pull a second HTTP stack; oxsum already serves, so only the recorder and handle are needed.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
futures-util = "0.3"
tokio-tungstenite = "0.30"
# Outbound mail for the verification and password-reset flows: async SMTP over TLS.
# `smtps://` connects wrapped; `smtp://` upgrades with STARTTLS when the server offers it.
# `tokio1-rustls-tls` (not `tokio1-native-tls`): rustls keeps the whole workspace on
# one TLS stack and drops openssl-sys — the only crate that pulled it — from the graph.
# Default features are off because lettre's default set includes `native-tls`, which
# trips lettre's own tokio1/native-tls feature guard; the list below is the old
# default set minus `native-tls`.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport", "pool", "hostname", "builder", "tokio1-rustls-tls",
] }
# The statement PDF export (issue #205): a pure-Rust writer, no headless browser, so the
# single-binary deployment is kept. Default features off — the html/layout/images/svg
# machinery is unused — and the document renders with the standard-14 builtin fonts, so no
# font bytes ship in the binary.
printpdf = { version = "0.12", default-features = false }
# The QR on the statement page, pointing at /verify: rendered as vector rectangles, so no
# image feature and no PNG encode is needed. Default features off.
qrcode = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
