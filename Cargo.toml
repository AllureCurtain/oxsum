[workspace]
resolver = "3"
members = ["crates/doubleentry", "crates/core", "crates/server", "crates/web"]
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AllureCurtain/oxsum"

# cargo-leptos reads its `[package.metadata.leptos]` from `crates/web/Cargo.toml`.
# `cargo leptos build` compiles the `oxsum` binary plus the WASM dashboard;
# plain `cargo build` / `cargo test` are unaffected.

[workspace.dependencies]
oxsum-core = { path = "crates/core" }
oxsum-web = { path = "crates/web" }
doubleentry = { path = "crates/doubleentry", features = ["postgres", "serde"] }

axum = "0.8"
# Sealing channel credentials at rest: AES-256-GCM, and the base64 the stored record uses.
aes-gcm = "0.10"
base64 = "0.21"
dotenvy = "0.15"
# The dashboard: Leptos 0.8, server-side rendering plus browser hydration, mounted
# through the official leptos_axum into the same binary (docs/decisions.md).
leptos = "0.8.21"
leptos_axum = "0.8.10"
leptos_meta = "0.8.7"
leptos_router = "0.8.16"
password-auth = "1"
proptest = "1"
rand = "0.10"
sha2 = "0.11"
# The operator token on the admin surface is compared in constant time, so a wrong guess learns
# nothing from how long the comparison took.
subtle = "2"
# Parsing a channel's base URL where the rule lives (core), rather than trusting the HTTP layer to
# have checked it.
url = "2"
# The gateway's upstream client and both halves of the streaming relay: `rustls` so a
# deployment needs no OpenSSL, `stream` for the passthrough. See docs/decisions.md,
# "gateway HTTP client and token estimation".
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Polling the relay by hand needs the `Stream` trait itself, nothing else from futures.
futures-core = "0.3"
# The relay is a generator: it forwards chunks, then awaits the settlement before it ends. A
# hand-written `Stream` cannot await at its end, and awaiting there is what makes the ledger write
# visible to a client that is waiting for the stream to close.
async-stream = "0.3"
# Local token estimation, on the interruption path only; the vocabulary is built in.
tiktoken-rs = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "2"
time = { version = "0.3", features = ["macros", "serde-well-known"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5"] }

tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures-util = "0.3"
tokio-tungstenite = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
