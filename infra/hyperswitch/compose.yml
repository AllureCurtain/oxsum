# Disposable local sandbox; all images are pinned in versions.json and .runtime/stack.env.
# Run through ./infra/hyperswitch/stack.py, never against a production database.
services:
  pg:
    image: ${HS_POSTGRES_IMAGE:?Run setup.sh first}
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: ${HS_DB_PASSWORD:?Run setup.sh first}
      POSTGRES_DB: hyperswitch_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hyperswitch_db -U db_user"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: ${HS_REDIS_IMAGE:?Run setup.sh first}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  migration:
    image: ${HS_ROUTER_IMAGE:?Run setup.sh first}
    entrypoint: ["/tools/diesel"]
    command: ["migration", "run", "--migration-dir", "/migrations", "--config-file", "/tools/diesel.toml"]
    environment:
      DATABASE_URL: postgres://db_user:${HS_DB_PASSWORD:?Run setup.sh first}@pg:5432/hyperswitch_db
    volumes:
      - ./.runtime/tools:/tools:ro
      - ./.repo/migrations:/migrations:ro
    depends_on:
      pg: {condition: service_healthy}
    restart: "no"
  router:
    image: ${HS_ROUTER_IMAGE:?Run setup.sh first}
    command: ["/local/bin/router", "-f", "/local/config/docker_compose.toml"]
    working_dir: /local
    ports:
      - "127.0.0.1:${HS_ROUTER_PORT:-18080}:8080"
    volumes:
      - ./.runtime/config:/local/config:ro
      - router_files:/local/bin/files
    depends_on:
      pg: {condition: service_healthy}
      redis: {condition: service_healthy}
      migration: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s
  sdk:
    image: ${HS_SDK_IMAGE:?Run setup.sh first}
    ports:
      - "127.0.0.1:${HS_SDK_PORT:-19050}:9050"
    environment:
      ENABLE_LOGGING: "false"
      sdkEnv: local
      ENV_BACKEND_URL: ${HS_PUBLIC_ROUTER_URL:-http://127.0.0.1:18080}
      ENV_SDK_URL: ${HS_PUBLIC_SDK_URL:-http://127.0.0.1:19050}
    depends_on:
      router: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9050/HyperLoader.js').then(async r=>{if(!r.ok || (await r.text()).length<1000)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s
  control-center:
    image: ${HS_CONTROL_CENTER_IMAGE:?Run setup.sh first}
    ports:
      - "127.0.0.1:${HS_CONTROL_PORT:-19000}:9000"
    environment:
      configPath: /tmp/dashboard-config.toml
      themeConfigPath: /tmp/dashboard-theme.json
    volumes:
      - ./.runtime/config/dashboard.toml:/tmp/dashboard-config.toml:ro
      - ./.runtime/config/dashboard_theme.json:/tmp/dashboard-theme.json:ro
    depends_on:
      router: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
  mailpit:
    image: ${HS_MAILPIT_IMAGE:?Run setup.sh first}
    ports:
      - "127.0.0.1:${HS_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${HS_MAIL_UI_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    volumes:
      - mail_data:/data
volumes:
  pg_data:
  redis_data:
  router_files:
  mail_data:
