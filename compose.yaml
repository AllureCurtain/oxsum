# PostgreSQL for local development. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    # A database with thousands of ledger schemas needs a lock per table during
    # a dump; the stock 64 per transaction answers "out of shared memory"
    # (docs/development.md, "Backup").
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oxsum
    ports:
      - "127.0.0.1:5432:5432"
    # A large restore (thousands of ledger schemas) needs more than Docker's
    # 64 MB /dev/shm: parallel index builds otherwise fail with "could not
    # resize shared memory segment" (docs/development.md, "Backup and restore
    # drill").
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  # The x402-rs facilitator sidecar (issue #282): the real rail oxsum's
  # `OXSUM_X402_FACILITATOR_*` set delegates verify/settle to. Uncomment to run
  # one locally; it needs a config.json naming chains, signers and RPCs — see
  # docs/development.md ("x402 facilitator sidecar"). Off by default: the
  # stand-in verifier covers development and the test suites.
  # facilitator:
  #   image: ghcr.io/x402-rs/x402-facilitator:main
  #   volumes:
  #     - ./facilitator.config.json:/app/config.json
  #   ports:
  #     - "127.0.0.1:8080:8080"

volumes:
  pgdata:
