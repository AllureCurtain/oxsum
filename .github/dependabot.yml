# Dependabot: weekly dependency bumps, grouped so patch/minor batch and
# major stays its own PR (issue #388).
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Patch and minor together: one PR per week, not one per crate.
      cargo-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # jsonwebtoken stays on 9 (docs/decisions.md): 10/11 ship no crypto
    # backend, so every encode/decode panics without an explicit rustls
    # provider feature. Stop dependabot re-proposing the forbidden major.
    ignore:
      - dependency-name: "jsonwebtoken"
        update-types: ["version-update:semver-major"]
    # Cargo has no conventional commit prefix rule; keep the repo's type
    # prefix so the PR title matches the branch naming policy.
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    commit-message:
      prefix: ci
