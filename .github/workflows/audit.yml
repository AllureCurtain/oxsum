# Dependency audit: cargo audit on lockfile changes and weekly, so a new
# CVE is found even without code touching the tree (issue #389).

name: Audit

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the lockfile
        run: cargo audit
