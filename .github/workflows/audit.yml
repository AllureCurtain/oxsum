# Dependency audit: cargo audit on lockfile changes and weekly, so a new
# CVE is found even without code touching the tree (issue #389).

name: Audit

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
      # A change to this workflow should be exercised by its own branches,
      # otherwise a broken install step goes unnoticed until the next lockfile
      # bump (which is what this PR's cargo-audit install change is).
      - '.github/workflows/audit.yml'
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A prebuilt binary (taiki-e/install-action fetches the release asset)
      # instead of `cargo install`, which spent ~90s of this job's 197s
      # compiling cargo-audit itself.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit the lockfile
        run: cargo audit
