# Release candidate gate (issue #620, T29): given an exact SHA, prove the
# candidate and produce its artifacts — never publish or deploy them.
#
# Run it by hand:
#   gh workflow run release-candidate.yml -f sha=<40-char commit>
# The workflow checks out THAT sha (not the branch that happened to point at
# it), so the gate's verdict and the manifest it writes always name one
# immutable commit. `workflow_call` exists so a future promotion flow can
# invoke the gate and receive the manifest as an artifact.
#
# What it runs, on the promoted SHA:
#   fmt + clippy + lib/doc tests   — the fast correctness tier ci.yml uses
#   wasm build                     — scripts/build-verify-wasm.sh, the real
#                                    browser-verifier bundle, not the image stage
#   frontend build                 — codegen from openapi.yaml + `npm run build`
#   verify-consumer                — scripts/check-verify-consumer.sh: packs the
#                                    verify-oxsum-bill tarball, installs it into
#                                    a clean project, verifies genuine + rejects
#                                    tampered evidence offline
#   examples                       — scripts/verify-examples.sh: every shipped
#                                    developer example end to end on a fresh
#                                    scratch deployment (T26's fresh-install gate)
#   candidate image                — docker build of the exact SHA, pushed NOWHERE
#                                    (load: true, no registry login, no push)
#   artifacts                      — the SDK tarball, web/dist, the wasm bundle,
#                                    SHA-256 checksums of all of it, a manifest
#                                    recording {sha, artifact digests, run id,
#                                    image digest}, and a release-notes draft
#                                    cut from openapi.yaml's changelog
#
# The heavy tier (the three nextest shards + process-shared suites against
# real PostgreSQL) deliberately stays in ci.yml: a promoted SHA must be a main
# commit. resolve validates a successful, fully executed ci.yml run on that
# exact SHA, including engine conformance. Missing/skipped/red evidence fails
# closed; the referenced run and image smoke log travel with the bundle.
#
# Nothing here publishes: no registry login, `push: false`, no npm publish, no
# deploy trigger, no secrets. `release.yml` remains the publish half and
# `deploy.yml` the deploy half — both manual-only, both untouched by a gate.

name: Release candidate

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact commit SHA to gate (must be a main commit)'
        required: true
  workflow_call:
    inputs:
      sha:
        description: 'Exact commit SHA to gate'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_TEST_STRIP: symbols
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # One place that decides whether the promoted SHA is even gatable: it must
  # exist, and it must be an ancestor of main — a candidate is a main commit,
  # not a side branch.
  resolve:
    name: resolve the promoted SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      ci_run_url: ${{ steps.full-ci.outputs.run_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pin and validate the candidate
        id: pin
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          sha="$REQUESTED_SHA"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate must be a full lowercase commit SHA"
            exit 1
          fi
          if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "::error::${sha} is not a commit in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${sha} is not an ancestor of main — gate a merged commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the candidate workflow revision must also be merged into main"
            exit 1
          fi
          full="$(git rev-parse "$sha")"
          echo "candidate: $full"
          echo "sha=$full" >> "$GITHUB_OUTPUT"
      - name: Check out the candidate's gate helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pin.outputs.sha }}
      - name: Test candidate evidence validation
        run: |
          python3 scripts/test-candidate-ci.py
          python3 scripts/test-candidate-bundle.py
      - name: Require executed full CI on the candidate SHA
        id: full-ci
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          python3 scripts/check-candidate-ci.py --sha "$CANDIDATE_SHA" \
            --repository "$GITHUB_REPOSITORY" --output candidate-ci.json
          echo "run_url=$(python3 -c 'import json; print(json.load(open("candidate-ci.json"))["run_url"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-full-ci
          path: candidate-ci.json
          retention-days: 90

  fmt:
    name: fmt
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Read the pinned formatter
        run: echo "RUSTFMT_TOOLCHAIN=$(tr -d '[:space:]' < rustfmt-nightly)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTFMT_TOOLCHAIN }}
          components: rustfmt
      - name: Check pinned formatting
        run: scripts/fmt-check.sh

  clippy:
    name: clippy
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install mold
        run: |
          curl -sL https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (lib + doc)
    needs: [resolve, fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mold
        run: |
          curl -sL https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo test --workspace --lib
      - run: cargo test --workspace --doc

  # The real browser verifier off the promoted SHA — the artifact the tarball
  # and the /verify page both ship. `wasm-bindgen-cli` is installed to match
  # the lockfile the same way the Dockerfile's wasm stage pins it.
  wasm:
    name: wasm (browser verifier)
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: false
      # The env-level RUSTC_WRAPPER=sccache applies here too: `cargo install`
      # compiles wasm-bindgen-cli, so the runner must have sccache on PATH —
      # the wrapper otherwise resolves to a missing binary and rustc never
      # executes (the first crates.io-install dispatch hit exactly this).
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install wasm-bindgen-cli at the lockfile's version
        run: |
          version="$(sed -n '/name = "wasm-bindgen"/{n;s/.*version = "\(.*\)"/\1/p;q}' Cargo.lock)"
          echo "wasm-bindgen $version"
          # crates.io is the durable source: the GitHub release asset for an old
          # wasm-bindgen can disappear (0.2.129's did when the repo moved to
          # wasm-bindgen/wasm-bindgen), while `cargo install --locked` builds
          # the exact lockfile version from a source that cannot be deleted.
          cargo install wasm-bindgen-cli --version "$version" --locked --root "$HOME/.cargo"
          # `--root $HOME/.cargo` puts the binary on the default PATH; an explicit
          # /usr/local root fails on a runner whose cargo home is not writable as
          # root-owned (the first dispatch hit `/usr/local/.crates.toml` denied).
      - run: bash scripts/build-verify-wasm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: verify-wasm
          path: crates/web/verify-wasm/
          retention-days: 30

  frontend:
    name: frontend
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          cd web
          npm ci
          npm run codegen
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 30

  # The SDK half of A30: pack verify-oxsum-bill, install it into a clean
  # consumer project, verify the genuine evidence and reject the tampered
  # set — all offline, exactly what a customer's browser does.
  verify-consumer:
    name: verify consumer (SDK tarball)
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: false
      # The env-level RUSTC_WRAPPER=sccache applies here too: `cargo install`
      # compiles wasm-bindgen-cli, so the runner must have sccache on PATH the
      # same way the examples job does — the workflow-level wrapper otherwise
      # resolves to a missing binary and rustc never executes.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install wasm-bindgen-cli at the lockfile's version
        run: |
          version="$(sed -n '/name = "wasm-bindgen"/{n;s/.*version = "\(.*\)"/\1/p;q}' Cargo.lock)"
          # crates.io is the durable source: the GitHub release asset for an old
          # wasm-bindgen can disappear (0.2.129's did when the repo moved to
          # wasm-bindgen/wasm-bindgen), while `cargo install --locked` builds
          # the exact lockfile version from a source that cannot be deleted.
          cargo install wasm-bindgen-cli --version "$version" --locked --root "$HOME/.cargo"
          # `--root $HOME/.cargo` puts the binary on the default PATH; an explicit
          # /usr/local root fails on a runner whose cargo home is not writable as
          # root-owned (the first dispatch hit `/usr/local/.crates.toml` denied).
      - name: Pack the tarball and run the clean consumer
        env:
          VERIFY_CONSUMER_OUTPUT: ${{ github.workspace }}/candidate-artifacts
        run: bash scripts/check-verify-consumer.sh | tee consumer.log
      - uses: actions/upload-artifact@v7
        with:
          name: verify-consumer-log
          path: consumer.log
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: verify-oxsum-bill-tarball
          path: candidate-artifacts/*.tgz
          retention-days: 30

  # The runnable developer examples (issue #617, T26): a fresh scratch
  # deployment — real postgres service, the server built at the promoted
  # SHA — and every shipped example end to end against it. This is the
  # A27 fresh-install half a candidate must keep green.
  examples:
    name: developer examples (fresh install)
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mold
        run: |
          curl -sL https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install wasm-bindgen-cli at the lockfile's version
        run: |
          version="$(sed -n '/name = "wasm-bindgen"/{n;s/.*version = "\(.*\)"/\1/p;q}' Cargo.lock)"
          # crates.io is the durable source: the GitHub release asset for an old
          # wasm-bindgen can disappear (0.2.129's did when the repo moved to
          # wasm-bindgen/wasm-bindgen), while `cargo install --locked` builds
          # the exact lockfile version from a source that cannot be deleted.
          cargo install wasm-bindgen-cli --version "$version" --locked --root "$HOME/.cargo"
          # `--root $HOME/.cargo` puts the binary on the default PATH; an explicit
          # /usr/local root fails on a runner whose cargo home is not writable as
          # root-owned (the first dispatch hit `/usr/local/.crates.toml` denied).
      - run: rustup target add wasm32-unknown-unknown
      - run: bash scripts/verify-examples.sh

  # The candidate image: built at the promoted SHA, loaded into the local
  # daemon, and its digest recorded in the manifest. It is NOT pushed —
  # publishing stays release.yml's manual half. The build's GIT_SHA arg is
  # the promoted SHA, so /api/v1/version inside the image reports it.
  image:
    name: candidate image (no push)
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      - uses: docker/setup-buildx-action@v4
      - name: Build the candidate image (load, never push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ghcr.io/allurecurtain/oxsum:sha-${{ needs.resolve.outputs.sha }}
          build-args: |
            GIT_SHA=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=candidate
          cache-to: type=gha,mode=max,scope=candidate
      - name: Smoke the exact candidate image
        env:
          OXSUM_IMAGE_TAG: sha-${{ needs.resolve.outputs.sha }}
          SMOKE_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          SMOKE_BUILD: "0"
          # The mandatory verify-consumer job validates the same SHA's packed
          # artifact. Avoid compiling a second consumer in this Docker job.
          SMOKE_SKIP_CONSUMER: "1"
        run: bash scripts/release-candidate-smoke.sh | tee candidate-smoke.log
      - name: Export the tested image without publishing
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
        run: docker save "ghcr.io/allurecurtain/oxsum:sha-$CANDIDATE_SHA" | gzip > candidate-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-image
          path: candidate-image.tar.gz
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-smoke
          path: candidate-smoke.log
          if-no-files-found: ignore
          retention-days: 90

  # Everything the gate produced, folded into one manifest with SHA-256s —
  # the object a release manager reviews before touching release.yml.
  manifest:
    name: candidate manifest + release notes draft
    needs: [resolve, fmt, clippy, test, wasm, frontend, verify-consumer, examples, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: artifacts/
      - name: Draft the release notes
        run: |
          version="$(sed -n 's/^  version: //p' crates/server/openapi.yaml | head -1)"
          {
            echo "# Release candidate ${{ needs.resolve.outputs.sha }}"
            echo
            echo "Contract version: ${version}"
            echo "Gated by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Changelog for ${version}"
            echo
            # openapi.yaml's info.description prepends one changelog
            # paragraph per version, newest first — extract exactly this
            # version's paragraph (from its heading to the next blank line).
            awk -v v="$version" '
              $0 ~ "^    "v" " {in_par=1}
              in_par && NF==0 {exit}
              in_par {print}
            ' crates/server/openapi.yaml
          } > RELEASE-NOTES-DRAFT.md
          cat RELEASE-NOTES-DRAFT.md
      - name: Write and validate the version-2 candidate manifest
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          mkdir -p candidate-bundle
          mv artifacts candidate-bundle/artifacts
          mv RELEASE-NOTES-DRAFT.md candidate-bundle/
          sdk="$(find candidate-bundle/artifacts/verify-oxsum-bill-tarball -maxdepth 1 -name '*.tgz' -print)"
          [ "$(printf '%s\n' "$sdk" | wc -l)" -eq 1 ] || exit 1
          python3 scripts/candidate_bundle.py create candidate-bundle \
            --sha "$CANDIDATE_SHA" --repository "$GITHUB_REPOSITORY" \
            --workflow-sha "$WORKFLOW_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --image artifacts/candidate-image/candidate-image.tar.gz \
            --sdk "${sdk#candidate-bundle/}" \
            --full-ci artifacts/candidate-full-ci/candidate-ci.json \
            --smoke-log artifacts/candidate-smoke/candidate-smoke.log \
            --consumer-log artifacts/verify-consumer-log/consumer.log
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-bundle
          path: candidate-bundle/
          retention-days: 90
