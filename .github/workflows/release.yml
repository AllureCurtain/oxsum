# Publication only: transfer a successful candidate's original config/layer
# bytes to GHCR and retain a digest receipt. No build, SDK publication or deploy.
name: Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full 40-character source SHA from the successful candidate'
        required: true
      candidate_run:
        description: 'Successful release-candidate workflow run ID'
        required: true
      candidate_attempt:
        description: 'Successful candidate run attempt'
        required: true
      image_tag:
        description: 'Explicit version to publish (vX.Y.Z or vX.Y.Z-suffix)'
        required: true
  workflow_call:
    inputs:
      # Optional in the callable schema only for the legacy deploy.yml caller.
      # Missing selectors fail before download/publication; N13.c replaces it.
      source_sha:
        required: false
        type: string
      candidate_run:
        required: false
        type: string
      candidate_attempt:
        required: false
        type: string
      image_tag:
        required: false
        type: string

# Registry tags have no atomic compare-and-swap. Serialize all writes through
# this workflow; other registry writers must honor the same operator lock.
concurrency:
  group: oxsum-image-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: promote the verified candidate image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate explicit selectors
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          for name, pattern in {
              "SOURCE_SHA": r"[0-9a-f]{40}",
              "CANDIDATE_RUN": r"[1-9][0-9]*",
              "CANDIDATE_ATTEMPT": r"[1-9][0-9]*",
              "IMAGE_TAG": r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?",
          }.items():
              if not re.fullmatch(pattern, os.environ[name]):
                  raise SystemExit("Missing or invalid " + name + "; explicit candidate selectors are required")
          PY
      - name: Download the selected candidate bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name candidate-bundle --dir candidate-bundle
      - name: Validate provenance and promote original image bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OXSUM_REGISTRY_USERNAME: ${{ github.actor }}
          OXSUM_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          python3 scripts/promote-candidate.py candidate-bundle \
            --sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" \
            --run "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" \
            --destination "ghcr.io/allurecurtain/oxsum:$IMAGE_TAG" \
            --receipt promotion-receipt.json
      - name: Retain immutable promotion receipt
        uses: actions/upload-artifact@v6
        with:
          name: image-promotion-receipt
          path: promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
