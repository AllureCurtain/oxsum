# Manual deployment only. Verify an already-published candidate digest, then
# transfer a trusted plan/helper to the explicitly configured host. No Release
# workflow, build, package write or implicit tag selection is part of this path.
#
# Target prerequisites: Linux Docker + Python 3.10+, authenticated read access to
# GHCR, /opt/oxsum/oxsum.env, and private managed state /opt/oxsum/deployment-state.
# An existing unmanaged oxsum container is refused; follow the migration runbook.
# Secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS (pinned).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Deploy a verified candidate or roll back to a retained compatible artifact'
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
      image_ref:
        description: 'Explicit ghcr.io/allurecurtain/oxsum@sha256:<digest>'
        required: true
      source_sha:
        description: 'Full source SHA expected in the selected artifact'
        required: true
      candidate_run:
        description: 'Successful candidate run ID (required for deploy)'
        required: false
      candidate_attempt:
        description: 'Successful candidate attempt (required for deploy)'
        required: false
      port:
        description: 'Host loopback port for the managed oxsum container'
        default: '3001'
        required: true
      confirm_compatible_rollback:
        description: 'Rollback only: operator has checked behavior and database compatibility'
        type: boolean
        default: false
        required: true

concurrency:
  group: oxsum-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy an immutable verified artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      OPERATION: ${{ inputs.operation }}
      IMAGE_REF: ${{ inputs.image_ref }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
      DEPLOY_PORT: ${{ inputs.port }}
      CONFIRM_ROLLBACK: ${{ inputs.confirm_compatible_rollback }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate explicit deployment selectors
        run: |
          python3 - <<'PY'
          import os, re
          values = os.environ
          checks = [values["OPERATION"] in {"deploy", "rollback"},
                    bool(re.fullmatch(r"ghcr\.io/allurecurtain/oxsum@sha256:[0-9a-f]{64}", values["IMAGE_REF"])),
                    bool(re.fullmatch(r"[0-9a-f]{40}", values["SOURCE_SHA"])),
                    values["DEPLOY_PORT"].isdigit() and 1024 <= int(values["DEPLOY_PORT"]) <= 65535]
          if values["OPERATION"] == "deploy":
              checks += [bool(re.fullmatch(r"[1-9][0-9]*", values[name])) for name in ["CANDIDATE_RUN", "CANDIDATE_ATTEMPT"]]
          else:
              checks += [values["CONFIRM_ROLLBACK"] == "true"]
          if not all(checks):
              raise SystemExit("Invalid deployment selectors or missing explicit rollback compatibility decision")
          PY
      - name: Download and verify the selected candidate and registry digest
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OXSUM_REGISTRY_USERNAME: ${{ github.actor }}
          OXSUM_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name candidate-bundle --dir candidate-bundle
          python3 scripts/deployment_plan.py candidate-bundle --sha "$SOURCE_SHA" \
            --run "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" \
            --image-ref "$IMAGE_REF" --output deployment-plan.json
      - name: Pin the host key and stage the trusted deployment tools
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          for name, pattern in {"DEPLOY_HOST": r"[A-Za-z0-9][A-Za-z0-9.-]*", "DEPLOY_USER": r"[a-z_][a-z0-9_-]*"}.items():
              if not re.fullmatch(pattern, os.environ[name]):
                  raise SystemExit("Invalid " + name)
          if not os.environ["DEPLOY_KNOWN_HOSTS"].strip():
              raise SystemExit("Pinned DEPLOY_KNOWN_HOSTS is required")
          path = pathlib.Path.home() / ".ssh"
          path.mkdir(mode=0o700, exist_ok=True)
          (path / "deploy_key").write_text(os.environ["DEPLOY_SSH_KEY"] + "\n")
          (path / "deploy_key").chmod(0o600)
          (path / "known_hosts").write_text(os.environ["DEPLOY_KNOWN_HOSTS"] + "\n")
          PY
          remote_dir="/tmp/oxsum-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; mkdir '$remote_dir'"
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/deploy-candidate.py scripts/deployment_plan.py scripts/promote-candidate.py \
            scripts/candidate_bundle.py scripts/check-candidate-ci.py "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/"
          if [ "$OPERATION" = deploy ]; then
            scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              deployment-plan.json "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/"
          fi
      - name: Apply the selected immutable image and verify readiness/version
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_dir="/tmp/oxsum-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "$OPERATION" = deploy ]; then
            selection="--plan $remote_dir/deployment-plan.json"
          else
            selection="--image-ref $IMAGE_REF --source-sha $SOURCE_SHA --confirm-compatible-rollback"
          fi
          # Every interpolated selector passed the strict validation step; paths
          # below are fixed or composed only from GitHub's numeric run identifiers.
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=10 "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 '$remote_dir/deploy-candidate.py' '$OPERATION' $selection --port '$DEPLOY_PORT' \
              --env-file /opt/oxsum/oxsum.env --state-directory /opt/oxsum/deployment-state \
              --receipt '$remote_dir/deployment-receipt.json'"
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/deployment-receipt.json" deployment-receipt.json
      - name: Retain the deployment receipt
        uses: actions/upload-artifact@v7
        with:
          name: deployment-receipt
          path: deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
