# Deploy to zhao-cloud: publish the release image through release.yml (the
# publish-only path, which this workflow calls and which can equally run
# alone — `gh workflow run release.yml` publishes the same tags and stops),
# then pull and restart on the server over SSH.
#
# Manual trigger only: push-to-main auto-deploy can follow once the manual
# path has proven itself, and no test may ever reach this workflow (issue
# #619 — the deploy side effects stay behind workflow_dispatch).
#
# Server-side prerequisites (one-time, on zhao-cloud):
#   - the deploy key's public half in ubuntu's ~/.ssh/authorized_keys
#   - an `oxsum` database + role on the existing PostgreSQL container
#   - /opt/oxsum/oxsum.env holding DATABASE_URL and the OXSUM_* secrets
#     (never baked into the image; see docs/development.md, "Deployment runbook")
#     with OXSUM_ADDR=127.0.0.1:<port> — `--network host` lets the container
#     reach PostgreSQL on the host's loopback, where it only listens.
#   - port 3001 free on loopback (3000 is taken by new-api)
#
# Secrets (repo settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY  the deploy private key
#   DEPLOY_HOST     82.156.116.18
#   DEPLOY_USER     ubuntu

name: Deploy

on:
  workflow_dispatch:
    inputs:
      port:
        description: 'Host loopback port for the oxsum container'
        default: '3001'
        required: true
      image_tag:
        description: 'Image tag to deploy (default: latest; use sha-<sha> for rollback)'
        default: 'latest'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The publish half: the same job deploy.yml used to inline, extracted into
  # release.yml so it runs with no deployment side effects. `latest` and
  # `sha-<sha>` are always pushed; this run's sha tag is what the deploy job
  # pulls — the image it just built, not whatever `latest` happens to point
  # at by the time SSH lands.
  release:
    name: build and push the release image
    uses: ./.github/workflows/release.yml
    with:
      image_tag: ''
    permissions:
      contents: read
      packages: write

  deploy:
    name: deploy to zhao-cloud
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=10 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << EOF
          set -e
          docker pull ghcr.io/allurecurtain/oxsum:${{ inputs.image_tag }}
          docker stop oxsum 2>/dev/null || true
          docker rm oxsum 2>/dev/null || true
          # --network host: PostgreSQL only listens on the host's loopback, so the
          # container must share it. OXSUM_ADDR in the env file binds 127.0.0.1:<port>.
          docker run -d --name oxsum --restart unless-stopped --network host \
            --env-file /opt/oxsum/oxsum.env \
            ghcr.io/allurecurtain/oxsum:${{ inputs.image_tag }}
          docker ps --filter name=oxsum --format '{{.Names}}: {{.Status}}'
          EOF
      # The binary migrates at startup and refuses to boot without the database,
      # so /healthz answering means the deploy is genuinely up.
      - name: Wait for a healthy server
        run: |
          for attempt in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=10 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "curl --fail --silent http://127.0.0.1:${{ inputs.port }}/healthz" >/dev/null 2>&1; then
              echo "oxsum answered /healthz after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "oxsum never answered /healthz"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=10 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker logs oxsum 2>&1 | tail -30" || true
          exit 1
