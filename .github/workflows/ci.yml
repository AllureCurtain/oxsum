# Continuous integration: format, lints, and the full test suites.
#
# The test job runs against a real PostgreSQL 17 service container. doubleentry's own
# Postgres conformance suite spins up its container through testcontainers, which works
# because GitHub-hosted runners provide Docker (docs/development.md, "Continuous
# integration").

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain (1.98) plus rustfmt and clippy, matching rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # No database is needed to compile: the tree uses no sqlx::query! macros,
      # so compilation never touches a live database.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxsum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxsum
    steps:
      # Full history: the ledger-engine gate below diffs the push/PR base against HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      # The workspace's test binaries are big (Leptos, testcontainers, sqlx):
      # without this the runner exhausts its disk compiling them ("No space left
      # on device" from rustc).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      # The registry, index and target dir: the workspace's dependency tree is the
      # expensive part of every run, and it only changes with the lockfile.
      - uses: Swatinem/rust-cache@v2
      # The database tests skip without DATABASE_URL; here it is set, so they
      # run for real.
      - name: Run the workspace test suites
        run: cargo test --workspace
      # doubleentry's Postgres conformance suite spins up testcontainers for several
      # minutes. doubleentry is vendored and almost never changes, so the suite runs
      # only when the engine, the lockfile or the database migration list changed —
      # the push diff is `before`..HEAD, the pull_request diff base..HEAD.
      - name: Does the run touch the ledger engine
        id: ledger
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # An unresolvable base (force-push, first commit) errs on the side of
          # running the suite.
          if [ "${base#0000000}" != "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(crates/doubleentry/|crates/core/migrations/|Cargo\.lock)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run doubleentry's Postgres conformance suite
        if: steps.ledger.outputs.changed == 'true'
        run: cargo test -p doubleentry --features postgres --test postgres

  # The browser contract gate. No other job builds the site, so nothing else notices a
  # server that serves `/pkg/*` from the wrong directory (issue #44) or a wasm module that
  # never exports `hydrate`, which leaves every page inert and the login form falling back
  # to a native GET that puts the credentials in the URL (issue #46). Both reached main on
  # 2026-10-03; both are visible from the built site and the served HTML, without a browser
  # (docs/development.md, "Browser contract").
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      # Same reason as the test job: the host and wasm32 compilations, plus the
      # cargo-leptos install, do not fit in the runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      - uses: Swatinem/rust-cache@v2
      # The browser half of the workspace only compiles for this target.
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      # The version the Dockerfile pins: the layout of `target/site` is part of what this
      # gate checks, so it must not drift with whatever is newest. The binary is cached —
      # `cargo install` compiles it from source, which is ~10 minutes of every run.
      - name: Cache cargo-leptos
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-leptos
          key: cargo-leptos-0.3.11-${{ runner.os }}
      - name: Install cargo-leptos
        run: command -v cargo-leptos >/dev/null || cargo install cargo-leptos --version 0.3.11
      - name: Build the site
        run: cargo leptos build
      # `browser_contract` is `#[ignore]`d so that `cargo test --workspace` stays green on a
      # machine without a built site; this job is what runs it, against the site just built.
      # It needs no database: the routes it checks are answered without one.
      - name: Check the browser contract
        run: cargo test -p oxsum-server --test browser_contract -- --ignored --nocapture
        env:
          OXSUM_SITE_DIR: target/site
