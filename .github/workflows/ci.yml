# Continuous integration: format, lints, and the full test suites.
#
# The test job runs against a real PostgreSQL 17 service container. doubleentry's own
# Postgres conformance suite spins up its container through testcontainers, which works
# because GitHub-hosted runners provide Docker (docs/development.md, "Continuous
# integration").

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale runs for pull requests only — never cancel a main-branch run
  # mid-flight (helix pattern).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fresh (non-incremental) compiles are faster in CI and shrink the cache
  # (uv/rust-analyzer/bevy pattern).
  CARGO_INCREMENTAL: 0
  # Test binaries don't need debuginfo (uv pattern): linking is the serial,
  # uncacheable part of CI, and debuginfo only makes it slower.
  CARGO_PROFILE_TEST_DEBUG: 0
  # sccache: content-addressed compile caching across runs (issue #237). The
  # rust-cache entries still cover registry/index/target-dir; sccache covers
  # the object files themselves, which is what dominates a cold PR run.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Path routing (issue #437): a PR that touches no Rust-relevant path shouldn't
  # pay for the fmt/clippy/test/build-tests/shard suite — that's minutes of
  # runner time spent proving nothing changed. A single `paths-filter` job names
  # the Rust surface once; the Rust jobs `needs:` it and early-exit green when
  # `rust` is false, so required checks still report success instead of going
  # absent (which is what deadlocked the docs-only PRs — a skipped job's check
  # never posts). `web`-only and docs-only PRs route around the whole suite.
  filter:
    name: filter
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # `rust` = anything the Rust toolchain builds, tests or lints against.
          # A change that misses every one of these cannot alter a Rust result.
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'scripts/**'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/**'
              - 'Dockerfile'
              - '.dockerignore'

  fmt:
    name: fmt
    needs: [filter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No Rust surface changed — report green without running (see `filter`).
      - name: No Rust change
        if: needs.filter.outputs.rust != 'true'
        run: echo "no Rust-path change; fmt passes vacuously"
      # The runner's stable toolchain plus rustfmt and clippy.
      - uses: dtolnay/rust-toolchain@stable
        if: needs.filter.outputs.rust == 'true'
        with:
          components: rustfmt, clippy
      - if: needs.filter.outputs.rust == 'true'
        run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: [filter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No Rust change
        if: needs.filter.outputs.rust != 'true'
        run: echo "no Rust-path change; clippy passes vacuously"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.filter.outputs.rust == 'true'
        with:
          components: rustfmt, clippy
      # The tracked .cargo/config.toml routes linking through mold
      # (-C link-arg=-fuse-ld=mold); the stock ubuntu-latest image does not
      # ship it, so install it before anything links. Direct tarball download
      # is faster than apt-get update (issue #237).
      - name: Install mold
        if: needs.filter.outputs.rust == 'true'
        run: |
          curl -sL https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
          mold --version
      - uses: Swatinem/rust-cache@v2
        if: needs.filter.outputs.rust == 'true'
        with:
          # One shared cache entry for every compile job (helix pattern) instead
          # of one per job; workspace crates included (uv pattern).
          shared-key: "ci"
          cache-workspace-crates: "true"
          # PR runs restore the cache but only main saves it (uv pattern):
          # keeps every push from thrashing the cache entry.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure sccache
        if: needs.filter.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      # No database is needed to compile: the tree uses no sqlx::query! macros,
      # so compilation never touches a live database.
      - if: needs.filter.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The image's language-boundary stages (issues #296/#309). The release-image gate
  # only runs after merge, which is how #284 shipped a wasm stage that could not
  # build and #256 removed the assets its smoke test still probed. These jobs build
  # each stage before merge. They always run so they can be required checks; the
  # Docker build is skipped when the PR touches nothing the stage depends on.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            stages:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - 'crates/verify/**'
              - '.github/workflows/**'
      - name: No wasm stage change
        if: steps.filter.outputs.stages != 'true'
        run: echo "no Dockerfile/wasm change; skipping the stage build"
      - uses: docker/setup-buildx-action@v4
        if: steps.filter.outputs.stages == 'true'
      - uses: docker/build-push-action@v7
        if: steps.filter.outputs.stages == 'true'
        with:
          context: .
          target: wasm
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The SPA half of the image (issue #309): the frontend stage runs `npm ci`,
  # regenerates the typed client from openapi.yaml and builds the Vite bundle.
  # Without this job a TypeScript error reaches main and only the post-merge
  # release image notices.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            stages:
              - 'Dockerfile'
              - '.dockerignore'
              - 'web/**'
              - 'crates/server/openapi.yaml'
              - '.github/workflows/**'
      - name: No frontend stage change
        if: steps.filter.outputs.stages != 'true'
        run: echo "no frontend change; skipping the stage build"
      - uses: docker/setup-buildx-action@v4
        if: steps.filter.outputs.stages == 'true'
      - uses: docker/build-push-action@v7
        if: steps.filter.outputs.stages == 'true'
        with:
          context: .
          target: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: test
    # Fast signal first (issue #237): lib and doc tests — no postgres, no
    # integration binaries — so a unit break answers in minutes rather than
    # waiting for the DB-backed suites. `test-integration` below still runs
    # everything before merge.
    needs: [filter, fmt, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: No Rust change
        if: needs.filter.outputs.rust != 'true'
        run: echo "no Rust-path change; lib/doc tests pass vacuously"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.filter.outputs.rust == 'true'
      - name: Install mold
        if: needs.filter.outputs.rust == 'true'
        run: |
          curl -sL https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
          mold --version
      - uses: Swatinem/rust-cache@v2
        if: needs.filter.outputs.rust == 'true'
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure sccache
        if: needs.filter.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      # `--lib` only builds the lib test binaries — the heavy integration
      # targets (testcontainers, sqlx test deps) never compile here, which is
      # where most of the job's wall time used to go.
      - if: needs.filter.outputs.rust == 'true'
        run: cargo test --workspace --lib
      - if: needs.filter.outputs.rust == 'true'
        run: cargo test --workspace --doc

  # Build every test binary once, then hand the binaries off to the shard jobs.
  # Compiling is the serial, uncacheable part of test-integration; archiving it
  # into one artifact is what lets the shards run without each paying the full
  # compile cost (issue #276).
  build-tests:
    name: build-tests
    # Not a required check — skip the whole job (no runner at all) when the PR
    # touches no Rust path. Required checks can't do this (a skipped job posts
    # no check), but this one isn't required, so the suite simply doesn't exist
    # for a web/docs-only change.
    needs: [filter, fmt, clippy]
    if: needs.filter.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install mold
        run: |
          curl -sL https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
          mold --version
      # The workspace's test binaries are big (testcontainers, sqlx):
      # without this the runner exhausts its disk compiling them ("No space left
      # on device" from rustc).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      # The registry, index and target dir: the workspace's dependency tree is the
      # expensive part of every run, and it only changes with the lockfile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Archive every test target — the process-shared suites and the
      # doubleentry conformance binary are included, and their jobs run the
      # same binaries straight from this archive instead of recompiling.
      # doubleentry's postgres suite is feature-gated (`#![cfg(feature =
      # "postgres")]`), so it gets a second archive built with the feature on;
      # a plain --workspace build would archive an empty binary.
      - name: Archive the test binaries
        run: |
          cargo nextest archive --workspace --archive-file nextest-archive.tar.zst
          cargo nextest archive -p doubleentry --features postgres --archive-file doubleentry-archive.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: "*.tar.zst"
          # Shards download the archive within the same run; 1 day is plenty.
          retention-days: 1

  # Run the workspace test binaries sharded over N runners. Each shard gets its
  # own postgres service and sweeps it before running, so scratch databases from
  # interrupted runs can't bleed into this one's timing (issue #271).
  test-shard:
    name: test-shard (${{ matrix.shard }}/3)
    needs: [filter, build-tests]
    if: needs.filter.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxsum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxsum
    steps:
      # The archive does not carry the workspace source — nextest requires the
      # same tree checked out at the same revision to locate fixtures and set
      # working directories.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      - name: Sweep stale test scratch databases
        run: |
          # `localhost` resolves to a Unix socket for psql — 127.0.0.1 forces TCP
          # to the service container.
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -f scripts/drop-test-scratch.sql
      # Three suites coordinate through process-global state — the generative
      # property suite's OnceLock shared schemas, and the seed/jobs suites'
      # in-process mutexes. nextest runs every test in its own process, so
      # parallel workers race on that shared state (dropped schemas, double
      # seeds). They stay on cargo test in test-extras, which runs one binary
      # per process.
      - name: Run the workspace test suites (shard ${{ matrix.shard }}/3)
        run: >-
          cargo nextest run --archive-file nextest-archive.tar.zst
          --partition count:${{ matrix.shard }}/3
          -E 'not binary(generative) and not binary(seed) and not binary(jobs)'

  # The suites that can't run under nextest, plus doctests, plus doubleentry's
  # Postgres conformance suite — all small enough to live on one runner that
  # waits for the archive rather than recompiling them itself.
  test-extras:
    name: test-extras
    needs: [filter, build-tests]
    if: needs.filter.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxsum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxsum
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      - name: Extract the test binaries
        run: |
          mkdir -p target/nextest/extracted target/nextest/extracted-de
          tar -xf nextest-archive.tar.zst -C target/nextest/extracted
          tar -xf doubleentry-archive.tar.zst -C target/nextest/extracted-de
      - name: Sweep stale test scratch databases
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -f scripts/drop-test-scratch.sql
      # Containers are the other half of the residue (issue #277): the
      # doubleentry suite's deferred-sequencing tests start a dedicated
      # container even under DATABASE_URL, and a Ryuk miss leaves it.
      - name: Sweep stale testcontainers
        run: ./scripts/clean-testcontainers.sh --drop
      # Extracted archive binaries run directly under the shell — same
      # process-per-binary model as `cargo test`, so the process-global
      # coordination inside generative/seed/jobs stays sound. The binaries
      # directory holds every compiled test binary plus binaries-metadata.json.
      - name: Run the process-shared suites
        run: |
          bins=target/nextest/extracted/target/debug/deps
          # `jobs-*` matches two binaries (oxsum-core and oxsum-server both
          # have a jobs suite) — run all of them, not just the first.
          for f in generative seed jobs; do
            find "$bins" -name "$f-*" -type f | while read -r exe; do
              echo "=== $f -> $exe"
              "$exe" --test-threads=4
            done
          done
      # Doctests already run in the `test` job — no need to pay for a fresh
      # compile here.
      # doubleentry's Postgres conformance suite spins up testcontainers for several
      # minutes. doubleentry is vendored and almost never changes, so the suite runs
      # only when the engine, the lockfile or the database migration list changed —
      # the push diff is `before`..HEAD, the pull_request diff base..HEAD.
      - name: Does the run touch the ledger engine
        id: ledger
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # An unresolvable base (force-push, first commit) errs on the side of
          # running the suite.
          if [ "${base#0000000}" != "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(crates/doubleentry/|crates/core/migrations/|Cargo\.lock|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # `DOUBLEENTRY_DATABASE_URL` makes the suite create its scratch
      # databases on the service container instead of spinning up its own
      # testcontainer (issue #241) — the binary was archived with the
      # `postgres` feature on, so it is real code, not an empty cfg.
      - name: Run doubleentry's Postgres conformance suite
        if: steps.ledger.outputs.changed == 'true'
        env:
          DOUBLEENTRY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          bins=target/nextest/extracted-de/target/debug/deps
          exe=$(find "$bins" -name "postgres-*" -type f | head -1)
          echo "=== postgres -> $exe"
          "$exe" --test-threads=4
