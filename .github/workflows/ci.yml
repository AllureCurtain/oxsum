# Continuous integration: format, lints, and the full test suites.
#
# The test job runs against a real PostgreSQL 17 service container. doubleentry's own
# Postgres conformance suite spins up its container through testcontainers, which works
# because GitHub-hosted runners provide Docker (docs/development.md, "Continuous
# integration").

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale runs for pull requests only — never cancel a main-branch run
  # mid-flight (helix pattern).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fresh (non-incremental) compiles are faster in CI and shrink the cache
  # (uv/rust-analyzer/bevy pattern).
  CARGO_INCREMENTAL: 0
  # Test binaries don't need debuginfo (uv pattern): linking is the serial,
  # uncacheable part of CI, and debuginfo only makes it slower.
  CARGO_PROFILE_TEST_DEBUG: 0
  # sccache: content-addressed compile caching across runs (issue #237). The
  # rust-cache entries still cover registry/index/target-dir; sccache covers
  # the object files themselves, which is what dominates a cold PR run.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain (1.98) plus rustfmt and clippy, matching rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      # The tracked .cargo/config.toml routes linking through mold
      # (-C link-arg=-fuse-ld=mold); the stock ubuntu-latest image does not
      # ship it, so install it before anything links. Direct tarball download
      # is faster than apt-get update (issue #237).
      - name: Install mold
        run: |
          curl -sL https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
          mold --version
      - uses: Swatinem/rust-cache@v2
        with:
          # One shared cache entry for every compile job (helix pattern) instead
          # of one per job; workspace crates included (uv pattern).
          shared-key: "ci"
          cache-workspace-crates: "true"
          # PR runs restore the cache but only main saves it (uv pattern):
          # keeps every push from thrashing the cache entry.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      # No database is needed to compile: the tree uses no sqlx::query! macros,
      # so compilation never touches a live database.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    # Fast signal first (issue #237): lib and doc tests — no postgres, no
    # integration binaries — so a unit break answers in minutes rather than
    # waiting for the DB-backed suites. `test-integration` below still runs
    # everything before merge.
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - name: Install mold
        run: |
          curl -sL https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
          mold --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      # `--lib` only builds the lib test binaries — the heavy integration
      # targets (testcontainers, sqlx test deps) never compile here, which is
      # where most of the job's wall time used to go.
      - run: cargo test --workspace --lib
      - run: cargo test --workspace --doc

  test-integration:
    name: test-integration
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxsum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxsum
    steps:
      # Full history: the ledger-engine gate below diffs the push/PR base against HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      # Same mold requirement as the clippy job: the tracked .cargo/config.toml
      # links through mold, which the stock image does not ship.
      # Direct tarball download is faster than apt-get update (issue #237).
      - name: Install mold
        run: |
          curl -sL https://github.com/rui314/mold/releases/download/v2.40.0/mold-2.40.0-x86_64-linux.tar.gz | sudo tar -xz -C /usr/local --strip-components=1
          mold --version
      # The workspace's test binaries are big (testcontainers, sqlx):
      # without this the runner exhausts its disk compiling them ("No space left
      # on device" from rustc).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      # The registry, index and target dir: the workspace's dependency tree is the
      # expensive part of every run, and it only changes with the lockfile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      # nextest runs the workspace's test binaries in parallel (tokio,
      # rust-analyzer and uv all use it); doctests still go through cargo test.
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The database tests skip without DATABASE_URL; here it is set, so they
      # run for real. Before any test binary runs, sweep stale scratch
      # databases left by previous runs — per-suite drop is best-effort and
      # an interrupted job's residue must not bleed into this one's timing
      # (issue #271). psql against the service's maintenance database is the
      # same shape scripts/drop-test-scratch.sql documents for local use.
      - name: Sweep stale test scratch databases
        run: |
          # `localhost` resolves to a Unix socket for psql — 127.0.0.1 forces TCP
          # to the service container.
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -f scripts/drop-test-scratch.sql
      - name: Run the workspace test suites
        # Three suites coordinate through process-global state — the generative
        # property suite's OnceLock shared schemas, and the seed/jobs suites'
        # in-process mutexes. nextest runs every test in its own process, so
        # parallel workers race on that shared state (dropped schemas, double
        # seeds). They stay on cargo test, which runs one binary per process.
        run: cargo nextest run --workspace -E 'not binary(generative) and not binary(seed) and not binary(jobs)'
      - name: Run the process-shared suites
        run: |
          cargo test -p oxsum-core --test generative --test seed --test jobs
          cargo test -p oxsum-server --test jobs
      - name: Run doctests
        run: cargo test --workspace --doc
      # doubleentry's Postgres conformance suite spins up testcontainers for several
      # minutes. doubleentry is vendored and almost never changes, so the suite runs
      # only when the engine, the lockfile or the database migration list changed —
      # the push diff is `before`..HEAD, the pull_request diff base..HEAD.
      - name: Does the run touch the ledger engine
        id: ledger
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # An unresolvable base (force-push, first commit) errs on the side of
          # running the suite.
          if [ "${base#0000000}" != "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(crates/doubleentry/|crates/core/migrations/|Cargo\.lock|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run doubleentry's Postgres conformance suite
        if: steps.ledger.outputs.changed == 'true'
        run: cargo test -p doubleentry --features postgres --test postgres
