# Continuous integration: every pull request runs the fast tier; a pull request
# that can change money-path behaviour also runs the heavy tier before merge.
#
# Two tiers (issue #552, reworked in issue #1214). Every pull request runs the
# fast tier — `filter`, `fmt`, `clippy --all-targets`, the lib/doc tests,
# `wasm`, `frontend`, `publishable` and `audit`. The heavy tier (`build-tests`,
# the three shards, `test-extras`, `solana-e2e`) runs on a pull request whose
# diff touches `crates/**` (core, server, integrations, migrations…), the Cargo
# manifests/lockfile, the cargo/toolchain config or the CI definition itself —
# or that carries the `ci:heavy` label — and always on a push to `main`, the
# nightly and a manual dispatch. Web- and docs-only pull requests stay on the
# fast tier. Issue #552 moved the heavy tier post-merge only; two weeks of
# history showed main red on 40% of pushes afterwards (0% before), about two
# thirds of them integration/migration breaks a pre-merge heavy run would have
# stopped.
#
# The five required checks (`fmt`, `clippy`, `test`, `wasm`, `frontend`) stay
# in the fast tier and always report, so branch protection needs no change and
# a light pull request never waits on an "expected" check. `heavy-tier` is the
# one roll-up of the heavy jobs: it passes when the tier was correctly skipped
# and fails when any heavy job failed or was cancelled — the single name to
# make required later. The post-merge heavy run on `main` stays: it is the
# safety net for the merge skew a pre-merge run cannot see (two green pull
# requests that conflict only together), and the release-candidate gate
# (`scripts/check-candidate-ci.py`) requires a full green CI run on the
# candidate's own main SHA.
#
# Every push to main owns its run (issue #549): the concurrency group is keyed
# on the commit, because GitHub cancels the *pending* run when a newer one joins
# the same group even with `cancel-in-progress: false`. A shared main group let
# a burst of merges drop one push's gate entirely. A nightly `schedule` (and a
# manual `workflow_dispatch`) ignores the path filter and runs the full tier, so
# main is re-verified within a day whatever the last push touched — including a
# docs-only push, which `paths-ignore` never triggered at all.
#
# The test job runs against a real PostgreSQL 17 service container. doubleentry's own
# Postgres conformance suite spins up its container through testcontainers, which works
# because GitHub-hosted runners provide Docker (docs/development.md, "Continuous
# integration").

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    # `labeled` lets `ci:heavy` force the heavy tier on a branch without a new
    # push. Any other label re-runs the (cheap) fast tier too — the price of
    # GitHub offering no per-label trigger filter.
    types: [opened, synchronize, reopened, labeled]
  # A nightly full run, ignoring the path filter (issue #549): it re-verifies
  # main even when the last push touched only docs, or when a burst of merges
  # displaced a push run. 03:17 UTC keeps it clear of the common merge hours.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # A pull request keeps one group per branch, so a newer push cancels its stale
  # run. Every other event gets a group keyed on its commit: GitHub cancels the
  # *pending* run in a group when a newer one arrives, even with
  # `cancel-in-progress: false`, which is how a burst of merges once left main
  # commits with no gate at all (issue #549).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fresh (non-incremental) compiles are faster in CI and shrink the cache
  # (uv/rust-analyzer/bevy pattern).
  CARGO_INCREMENTAL: 0
  # Test binaries don't need debuginfo (uv pattern): linking is the serial,
  # uncacheable part of CI, and debuginfo only makes it slower.
  CARGO_PROFILE_TEST_DEBUG: 0
  # Test binaries carry symbol tables nothing in CI reads. The nextest archive
  # they are shipped in was 1242 MB, and every shard paid 113s to download it;
  # stripping roughly halves it. The cost is a symbol-less backtrace when a
  # test fails in CI — rerun the suite locally for that.
  CARGO_PROFILE_TEST_STRIP: symbols
  # sccache: content-addressed compile caching across runs (issue #237). The
  # rust-cache entries still cover registry/index/target-dir; sccache covers
  # the object files themselves, which is what dominates a cold PR run.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Path routing (issue #437): a PR that touches no Rust-relevant path shouldn't
  # pay for the fmt/clippy/test/build-tests/shard suite — that's minutes of
  # runner time spent proving nothing changed. A single `paths-filter` job names
  # the Rust surface once; the Rust jobs `needs:` it and early-exit green when
  # `rust` is false, so required checks still report success instead of going
  # absent (which is what deadlocked the docs-only PRs — a skipped job's check
  # never posts). `web`-only and docs-only PRs route around the whole suite.
  filter:
    name: filter
    runs-on: ubuntu-latest
    outputs:
      # A scheduled or manually dispatched run verifies the whole tree, whatever
      # the last push touched (issue #549).
      rust: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.rust }}
      # Whether the heavy tier runs (issue #1214). A scheduled or dispatched
      # run is a full run; a push to `main` runs it for any Rust-surface change
      # (the post-merge safety net, unchanged); a pull request runs it when its
      # diff can change what the DB-backed suites prove, or when it carries the
      # `ci:heavy` label.
      heavy: ${{ ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true') || (github.event_name == 'push' && steps.filter.outputs.rust) || ((github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:heavy') || steps.filter.outputs.heavy == 'true')) && 'true') || 'false' }}
    steps:
      - uses: actions/checkout@v7
      # Only a push or a pull request has a base to diff against; a scheduled
      # run is a full run by construction.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          # `rust` = anything the Rust toolchain builds, tests or lints against.
          # A change that misses every one of these cannot alter a Rust result.
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'scripts/**'
              - 'rustfmt-nightly'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Dockerfile'
              - '.dockerignore'
            # `heavy` = what the DB-backed integration, migration, concurrency
            # and Solana e2e suites can observe: every crate (core, server,
            # integrations and core's migrations among them), the manifests
            # and lockfile, the cargo/toolchain config, the CI definition and
            # the helpers the heavy jobs execute. Web, docs and other scripts
            # cannot change a heavy-tier result, so they stay on the fast tier.
            heavy:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'scripts/run-shared-suites.py'
              - 'scripts/drop-test-scratch.sql'
              - 'scripts/clean-testcontainers.sh'

  fmt:
    name: fmt
    needs: [filter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No Rust surface changed — report green without running (see `filter`).
      - name: No Rust change
        if: needs.filter.outputs.rust != 'true'
        run: echo "no Rust-path change; fmt passes vacuously"
      # The pinned formatter the repository's scripts read. `imports_granularity`
      # and `format_macro_matchers` are nightly-only options, so the same
      # version file must drive the local scripts and this job; `rustfmt.toml`
      # and `rustfmt-nightly` are the single sources.
      - name: Read the pinned rustfmt version
        id: rustfmt
        if: needs.filter.outputs.rust == 'true'
        run: echo "version=$(tr -d '[:space:]' < rustfmt-nightly)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: needs.filter.outputs.rust == 'true'
        with:
          toolchain: ${{ steps.rustfmt.outputs.version }}
          components: rustfmt
      - name: Check pinned formatting
        if: needs.filter.outputs.rust == 'true'
        run: scripts/fmt-check.sh
      - name: Test verified tool installation
        run: |
          python3 scripts/test-ci-tools.py
          python3 scripts/test-shared-suites.py
          node --test scripts/issue-labels.test.mjs
      - name: Test candidate evidence validation
        run: |
          python3 scripts/test-candidate-ci.py
          python3 scripts/test-candidate-bundle.py
          python3 scripts/test-candidate-promotion.py
          python3 scripts/test-candidate-deploy.py
          python3 scripts/test-candidate-sdk.py
      - name: Test sanitized operator diagnostics
        run: python3 scripts/test-operator-diagnostics.py
      - name: Test explicit backup and restore boundaries
        run: python3 scripts/test-backup-restore.py
      - name: Test artifact recovery refusal boundaries
        run: python3 scripts/test-artifact-recovery.py
      - name: Test isolated example runner failure paths
        run: |
          python3 -m venv /tmp/oxsum-example-test-venv
          /tmp/oxsum-example-test-venv/bin/pip install -r scripts/verify-examples-requirements.txt
          /tmp/oxsum-example-test-venv/bin/python -m unittest discover -s scripts -p test_verify_examples.py
      - name: Test external application durability and notification intake
        run: |
          python3 -m unittest discover -s examples/embedded-application -p 'test_*.py'
          python3 -m unittest discover -s examples/application-notifications -p 'test_*.py'

  clippy:
    name: clippy
    needs: [filter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No Rust change
        if: needs.filter.outputs.rust != 'true'
        run: echo "no Rust-path change; clippy passes vacuously"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.filter.outputs.rust == 'true'
        with:
          components: rustfmt, clippy
      # The tracked .cargo/config.toml routes linking through mold
      # (-C link-arg=-fuse-ld=mold); the stock ubuntu-latest image does not
      # ship it. Verify the pinned official asset before installing into the
      # runner tool cache and exposing its bin directory (issue #822).
      - name: Install mold
        if: needs.filter.outputs.rust == 'true'
        uses: ./.github/actions/install-ci-tool
        with:
          tool: mold
      - uses: Swatinem/rust-cache@v2
        if: needs.filter.outputs.rust == 'true'
        with:
          # One shared cache entry for every compile job (helix pattern) instead
          # of one per job; workspace crates included (uv pattern).
          shared-key: "ci"
          cache-workspace-crates: "true"
          # PR runs restore the cache but only main saves it (uv pattern):
          # keeps every push from thrashing the cache entry.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify pinned sccache archive
        if: needs.filter.outputs.rust == 'true'
        uses: ./.github/actions/install-ci-tool
        with:
          tool: sccache
      - name: Configure sccache
        if: needs.filter.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      # No database is needed to compile: the tree uses no sqlx::query! macros,
      # so compilation never touches a live database.
      - name: Run strict Clippy
        if: needs.filter.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The `otlp` feature gate only holds while something compiles without it —
      # a default-features build would silently re-bury the exporter in the
      # tree.
      - name: Check the no-OTLP build still compiles
        if: needs.filter.outputs.rust == 'true'
        run: cargo check -p oxsum-server --no-default-features --all-targets

  # Publishability of the crates that ship outside the workspace (issue #468):
  # oxsum-verify and its vendored doubleentry dependency must `cargo publish
  # --dry-run` clean, or a broken manifest reaches main and the real publish
  # fails on it. Runs whenever Cargo manifests or the publishable crates move.
  publishable:
    name: publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A default-branch schedule has no base to diff against; the nightly
      # no-ops here rather than failing the whole run (issue #549).
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            crates:
              - 'crates/verify/**'
              - 'crates/doubleentry/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - '.github/actions/**'
      - name: No publishable-crate change
        if: steps.filter.outputs.crates != 'true'
        run: echo "no publishable-crate change; skipping the dry-run"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.crates == 'true'
      # The repo's .cargo/config.toml sets RUSTC_WRAPPER=sccache and rustflags
      # `-fuse-ld=mold` for the whole workspace; the dry-run compiles the
      # packaged tarball under the same flags, so install mold and clear the
      # sccache wrapper the same way the clippy job does.
      - name: Install mold
        if: steps.filter.outputs.crates == 'true'
        uses: ./.github/actions/install-ci-tool
        with:
          tool: mold
      - if: steps.filter.outputs.crates == 'true'
        env:
          RUSTC_WRAPPER: ""
        run: |
          cargo publish --dry-run -p doubleentry
          cargo publish --dry-run -p oxsum-verify

  # The image's language-boundary stages (issues #296/#309). The release-image gate
  # only runs after merge, which is how #284 shipped a wasm stage that could not
  # build and #256 removed the assets its smoke test still probed. These jobs build
  # each stage before merge. They always run so they can be required checks; the
  # Docker build is skipped when the PR touches nothing the stage depends on.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Manual/nightly runs execute every stage, independently of path filters.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            stages:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - 'crates/verify/**'
              - '.github/workflows/**'
              - '.github/actions/**'
      - name: No wasm stage change
        if: steps.filter.outputs.stages != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: echo "no Dockerfile/wasm change; skipping the stage build"
      - uses: docker/setup-buildx-action@v4
        if: steps.filter.outputs.stages == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - name: Build the WASM stage
        uses: docker/build-push-action@v7
        if: steps.filter.outputs.stages == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          target: wasm
          push: false
          # Scoped so release-image.yml can import this stage instead of
          # rebuilding it (it used the default scope, which these never wrote).
          cache-from: type=gha,scope=wasm
          cache-to: type=gha,mode=max,scope=wasm

  # The SPA half of the image (issue #309): the frontend stage runs `npm ci`,
  # regenerates the typed client from openapi.yaml and builds the Vite bundle.
  # Without this job a TypeScript error reaches main and only the post-merge
  # release image notices.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Manual/nightly runs execute this stage as well as all Rust suites.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            stages:
              - 'Dockerfile'
              - '.dockerignore'
              - 'web/**'
              - 'crates/server/openapi.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'
      - name: No frontend stage change
        if: steps.filter.outputs.stages != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: echo "no frontend change; skipping the stage build"
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.stages == 'true'
        with:
          node-version: 22
      - name: Test exact sale editor inputs
        if: steps.filter.outputs.stages == 'true'
        run: node --experimental-strip-types --test web/tests/sale-draft.test.ts
      - name: Check merchant credential drafts
        run: node --experimental-strip-types --test web/tests/merchant-draft.test.ts
      - name: Test exact money inputs
        if: steps.filter.outputs.stages == 'true'
        run: node --experimental-strip-types --test web/tests/money.test.ts
      - name: Test retained customer trust boundaries
        if: steps.filter.outputs.stages == 'true'
        run: node --experimental-strip-types --test web/tests/retained-head.test.ts web/tests/evidence.test.ts
      - name: Test complete provider configuration inputs
        if: steps.filter.outputs.stages == 'true'
        run: node --experimental-strip-types --test web/tests/provider-draft.test.ts
      - name: Test lazy-page chunk recovery
        if: steps.filter.outputs.stages == 'true'
        run: node --experimental-strip-types --test web/tests/chunk-reload.test.ts
      # schema.d.ts is generated from crates/server/openapi.yaml; a contract
      # edit that forgets `npm run codegen` commits the stale file. Regenerating
      # and diffing the tracked output keeps the two from drifting (the drift
      # this step was added for was a stale docstring after issue #1053).
      - name: Check the generated client matches the contract
        if: steps.filter.outputs.stages == 'true'
        run: |
          npm --prefix web ci
          npm --prefix web run codegen
          git diff --exit-code web/src/api/schema.d.ts
      # The Solana rail's client units (issue #1207): the Solana Pay URL
      # builder, the wallet-adapter send path and the intent status mapper —
      # pure logic the stage build never exercises. Runs after `npm ci`
      # because `solana-wallet.test.ts` imports the wallet-adapter/web3.js
      # packages the bare `node --test` steps above never need. The glob keeps
      # every future `solana-*.test.ts` under the same step.
      - name: Test the Solana rail client units
        if: steps.filter.outputs.stages == 'true'
        run: node --experimental-strip-types --test web/tests/solana-*.test.ts
      - uses: docker/setup-buildx-action@v4
        if: steps.filter.outputs.stages == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - name: Build the frontend stage
        uses: docker/build-push-action@v7
        if: steps.filter.outputs.stages == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          target: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  test:
    name: test
    # Fast signal first (issue #237): lib and doc tests — no postgres, no
    # integration binaries — so a unit break answers in minutes rather than
    # waiting for the DB-backed suites. This is the whole test tier of a pull
    # request; the heavy suites run on main after the merge (issue #552).
    #
    # Deliberately not `needs: clippy`: the two share only a checkout, and
    # chaining them put 131s of clippy on the critical path before the first
    # test compiled. A clippy failure still blocks the merge on its own check.
    needs: [filter, fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: No Rust change
        if: needs.filter.outputs.rust != 'true'
        run: echo "no Rust-path change; lib/doc tests pass vacuously"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.filter.outputs.rust == 'true'
      - name: Install mold
        if: needs.filter.outputs.rust == 'true'
        uses: ./.github/actions/install-ci-tool
        with:
          tool: mold
      - uses: Swatinem/rust-cache@v2
        if: needs.filter.outputs.rust == 'true'
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify pinned sccache archive
        if: needs.filter.outputs.rust == 'true'
        uses: ./.github/actions/install-ci-tool
        with:
          tool: sccache
      - name: Configure sccache
        if: needs.filter.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      # `--lib` only builds the lib test binaries — the heavy integration
      # targets (testcontainers, sqlx test deps) never compile here, which is
      # where most of the job's wall time used to go.
      - name: Run library tests
        if: needs.filter.outputs.rust == 'true'
        run: cargo test --workspace --lib
      - name: Run documentation tests
        if: needs.filter.outputs.rust == 'true'
        run: cargo test --workspace --doc

  # Build every test binary once, then hand the binaries off to the shard jobs.
  # Compiling is the serial, uncacheable part of test-integration; archiving it
  # into one artifact is what lets the shards run without each paying the full
  # compile cost (issue #276).
  build-tests:
    name: build-tests
    # Not a required check — skip the whole job (no runner at all) when the PR
    # touches no Rust path. Required checks can't do this (a skipped job posts
    # no check), but this one isn't required, so the suite simply doesn't exist
    # for a web/docs-only change.
    #
    # Compiling waits on `fmt` (7s) only. It used to wait on `clippy` too, which
    # serialized 131s of lints in front of a build that needs none of them.
    #
    # Heavy tier (issue #1214): a pull request whose diff can change a heavy
    # result (`filter`'s `heavy` paths) or that carries `ci:heavy`, every
    # Rust-surface push to `main`, the nightly and a manual dispatch — so a
    # commit a displaced push left ungated is still verified within a day
    # (#549). None of the heavy jobs is a required check; `heavy-tier` below
    # rolls them up.
    needs: [filter, fmt]
    if: needs.filter.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install mold
        uses: ./.github/actions/install-ci-tool
        with:
          tool: mold
      # The workspace's test binaries are big (testcontainers, sqlx):
      # without this the runner exhausts its disk compiling them ("No space left
      # on device" from rustc).
      - name: Free disk space
        run: |
          # Four independent trees plus a docker prune, deleted in parallel: the
          # serial form spent 86s here, more than a fifth of the job.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
          sudo docker image prune --all --force &
          wait
          df -h
      # The registry, index and target dir: the workspace's dependency tree is the
      # expensive part of every run, and it only changes with the lockfile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify pinned sccache archive
        uses: ./.github/actions/install-ci-tool
        with:
          tool: sccache
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Archive every test target — the process-shared suites and the
      # doubleentry conformance binary are included, and their jobs run the
      # same binaries straight from this archive instead of recompiling.
      # doubleentry's postgres suite is feature-gated (`#![cfg(feature =
      # "postgres")]`), so it gets a second archive built with the feature on;
      # a plain --workspace build would archive an empty binary.
      - name: Archive the test binaries
        run: |
          cargo nextest archive --workspace --archive-file nextest-archive.tar.zst
          cargo nextest archive -p doubleentry --features postgres --archive-file doubleentry-archive.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: "*.tar.zst"
          # Shards download the archive within the same run; 1 day is plenty.
          retention-days: 1

  # Run the workspace test binaries sharded over N runners. Each shard gets its
  # own postgres service and sweeps it before running, so scratch databases from
  # interrupted runs can't bleed into this one's timing (issue #271).
  test-shard:
    name: test-shard (${{ matrix.shard }}/3)
    needs: [filter, build-tests]
    # Heavy tier (issues #552, #549, #1214). See build-tests above.
    if: needs.filter.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxsum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxsum
    steps:
      # The archive does not carry the workspace source — nextest requires the
      # same tree checked out at the same revision to locate fixtures and set
      # working directories.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      - name: Sweep stale test scratch databases
        run: |
          # `localhost` resolves to a Unix socket for psql — 127.0.0.1 forces TCP
          # to the service container.
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -f scripts/drop-test-scratch.sql
      # Three suites coordinate through process-global state — the generative
      # property suite's OnceLock shared schemas, and the seed/jobs suites'
      # in-process mutexes. nextest runs every test in its own process, so
      # parallel workers race on that shared state (dropped schemas, double
      # seeds). They stay on cargo test in test-extras, which runs one binary
      # per process.
      - name: Run the workspace test suites (shard ${{ matrix.shard }}/3)
        run: >-
          cargo nextest run --archive-file nextest-archive.tar.zst
          --partition count:${{ matrix.shard }}/3
          -E 'not ((package(=oxsum-core) and binary(=core) and test(/^(generative|seed|jobs)::/)) or (package(=oxsum-server) and binary(=server) and test(/^jobs::/)))'

  # The suites that can't run under nextest, plus doctests, plus doubleentry's
  # Postgres conformance suite — all small enough to live on one runner that
  # waits for the archive rather than recompiling them itself.
  test-extras:
    name: test-extras
    needs: [filter, build-tests]
    # Heavy tier (issues #552, #549, #1214). See build-tests above.
    if: needs.filter.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxsum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxsum
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      - name: Extract the test binaries
        run: |
          mkdir -p target/nextest/extracted target/nextest/extracted-de
          tar -xf nextest-archive.tar.zst -C target/nextest/extracted
          tar -xf doubleentry-archive.tar.zst -C target/nextest/extracted-de
      - name: Sweep stale test scratch databases
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -f scripts/drop-test-scratch.sql
      # Containers are the other half of the residue (issue #277): the
      # doubleentry suite's deferred-sequencing tests start a dedicated
      # container even under DATABASE_URL, and a Ryuk miss leaves it.
      - name: Sweep stale testcontainers
        run: ./scripts/clean-testcontainers.sh --drop
      # The aggregate binaries retain module prefixes. Run each process-shared
      # module in one process; refuse absent binaries or empty suite selections.
      - name: Run the process-shared suites
        run: python3 scripts/run-shared-suites.py target/nextest/extracted/target/debug/deps
      # Doctests already run in the `test` job — no need to pay for a fresh
      # compile here.
      # doubleentry's Postgres conformance suite spins up testcontainers for several
      # minutes. doubleentry is vendored and almost never changes, so the suite runs
      # only when the engine, the lockfile or the database migration list changed —
      # the push diff is `before`..HEAD, the pull_request diff base..HEAD.
      - name: Does the run touch the ledger engine
        id: ledger
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # An unresolvable base (force-push, first commit) errs on the side of
          # running the suite.
          if [ "${base#0000000}" != "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(crates/doubleentry/|crates/core/migrations/|Cargo\.lock|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # `DOUBLEENTRY_DATABASE_URL` makes the suite create its scratch
      # databases on the service container instead of spinning up its own
      # testcontainer (issue #241) — the binary was archived with the
      # `postgres` feature on, so it is real code, not an empty cfg.
      - name: Run doubleentry's Postgres conformance suite
        if: steps.ledger.outputs.changed == 'true'
        env:
          DOUBLEENTRY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          # The archive can record the binary under `build/…/out/` rather than
          # `debug/deps/` — resolve it through the shared metadata walk
          # (run-shared-suites.py) so both layouts find it.
          exe=$(python3 scripts/run-shared-suites.py \
                  --resolve postgres target/nextest/extracted-de)
          echo "=== postgres -> $exe"
          "$exe" --test-threads=4

  # The Solana end-to-end suite (issue #1152): the archived `e2e` test binary
  # runs the real SolanaRpcClient against a local solana-test-validator and the
  # credit path on the service postgres. The tests skip cleanly without a
  # reachable validator, so a toolchain failure degrades the job to a
  # validator-health check rather than a false green — the job therefore fails
  # explicitly when the validator never comes up, instead of letting the skips
  # mask a broken install.
  solana-e2e:
    name: solana-e2e
    needs: [filter, build-tests]
    # Heavy tier like the shards (issues #552, #549, #1214).
    if: needs.filter.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxsum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxsum
      OXSUM_SOLANA_E2E_RPC: http://127.0.0.1:8899
      # The pinned agave toolchain the validator binary comes from — bump
      # deliberately; the cache key below follows it.
      SOLANA_RELEASE: v4.4.1
    steps:
      - uses: actions/checkout@v7
      - name: Cache the agave toolchain
        uses: actions/cache@v6
        id: agave-cache
        with:
          path: ~/agave-release
          key: agave-${{ env.SOLANA_RELEASE }}-x86_64-unknown-linux-gnu
      - name: Install solana-test-validator
        if: steps.agave-cache.outputs.cache-hit != 'true'
        run: |
          # Prebuilt release tarball — the same artifact solana-install
          # downloads, pinned and verified by hand rather than piping a
          # version-checking installer through the runner.
          curl -fL --retry 3 \
            -o /tmp/solana-release.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/${SOLANA_RELEASE}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          mkdir -p ~/agave-release
          tar -xjf /tmp/solana-release.tar.bz2 -C ~/agave-release --strip-components=1
          ~/agave-release/bin/solana-test-validator --version
      - name: Start the test validator
        run: |
          ~/agave-release/bin/solana-test-validator --reset --quiet \
            --ledger /tmp/solana-test-ledger --rpc-port 8899 --faucet-port 9900 \
            > /tmp/solana-validator.log 2>&1 &
          echo $! > /tmp/solana-validator.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8899 \
              -X POST -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
              | grep -q '"ok"'; then
              echo "validator healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the validator never became healthy:"
          cat /tmp/solana-validator.log
          exit 1
      - name: Sweep stale test scratch databases
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -f scripts/drop-test-scratch.sql
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The suite reads OXSUM_SOLANA_E2E_RPC from the job env. A validator
      # outage fails the health step above rather than letting the tests
      # skip green.
      - name: Run the solana e2e suite
        run: >-
          cargo nextest run --archive-file nextest-archive.tar.zst
          -E 'package(=oxsum-integrations) and binary(=e2e)'
      - name: Stop the test validator
        if: always()
        run: |
          if [ -f /tmp/solana-validator.pid ]; then
            kill "$(cat /tmp/solana-validator.pid)" 2>/dev/null || true
          fi

  # The heavy tier's one roll-up (issue #1214). It always runs — `always()` —
  # so it reports on every event: green when `filter` decided the tier does not
  # apply (a web- or docs-only pull request; every heavy job then reports
  # `skipped`), green when every heavy job succeeded, red when any heavy job
  # failed or was cancelled, or when `filter` itself failed. A skipped heavy job
  # under `heavy == 'true'` is red too: it means a dependency broke, not that
  # the tier was waived. It is the single name to make required once the
  # pre-merge heavy tier has proven itself.
  heavy-tier:
    name: heavy-tier
    needs: [filter, build-tests, test-shard, test-extras, solana-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Judge the heavy tier
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          HEAVY: ${{ needs.filter.outputs.heavy }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          if os.environ["FILTER_RESULT"] != "success":
              sys.exit(f"filter did not succeed ({os.environ['FILTER_RESULT']}); the tier decision is unknown")
          results = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items() if name != "filter"}
          print("heavy tier applies:", os.environ["HEAVY"])
          for name, result in sorted(results.items()):
              print(f"  {name}: {result}")
          if os.environ["HEAVY"] != "true":
              bad = {n: r for n, r in results.items() if r not in ("skipped", "success")}
              if bad:
                  sys.exit(f"heavy jobs ran outside the tier and did not pass: {bad}")
              print("the heavy tier does not apply to this change; nothing to judge")
              sys.exit(0)
          bad = {n: r for n, r in results.items() if r != "success"}
          if bad:
              sys.exit(f"heavy tier failed: {bad}")
          print("every heavy job passed")
          PY
